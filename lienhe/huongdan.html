<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hướng Dẫn Sử Dụng - Hành Trình Số</title>
    <style>
        :root {
            --primary: #004d40;
            --primary-light: #00796b;
            --bg-gradient: linear-gradient(135deg, #e0f2f1 0%, #f4f7f6 100%);
            --text-main: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            /* Khóa cuộn trang nền để khi vuốt PDF không bị kéo cả trang web */
            overscroll-behavior: none; 
        }

        /* Header */
        .header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }

        .btn-back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 3px;
            padding: 0 40px;
        }

        .header p {
            font-size: 0.85rem;
            font-style: italic;
        }

        /* Container */
        .main-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
        }

        /* KHUNG PDF */
        .pdf-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Dùng dvh để khung tự co giãn vừa khít màn hình, không bị chòng chềnh */
            height: calc(100dvh - 160px); 
            height: calc(100vh - 160px); /* Fallback cho trình duyệt cũ */
        }

        .pdf-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch; 
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 10px 15px 20px;
            font-size: 0.85rem;
            color: #555;
        }

        .footer strong {
            color: var(--primary);
        }

        /* Responsive cho điện thoại nhỏ */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.1rem;
                padding: 0 35px; 
            }
            .btn-back span {
                display: none; 
            }
            .btn-back {
                padding: 8px;
            }
            .main-container {
                padding: 10px;
            }
            .pdf-card {
                /* Căn chỉnh lại khoảng trừ cho vừa vặn phần màn hình còn lại trên điện thoại */
                height: calc(100dvh - 140px);
                height: calc(100vh - 140px);
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="javascript:history.back()" class="btn-back" title="Trở về trang trước">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span>🏚️ Trở về</span>
        </a>

        <div>
            <h1>HƯỚNG DẪN SỬ DỤNG - HOCTAP.IO.VN</h1>
            <p>Mang công nghệ vào mọi chuyến đi</p>
        </div>
    </header>

    <main class="main-container">
        <div class="pdf-card">
            <div class="pdf-wrapper">
                <iframe src="huongdan.pdf?v=2#toolbar=0&navpanes=0&view=FitH" title="Hướng dẫn sử dụng trang web">
                    <p style="text-align: center; padding: 20px;">Trình duyệt của bạn không hỗ trợ xem trực tiếp.</p>
                </iframe>
            </div>
        </div>
    </main>

  

</body>
</html>
