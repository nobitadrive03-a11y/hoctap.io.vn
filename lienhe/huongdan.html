<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hướng Dẫn Sử Dụng - Hành Trình Số</title>
    <style>
        :root {
            --primary: #004d40;
            --primary-light: #00796b;
            --accent: #ff8f00;
            --bg-gradient: linear-gradient(135deg, #e0f2f1 0%, #f4f7f6 100%);
            --text-main: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
        }

        /* Header */
        .header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
        }

        /* Nút Trở Về */
        .btn-back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
            padding: 0 100px; /* Nhường chỗ cho nút Trở về không bị đè lên chữ */
        }

        .header p {
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Container */
        .main-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        /* KHUNG PDF */
        .pdf-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 1200px; 
            margin-bottom: 20px;
        }

        .pdf-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch; 
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Nút tải xuống */
        .action-buttons {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .btn-download {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 143, 0, 0.3);
        }

        .btn-download svg {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #555;
        }

        .footer strong {
            color: var(--primary);
        }

        /* Responsive cho điện thoại nhỏ */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.1rem;
                padding: 0 40px; 
            }
            .btn-back span {
                display: none; /* Trên điện thoại nhỏ ẩn chữ "Trở về", chỉ giữ lại Icon mũi tên */
            }
            .btn-back {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <!-- Nút Trở về trang trước (Sử dụng JavaScript lịch sử trình duyệt) -->
        <a href="javascript:history.back()" class="btn-back" title="Trở về trang trước">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span>🏚️ Trở về</span>
        </a>

        <div>
            <h1>HƯỚNG DẪN SỬ DỤNG - HOCTAP.IO.VN</h1>
            <p>Mang công nghệ vào mọi chuyến đi</p>
        </div>
    </header>

    <main class="main-container">
        <div class="pdf-card">
            
            <div class="pdf-wrapper">
                <!-- Thêm ?v=2 để làm mới bộ nhớ đệm, đảm bảo tải mượt -->
                <iframe src="huongdan.pdf?v=2#toolbar=0&navpanes=0&view=FitH" title="Hướng dẫn sử dụng trang web">
                    <p style="text-align: center; padding: 20px;">Trình duyệt của bạn không hỗ trợ xem trực tiếp. Vui lòng tải xuống!</p>
                </iframe>
            </div>

            <div class="action-buttons">
                <a href="huongdan.pdf" download class="btn-download">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Tải tài liệu về máy
                </a>
            </div>

        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Bản quyền thuộc về <strong>Trường THPT Phan Đình Phùng - Quảng Trị</strong><br>
        Website học tập và giải trí của <strong>cô Lê Huyền Sinh</strong>
    </footer>

</body>
</html>
