<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản Đồ Chỉ Đường - Hành Trình Số</title>
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .location-section {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            max-width: 800px;
            margin: 10px auto;
            text-align: center;
            border-top: 5px solid #004d40;
            box-sizing: border-box;
        }

        .btn-back-map {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background-color: #f1f3f4;
            color: #333;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            float: left;
        }

        .clear { clear: both; }

        .location-section h3 {
            color: red;
            font-size: 1.4rem;
            margin-top: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .address-text {
            color: blue;
            font-size: 1.05rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Nút Mở Tab Chỉ Đường Mới */
        .btn-directions {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ff8f00; 
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 143, 0, 0.3);
        }

        .btn-directions:hover {
            background-color: #e65c00;
            transform: translateY(-2px);
        }

        .instruction-note {
            font-size: 0.85rem;
            color: #2e7d32;
            margin-bottom: 20px;
            font-style: italic;
        }

        .map-container {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e0f2f1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
            width: 100%;
            padding-top: 75%; 
        }

        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (min-width: 600px) {
            .map-container { padding-top: 50%; }
        }
    </style>
</head>
<body>

    <div class="location-section">
        <!-- Nút Trở về trang trước của web -->
        <a href="javascript:history.back()" class="btn-back-map">
            <span>🏚️ Trở về</span>
        </a>
        <div class="clear"></div>

        <h3>📍 Địa Chỉ Của Chúng Tôi</h3>
        <p class="address-text">
            <strong>Trường THPT Phan Đình Phùng</strong><br>
            Số 14 Đường Xuân Diệu, Phường Đồng Hới, Quảng Trị
        </p>
        
        <!-- Nút Chỉ đường an toàn (Mở tab mới) -->
        <a href="https://www.google.com/maps/dir/?api=1&destination=Trường+THPT+Phan+Đình+Phùng,+14+Xuân+Diệu,+Quảng+Trị" target="_blank" rel="noopener noreferrer" class="btn-directions">
            📍 Xem đường đi chi tiết
        </a>
        
        <!-- Hướng dẫn nhỏ gọn để người dùng hiểu -->
        <div class="instruction-note">
            (Mở sang cửa sổ mới. Tắt cửa sổ bản đồ để quay lại trang này)
        </div>

        <!-- Khung Bản Đồ Tĩnh -->
        <div class="map-container">
            <iframe src="https://maps.google.com/maps?q=Trường+THPT+Phan+Đình+Phùng,+14+Xuân+Diệu,+Quảng+Trị&t=&z=16&ie=UTF8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
        </div>
    </div>

</body>
</html>
