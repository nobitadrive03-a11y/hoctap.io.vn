<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cấu hình bắt buộc để web hiển thị chuẩn trên màn hình điện thoại di động -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Chỉ Đường - Hành Trình Số</title>
    <style>
        /* CSS cho khu vực bản đồ và địa chỉ */
        .location-section {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
            max-width: 800px;
            margin: 30px auto;
            text-align: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            border-top: 5px solid #004d40;
            position: relative;
        }

        /* Nút Trở Về */
        .btn-back-map {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background-color: #f1f3f4;
            color: #333;
            text-decoration: none;
            padding: 10px 18px; /* Nút to dễ bấm trên mobile */
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            float: left; 
            cursor: pointer;
        }

        .btn-back-map:hover {
            background-color: #e2e6ea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .clear {
            clear: both;
        }

        /* Tiêu đề màu đỏ, Hướng dẫn màu xanh */
        .location-section h3 {
            color: red; 
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .address-text {
            color: blue; 
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Nút bấm chỉ đường */
        .btn-directions {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ff8f00; 
            color: #ffffff;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 143, 0, 0.3);
            margin-bottom: 25px;
            width: 80%; /* Trải rộng trên mobile */
            max-width: 300px;
        }

        .btn-directions:hover {
            background-color: #e65c00;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 143, 0, 0.4);
        }

        /* Khung hiển thị bản đồ trực tiếp */
        .map-container {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e0f2f1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .map-container iframe {
            width: 100%;
            height: 400px;
            border: none;
            display: block;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 480px) {
            .location-section {
                padding: 15px;
                margin: 15px;
            }
            .map-container iframe {
                height: 350px;
            }
            .btn-directions {
                width: 100%;
                font-size: 0.95rem;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="location-section">
        
        <!-- Nút trở về đã được sửa lại lệnh history.back() để tự động quay lại trang trước đó -->
        <a href="#" onclick="history.back(); return false;" class="btn-back-map" title="Trở về trang trước">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span>🏚️ Trở về</span>
        </a>
        <div class="clear"></div>

        <h3>📍 Địa Chỉ Của Chúng Tôi</h3>
        
        <p class="address-text">
            <strong>Trường THPT Phan Đình Phùng</strong><br>
            Số 14 Đường Xuân Diệu, Phường Đồng Hới, Quảng Trị
        </p>
        
        <a href="https://www.google.com/maps/dir/?api=1&destination=Trường+THPT+Phan+Đình+Phùng,+14+Xuân+Diệu,+Quảng+Trị" target="_blank" class="btn-directions" title="Xem hướng dẫn đường đi">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
            </svg>
            Nhấn để xem đường đi
        </a>

        <div class="map-container">
            <iframe src="https://maps.google.com/maps?q=Trường+THPT+Phan+Đình+Phùng,+14+Xuân+Diệu,+Quảng+Trị&t=&z=16&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
        </div>
        
    </div>

</body>
</html>
