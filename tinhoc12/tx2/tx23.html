  <script>

    try {

            storageBucket: "hoctap-91691.firebasestorage.app",

            appId: "1:1004553425319:web:45d15cbae393f614c56682",

        if (typeof firebase !== 'undefined') {

            database = firebase.database();
            scoresRef = database.ref('TinHoc11/tx2_De3');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });

        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');

    const de_data = [
        { id: "1_1", type: "single", question: "Phần mềm <span class='code-inline'>GIMP</span> được biết đến rộng rãi trong cộng đồng công nghệ thông tin với chức năng chính trị yếu là gì?", options: ["Là một phần mềm mã nguồn mở chuyên dụng để hỗ trợ người dùng chỉnh sửa hình ảnh, thiết kế đồ họa và vẽ kĩ thuật.", "Là một phần mềm mã nguồn đóng chuyên dụng để hỗ trợ người dùng soạn thảo các văn bản hành chính nhà nước.", "Là một phần mềm thương mại có tính phí chuyên dụng để hỗ trợ người dùng lập trình các hệ quản trị cơ sở dữ liệu.", "Là một phần mềm hệ thống độc lập chuyên dụng để hỗ trợ người dùng quét và tiêu diệt các loại virus trên máy tính."], correct: 0 },
        { id: "1_2", type: "single", question: "Khi người dùng lưu lại tệp tin đang làm việc dở dang trong phần mềm <span class='code-inline'>GIMP</span> bằng lệnh <span class='code-inline'>\"Save\"</span>, tệp tin đó sẽ mang phần mở rộng mặc định là gì?", options: ["Tệp tin sẽ được lưu với phần mở rộng <span class='code-inline'>.jpg</span>, đây là định dạng ảnh đã được nén lại để giảm dung lượng lưu trữ trên đĩa.", "Tệp tin sẽ được lưu với phần mở rộng <span class='code-inline'>.png</span>, đây là định dạng ảnh hỗ trợ nền trong suốt để dễ dàng đăng tải lên mạng.", "Tệp tin sẽ được lưu với phần mở rộng <span class='code-inline'>.xcf</span>, đây là định dạng chuẩn của GIMP giúp giữ nguyên toàn bộ cấu trúc các lớp ảnh.", "Tệp tin sẽ được lưu với phần mở rộng <span class='code-inline'>.gif</span>, đây là định dạng ảnh động gồm nhiều khung hình được phát liên tục lặp lại."], correct: 2 },
        { id: "1_3", type: "single", question: "Khái niệm \"Lớp ảnh\" (<span class='code-inline'>Layer</span>) bên trong phần mềm chỉnh sửa ảnh <span class='code-inline'>GIMP</span> mang lại tác dụng kĩ thuật to lớn nào cho người thiết kế?", options: ["Lớp ảnh giúp tự động phân loại tất cả các hình ảnh đang có trong máy tính vào từng thư mục riêng biệt theo ngày tháng.", "Lớp ảnh giúp người dùng có thể chỉnh sửa các chi tiết đồ họa trên từng bề mặt độc lập mà không làm hỏng các phần khác.", "Lớp ảnh giúp máy tính tự động tăng độ sáng chói của toàn bộ bức ảnh lên mức tối đa mà không cần phải dùng công cụ.", "Lớp ảnh giúp tự động chuyển đổi toàn bộ ngôn ngữ hiển thị của phần mềm từ tiếng Anh sang tiếng Việt chuẩn quốc gia."], correct: 1 },
        { id: "1_4", type: "single", question: "Để thay đổi kích thước của một đối tượng hình ảnh hoặc một lớp ảnh cụ thể trong <span class='code-inline'>GIMP</span>, người dùng cần kích hoạt công cụ nào sau đây?", options: ["Người dùng cần kích hoạt công cụ <span class='code-inline'>Move Tool</span> để tiến hành phóng to hoặc thu nhỏ đối tượng ảnh theo đúng tỉ lệ mong muốn.", "Người dùng cần kích hoạt công cụ <span class='code-inline'>Scale Tool</span> để tiến hành phóng to hoặc thu nhỏ đối tượng ảnh theo đúng tỉ lệ mong muốn.", "Người dùng cần kích hoạt công cụ <span class='code-inline'>Text Tool</span> để tiến hành phóng to hoặc thu nhỏ đối tượng ảnh theo đúng tỉ lệ mong muốn.", "Người dùng cần kích hoạt công cụ <span class='code-inline'>Crop Tool</span> để tiến hành phóng to hoặc thu nhỏ đối tượng ảnh theo đúng tỉ lệ mong muốn."], correct: 1 },
        { id: "1_5", type: "single", question: "Công cụ <span class='code-inline'>\"Brightness-Contrast\"</span> trong <span class='code-inline'>GIMP</span> thường được người thiết kế đồ họa sử dụng chủ yếu để thực hiện tác vụ tinh chỉnh nào?", options: ["Tác vụ điều chỉnh sự cân bằng màu sắc giữa các dải màu đỏ, lục, lam nhằm loại bỏ hiện tượng bức ảnh bị ám màu.", "Tác vụ điều chỉnh độ sáng tối tổng thể và độ tương phản giữa các vùng sáng tối nhằm làm cho bức ảnh trở nên rõ nét hơn.", "Tác vụ điều chỉnh độ đậm nhạt của từng tông màu đơn lẻ nhằm biến một bức ảnh phong cảnh mùa hè thành mùa thu.", "Tác vụ điều chỉnh độ trong suốt của một lớp ảnh bất kì nhằm tạo hiệu ứng bóng mờ đổ dài trên nền của các lớp ảnh dưới."], correct: 1 },
        { id: "1_6", type: "single", question: "Để chọn một vùng hình ảnh có ranh giới là các hình chữ nhật hoặc hình vuông, ta dùng công cụ chọn vùng cơ bản nào trong <span class='code-inline'>GIMP</span>?", options: ["Công cụ <span class='code-inline'>Ellipse Select Tool</span> cho phép người dùng kéo thả chuột để tạo ra một vùng chọn mang hình dáng hình chữ nhật.", "Công cụ <span class='code-inline'>Rectangle Select Tool</span> cho phép người dùng kéo thả chuột để tạo ra một vùng chọn mang hình dáng hình chữ nhật.", "Công cụ <span class='code-inline'>Free Select Tool</span> cho phép người dùng kéo thả chuột để tạo ra một vùng chọn mang hình dáng hình chữ nhật.", "Công cụ <span class='code-inline'>Fuzzy Select Tool</span> cho phép người dùng kéo thả chuột để tạo ra một vùng chọn mang hình dáng hình chữ nhật."], correct: 1 },
        { id: "1_7", type: "single", question: "Công cụ <span class='code-inline'>\"Fuzzy Select\"</span> (còn gọi là công cụ chọn theo màu sắc lân cận/đũa thần) hoạt động dựa trên nguyên lí kĩ thuật nào?", options: ["Nó tự động khoanh vùng tất cả các chi tiết mang hình dạng tròn hoặc hình bầu dục xuất hiện trên bề mặt bức ảnh hiện tại.", "Nó tự động khoanh vùng tất cả các khu vực có chứa dữ liệu văn bản để người dùng có thể tiến hành sửa lỗi chính tả.", "Nó tự động khoanh vùng tất cả các điểm ảnh nằm liền kề nhau và có mức độ màu sắc tương đồng với điểm ảnh được nhấn chuột.", "Nó tự động khoanh vùng tất cả các điểm ảnh bị nhiễu hạt do chụp trong điều kiện thiếu sáng để hệ thống xử lí làm mịn."], correct: 2 },
        { id: "1_8", type: "single", question: "Khi đã tạo xong một vùng chọn bao quanh đối tượng A, nếu muốn đổi vùng chọn sang tất cả các phần còn lại của bức ảnh (trừ đối tượng A), ta sử dụng lệnh nào?", options: ["Ta sử dụng lệnh <span class='code-inline'>Select -> Invert</span> để yêu cầu phần mềm tự động nghịch đảo vùng đang được chọn thành vùng không được chọn và ngược lại.", "Ta sử dụng lệnh <span class='code-inline'>Select -> None</span> để yêu cầu phần mềm tự động nghịch đảo vùng đang được chọn thành vùng không được chọn và ngược lại.", "Ta sử dụng lệnh <span class='code-inline'>Select -> All</span> để yêu cầu phần mềm tự động nghịch đảo vùng đang được chọn thành vùng không được chọn và ngược lại.", "Ta sử dụng lệnh <span class='code-inline'>Select -> Float</span> để yêu cầu phần mềm tự động nghịch đảo vùng đang được chọn thành vùng không được chọn và ngược lại."], correct: 0 },
        { id: "1_9", type: "single", question: "Công cụ <span class='code-inline'>Color Balance</span> trong <span class='code-inline'>GIMP</span> mang lại hiệu quả chỉnh sửa đặc biệt nào khi xử lí một bức ảnh chụp kĩ thuật số?", options: ["Nó mang lại hiệu quả làm mờ đi các chi tiết phía sau hậu cảnh để làm nổi bật lên khuôn mặt của nhân vật chính trong ảnh.", "Nó mang lại hiệu quả điều chỉnh tỉ lệ pha trộn giữa các màu cơ bản nhằm khắc phục tình trạng bức ảnh bị ngả màu sai lệch.", "Nó mang lại hiệu quả tự động xóa bỏ hoàn toàn nền của bức ảnh và thay thế bằng một nền phong cảnh thiên nhiên khác.", "Nó mang lại hiệu quả chuyển đổi toàn bộ bức ảnh màu rực rỡ trở thành một bức ảnh đen trắng nghệ thuật mang phong cách cổ."], correct: 1 },
        { id: "1_10", type: "single", question: "Để tô kín một vùng chọn bằng một màu sắc thuần nhất (màu đồng nhất không có sự chuyển sắc), công cụ nào sau đây là lựa chọn chính xác?", options: ["Công cụ <span class='code-inline'>Gradient Tool</span> sẽ tự động phun một lớp màu đồng nhất bao phủ toàn bộ diện tích của vùng chọn đang được kích hoạt.", "Công cụ <span class='code-inline'>Bucket Fill Tool</span> sẽ tự động phun một lớp màu đồng nhất bao phủ toàn bộ diện tích của vùng chọn đang được kích hoạt.", "Công cụ <span class='code-inline'>Paintbrush Tool</span> sẽ tự động phun một lớp màu đồng nhất bao phủ toàn bộ diện tích của vùng chọn đang được kích hoạt.", "Công cụ <span class='code-inline'>Eraser Tool</span> sẽ tự động phun một lớp màu đồng nhất bao phủ toàn bộ diện tích của vùng chọn đang được kích hoạt."], correct: 1 },
        { id: "1_11", type: "single", question: "Sự khác biệt cơ bản về nét vẽ giữa công cụ <span class='code-inline'>Pencil Tool</span> (Bút chì) và <span class='code-inline'>Paintbrush Tool</span> (Cọ vẽ) bên trong phần mềm <span class='code-inline'>GIMP</span> là gì?", options: ["Nét vẽ của Bút chì luôn luôn cứng và sắc cạnh, trong khi nét vẽ của Cọ vẽ thì được làm mềm ở vùng biên viền tạo độ mượt mà.", "Nét vẽ của Bút chì luôn luôn được làm mềm ở vùng biên viền tạo độ mượt mà, trong khi nét vẽ của Cọ vẽ thì luôn cứng và sắc cạnh.", "Nét vẽ của Bút chì chỉ có thể sử dụng được những màu sắc tối, trong khi nét vẽ của Cọ vẽ thì chỉ sử dụng được những màu sắc sáng.", "Nét vẽ của Bút chì chuyên dùng để xóa bỏ các chi tiết thừa, trong khi nét vẽ của Cọ vẽ chuyên dùng để sao chép hình ảnh sang chỗ khác."], correct: 0 },
        { id: "1_12", type: "single", question: "Để bổ sung một đoạn văn bản (như tiêu đề hoặc lời bình) lên trên bề mặt của bức ảnh, người thiết kế cần sử dụng công cụ có biểu tượng mang hình dáng nào?", options: ["Người thiết kế cần sử dụng công cụ mang biểu tượng hình chiếc thùng sơn đang đổ mực để có thể gõ và chèn các dòng văn bản.", "Người thiết kế cần sử dụng công cụ mang biểu tượng hình chữ A (<span class='code-inline'>Text Tool</span>) để có thể gõ và chèn các dòng chữ văn bản nghệ thuật.", "Người thiết kế cần sử dụng công cụ mang biểu tượng hình cục tẩy cao su để có thể gõ và chèn các dòng chữ văn bản nghệ thuật.", "Người thiết kế cần sử dụng công cụ mang biểu tượng hình một con mắt đang mở để có thể gõ và chèn các dòng chữ văn bản nghệ thuật."], correct: 1 },
        { id: "1_13", type: "single", question: "Trong quá trình sử dụng công cụ <span class='code-inline'>Eraser</span> (Cục tẩy), thao tác xóa trên một lớp ảnh bình thường (không có kênh <span class='code-inline'>Alpha</span>/kênh trong suốt) sẽ dẫn đến hệ quả nào?", options: ["Phần hình ảnh bị tẩy xóa sẽ lập tức trở nên trong suốt, cho phép người xem nhìn xuyên thấu xuống các lớp ảnh nằm ở phía dưới.", "Phần hình ảnh bị tẩy xóa sẽ tự động biến thành màu nền hiện tại (<span class='code-inline'>Background color</span>) đang được thiết lập ở hộp công cụ màu sắc.", "Phần hình ảnh bị tẩy xóa sẽ tự động khôi phục lại trạng thái màu sắc nguyên bản giống hệt như lúc bức ảnh mới được chụp.", "Phần hình ảnh bị tẩy xóa sẽ làm cho toàn bộ phần mềm GIMP báo lỗi và lập tức thoát khỏi không gian làm việc của máy tính."], correct: 1 },
        { id: "1_14", type: "single", question: "Công cụ <span class='code-inline'>Gradient Tool</span> trong <span class='code-inline'>GIMP</span> được ứng dụng nhằm tạo ra hiệu ứng mĩ thuật nào trên bề mặt bản thiết kế?", options: ["Tạo ra hiệu ứng đổ màu hòa trộn chuyển tiếp một cách liên tục và mượt mà từ một màu sắc này sang một màu sắc khác.", "Tạo ra hiệu ứng làm sắc nét toàn bộ các góc cạnh của mọi vật thể xuất hiện bên trong khung hình để làm rõ các chi tiết bị mờ.", "Tạo ra hiệu ứng biến bức ảnh kĩ thuật số thành một bản vẽ phác thảo bằng bút chì đen trắng mang tính chất nghệ thuật trừu tượng.", "Tạo ra hiệu ứng cắt xén gọt bỏ những phần không gian thừa thãi xung quanh các cạnh của bức ảnh để tập trung vào chủ thể."], correct: 0 },
        { id: "1_15", type: "single", question: "Để tạo ra một bức ảnh động (<span class='code-inline'>Animated GIF</span>) bằng phần mềm <span class='code-inline'>GIMP</span>, người thiết kế cần chuẩn bị dữ liệu cấu trúc như thế nào?", options: ["Người thiết kế phải tạo ra nhiều tệp tin ảnh rời rạc khác nhau và xếp chúng chung vào một thư mục gốc trên ổ đĩa máy tính.", "Người thiết kế phải mở phần mềm Microsoft PowerPoint để thiết kế các hiệu ứng trượt trước khi đưa dữ liệu nhập vào phần mềm GIMP.", "Người thiết kế phải tạo ra một tệp tin duy nhất, trong đó mỗi một lớp ảnh (<span class='code-inline'>Layer</span>) sẽ đóng vai trò như một khung hình (<span class='code-inline'>Frame</span>) chuyển động.", "Người thiết kế phải tạo ra một tệp tin video định dạng MP4 dài khoảng năm phút, sau đó cho vào phần mềm GIMP để cắt gọn."], correct: 2 },
        { id: "1_16", type: "single", question: "Để có thể xem thử quá trình chuyển động của ảnh động ngay bên trong phần mềm <span class='code-inline'>GIMP</span> trước khi xuất bản, ta dùng đường dẫn trình đơn (Menu) nào?", options: ["Ta dùng đường dẫn trình đơn <span class='code-inline'>File -> Play Animation</span> để hệ thống mở ra một cửa sổ nhỏ phát lại toàn bộ quá trình chuyển động.", "Ta dùng đường dẫn trình đơn <span class='code-inline'>Edit -> Run Animation</span> để hệ thống mở ra một cửa sổ nhỏ phát lại toàn bộ quá trình chuyển động.", "Ta dùng đường dẫn trình đơn <span class='code-inline'>Filters -> Animation -> Playback</span> để hệ thống mở ra một cửa sổ nhỏ phát lại toàn bộ quá trình chuyển động.", "Ta dùng đường dẫn trình đơn <span class='code-inline'>Select -> View GIF</span> để hệ thống mở ra một cửa sổ nhỏ phát lại toàn bộ quá trình chuyển động."], correct: 2 },
        { id: "1_17", type: "single", question: "Khi thực hiện thao tác xuất bản một tệp tin ảnh động <span class='code-inline'>GIF</span> ra khỏi phần mềm <span class='code-inline'>GIMP</span>, người thiết kế bắt buộc phải đánh dấu tích vào tùy chọn nào ở hộp thoại xuất tệp?", options: ["Người thiết kế bắt buộc phải đánh dấu tích vào ô <span class='code-inline'>\"Save as video\"</span> để máy tính nhận diện và ghép nối các khung hình với nhau.", "Người thiết kế bắt buộc phải đánh dấu tích vào ô <span class='code-inline'>\"As animation\"</span> để hệ thống hiểu rằng cần xuất ảnh dưới dạng hình động liên tiếp.", "Người thiết kế bắt buộc phải đánh dấu tích vào ô <span class='code-inline'>\"Flatten image\"</span> để hệ thống gộp tất cả các lớp ảnh lại thành một hình duy nhất.", "Người thiết kế bắt buộc phải đánh dấu tích vào ô <span class='code-inline'>\"Remove alpha channel\"</span> để loại bỏ hoàn toàn các khu vực trong suốt của bức ảnh."], correct: 1 },
        { id: "1_18", type: "single", question: "Chỉ số thời gian trễ (<span class='code-inline'>Delay time</span>) thường được gán vào tên của từng lớp ảnh khi làm ảnh động mang ý nghĩa kĩ thuật gì?", options: ["Nó quy định khoảng thời gian mà hệ thống phải chờ đợi trước khi bắt đầu tải bức ảnh lên trên không gian lưu trữ đám mây.", "Nó quy định khoảng thời gian lưu lại trên màn hình của khung hình đó trước khi chuyển sang khung hình tiếp theo của ảnh động.", "Nó quy định khoảng thời gian đếm ngược để phần mềm tự động đóng lại nhằm mục đích tiết kiệm năng lượng cho máy tính.", "Nó quy định khoảng thời gian mà người dùng có quyền nhấn nút hoàn tác (Undo) nếu chẳng may lỡ tay thực hiện sai một thao tác vẽ."], correct: 1 },
        { id: "1_19", type: "single", question: "Lệnh <span class='code-inline'>\"Optimize (for GIF)\"</span> trong bảng chọn <span class='code-inline'>Filters -> Animation</span> có tác dụng vô cùng thiết thực nào đối với tệp ảnh động?", options: ["Nó có tác dụng bổ sung thêm nhiều màu sắc rực rỡ vào bên trong các khung hình để làm cho chất lượng của ảnh động hiển thị đẹp hơn.", "Nó có tác dụng giảm bớt dung lượng tổng thể của tệp ảnh động bằng cách loại bỏ các điểm ảnh không thay đổi giữa các khung hình liên tiếp.", "Nó có tác dụng thay thế hoàn toàn phần mềm GIMP bằng một phần mềm trực tuyến khác chuyên biệt hơn để tăng tốc độ khởi tạo ảnh động.", "Nó có tác dụng phóng to kích thước chiều dài và chiều rộng của bức ảnh lên gấp đôi so với ban đầu để phục vụ cho việc in ấn khổ lớn."], correct: 1 },
        { id: "1_20", type: "single", question: "Sự khác biệt cơ bản giữa việc lưu tệp bằng lệnh <span class='code-inline'>\"Save\"</span> và lệnh <span class='code-inline'>\"Export As\"</span> trong phần mềm đồ họa <span class='code-inline'>GIMP</span> là gì?", options: ["Lệnh <span class='code-inline'>Save</span> chuyên dùng để xuất ra các bức ảnh đã hoàn thiện (ví dụ JPG, PNG), còn lệnh <span class='code-inline'>Export As</span> dùng để lưu tệp dự án chưa hoàn thiện (.xcf).", "Lệnh <span class='code-inline'>Save</span> chuyên dùng để lưu giữ nguyên cấu trúc các lớp ảnh dưới dạng tệp dự án (.xcf), còn lệnh <span class='code-inline'>Export As</span> dùng để xuất ra định dạng ảnh phổ thông.", "Lệnh <span class='code-inline'>Save</span> chỉ có thể sử dụng khi máy tính có kết nối mạng internet liên tục, còn lệnh <span class='code-inline'>Export As</span> thì chỉ sử dụng khi máy tính ngắt kết nối mạng.", "Lệnh <span class='code-inline'>Save</span> sẽ tự động gửi bức ảnh trực tiếp vào hòm thư điện tử cá nhân, còn lệnh <span class='code-inline'>Export As</span> sẽ đẩy bức ảnh đó lên trang chủ của mạng xã hội."], correct: 1 },
        { id: "1_21", type: "single", question: "Để chọn đồng thời nhiều lớp ảnh (<span class='code-inline'>Layers</span>) và nhóm chúng lại vào cùng một thư mục nhóm lớp (<span class='code-inline'>Layer Group</span>), mục đích chính của thao tác này là gì?", options: ["Mục đích là để làm cho dung lượng của tệp ảnh tăng lên đột biến nhằm che giấu không cho các phần mềm quét virus đọc được nội dung của tệp.", "Mục đích là để thuận tiện cho việc quản lí số lượng lớn các lớp ảnh, dễ dàng ẩn, hiện hoặc di chuyển nhiều lớp ảnh cùng một lúc rất nhanh chóng.", "Mục đích là để máy tính tự động trộn lẫn các màu sắc của những lớp ảnh này lại với nhau tạo thành một màu đen duy nhất trên màn hình máy tính.", "Mục đích là để khóa vĩnh viễn chức năng chỉnh sửa đồ họa, đảm bảo bức ảnh không bao giờ bị người khác thêm bớt chi tiết bằng bất kì cách nào."], correct: 1 },
        { id: "1_22", type: "single", question: "Khi sử dụng công cụ <span class='code-inline'>Scale Tool</span> để thu nhỏ một lớp ảnh chứa hình một nhân vật, để đảm bảo nhân vật không bị bóp méo sai lệch tỉ lệ chiều ngang và dọc, ta nên làm gì?", options: ["Ta nên nhấn giữ chặt phím <span class='code-inline'>Ctrl</span> (hoặc bấm vào biểu tượng chiếc khóa xích kết nối) trong suốt quá trình thao tác kéo các điểm neo ở góc bức ảnh.", "Ta nên nhấn giữ chặt phím Alt trong suốt quá trình thao tác kéo các điểm neo ở vị trí chính giữa của bức ảnh để bóp nhỏ đối tượng đồ họa.", "Ta nên nhấn giữ chặt phím Spacebar để tiến hành dịch chuyển toàn bộ bức hình ra bên ngoài phạm vi của vùng làm việc an toàn trên phần mềm.", "Ta nên thay đổi công cụ bằng cách chọn luôn công cụ Eraser Tool để trực tiếp tẩy đi phần kích thước bị thừa ở xung quanh của bức ảnh nhân vật."], correct: 0 },
        { id: "1_23", type: "single", question: "Việc điều chỉnh thông số <span class='code-inline'>\"Opacity\"</span> của một lớp ảnh trên bảng điều khiển <span class='code-inline'>Layers</span> sẽ gây ra sự thay đổi gì đối với lớp ảnh đó?", options: ["Nó sẽ làm thay đổi độ trong suốt của lớp ảnh, giá trị càng thấp thì lớp ảnh càng trở nên mờ ảo và có thể nhìn xuyên thấu xuống các lớp dưới.", "Nó sẽ làm thay đổi độ sắc nét của lớp ảnh, giá trị càng cao thì bức ảnh càng trở nên vỡ hạt và xuất hiện nhiều khối vuông màu khác nhau.", "Nó sẽ làm thay đổi hoàn toàn tông màu chủ đạo của lớp ảnh, biến một lớp ảnh mang tông màu nóng rực rỡ trở thành một lớp ảnh tông màu lạnh.", "Nó sẽ làm thay đổi hướng nghiêng của lớp ảnh, giá trị càng lớn thì toàn bộ các điểm ảnh sẽ càng bị kéo dãn và đổ nghiêng về phía bên tay trái."], correct: 0 },
        { id: "1_24", type: "single", question: "Công cụ nào sau đây cho phép người thiết kế lấy mẫu chính xác một màu sắc bất kì từ một điểm ảnh có sẵn trên màn hình để gán làm màu vẽ hiện tại (<span class='code-inline'>Foreground color</span>)?", options: ["Công cụ <span class='code-inline'>Color Picker Tool</span> (biểu tượng chiếc ống hút) cho phép người thiết kế lấy mẫu chính xác màu sắc tại một điểm đang nháy chuột.", "Công cụ <span class='code-inline'>Bucket Fill Tool</span> (biểu tượng thùng sơn) cho phép người thiết kế lấy mẫu chính xác màu sắc tại một điểm đang nháy chuột.", "Công cụ <span class='code-inline'>Alignment Tool</span> (biểu tượng căn lề) cho phép người thiết kế lấy mẫu chính xác màu sắc tại một điểm đang nháy chuột.", "Công cụ <span class='code-inline'>Heal Tool</span> (biểu tượng miếng băng dán) cho phép người thiết kế lấy mẫu chính xác màu sắc tại một điểm đang nháy chuột."], correct: 0 },
        
        { id: '1_c1', type: 'tf_cluster', question: "Bạn Tuấn đang thực hiện thiết kế một tấm áp phích tuyên truyền bảo vệ môi trường bằng phần mềm <span class='code-inline'>GIMP</span>. Tệp dự án của Tuấn đang có cấu trúc bảng quản lí lớp ảnh (<span class='code-inline'>Layers</span>) như sau:<div class='table-container'><table class='question-table'><tr><th>Tên Layer</th><th>Nội dung chi tiết trên Layer</th><th>Chế độ hiển thị</th></tr><tr><td><span class='code-inline'>Text_TieuDe</span></td><td>Dòng chữ \"Bảo vệ hành tinh xanh\"</td><td>Đang hiển thị (có hình con mắt)</td></tr><tr><td><span class='code-inline'>Hinh_TraiDat</span></td><td>Hình ảnh Trái Đất nền trong suốt</td><td>Đang hiển thị (có hình con mắt)</td></tr><tr><td><span class='code-inline'>Background</span></td><td>Nền màu xanh dương đồng nhất</td><td>Đang hiển thị (có hình con mắt)</td></tr></table></div>Tuấn cần chỉnh sửa lại vị trí và màu sắc của dòng tiêu đề nhưng không muốn làm xê dịch hình ảnh Trái Đất ở lớp phía dưới.", subQuestions: [
            { id: '1_d25a', text: "Phần mềm chỉnh sửa đồ họa GIMP tổ chức quản lí hình ảnh theo cơ chế các lớp ảnh (<span class='code-inline'>Layers</span>) độc lập, xếp chồng lên nhau tạo thành một bức ảnh tổng thể hoàn chỉnh.", correct: "Đúng" },
            { id: '1_d25b', text: "Để thay đổi được nội dung của dòng chữ \"Bảo vệ hành tinh xanh\", Tuấn chỉ cần kích hoạt công cụ <span class='code-inline'>Text Tool</span> và nháy chuột trực tiếp vào lớp ảnh mang tên <span class='code-inline'>Background</span> là xong.", correct: "Sai" },
            { id: '1_d25c', text: "Nếu Tuấn muốn tạm thời che giấu đi hình ảnh Trái Đất để tập trung xử lí chữ, Tuấn chỉ việc nháy chuột vào biểu tượng hình con mắt ở đầu dòng của lớp ảnh <span class='code-inline'>Hinh_TraiDat</span> để tắt nó đi.", correct: "Đúng" },
            { id: '1_d25d', text: "Lớp ảnh <span class='code-inline'>Background</span> đang nằm ở vị trí dưới cùng danh sách, do đó nền màu xanh dương này sẽ đóng vai trò làm nền tảng làm nền tảng bao bọc toàn bộ các đối tượng nằm ở lớp ảnh trên.", correct: "Đúng" }
        ]},
        { id: '1_c2', type: 'tf_cluster', question: "Bạn Lan có một bức ảnh chụp phong cảnh bị ngược sáng, khiến cho toàn bộ bầu trời có màu rất rực rỡ nhưng khu vực đồng cỏ bên dưới lại bị tối đen. Bạn Lan mở bức ảnh trong <span class='code-inline'>GIMP</span> và quyết định khoanh vùng riêng biệt khu vực đồng cỏ để tăng độ sáng. Bảng các công cụ được Lan lựa chọn xem xét gồm có:<div class='table-container'><table class='question-table'><tr><th>Tên công cụ</th><th>Chức năng dự kiến</th></tr><tr><td><span class='code-inline'>Free Select Tool</span></td><td>Dùng để vẽ một đường viền tự do bao quanh đồng cỏ.</td></tr><tr><td><span class='code-inline'>Fuzzy Select Tool</span></td><td>Dùng để chọn vùng ảnh có màu sắc tương đồng nhau.</td></tr><tr><td><span class='code-inline'>Brightness-Contrast</span></td><td>Dùng để tinh chỉnh mức độ sáng tối của vùng chọn.</td></tr></table></div>", subQuestions: [
            { id: '1_d26a', text: "Công cụ chọn tự do (<span class='code-inline'>Free Select Tool</span>) là một lựa chọn cực kì lí tưởng để Lan có thể khoanh vùng thủ công khu vực đồng cỏ có ranh giới uốn lượn phức tạp và không tuân theo hình học cơ bản.", correct: "Đúng" },
            { id: '1_d26b', text: "Nếu vùng đồng cỏ có một màu xanh đậm gần như hoàn toàn đồng nhất, Lan có thể sử dụng nhanh công cụ <span class='code-inline'>Fuzzy Select Tool</span> (đũa thần) để máy tính tự động lan tỏa và khoanh kín toàn bộ khu vực này.", correct: "Đúng" },
            { id: '1_d26c', text: "Sau khi vùng đồng cỏ đã được chọn thành công bởi nét đứt nhấp nháy, việc Lan tăng thanh trượt Contrast lên mức tối đa sẽ tự động làm cho đồng cỏ hòa nhập màu sắc với bầu trời phía trên.", correct: "Sai" },
            { id: '1_d26d', text: "Công cụ <span class='code-inline'>Brightness-Contrast</span> khi được Lan gọi ra sẽ chỉ tác động mức độ sáng tối lên khu vực đồng cỏ đang được chọn mà tuyệt đối không làm ảnh hưởng đến màu sắc bầu trời nằm ngoài vùng chọn.", correct: "Đúng" }
        ]},
        { id: '1_c3', type: 'tf_cluster', question: "Để thiết kế một logo đơn giản cho câu lạc bộ học tập, bạn Minh đã tạo một tệp tin hình vuông mới trong <span class='code-inline'>GIMP</span>. Kế hoạch thiết kế của Minh được chia làm ba bước thao tác sử dụng công cụ:<div class='table-container'><table class='question-table'><tr><th>Bước</th><th>Công cụ sử dụng</th><th>Mục đích thao tác kĩ thuật</th></tr><tr><td>Bước 1</td><td><span class='code-inline'>Bucket Fill Tool</span></td><td>Đổ toàn bộ lớp nền của hình vuông thành một màu vàng tươi.</td></tr><tr><td>Bước 2</td><td><span class='code-inline'>Paintbrush Tool</span></td><td>Dùng nét vẽ mềm mại để phác thảo biểu tượng cuốn sách mở.</td></tr><tr><td>Bước 3</td><td><span class='code-inline'>Text Tool</span></td><td>Gõ tên câu lạc bộ uốn lượn đặt ngay phía trên biểu tượng sách.</td></tr></table></div>", subQuestions: [
            { id: '1_d27a', text: "Ở Bước 1, công cụ <span class='code-inline'>Bucket Fill Tool</span> khi được đổ vào một lớp nền hoàn toàn trống rỗng sẽ tự động lan tỏa mực và lấp đầy toàn bộ kích thước của lớp ảnh hiện hành bằng màu vàng tươi đã chọn.", correct: "Đúng" },
            { id: '1_d27b', text: "Ở Bước 2, so với công cụ Pencil Tool, việc Minh lựa chọn công cụ <span class='code-inline'>Paintbrush Tool</span> (Cọ vẽ) sẽ giúp cho các đường nét phác thảo cuốn sách có phần đường biên được làm mềm mượt và tự nhiên hơn.", correct: "Đúng" },
            { id: '1_d27c', text: "Khi Minh sử dụng <span class='code-inline'>Text Tool</span> ở Bước 3 để gõ chữ, hệ thống phần mềm GIMP sẽ không bao giờ tạo ra một lớp ảnh mới mà tự động hòa trộn luôn nét chữ cứng đơ vào bên trong biểu tượng cuốn sách.", correct: "Sai" },
            { id: '1_d27d', text: "Nếu trong lúc thao tác vẽ ở Bước 2 Minh lỡ tay làm nét vẽ bị chệch hướng, Minh hoàn toàn có thể nhanh chóng nhấn tổ hợp phím <span class='code-inline'>Ctrl + Z</span> trên bàn phím để ra lệnh cho phần mềm hoàn tác lại nét vẽ vừa rồi.", correct: "Đúng" }
        ]},
        { id: '1_c4', type: 'tf_cluster', question: "Bạn Hoa muốn tự tay thiết kế một tấm ảnh động (<span class='code-inline'>GIF</span>) đơn giản mô phỏng hình ảnh một ngôi sao đang nhấp nháy ánh sáng liên tục. Hoa sử dụng <span class='code-inline'>GIMP</span> và tạo ra một cấu trúc tệp tin gồm 3 lớp ảnh như sau:<div class='table-container'><table class='question-table'><tr><th>Tên lớp ảnh (Layer)</th><th>Chi tiết thể hiện trên lớp ảnh</th></tr><tr><td><span class='code-inline'>Frame 3 (100ms)</span></td><td>Hình ngôi sao màu vàng chói sáng tỏa các tia rộng lớn.</td></tr><tr><td><span class='code-inline'>Frame 2 (100ms)</span></td><td>Hình ngôi sao màu vàng nhạt kích thước vừa phải.</td></tr><tr><td><span class='code-inline'>Frame 1 (100ms)</span></td><td>Hình ngôi sao màu trắng xám vô cùng nhỏ bé mờ nhạt.</td></tr></table></div>Bạn Hoa đang phân vân ở khâu kiểm tra và xuất bản tệp tin để đảm bảo hình ảnh hoạt động nhịp nhàng.", subQuestions: [
            { id: '1_d28a', text: "Trong cơ chế tạo ảnh động của phần mềm đồ họa GIMP, mỗi một lớp ảnh (như <span class='code-inline'>Frame 1</span>, <span class='code-inline'>Frame 2</span>) sẽ trực tiếp đảm nhận vai trò hiển thị tuần tự như một khung hình chuyển động (Frame) nối tiếp nhau.", correct: "Đúng" },
            { id: '1_d28b', text: "Chỉ số thời gian (<span class='code-inline'>100ms</span>) được đính kèm ở bên trong ngoặc của tên mỗi lớp ảnh mang ý nghĩa quy định chính xác khoảng thời gian dừng lại trên màn hình của từng khung hình trước khi chuyển tiếp sang hình khác.", correct: "Đúng" },
            { id: '1_d28c', text: "Trước khi xuất bản tệp, Hoa có thể vào đường dẫn thực đơn <span class='code-inline'>Filters -> Animation -> Playback</span> để phần mềm cung cấp một trình phát thử, giúp bạn ấy xem trước độ mượt mà của ngôi sao nhấp nháy.", correct: "Đúng" },
            { id: '1_d28d', text: "Khi thực hiện lệnh <span class='code-inline'>Export As</span> để xuất thành tệp hình ảnh, Hoa chỉ việc gõ đuôi <span class='code-inline'>.jpg</span> và đánh dấu vào ô \"As animation\", lập tức hệ thống sẽ xuất ra một bức ảnh có hình ngôi sao chuyển động vô tận.", correct: "Sai" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Kiểm Tra Thường Xuyên Đề 3 - Tin Học 11' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn câu hỏi và không trộn đáp án
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp điểm ưu tiên từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ in ra định dạng ngày tháng năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
