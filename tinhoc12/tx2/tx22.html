  <script>
    let database = null;
    let scoresRef = null;
    let currentIdx = 0;

    try {
        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Pos8awlh9j041qDWTPFRsVIjF-kPnk",
            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoctap-91691",
            storageBucket: "hoctap-91691.firebasestorage.app",
            messagingSenderId: "1004553425319",
            appId: "1:1004553425319:web:45d15cbae393f614c56682",
            measurementId: "G-Q6X1TL9PRV"
        };
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            scoresRef = database.ref('TinHoc12/tx2de2');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('selectstart', event => {
        if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') { event.preventDefault(); }
    });
    document.addEventListener('dragstart', event => event.preventDefault());

        event.clipboardData.setData('text/plain', 'Tài liệu đã được bảo vệ!');
        event.preventDefault();
        window.handleCheatAction('Sao chép (Copy) văn bản');
    });

    // DỮ LIỆU ĐỀ THI MỚI (GOOGLE SITES) - CÓ BỌC CODE-INLINE VÀ CODE-BLOCK
    const de_data = [
        { id: "1_1", type: "single", question: "Nền tảng <span class='code-inline'>Google Sites</span> mang lại lợi ích kĩ thuật cốt lõi nào cho người dùng khi có nhu cầu xây dựng trang web cá nhân hoặc dự án lớp học?", options: ["Google Sites là công cụ trực quan cho phép người dùng kéo thả các thành phần để tạo trang web hoàn chỉnh mà không cần viết bất kì dòng mã lập trình nào.", "Google Sites là công cụ chuyên dụng yêu cầu người sử dụng phải gõ mã lệnh HTML và CSS thủ công để máy chủ có thể dịch thuật giao diện trang web.", "Google Sites là công cụ quản trị mạng nội bộ, chỉ cho phép học sinh trong cùng một lớp học được quyền truy cập và trao đổi bài tập về nhà với nhau.", "Google Sites là công cụ lưu trữ dữ liệu dạng bảng tính, tự động vẽ các biểu đồ toán học phức tạp dựa trên các con số do giáo viên cung cấp trên lớp."], correct: 0 },
        { id: "1_2", type: "single", question: "Trong giao diện làm việc của Google Sites, thẻ (Tab) <span class='code-inline'>\"Giao diện\"</span> (Themes) cung cấp chức năng thiết kế tổng thể nào cho toàn bộ hệ thống trang web?", options: ["Thẻ Giao diện cho phép người thiết kế dễ dàng thay đổi đồng loạt hệ thống phông chữ, tông màu chủ đạo và kiểu dáng tiêu đề cho tất cả các trang.", "Thẻ Giao diện cho phép người thiết kế tự động chuyển đổi ngôn ngữ của toàn bộ các đoạn văn bản tiếng Việt sang tiếng Anh chuẩn quốc tế.", "Thẻ Giao diện cho phép người thiết kế thống kê chính xác số lượng khán giả đang trực tuyến truy cập vào xem trang web tại thời điểm hiện tại.", "Thẻ Giao diện cho phép người thiết kế tải về máy tính cá nhân toàn bộ cấu trúc mã nguồn của trang web để tiến hành cài đặt chạy không cần mạng."], correct: 0 },
        { id: "1_3", type: "single", question: "Để bổ sung thêm một trang con (<span class='code-inline'>Subpage</span>) mới nằm dưới quyền quản lí của \"Trang chủ\" (<span class='code-inline'>Homepage</span>), người thiết kế web cần thao tác trên khu vực nào?", options: ["Người thiết kế mở thẻ \"Trang\" (<span class='code-inline'>Pages</span>) ở cột bên phải, nháy nút ba chấm cạnh \"Trang chủ\" rồi chọn lệnh \"Thêm trang con\" (<span class='code-inline'>Add subpage</span>) để khởi tạo.", "Người thiết kế mở thẻ \"Chèn\" (<span class='code-inline'>Insert</span>) ở cột bên phải, nháy nút ba chấm cạnh \"Văn bản\" rồi chọn lệnh \"Thêm trang con\" (<span class='code-inline'>Add subpage</span>) để khởi tạo.", "Người thiết kế mở thẻ \"Giao diện\" (<span class='code-inline'>Themes</span>) ở cột bên phải, nháy nút ba chấm cạnh \"Màu sắc\" rồi chọn lệnh \"Thêm trang con\" (<span class='code-inline'>Add subpage</span>) để khởi tạo.", "Người thiết kế mở mục \"Cài đặt\" (<span class='code-inline'>Settings</span>) ở thanh menu trên, nháy nút ba chấm cạnh \"Logo\" rồi chọn lệnh \"Thêm trang con\" (<span class='code-inline'>Add subpage</span>) để khởi tạo."], correct: 0 },
        { id: "1_4", type: "single", question: "Tính năng \"Bố cục\" (<span class='code-inline'>Layouts</span>) được cung cấp sẵn trong ngăn \"Chèn\" (<span class='code-inline'>Insert</span>) của Google Sites hỗ trợ người dùng giải quyết vấn đề thiết kế nào?", options: ["Tính năng này cung cấp các khuôn mẫu sắp xếp sẵn (ví dụ: một ảnh kèm một đoạn văn, ba ảnh xếp ngang) giúp người dùng dàn trang đều, đẹp và nhanh chóng.", "Tính năng này cung cấp một công cụ dịch thuật tự động, giúp mọi văn bản gõ vào các ô trống lập tức được chuyển thành ngôn ngữ kí hiệu dành cho người khiếm thính.", "Tính năng này cung cấp một bộ đếm thời gian lùi tự động, ép buộc người truy cập trang web phải đọc xong bài viết trong vòng năm phút trước khi trang tự đóng.", "Tính năng này cung cấp khả năng tự động lấy cắp hình ảnh từ các trang mạng xã hội khác và chèn trực tiếp vào trang web của mình mà không vi phạm bản quyền."], correct: 0 },
        { id: "1_5", type: "single", question: "Khi chèn một tiện ích \"Băng chuyền hình ảnh\" (<span class='code-inline'>Image Carousel</span>) vào trang web Google Sites, thành phần này mang lại hiệu ứng trình diễn như thế nào?", options: ["Thành phần này tạo ra một trình phát tự động xoay vòng nhiều bức ảnh khác nhau trong cùng một khung hiển thị, giúp tiết kiệm không gian trên trang web.", "Thành phần này tạo ra một hiệu ứng biến đổi hình ảnh tĩnh thành một đoạn phim video có kèm theo âm thanh thuyết minh sinh động cho người khiếm thị.", "Thành phần này tạo ra một khung văn bản dài hiển thị toàn bộ lịch sử chỉnh sửa hình ảnh của người quản trị viên từ lúc mới thành lập trang web đến nay.", "Thành phần này tạo ra một bộ lọc màu sắc, tự động biến tất cả các bức ảnh có trên trang web thành định dạng đen trắng mang phong cách hoài cổ."], correct: 0 },
        { id: "1_6", type: "single", question: "Trong mục thiết lập phần Đầu trang (<span class='code-inline'>Header</span>) của Google Sites, tùy chọn loại đầu trang \"Biểu ngữ lớn\" (<span class='code-inline'>Large banner</span>) khác biệt thế nào so với \"Chỉ tiêu đề\" (<span class='code-inline'>Title only</span>)?", options: ["\"Biểu ngữ lớn\" sẽ hiển thị một khung nền hình ảnh đồ họa cực kì rộng kèm theo dòng chữ tiêu đề, trong khi \"Chỉ tiêu đề\" loại bỏ hoàn toàn ảnh nền và chỉ giữ lại dòng chữ.", "\"Biểu ngữ lớn\" sẽ tự động phóng to tất cả các bức ảnh có mặt trên trang web lên gấp ba lần kích cỡ, trong khi \"Chỉ tiêu đề\" thu nhỏ mọi thứ lại thành một biểu tượng.", "\"Biểu ngữ lớn\" yêu cầu người truy cập phải trả phí để có thể xem được nội dung ảnh, trong khi \"Chỉ tiêu đề\" cho phép khán giả đọc văn bản hoàn toàn miễn phí.", "\"Biểu ngữ lớn\" chỉ có thể sử dụng được trên các trình duyệt của điện thoại thông minh, trong khi \"Chỉ tiêu đề\" lại chỉ hoạt động duy nhất trên màn hình máy tính bàn."], correct: 0 },
        { id: "1_7", type: "single", question: "Việc tích hợp trực tiếp một tài liệu biểu mẫu <span class='code-inline'>Google Forms</span> vào trang web thông qua công cụ của Google Sites mang lại ứng dụng thực tiễn nào?", options: ["Việc tích hợp biểu mẫu cho phép khách truy cập trang web có thể trực tiếp điền thông tin khảo sát, đăng kí sự kiện ngay trên trang mà không cần mở liên kết mới.", "Việc tích hợp biểu mẫu cho phép trang web tự động gửi tin nhắn báo động đỏ đến điện thoại của người quản trị mỗi khi có một tin tặc cố gắng tấn công bẻ khóa.", "Việc tích hợp biểu mẫu cho phép máy tính tự động dọn dẹp các tập tin rác bên trong hệ thống Google Drive để giải phóng dung lượng cho tài khoản người dùng.", "Việc tích hợp biểu mẫu cho phép hệ thống tự động tải toàn bộ cơ sở dữ liệu của một trường học trên mạng về máy tính cá nhân của học sinh mà không cần mật khẩu."], correct: 0 },
        { id: "1_8", type: "single", question: "Khi tiến hành nhúng một đoạn video từ YouTube vào Google Sites, thao tác này mang lại lợi thế kĩ thuật nào so với việc tải tệp video đó trực tiếp lên trang?", options: ["Việc nhúng video YouTube giúp tiết kiệm tối đa dung lượng lưu trữ của trang web và tận dụng được tốc độ truyền tải cực nhanh từ máy chủ phát video của Google.", "Việc nhúng video YouTube sẽ tự động chặn mọi người dùng không có tài khoản quản trị viên xem được đoạn video đó nhằm bảo vệ bản quyền tác phẩm nghệ thuật.", "Việc nhúng video YouTube ép buộc đoạn phim đó phải được phát liên tục không ngừng nghỉ mà khán giả hoàn toàn không có quyền nhấn nút dừng hình hay tắt tiếng.", "Việc nhúng video YouTube sẽ tự động chuyển đổi toàn bộ chất lượng hình ảnh sắc nét của đoạn video gốc thành dạng điểm ảnh mờ nhạt để trang web tải nhanh hơn."], correct: 0 },
        { id: "1_9", type: "single", question: "Trong quá trình hợp tác làm việc nhóm trên Google Sites, tính năng \"Chia sẻ với người khác\" (<span class='code-inline'>Share with others</span>) đóng vai trò quản lí phân quyền như thế nào?", options: ["Tính năng này cho phép chủ sở hữu trang web mời các thành viên khác bằng địa chỉ email và cấp cho họ quyền \"Người chỉnh sửa\" để cùng nhau xây dựng nội dung trang.", "Tính năng này cho phép chủ sở hữu trang web ra lệnh cho hệ thống tự động đăng tải bài viết lên tất cả các trang mạng xã hội nổi tiếng để thu hút thêm người xem.", "Tính năng này cho phép chủ sở hữu trang web khóa chặt mọi chức năng nhấp chuột của khách truy cập cho đến khi họ chịu nhấn nút chia sẻ trang web cho bạn bè.", "Tính năng này cho phép chủ sở hữu trang web tự động trừ tiền trong thẻ tín dụng của những ai cố ý đọc trộm bài viết mà chưa được cấp mã khóa mật khẩu."], correct: 0 },
        { id: "1_10", type: "single", question: "Để điều hướng nhanh người dùng từ trang \"Giới thiệu\" sang trang \"Liên hệ\" trong cùng một hệ thống Google Sites, người thiết kế thường dùng công cụ nào?", options: ["Người thiết kế sử dụng công cụ \"Nút\" (<span class='code-inline'>Button</span>) trong thẻ Chèn, đặt tên cho nút là \"Liên hệ chúng tôi\" và trỏ đường dẫn liên kết trực tiếp đến trang \"Liên hệ\".", "Người thiết kế sử dụng công cụ \"Bản đồ\" (<span class='code-inline'>Map</span>) trong thẻ Chèn, đánh dấu vị trí địa lí trên vệ tinh để người dùng dùng xe máy đi đến trang \"Liên hệ\".", "Người thiết kế sử dụng công cụ \"Tài liệu\" (<span class='code-inline'>Docs</span>) trong thẻ Chèn, viết một đoạn văn bản dài mô tả cách thức bấm chuột để chuyển sang trang \"Liên hệ\".", "Người thiết kế sử dụng công cụ \"Biểu đồ\" (<span class='code-inline'>Chart</span>) trong thẻ Chèn, vẽ một biểu đồ hình tròn hiển thị tỉ lệ phần trăm số người đã chuyển sang trang \"Liên hệ\"."], correct: 0 },
        { id: "1_11", type: "single", question: "Chức năng \"Chân trang\" (<span class='code-inline'>Footer</span>) trong Google Sites mang đặc tính hiển thị nhất quán nào trên toàn bộ hệ thống cấu trúc của trang web?", options: ["Chân trang là khu vực nằm ở dưới cùng của trang web, bất kì nội dung nào (như bản quyền, liên hệ) được thêm vào đây đều sẽ tự động hiển thị trên tất cả các trang con.", "Chân trang là khu vực nằm ở trên cùng của trang web, bất kì nội dung nào được thêm vào đây đều sẽ lập tức biến mất nếu người dùng lướt chuột xuống phía dưới.", "Chân trang là khu vực ẩn giấu sau lưng trang web, chỉ những người lập trình viên cấp cao nhất mới có thể nhấn mã khóa bí mật để nhìn thấy được nó trên màn hình.", "Chân trang là khu vực nằm ở giữa trang web, nội dung ở đây sẽ tự động thay đổi màu sắc rực rỡ liên tục nhằm cảnh báo người dùng không được phép đóng trình duyệt."], correct: 0 },
        { id: "1_12", type: "single", question: "Tính năng \"Xem trước\" (<span class='code-inline'>Preview</span> - biểu tượng hình máy tính/điện thoại) mang lại giá trị kiểm thử vô cùng quan trọng nào trước khi xuất bản trang web?", options: ["Nó cho phép người thiết kế quan sát và kiểm tra xem giao diện trang web của mình sẽ hiển thị co giãn như thế nào trên các thiết bị khác nhau (PC, máy tính bảng, điện thoại).", "Nó cho phép người thiết kế tự động gửi trước toàn bộ nội dung của trang web cho chính quyền địa phương kiểm duyệt trước khi được phép đăng tải công khai lên mạng.", "Nó cho phép người thiết kế ép buộc tất cả khán giả phải xem trước một đoạn video quảng cáo dài năm phút thì mới được cấp quyền truy cập vào nội dung bài học.", "Nó cho phép người thiết kế dự đoán chính xác được doanh thu lợi nhuận thu về từ trang web trong vòng mười năm tới dựa trên các thuật toán tài chính đám mây."], correct: 0 },
        { id: "1_13", type: "single", question: "Thao tác \"Công bố\" (<span class='code-inline'>Publish</span>) trong Google Sites thực thi quy trình kĩ thuật cuối cùng nào đối với dự án thiết kế trang web của người dùng?", options: ["Nó sẽ đẩy toàn bộ dữ liệu thiết kế từ trạng thái bản nháp riêng tư lên hệ thống máy chủ công khai, cung cấp một đường dẫn URL chính thức để mọi người có thể truy cập.", "Nó sẽ tự động khóa toàn bộ các tài khoản của người dùng khác đang cộng tác trên trang web và tước đoạt hoàn toàn quyền chỉnh sửa của họ vĩnh viễn không thể khôi phục.", "Nó sẽ biến trang web trở thành một tệp tin tài liệu in ấn PDF và tự động gửi lệnh in đến tất cả các máy in đang có mặt trong mạng lưới trường học hoặc cơ quan.", "Nó sẽ tự động chuyển đổi toàn bộ hình ảnh và văn bản trên trang web thành các dòng mã vạch QR code để người đi đường có thể dùng điện thoại di động quét nhanh."], correct: 0 },
        { id: "1_14", type: "single", question: "Khi công bố trang web lần đầu tiên, mục \"Địa chỉ web\" (<span class='code-inline'>Web address</span>) yêu cầu người dùng thiết lập thông tin để cấu thành yếu tố nào của đường dẫn?", options: ["Yêu cầu thiết lập một chuỗi kí tự ngắn gọn (không dấu, không khoảng trắng) để nối vào sau đường dẫn mặc định của hệ thống <span class='code-inline'>sites.google.com/view/</span>... tạo thành địa chỉ trang.", "Yêu cầu thiết lập một đoạn mã bảo mật gồm sáu chữ số để hệ thống tạo ra một bức tường lửa vững chắc ngăn chặn tuyệt đối những khách hàng không mời mà đến.", "Yêu cầu thiết lập số điện thoại cá nhân của chủ sở hữu trang web để hệ thống Google tự động gọi điện thông báo mỗi khi có một bình luận mới xuất hiện trên bài viết.", "Yêu cầu thiết lập địa chỉ nơi sinh sống thực tế của người quản trị viên để Google Maps tự động định vị và cử nhân viên kĩ thuật đến sửa chữa khi trang web bị lỗi mạng."], correct: 0 },
        { id: "1_15", type: "single", question: "Để nhúng một tệp tin trình chiếu bài giảng (<span class='code-inline'>Google Slides</span>) từ Google Drive vào Google Sites, người dùng cần sử dụng công cụ nằm trong nhóm chức năng nào?", options: ["Người dùng cần cuộn xuống phía dưới cùng của thẻ \"Chèn\" (<span class='code-inline'>Insert</span>), tìm và nhấp chọn biểu tượng \"Trang trình bày\" (<span class='code-inline'>Slides</span>) rồi lựa chọn tệp tin tương ứng từ kho Google Drive.", "Người dùng cần cuộn xuống phía dưới cùng của thẻ \"Trang\" (<span class='code-inline'>Pages</span>), tìm và nhấp chọn biểu tượng \"Trang trình bày\" (<span class='code-inline'>Slides</span>) rồi lựa chọn tệp tin tương ứng từ kho Google Drive.", "Người dùng cần cuộn xuống phía dưới cùng của thẻ \"Giao diện\" (<span class='code-inline'>Themes</span>), tìm và nhấp chọn biểu tượng \"Trang trình bày\" (<span class='code-inline'>Slides</span>) rồi lựa chọn tệp tin tương ứng từ kho Google Drive.", "Người dùng cần cuộn xuống phía dưới cùng của nút \"Công bố\" (<span class='code-inline'>Publish</span>), tìm và nhấp chọn biểu tượng \"Trang trình bày\" (<span class='code-inline'>Slides</span>) rồi lựa chọn tệp tin tương ứng từ kho Google Drive."], correct: 0 },
        { id: "1_16", type: "single", question: "Việc ứng dụng thành phần \"Mục lục\" (<span class='code-inline'>Table of Contents</span>) trong Google Sites mang lại tiện ích định hướng thông tin như thế nào cho khách truy cập?", options: ["Tiện ích này tự động quét tất cả các dòng tiêu đề có trên trang và tạo ra một danh sách liên kết, giúp người đọc dễ dàng nhấp chuột để cuộn nhanh đến nội dung tương ứng.", "Tiện ích này tự động quét tất cả các bức ảnh có trên trang và tạo ra một bộ sưu tập hình nền đẹp mắt, giúp người đọc có thể dễ dàng tải về máy tính để làm kỉ niệm.", "Tiện ích này tự động quét tất cả các số liệu có trên trang và vẽ ra một biểu đồ hình tròn so sánh tỉ lệ phần trăm, giúp người đọc đánh giá được năng lực kinh doanh.", "Tiện ích này tự động quét tất cả các bình luận của khán giả có trên trang và xóa bỏ những bình luận chứa từ ngữ thô tục, giúp người đọc không bị phản cảm khi lướt web."], correct: 0 },
        { id: "1_17", type: "single", question: "Trong phần Cài đặt điều hướng (<span class='code-inline'>Navigation Settings</span>) của Google Sites, thao tác chuyển đổi chế độ từ \"Trên cùng\" (<span class='code-inline'>Top</span>) sang \"Bên\" (<span class='code-inline'>Side</span>) sẽ làm thanh Menu thay đổi ra sao?", options: ["Thanh menu điều hướng sẽ rời khỏi vị trí nằm ngang ở phía trên cùng của trang web và di chuyển thành một dải danh sách các nút bấm xếp dọc nằm ở cạnh bên tay trái màn hình.", "Thanh menu điều hướng sẽ rời khỏi vị trí nằm ngang ở phía trên cùng của trang web và trôi nổi tự do khắp nơi trên màn hình, chạy trốn mỗi khi người dùng định bấm chuột vào.", "Thanh menu điều hướng sẽ rời khỏi vị trí nằm ngang ở phía trên cùng của trang web và tự động biến thành một biểu tượng giấu kín ở tít phía dưới cùng của khu vực chân trang.", "Thanh menu điều hướng sẽ rời khỏi vị trí nằm ngang ở phía trên cùng của trang web và tự động phân thân thành hai thanh menu hoàn toàn giống hệt nhau ở cả hai mép trái phải."], correct: 0 },
        { id: "1_18", type: "single", question: "Công cụ \"Nhóm có thể thu gọn\" (<span class='code-inline'>Collapsible group</span>) được người thiết kế web sử dụng cực kì hiệu quả trong tình huống trình bày dữ liệu nào?", options: ["Sử dụng hiệu quả trong tình huống thiết kế các mục Câu hỏi thường gặp (FAQ), nơi người dùng có thể bấm vào dòng tiêu đề để mở rộng hoặc thu gọn phần văn bản trả lời chi tiết.", "Sử dụng hiệu quả trong tình huống thiết kế bản đồ định vị toàn cầu, nơi người dùng có thể bấm vào tọa độ vệ tinh để phóng to hoặc thu nhỏ khoảng cách địa lí của thành phố.", "Sử dụng hiệu quả trong tình huống thiết kế hệ thống báo thức, nơi người dùng có thể bấm vào khung giờ để bật lên hoặc tắt đi âm thanh chuông báo gọi dậy đi học buổi sáng.", "Sử dụng hiệu quả trong tình huống thiết kế bảng màu nghệ thuật, nơi người dùng có thể bấm vào màu đỏ để làm cho toàn bộ trang web lập tức đổi màu nền sang tông sặc sỡ."], correct: 0 },
        { id: "1_19", type: "single", question: "Nếu bạn đã lỡ công bố trang web nhưng sau đó phát hiện có lỗi sai nghiêm trọng và không muốn ai tiếp tục xem trang web đó nữa, bạn cần sử dụng tính năng gì?", options: ["Bạn cần nhấp vào mũi tên chỉ xuống bên cạnh nút \"Công bố\", sau đó chọn lệnh \"Hủy công bố\" (<span class='code-inline'>Unpublish</span>) để rút trang web khỏi môi trường mạng Internet công khai.", "Bạn cần nhấp vào mũi tên chỉ xuống bên cạnh nút \"Cài đặt\", sau đó chọn lệnh \"Xóa tài khoản Google\" để tiêu hủy hoàn toàn mọi thông tin cá nhân của bản thân trên mạng.", "Bạn cần nhấp vào mũi tên chỉ xuống bên cạnh nút \"Chia sẻ\", sau đó chọn lệnh \"Chặn tất cả khách hàng\" để cấm hệ thống mạng nội bộ phát sóng Wi-Fi cho hàng xóm dùng ké.", "Bạn cần nhấp vào mũi tên chỉ xuống bên cạnh nút \"Giao diện\", sau đó chọn lệnh \"Màn hình đen\" để trang web trở nên tối thui khiến cho khán giả sợ hãi và tự động thoát ra."], correct: 0 },
        { id: "1_20", type: "single", question: "Tính năng \"Nhân bản trang\" (<span class='code-inline'>Duplicate page</span>) hỗ trợ người thiết kế tiết kiệm đáng kể thời gian trong trường hợp nào khi xây dựng website?", options: ["Khi cần tạo ra một trang con mới có cấu trúc bố cục và cách trình bày đồ họa hoàn toàn giống hệt với một trang đã thiết kế sẵn, chỉ cần sửa lại văn bản nội dung cho khác đi.", "Khi cần tạo ra hàng loạt các tài khoản người dùng ảo để vào bình luận khen ngợi tự động (seeding) nhằm mục đích tăng hạng tìm kiếm cho trang web của mình trên mạng.", "Khi cần tạo ra một bản sao lưu toàn bộ hệ thống ổ cứng của máy tính cá nhân lên trên không gian lưu trữ đám mây để phòng ngừa tình trạng virus tấn công phá hoại dữ liệu.", "Khi cần tạo ra một tờ rơi quảng cáo in giấy màu đẹp mắt từ nội dung của trang web để mang đi phát miễn phí cho các bạn học sinh đứng ở ngoài cổng trường trung học."], correct: 0 },
        { id: "1_21", type: "single", question: "Trong hệ thống lưới (<span class='code-inline'>Grid layout</span>) ẩn của Google Sites, khi người dùng kéo thả để điều chỉnh chiều rộng của một bức ảnh, kích thước của bức ảnh sẽ thay đổi theo nguyên tắc nào?", options: ["Kích thước bức ảnh sẽ bắt buộc phải thay đổi thu phóng theo các cột dọc (columns) chia đều trên màn hình, giúp các thành phần luôn luôn được gióng hàng thẳng lối với nhau.", "Kích thước bức ảnh sẽ thay đổi hoàn toàn tự do theo bất kì từng điểm ảnh pixel nhỏ nhất nào mà không cần phải tuân thủ theo bất kì một quy luật hình học thẳng hàng nào cả.", "Kích thước bức ảnh sẽ bị khóa chết vĩnh viễn và hoàn toàn không thể thu phóng to nhỏ được nếu như người dùng chưa tiến hành nộp phí mua bản quyền công cụ chỉnh sửa ảnh.", "Kích thước bức ảnh sẽ tự động thay đổi ngược lại với thao tác của tay người dùng, nghĩa là nếu người dùng kéo to ra thì hệ thống máy tính sẽ tự động bóp hình ảnh đó nhỏ lại."], correct: 0 },
        { id: "1_22", type: "single", question: "Khi muốn gắn biểu trưng nhận diện thương hiệu (Logo) xuất hiện trên thanh điều hướng của toàn trang web, lập trình viên truy cập vào mục cấu hình nào?", options: ["Truy cập vào biểu tượng bánh răng \"Cài đặt\" (<span class='code-inline'>Settings</span>) ở góc trên, chọn mục \"Hình ảnh thương hiệu\" (<span class='code-inline'>Brand images</span>) và tiến hành tải tệp Logo lên để hệ thống tự động chèn vào.", "Truy cập vào biểu tượng kính lúp \"Tìm kiếm\" (<span class='code-inline'>Search</span>) ở góc trên, gõ chữ Logo và tiến hành kéo thả bức ảnh vào màn hình để hệ thống tự động căn chỉnh vào đúng khu vực trung tâm.", "Truy cập vào biểu tượng con người \"Tài khoản\" (<span class='code-inline'>Account</span>) ở góc trên, chọn mục \"Đổi ảnh đại diện\" và tiến hành tải tệp Logo lên để hệ thống tự động đổi ảnh của toàn bộ người dùng.", "Truy cập vào biểu tượng thùng rác \"Xóa bỏ\" (<span class='code-inline'>Delete</span>) ở góc trên, chọn mục \"Khôi phục dữ liệu\" và tiến hành tải tệp Logo lên để hệ thống tự động in ra màn hình máy in giấy."], correct: 0 },
        { id: "1_23", type: "single", question: "Việc nhấp chuột vào biểu tượng \"Liên kết\" (<span class='code-inline'>Insert link</span>) trong thanh công cụ định dạng văn bản cho phép người thiết kế thực hiện tác vụ liên kết thông tin nào?", options: ["Cho phép bôi đen một cụm từ (ví dụ: \"Nhấn vào đây\") và gắn một đường dẫn URL để khi người xem nhấp vào cụm từ đó, họ sẽ được chuyển hướng sang một trang web khác.", "Cho phép hệ thống tự động kết nối hai chiếc máy tính xách tay lại với nhau qua đường truyền Bluetooth để tiến hành trao đổi các tệp tin văn bản siêu dài mà không cần Internet.", "Cho phép người thiết kế gọi điện thoại trực tiếp qua mạng lưới viễn thông quốc tế đến tận nhà của khán giả đang truy cập trang web để hướng dẫn họ cách thức đọc bài viết.", "Cho phép máy tính tự động dịch thuật đoạn văn bản đó thành một chuỗi mã Morse dạng tiếng bíp dài ngắn để liên lạc vô tuyến với các thiết bị định vị hàng hải trên biển."], correct: 0 },
        { id: "1_24", type: "single", question: "Chức năng \"Lịch sử phiên bản\" (<span class='code-inline'>Version history</span>) mang lại giải pháp cứu vãn dữ liệu cực kì an toàn nào cho đội ngũ cộng tác viên xây dựng nội dung trang web?", options: ["Giải pháp này tự động lưu lại các mốc thay đổi của dự án theo thời gian thực, cho phép người quản trị khôi phục lại trang web về một phiên bản ổn định cũ nếu lỡ tay làm hỏng.", "Giải pháp này tự động ghi âm lại toàn bộ những lời trao đổi thảo luận của các thành viên trong đội ngũ qua loa máy tính để làm bằng chứng phân xử khi có tranh chấp bản quyền.", "Giải pháp này tự động lập bảng danh sách thống kê những khách hàng đã truy cập vào trang web từ thời xa xưa để đội ngũ bán hàng gọi điện thoại tư vấn chào mời mua sản phẩm.", "Giải pháp này tự động tua nhanh thời gian của chiếc đồng hồ trên hệ điều hành Windows để ép buộc phần mềm phải hoàn thành việc xuất bản trang web sớm hơn dự kiến."], correct: 0 },
        
        { id: '1_c1', type: 'tf_cluster', question: "Nhóm của Lan đang sử dụng nền tảng <span class='code-inline'>Google Sites</span> để xây dựng một dự án trang web giới thiệu về các câu lạc bộ trong trường THPT. Lan chịu trách nhiệm tạo bố cục trang \"Trang chủ\". Bạn ấy tiến hành chèn một khối bố cục (<span class='code-inline'>Layout</span>) có sẵn gồm 3 ô hình ảnh nằm ngang kèm theo 3 đoạn văn bản mô tả ở phía dưới.", subQuestions: [
            { id: '1_d25a', text: "Các khối \"Bố cục\" (<span class='code-inline'>Layouts</span>) cung cấp sẵn trong ngăn Chèn (<span class='code-inline'>Insert</span>) là công cụ thiết kế trực quan, giúp Lan dàn trang hiển thị đồng đều mà hoàn toàn không cần phải căn ke kéo thả từng milimet theo cách thủ công.", correct: "Đúng" },
            { id: '1_d25b', text: "Dù đã chọn khối bố cục mẫu có sẵn 3 ô ảnh, Lan vẫn hoàn toàn có thể linh hoạt nhấp chuột vào một ô ảnh bất kì để xóa nó đi, hoặc chèn thêm một ô văn bản khác vào bên cạnh nếu muốn thay đổi lại cấu trúc.", correct: "Đúng" },
            { id: '1_d25c', text: "Để chèn một bức ảnh minh họa câu lạc bộ Thể thao vào ô trống đầu tiên của khối bố cục, Lan bắt buộc phải gõ mã lệnh <span class='code-inline'>&lt;img src=\"...\"&gt;</span> bằng ngôn ngữ HTML vào thanh tìm kiếm của Google Sites.", correct: "Sai" },
            { id: '1_d25d', text: "Các bức ảnh khi được Lan tải lên và đưa vào trong khối bố cục này sẽ tự động bị hệ thống khóa chết kích thước, Lan không thể nào sử dụng chuột để kéo các điểm neo nhằm phóng to hay thu nhỏ hình ảnh được nữa.", correct: "Sai" }
        ]},
        { id: '1_c2', type: 'tf_cluster', question: "Sau khi hoàn thiện trang \"Trang chủ\", bạn Tuấn đảm nhận nhiệm vụ tạo thêm hai trang mới là \"Giới thiệu\" và \"Đăng kí thành viên\". Tuấn mở thẻ \"Trang\" (<span class='code-inline'>Pages</span>) ở cột công cụ bên phải để thao tác. Dưới trang \"Đăng kí thành viên\", Tuấn muốn tạo thêm hai trang con là \"Mẫu đơn\" và \"Nội quy\".", subQuestions: [
            { id: '1_d26a', text: "Để tạo một trang mới hoàn toàn ngang hàng với \"Trang chủ\", Tuấn chỉ cần nhấp chuột vào biểu tượng dấu cộng (+) nằm ở phía dưới cùng của thẻ \"Trang\" (<span class='code-inline'>Pages</span>) và gõ tên trang mới.", correct: "Đúng" },
            { id: '1_d26b', text: "Mỗi khi Tuấn tạo thành công một trang mới, Google Sites sẽ tự động và thông minh thêm tên của trang đó vào thanh menu điều hướng (<span class='code-inline'>Navigation bar</span>) ở khu vực đầu trang web để khách truy cập dễ dàng nhấp vào.", correct: "Đúng" },
            { id: '1_d26c', text: "Để tạo trang con \"Mẫu đơn\" nằm thụt lùi vào bên trong hệ thống của trang \"Đăng kí thành viên\", Tuấn cần nháy nút ba chấm cạnh chữ \"Đăng kí thành viên\" rồi chọn lệnh \"Thêm trang con\" (<span class='code-inline'>Add subpage</span>).", correct: "Đúng" },
            { id: '1_d26d', text: "Nếu Tuấn lỡ tay kéo thả trang \"Giới thiệu\" đè lên trên \"Trang chủ\" ở trong danh sách thẻ Trang, hệ thống phần mềm sẽ lập tức báo lỗi nghiêm trọng và xóa sạch toàn bộ nội dung mà Tuấn đã thiết kế từ sáng tới giờ.", correct: "Sai" }
        ]},
        { id: '1_c3', type: 'tf_cluster', question: "Ở trang \"Mẫu đơn\", bạn Hùng muốn nhúng một biểu mẫu khảo sát trực tuyến do giáo viên chủ nhiệm đã tạo trên <span class='code-inline'>Google Forms</span> để thu thập thông tin học sinh đăng kí câu lạc bộ.", subQuestions: [
            { id: '1_d27a', text: "Để nhúng biểu mẫu, Hùng cần cuộn công cụ xuống phần dưới của thẻ \"Chèn\" (<span class='code-inline'>Insert</span>), chọn tiện ích \"Biểu mẫu\" (<span class='code-inline'>Forms</span>), sau đó hệ thống sẽ tự động mở kho Google Drive của Hùng để chọn tệp khảo sát cần thiết.", correct: "Đúng" },
            { id: '1_d27b', text: "Khi biểu mẫu <span class='code-inline'>Google Forms</span> được nhúng trực tiếp vào trang web, học sinh truy cập có thể thao tác đánh dấu tích và nhấn nút \"Gửi\" (<span class='code-inline'>Submit</span>) ngay trên màn hình trang web mà không cần bị điều hướng mở ra một tab mới.", correct: "Đúng" },
            { id: '1_d27c', text: "Thay vì dùng tiện ích có sẵn, Hùng bắt buộc phải mở tệp Google Forms, nhấn tổ hợp phím sao chép mã nhúng (<span class='code-inline'>embed code</span>) và viết một đoạn mã lập trình giao tiếp mạng cục bộ thì biểu mẫu mới có thể hiển thị được.", correct: "Sai" },
            { id: '1_d27d', text: "Mọi dữ liệu mà học sinh điền vào biểu mẫu trên trang Google Sites sẽ không được lưu trữ lại do hệ thống bảo mật của Google tự động chặn các luồng thông tin thu thập từ các trang web tự tạo của cá nhân.", correct: "Sai" }
        ]},
        { id: '1_c4', type: 'tf_cluster', question: "Trang web dự án đã hoàn tất nội dung. Nhóm trưởng Mai tiến hành quá trình xuất bản trang web. Mai nhấp vào nút \"Công bố\" (<span class='code-inline'>Publish</span>) màu xanh ở góc trên bên phải màn hình. Cửa sổ thiết lập xuất bản hiện ra yêu cầu điền một số thông tin. Mai nhập địa chỉ web là <span class='code-inline'>clbtruongthpt2026</span>.", subQuestions: [
            { id: '1_d28a', text: "Thao tác \"Công bố\" mang tính chất kĩ thuật cốt lõi là chuyển trạng thái trang web từ dạng bản nháp nội bộ cá nhân lên hệ thống máy chủ mạng Internet, cho phép những người khác có thể sử dụng đường dẫn để truy cập vào xem.", correct: "Đúng" },
            { id: '1_d28b', text: "Nếu Mai nhập địa chỉ web là <span class='code-inline'>clbtruongthpt2026</span>, đường dẫn URL đầy đủ và chính thức cung cấp cho bạn bè truy cập thường sẽ có dạng chuẩn mực của hệ thống là <span class='code-inline'>https://sites.google.com/view/clbtruongthpt2026</span>.", correct: "Đúng" },
            { id: '1_d28c', text: "Tại phần \"Cài đặt tìm kiếm\" (<span class='code-inline'>Search settings</span>) trong hộp thoại công bố, Mai hoàn toàn có thể đánh dấu tích vào ô yêu cầu các công cụ tìm kiếm công cộng (như Google Search) không hiển thị trang web này lên kết quả tìm kiếm.", correct: "Đúng" },
            { id: '1_d28d', text: "Sau khi trang web đã được công bố lên mạng, nếu Mai quay lại sửa chữa một lỗi sai chính tả trong bài viết, nội dung chỉnh sửa đó sẽ tự động xuất hiện ngay lập tức trên máy tính của người xem mà Mai không cần phải nhấn nút \"Công bố\" lại lần thứ hai.", correct: "Sai" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Kiểm Tra Thường Xuyên - Tin Học 12' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn câu hỏi và không trộn đáp án
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp điểm ưu tiên từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ in ra định dạng ngày tháng năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
