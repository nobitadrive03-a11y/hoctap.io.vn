  <script>
    let database = null;
    let scoresRef = null;
    let currentIdx = 0;

    try {
        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Pos8awlh9j041qDWTPFRsVIjF-kPnk",
            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoctap-91691",
            storageBucket: "hoctap-91691.firebasestorage.app",
            messagingSenderId: "1004553425319",
            appId: "1:1004553425319:web:45d15cbae393f614c56682",
            measurementId: "G-Q6X1TL9PRV"
        };
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            scoresRef = database.ref('TinHoc12/KiemTraThuongXuyen1_De1');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('selectstart', event => {
        if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') { event.preventDefault(); }
    });
    document.addEventListener('dragstart', event => event.preventDefault()); 
    document.addEventListener('copy', event => {
        event.clipboardData.setData('text/plain', 'Tài liệu đã được bảo vệ!');
        event.preventDefault();
        window.handleCheatAction('Sao chép (Copy) văn bản');
    });

    // DỮ LIỆU ĐỀ THI MỚI (KẾT NỐI SỐ, NHÀ THÔNG MINH, THIẾT BỊ SỐ)
    const de_data = [
        { id: "1_1", type: "single", question: "Khi tiến hành kết nối máy tính cá nhân với thiết bị hiển thị bên ngoài như ti vi thông minh hoặc máy chiếu, cáp tín hiệu <span class='code-inline'>HDMI</span> mang lại ưu điểm kĩ thuật vượt trội nào?", options: ["Cáp <span class='code-inline'>HDMI</span> hỗ trợ khả năng truyền tải đồng thời cả tín hiệu hình ảnh độ phân giải cao và tín hiệu âm thanh kĩ thuật số chất lượng tốt qua một sợi cáp.", "Cáp <span class='code-inline'>HDMI</span> hỗ trợ tự động sửa chữa các tệp tin hệ điều hành bị lỗi trên máy tính cá nhân trước khi tiến hành trình chiếu hình ảnh lên trên màn hình.", "Cáp <span class='code-inline'>HDMI</span> hỗ trợ chuyển đổi mã nguồn phần mềm sang ngôn ngữ cấp thấp để tăng tốc độ khởi động của các thiết bị máy chiếu thông minh.", "Cáp <span class='code-inline'>HDMI</span> hỗ trợ khả năng chống lại mọi loại virus lây lan qua đường truyền mạng không dây nhờ một con chip bảo mật gắn ở trong lõi cáp."], correct: 0 },
        { id: "1_2", type: "single", question: "Tổ hợp phím tắt nào sau đây trên hệ điều hành Windows được kĩ thuật viên sử dụng để gọi nhanh bảng điều khiển các chế độ hiển thị màn hình mở rộng?", options: ["Nhấn giữ tổ hợp phím tắt <span class='code-inline'>Windows + P</span> trên bàn phím sẽ ngay lập tức mở ra bảng giao diện thiết lập các tùy chọn chiếu xuất hình ảnh màn hình.", "Nhấn giữ tổ hợp phím tắt <span class='code-inline'>Windows + D</span> trên bàn phím sẽ ngay lập tức mở ra bảng giao diện thiết lập các tùy chọn chiếu xuất hình ảnh màn hình.", "Nhấn giữ tổ hợp phím tắt <span class='code-inline'>Windows + L</span> trên bàn phím sẽ ngay lập tức mở ra bảng giao diện thiết lập các tùy chọn chiếu xuất hình ảnh màn hình.", "Nhấn giữ tổ hợp phím tắt <span class='code-inline'>Windows + E</span> trên bàn phím sẽ ngay lập tức mở ra bảng giao diện thiết lập các tùy chọn chiếu xuất hình ảnh màn hình."], correct: 0 },
        { id: "1_3", type: "single", question: "Trong các chế độ hiển thị màn hình mở rộng của Windows, tùy chọn <span class='code-inline'>\"Extend\"</span> (Mở rộng) mang lại phương thức làm việc kĩ thuật như thế nào cho người sử dụng?", options: ["Chế độ <span class='code-inline'>Extend</span> sẽ tiến hành ghép nối hai màn hình lại tạo thành không gian làm việc rộng lớn, cho phép kéo thả cửa sổ từ màn hình này sang màn kia.", "Chế độ <span class='code-inline'>Extend</span> sẽ tiến hành tắt hoàn toàn màn hình máy tính gốc và chỉ cho phép hiển thị nội dung duy nhất trên màn hình của chiếc máy chiếu phụ.", "Chế độ <span class='code-inline'>Extend</span> sẽ tiến hành sao chép hình ảnh giống hệt nhau ở cả hai màn hình, giúp tất cả khán giả nhìn thấy chính xác những gì đang diễn ra.", "Chế độ <span class='code-inline'>Extend</span> sẽ tiến hành đảo ngược toàn bộ màu sắc của các hình ảnh đang hiển thị trên màn hình phụ để tiết kiệm tối đa điện năng tiêu thụ."], correct: 0 },
        { id: "1_4", type: "single", question: "Trong các chế độ hiển thị màn hình mở rộng của Windows, tùy chọn <span class='code-inline'>\"Duplicate\"</span> (Nhân bản) đáp ứng nhu cầu báo cáo thuyết trình theo phương thức nào?", options: ["Chế độ <span class='code-inline'>Duplicate</span> sẽ hiển thị trên màn hình máy tính và màn hình chiếu những nội dung hoàn toàn giống hệt nhau để khán giả dễ dàng theo dõi.", "Chế độ <span class='code-inline'>Duplicate</span> sẽ mở rộng không gian làm việc ra cả hai màn hình giúp người dùng có thể mở đồng thời nhiều phần mềm ở hai khu vực riêng.", "Chế độ <span class='code-inline'>Duplicate</span> sẽ tự động ngắt kết nối với màn hình máy tính gốc và chỉ phát tín hiệu hình ảnh sang cho màn hình của thiết bị máy chiếu.", "Chế độ <span class='code-inline'>Duplicate</span> sẽ khóa chặt bàn phím và chuột của máy tính để bảo vệ bài thuyết trình không bị người lạ ấn nhầm nút làm gián đoạn."], correct: 0 },
        { id: "1_5", type: "single", question: "Sự khác biệt cơ bản giữa cổng giao tiếp điện tử <span class='code-inline'>VGA</span> truyền thống và cổng giao tiếp <span class='code-inline'>HDMI</span> hiện đại trên các thiết bị hiển thị máy tính là gì?", options: ["Cổng kết nối <span class='code-inline'>VGA</span> là chuẩn giao tiếp điện tử chỉ hỗ trợ truyền tải duy nhất tín hiệu hình ảnh mà hoàn toàn không thể truyền tải được tín hiệu âm thanh.", "Cổng kết nối <span class='code-inline'>VGA</span> là chuẩn giao tiếp điện tử cho phép truyền tải đồng thời cả hình ảnh sắc nét và âm thanh vòm chất lượng cao qua cùng một cáp.", "Cổng kết nối <span class='code-inline'>VGA</span> là chuẩn giao tiếp điện tử chuyên dùng để phát sóng mạng Wi-Fi tốc độ cao từ máy tính xách tay sang cho các thiết bị di động.", "Cổng kết nối <span class='code-inline'>VGA</span> là chuẩn giao tiếp điện tử có khả năng tự động nhận diện và diệt trừ mọi loại mã độc xâm nhập qua đường truyền cáp quang."], correct: 0 },
        { id: "1_6", type: "single", question: "Trong kĩ thuật truyền tải dữ liệu, công nghệ kết nối <span class='code-inline'>Bluetooth</span> được định nghĩa chính xác nhất theo nguyên lí hoạt động vô tuyến nào dưới đây?", options: ["Công nghệ <span class='code-inline'>Bluetooth</span> là chuẩn kết nối không dây qua sóng vô tuyến điện ở phạm vi gần, chuyên dùng để truyền dữ liệu giữa các thiết bị số với nhau.", "Công nghệ <span class='code-inline'>Bluetooth</span> là chuẩn kết nối có dây cáp quang siêu tốc, chuyên dùng để kết nối các máy chủ trung tâm dữ liệu khổng lồ xuyên quốc gia.", "Công nghệ <span class='code-inline'>Bluetooth</span> là chuẩn kết nối vệ tinh viễn thông ở khoảng cách xa, cho phép truyền hình ảnh trực tiếp từ không gian vũ trụ về mặt đất.", "Công nghệ <span class='code-inline'>Bluetooth</span> là chuẩn kết nối sử dụng tia hồng ngoại tần số cao, chỉ hoạt động khi hai thiết bị số được đặt áp sát trực tiếp vào nhau."], correct: 0 },
        { id: "1_7", type: "single", question: "Quá trình \"Ghép đôi\" (<span class='code-inline'>Pairing</span>) khi thiết lập kết nối <span class='code-inline'>Bluetooth</span> giữa máy tính xách tay và điện thoại thông minh mang ý nghĩa bảo mật cốt lõi nào?", options: ["Quá trình ghép đôi đảm bảo hai thiết bị nhận diện, trao đổi mã khóa và cấp quyền cho phép truyền dữ liệu an toàn mà không bị kẻ lạ xâm nhập.", "Quá trình ghép đôi đảm bảo máy tính tự động xóa bỏ mọi tập tin rác trên điện thoại để giải phóng dung lượng bộ nhớ trước khi tiến hành truyền tải.", "Quá trình ghép đôi đảm bảo hệ điều hành của máy tính sẽ tự động được cập nhật lên phiên bản mới nhất thông qua mạng viễn thông 4G của điện thoại.", "Quá trình ghép đôi đảm bảo điện thoại sẽ trở thành một chiếc điều khiển từ xa để tắt nguồn máy tính xách tay trong những tình huống khẩn cấp."], correct: 0 },
        { id: "1_8", type: "single", question: "Để thực hiện việc chuyển một tệp tin hình ảnh từ điện thoại di động sang máy tính hệ điều hành Windows qua <span class='code-inline'>Bluetooth</span>, người dùng chọn lệnh nào ở máy tính?", options: ["Để nhận tệp tin từ điện thoại qua máy tính Windows bằng Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar và chọn lệnh <span class='code-inline'>\"Receive a file\"</span>.", "Để nhận tệp tin từ điện thoại qua máy tính Windows bằng Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar và chọn lệnh <span class='code-inline'>\"Send a file\"</span>.", "Để nhận tệp tin từ điện thoại qua máy tính Windows bằng Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar và chọn lệnh <span class='code-inline'>\"Join a Network\"</span>.", "Để nhận tệp tin từ điện thoại qua máy tính Windows bằng Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar và chọn lệnh <span class='code-inline'>\"Remove device\"</span>."], correct: 0 },
        { id: "1_9", type: "single", question: "Mô hình \"Nhà thông minh\" (<span class='code-inline'>Smart Home</span>) được xây dựng dựa trên nền tảng kết nối tự động hóa nào để mang lại trải nghiệm sống hiện đại cho người dùng?", options: ["Nhà thông minh là loại nhà được trang bị các hệ thống công nghệ tự động hóa, có thể kết nối và điều khiển từ xa qua ứng dụng để tạo sự tiện ích.", "Nhà thông minh là loại nhà được thiết kế hoàn toàn bằng các vật liệu kính cường lực phản quang, tự động hấp thụ ánh nắng để sưởi ấm căn phòng.", "Nhà thông minh là loại nhà chỉ sử dụng năng lượng gió tự nhiên để vận hành các động cơ cơ học kéo hệ thống ròng rọc mở cửa sổ mỗi buổi sáng.", "Nhà thông minh là loại nhà không có bất kì kết nối Internet nào nhằm mục đích bảo vệ sự riêng tư tuyệt đối của chủ nhân khỏi mọi tin tặc mạng."], correct: 0 },
        { id: "1_10", type: "single", question: "Để điều khiển và giám sát toàn bộ hệ thống các thiết bị trong nhà thông minh từ xa (khi không ở nhà), giải pháp công nghệ nào được người dùng ưu tiên sử dụng?", options: ["Để điều khiển hệ thống nhà thông minh từ xa một cách thuận tiện, người dùng thường cài đặt các phần mềm ứng dụng chuyên biệt trên điện thoại di động.", "Để điều khiển hệ thống nhà thông minh từ xa một cách thuận tiện, người dùng thường phải viết các dòng mã lệnh SQL trực tiếp trên màn hình tivi.", "Để điều khiển hệ thống nhà thông minh từ xa một cách thuận tiện, người dùng bắt buộc phải dùng các thiết bị phát tia laser để chiếu vào cảm biến.", "Để điều khiển hệ thống nhà thông minh từ xa một cách thuận tiện, người dùng phải kéo các sợi cáp mạng nối từ cơ quan làm việc về thẳng tận nhà."], correct: 0 },
        { id: "1_11", type: "single", question: "Ứng dụng điều khiển nhà thông minh trên điện thoại di động hoạt động dựa trên cơ chế đồng bộ hóa dữ liệu từ hệ thống máy chủ nào?", options: ["Khi hoạt động, phần mềm điều khiển nhà thông minh trên điện thoại sẽ truy cập tới cơ sở dữ liệu đám mây để lấy thông tin trạng thái của các thiết bị.", "Khi hoạt động, phần mềm điều khiển nhà thông minh trên điện thoại sẽ truy cập tới ổ đĩa mềm của máy vi tính để tự động tải về các tệp tin nhạc.", "Khi hoạt động, phần mềm điều khiển nhà thông minh trên điện thoại sẽ truy cập tới đài phát thanh địa phương để thu sóng radio điều khiển từ xa.", "Khi hoạt động, phần mềm điều khiển nhà thông minh trên điện thoại sẽ truy cập tới thẻ nhớ cắm ngoài của máy ảnh kĩ thuật số để đọc lệnh điều khiển."], correct: 0 },
        { id: "1_12", type: "single", question: "Trong mạng lưới nhà thông minh, thiết bị điểm truy cập không dây <span class='code-inline'>WAP</span> (Wireless Access Point) đóng vai trò hạ tầng kĩ thuật quan trọng như thế nào?", options: ["Trong mạng lưới nhà thông minh, mô-đun thu phát Wi-Fi của thiết bị gia dụng sẽ kết nối với Internet thông qua thiết bị trung gian là điểm truy cập <span class='code-inline'>WAP</span>.", "Trong mạng lưới nhà thông minh, mô-đun thu phát Wi-Fi của thiết bị gia dụng sẽ kết nối với Internet thông qua các thiết bị lưu trữ thẻ nhớ USB.", "Trong mạng lưới nhà thông minh, mô-đun thu phát Wi-Fi của thiết bị gia dụng sẽ kết nối với Internet thông qua dây cáp đồng trục truyền hình.", "Trong mạng lưới nhà thông minh, mô-đun thu phát Wi-Fi của thiết bị gia dụng sẽ kết nối với Internet thông qua vệ tinh quỹ đạo tầng điện li."], correct: 0 },
        { id: "1_13", type: "single", question: "Vòng đeo tay thông minh (<span class='code-inline'>Smart Band</span>) là một thiết bị số trợ lí cá nhân mang những đặc điểm chức năng nổi bật nào hỗ trợ cho cuộc sống con người?", options: ["Vòng đeo tay thông minh là thiết bị nhỏ gọn gắn ở cổ tay, thường được tích hợp cảm biến để đếm bước chân, đo nhịp tim và báo thức thời gian.", "Vòng đeo tay thông minh là thiết bị nhỏ gọn gắn ở cổ tay, chuyên dùng để phát sóng mạng 5G siêu tốc cho các máy tính xách tay trong doanh nghiệp.", "Vòng đeo tay thông minh là thiết bị nhỏ gọn gắn ở cổ tay, có khả năng tự động chiếu hình ảnh phim 3D trực tiếp lên trên bề mặt của bức tường.", "Vòng đeo tay thông minh là thiết bị nhỏ gọn gắn ở cổ tay, được sử dụng để lưu trữ hàng ngàn bộ phim điện ảnh chất lượng cao phục vụ giải trí."], correct: 0 },
        { id: "1_14", type: "single", question: "Kính thực tế ảo (<span class='code-inline'>VR Glasses</span>) mang lại giải pháp công nghệ hình ảnh không gian độc đáo nào cho người trải nghiệm hệ thống đa phương tiện?", options: ["Kính thực tế ảo (<span class='code-inline'>VR</span>) là một thiết bị số đặc biệt giúp người sử dụng hòa mình vào không gian mô phỏng ba chiều sinh động do hệ thống máy tính tạo ra.", "Kính thực tế ảo (<span class='code-inline'>VR</span>) là một thiết bị số đặc biệt chuyên dùng để chụp ảnh X-quang y tế và gửi trực tiếp kết quả chẩn đoán vào hòm thư của bác sĩ.", "Kính thực tế ảo (<span class='code-inline'>VR</span>) là một thiết bị số đặc biệt giúp tự động dịch thuật mọi ngôn ngữ trên thế giới thành văn bản tiếng Việt hiển thị trên mặt kính.", "Kính thực tế ảo (<span class='code-inline'>VR</span>) là một thiết bị số đặc biệt có chức năng phát hiện và vô hiệu hóa mọi loại thiết bị nghe lén giấu kín bên trong căn phòng."], correct: 0 },
        { id: "1_15", type: "single", question: "Khi thực hành kết nối máy chiếu với máy tính xách tay, nếu máy chiếu không có màn hình cảm ứng để người dùng nhấp chọn giao diện thì ta thao tác như thế nào?", options: ["Do máy chiếu thường không có màn hình hiển thị để xác nhận menu, người dùng cần bấm các nút điều khiển vật lí trên thân máy để chọn cổng đầu vào.", "Do máy chiếu thường không có màn hình hiển thị để xác nhận menu, người dùng bắt buộc phải dùng giọng nói để ra lệnh cho máy chiếu khởi động lại.", "Do máy chiếu thường không có màn hình hiển thị để xác nhận menu, người dùng phải tháo rời thấu kính ra để điều chỉnh tiêu cự bằng tay thủ công.", "Do máy chiếu thường không có màn hình hiển thị để xác nhận menu, người dùng không thể nào kết nối được thiết bị này với bất kì chiếc laptop nào."], correct: 0 },
        { id: "1_16", type: "single", question: "Tùy chọn <span class='code-inline'>\"Second screen only\"</span> trong bảng trình chiếu của Windows 10 cung cấp phương thức xuất hình ảnh đáp ứng nhu cầu kĩ thuật nào?", options: ["Tùy chọn <span class='code-inline'>\"Second screen only\"</span> trên máy tính mang ý nghĩa là hệ thống sẽ tắt màn hình gốc của máy tính xách tay và chỉ phát hình ảnh lên màn chiếu.", "Tùy chọn <span class='code-inline'>\"Second screen only\"</span> trên máy tính mang ý nghĩa là hệ thống sẽ bật cả hai màn hình nhưng chỉ cho phép màn chiếu chạy các video clip.", "Tùy chọn <span class='code-inline'>\"Second screen only\"</span> trên máy tính mang ý nghĩa là hệ thống sẽ tự động ghép hai màn hình lại với nhau để chơi game giải trí thực tế ảo.", "Tùy chọn <span class='code-inline'>\"Second screen only\"</span> trên máy tính mang ý nghĩa là hệ thống sẽ thu nhỏ hình ảnh lại chỉ bằng một nửa kích thước của màn hình hiển thị."], correct: 0 },
        { id: "1_17", type: "single", question: "Để liên kết màn hình của một chiếc ti vi thông minh làm công cụ hiển thị thay thế cho máy tính trong phòng họp, chuẩn cáp vật lí nào được ưu tiên lựa chọn?", options: ["Tivi thông minh hiện đại thường được trang bị đa dạng các cổng kết nối tín hiệu đầu vào, trong đó phổ biến và chất lượng cao nhất là cổng giao tiếp <span class='code-inline'>HDMI</span>.", "Tivi thông minh hiện đại thường được trang bị đa dạng các cổng kết nối tín hiệu đầu vào, trong đó phổ biến và chất lượng cao nhất là cổng đĩa mềm Floppy.", "Tivi thông minh hiện đại thường được trang bị đa dạng các cổng kết nối tín hiệu đầu vào, trong đó phổ biến và chất lượng cao nhất là cổng nối máy in.", "Tivi thông minh hiện đại thường được trang bị đa dạng các cổng kết nối tín hiệu đầu vào, trong đó phổ biến và chất lượng cao nhất là cổng âm thanh Mono."], correct: 0 },
        { id: "1_18", type: "single", question: "Ở giai đoạn đầu tiên khi mới mua một thiết bị nhà thông minh (ví dụ công tắc đèn Wi-Fi) về lắp đặt, phần mềm điện thoại sẽ giao tiếp với thiết bị này qua đường dẫn nào?", options: ["Trong giai đoạn đầu tiên khi cấu hình thiết bị nhà thông minh, phần mềm điện thoại thường kết nối với thiết bị đó qua <span class='code-inline'>Bluetooth</span> hoặc <span class='code-inline'>Wi-Fi</span> phát ra trực tiếp.", "Trong giai đoạn đầu tiên khi cấu hình thiết bị nhà thông minh, phần mềm điện thoại thường yêu cầu người dùng phải gọi điện trực tiếp cho tổng đài nhà mạng.", "Trong giai đoạn đầu tiên khi cấu hình thiết bị nhà thông minh, phần mềm điện thoại sẽ tự động in ra một mã vạch QR lên giấy để người dùng lấy máy quét lại.", "Trong giai đoạn đầu tiên khi cấu hình thiết bị nhà thông minh, phần mềm điện thoại sẽ vô hiệu hóa toàn bộ chức năng nghe gọi để tập trung đẩy lượng băng thông."], correct: 0 },
        { id: "1_19", type: "single", question: "Hoạt động \"Đăng kí thiết bị lên đám mây\" (<span class='code-inline'>Cloud Registration</span>) mang ý nghĩa thiết yếu nào đối với hệ sinh thái của một ngôi nhà thông minh?", options: ["Việc đăng kí thiết bị nhà thông minh lên cơ sở dữ liệu đám mây là nhằm mục đích để thiết bị có thể được theo dõi trạng thái và điều khiển từ xa qua Internet.", "Việc đăng kí thiết bị nhà thông minh lên cơ sở dữ liệu đám mây là nhằm mục đích để thiết bị có khả năng tự động sạc pin bằng sóng năng lượng Mặt Trời.", "Việc đăng kí thiết bị nhà thông minh lên cơ sở dữ liệu đám mây là nhằm mục đích để hệ thống tự động tải về các trò chơi điện tử trực tuyến mới nhất.", "Việc đăng kí thiết bị nhà thông minh lên cơ sở dữ liệu đám mây là nhằm mục đích để thiết bị tự động dịch thuật các bài hát tiếng Anh sang tiếng Việt."], correct: 0 },
        { id: "1_20", type: "single", question: "Lợi ích sư phạm cốt lõi của việc sử dụng các thiết bị hiển thị mở rộng (như máy chiếu, ti vi lớn) trong các buổi thuyết trình và giảng dạy là gì?", options: ["Sử dụng các thiết bị hiển thị mở rộng giúp người thuyết trình kết hợp được hình ảnh và âm thanh chất lượng, làm cho bài báo cáo trở nên trực quan, sinh động.", "Sử dụng các thiết bị hiển thị mở rộng giúp cho máy tính cá nhân tự động dọn dẹp các tệp tin rác và tăng tốc độ xử lí trình duyệt web lên gấp đôi.", "Sử dụng các thiết bị hiển thị mở rộng giúp cho hệ thống âm thanh của máy tính tự động lọc bỏ mọi tiếng ồn từ khán giả xuất hiện trong hội trường.", "Sử dụng các thiết bị hiển thị mở rộng giúp cho toàn bộ các văn bản chữ viết trên slide tự động biến thành các hình ảnh minh họa vẽ bằng tay thủ công."], correct: 0 },
        { id: "1_21", type: "single", question: "Để sóng vô tuyến của công nghệ <span class='code-inline'>Bluetooth</span> đạt được độ ổn định và tốc độ truyền tải tệp tin cao nhất, người dùng cần tuân thủ điều kiện không gian nào?", options: ["Kết nối <span class='code-inline'>Bluetooth</span> hoạt động ổn định và hiệu quả nhất khi hai thiết bị số được đặt ở vị trí gần nhau trong một phạm vi không gian địa lí tương đối hẹp.", "Kết nối <span class='code-inline'>Bluetooth</span> hoạt động ổn định và hiệu quả nhất khi hai thiết bị số được đặt cách xa nhau ở hai thành phố khác nhau qua đường truyền vệ tinh.", "Kết nối <span class='code-inline'>Bluetooth</span> hoạt động ổn định và hiệu quả nhất khi hai thiết bị số được nhúng ngập hoàn toàn vào môi trường nước tinh khiết để tản nhiệt mát.", "Kết nối <span class='code-inline'>Bluetooth</span> hoạt động ổn định và hiệu quả nhất khi hai thiết bị số được che chắn cẩn thận bên trong một hộp kim loại chì nhằm tránh bị nhiễm từ."], correct: 0 },
        { id: "1_22", type: "single", question: "Để ra lệnh cho chiếc máy tính xách tay phát gửi một tệp tin tài liệu Word sang chiếc điện thoại di động thông qua <span class='code-inline'>Bluetooth</span>, thao tác chính xác là gì?", options: ["Để gửi một tệp tin từ máy tính sang điện thoại qua Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar rồi chọn lệnh <span class='code-inline'>\"Send a file\"</span>.", "Để gửi một tệp tin từ máy tính sang điện thoại qua Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar rồi chọn lệnh <span class='code-inline'>\"Receive a file\"</span>.", "Để gửi một tệp tin từ máy tính sang điện thoại qua Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar rồi chọn lệnh <span class='code-inline'>\"Block device\"</span>.", "Để gửi một tệp tin từ máy tính sang điện thoại qua Bluetooth, ta nháy chuột phải vào biểu tượng Bluetooth ở thanh Taskbar rồi chọn lệnh <span class='code-inline'>\"Turn off radio\"</span>."], correct: 0 },
        { id: "1_23", type: "single", question: "Một bộ \"Công tắc thông minh\" (<span class='code-inline'>Smart Switch</span>) được cấu tạo bao gồm những thành phần công nghệ hiện đại nào để thay thế cho công tắc cơ học truyền thống?", options: ["Một bộ công tắc thông minh thường được tích hợp các nút bấm cảm ứng linh hoạt cùng mô-đun kết nối mạng Wi-Fi để có thể nhận lệnh điều khiển từ xa.", "Một bộ công tắc thông minh thường được tích hợp một ổ đĩa đọc đĩa quang CD-ROM siêu nhỏ ở bên trong nhằm lưu trữ lại toàn bộ lịch sử bật tắt bóng đèn.", "Một bộ công tắc thông minh thường được tích hợp một hệ thống phát tia X-quang để tự động quét kiểm tra sức khỏe của người dùng khi họ tiến lại gần.", "Một bộ công tắc thông minh thường được tích hợp hệ thống động cơ phản lực thu nhỏ giúp thiết bị có khả năng bay lơ lửng xung quanh không gian phòng."], correct: 0 },
        { id: "1_24", type: "single", question: "Khi tiến hành kết nối một thiết bị gia dụng vào hệ thống nhà thông minh trên điện thoại, việc đưa thiết bị vào \"Trạng thái chờ kết nối\" nhằm mục đích gì?", options: ["Thiết bị cần được đưa vào trạng thái \"chờ kết nối\" để phát ra tín hiệu cho ứng dụng trên điện thoại di động có thể tiến hành dò tìm, nhận diện và đồng bộ.", "Thiết bị cần được đưa vào trạng thái \"chờ kết nối\" để nó tự động xóa bỏ mọi mật khẩu Wi-Fi cũ lưu trong bộ nhớ máy nhằm chống lại tin tặc mạng.", "Thiết bị cần được đưa vào trạng thái \"chờ kết nối\" để tự kích hoạt chế độ tự động dọn dẹp hệ điều hành Windows tránh giật lag khi đang tải thông tin.", "Thiết bị cần được đưa vào trạng thái \"chờ kết nối\" để máy tính chủ tiến hành tính toán trước bảng hóa đơn tiền điện hàng tháng cho toàn bộ ngôi nhà."], correct: 0 },
        
        { id: '1_c1', type: 'tf_cluster', question: "Trong giờ thực hành Tin học về kết nối thiết bị số, thầy giáo yêu cầu tổ của bạn Nam thực hiện trình chiếu một tệp tin bài tập lớn từ máy tính xách tay cá nhân (Laptop) lên trên màn hình của chiếc ti vi thông minh ở phòng học để cả lớp cùng quan sát. Nam tiến hành lấy cáp cắm và bấm phím chức năng.", subQuestions: [
            { id: '1_d25a', text: "Việc kết nối máy tính xách tay với ti vi thông minh thông qua cáp truyền tín hiệu <span class='code-inline'>HDMI</span> sẽ giúp truyền tải được đồng bộ cả phần hình ảnh trình chiếu và phần âm thanh thực tế sang thiết bị phát.", correct: "Đúng" },
            { id: '1_d25b', text: "Trong tình huống chiếc ti vi có nhiều cổng cắm HDMI khác nhau (như HDMI 1, HDMI 2), sau khi cắm cáp xong, Nam bắt buộc phải dùng điều khiển từ xa của ti vi để cấu hình chọn đúng đầu nguồn tín hiệu vào.", correct: "Đúng" },
            { id: '1_d25c', text: "Khi Nam thao tác bấm tổ hợp phím <span class='code-inline'>Windows + P</span> trên máy tính và lựa chọn chế độ <span class='code-inline'>\"Duplicate\"</span>, hình ảnh trên màn hình Laptop sẽ lập tức tắt đi và chỉ còn hiển thị duy nhất trên màn hình của chiếc ti vi.", correct: "Sai" },
            { id: '1_d25d', text: "Chế độ màn hình mở rộng <span class='code-inline'>\"Extend\"</span> cho phép Nam biến chiếc ti vi thành một màn hình thứ hai có không gian hoạt động độc lập, qua đó Nam có thể kéo cửa sổ phần mềm từ máy tính sang màn hình ti vi để làm việc đa nhiệm.", correct: "Đúng" }
        ]},
        { id: '1_c2', type: 'tf_cluster', question: "Bạn Mai đang ngồi tại thư viện trường và cần chuyển khẩn cấp một tệp tin hình ảnh đồ họa từ chiếc điện thoại di động thông minh sang máy tính xách tay Windows của mình bằng công nghệ <span class='code-inline'>Bluetooth</span>. Mai bật chức năng <span class='code-inline'>Bluetooth</span> trên cả hai thiết bị và bắt đầu quá trình thao tác chia sẻ tệp.", subQuestions: [
            { id: '1_d26a', text: "Bước thao tác đầu tiên có tính chất quyết định là Mai phải tiến hành \"Ghép đôi\" (<span class='code-inline'>Pairing</span>) thành công giữa máy tính xách tay và chiếc điện thoại để đảm bảo tính xác thực và an toàn bảo mật dữ liệu hai chiều.", correct: "Đúng" },
            { id: '1_d26b', text: "Trên giao diện hệ điều hành Windows, Mai nháy chuột phải vào biểu tượng Bluetooth ở khay hệ thống (Taskbar) và bắt buộc phải nhấn chọn lệnh <span class='code-inline'>\"Send a file\"</span> để dọn đường tiếp nhận tệp tin truyền đến từ chiếc điện thoại.", correct: "Sai" },
            { id: '1_d26c', text: "Khi Mai dùng điện thoại chọn tệp hình ảnh và ấn chia sẻ qua Bluetooth, máy tính xách tay (nếu đang bật trạng thái <span class='code-inline'>\"Receive a file\"</span>) sẽ tự động nhận diện kết nối và hiển thị thanh tiến trình truyền tải dữ liệu đồ họa.", correct: "Đúng" },
            { id: '1_d26d', text: "Công nghệ sóng kết nối không dây <span class='code-inline'>Bluetooth</span> mang đặc tính truyền dữ liệu ở phạm vi rất rộng lớn, do đó Mai có thể thoải mái đứng cách xa chiếc máy tính của mình hàng cây số mà vẫn gửi tệp bình thường qua các lớp tường.", correct: "Sai" }
        ]},
        { id: '1_c3', type: 'tf_cluster', question: "Bố của Hùng vừa mua một bộ công tắc điện thông minh (<span class='code-inline'>Smart Switch</span>) để thay thế cho công tắc đèn ngoài sân. Hùng tải phần mềm quản lí nhà thông minh về điện thoại di động và bắt đầu các bước thiết lập cấu hình để có thể bật/tắt đèn từ xa thông qua mạng Internet.", subQuestions: [
            { id: '1_d27a', text: "Trong lần cài đặt đầu tiên, Hùng cần cấp nguồn điện cho công tắc và nhấn giữ nút bấm cảm ứng trên thân thiết bị để đưa nó vào trạng thái \"Chờ kết nối\", lúc này đèn báo trên công tắc thường sẽ nhấp nháy liên tục.", correct: "Đúng" },
            { id: '1_d27b', text: "Để điện thoại và công tắc thông minh có thể \"nhìn thấy\" nhau lúc ban đầu, phần mềm trên điện thoại của Hùng sẽ tự động sử dụng sóng <span class='code-inline'>Bluetooth</span> hoặc mạng Wi-Fi phát ra trực tiếp từ chính chiếc công tắc đó.", correct: "Đúng" },
            { id: '1_d27c', text: "Sau khi kết nối gần thành công, phần mềm sẽ yêu cầu Hùng cung cấp mật khẩu Wi-Fi của mạng gia đình để công tắc kết nối với điểm truy cập không dây (<span class='code-inline'>WAP</span>), từ đó liên lạc được thẳng lên cơ sở dữ liệu đám mây.", correct: "Đúng" },
            { id: '1_d27d', text: "Khi hệ thống đã hoạt động ổn định, nếu Hùng bấm nút tắt đèn trên màn hình điện thoại, điện thoại của bạn ấy sẽ tự động phát tia hồng ngoại bắn thẳng vào công tắc ngoài sân để ra lệnh cắt điện cơ học.", correct: "Sai" }
        ]},
        { id: '1_c4', type: 'tf_cluster', question: "Bạn Khoa đang tìm hiểu về các thiết bị số cá nhân để chuẩn bị mua quà sinh nhật cho người em trai yêu thích công nghệ. Khoa tìm thấy hai lựa chọn rất phổ biến trên mạng là Vòng đeo tay thông minh (<span class='code-inline'>Smart Band</span>) và Kính thực tế ảo (<span class='code-inline'>VR Glasses</span>). Khoa đọc các thông số kĩ thuật để phân tích công dụng.", subQuestions: [
            { id: '1_d28a', text: "Vòng đeo tay thông minh (<span class='code-inline'>Smart Band</span>) là một thiết bị số nhỏ gọn được thiết kế chuyên biệt để đeo ở cổ tay, chức năng chính là hỗ trợ hiển thị thông báo tin nhắn, đếm bước chân và đo nhịp tim chăm sóc sức khỏe.", correct: "Đúng" },
            { id: '1_d28b', text: "Các loại kính thực tế ảo (<span class='code-inline'>VR Glasses</span>) có công dụng chính là giúp cho người dùng hòa mình vào một môi trường không gian ba chiều giả lập do máy tính tạo ra, mang lại cảm giác nhập vai sống động khi chơi game hoặc xem phim.", correct: "Đúng" },
            { id: '1_d28c', text: "Để Vòng đeo tay thông minh có thể đồng bộ hóa dữ liệu nhịp tim và giấc ngủ sang ứng dụng theo dõi sức khỏe trên điện thoại di động, người dùng bắt buộc phải dùng một sợi cáp mạng LAN cắm trực tiếp nối hai thiết bị với nhau.", correct: "Sai" },
            { id: '1_d28d', text: "Cả Vòng đeo tay thông minh và Kính thực tế ảo đều là những ví dụ điển hình cho sự phát triển của hệ sinh thái các thiết bị số cá nhân, giúp mở rộng khả năng tương tác của con người với môi trường điện toán số hóa.", correct: "Đúng" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Kiểm Tra Thường Xuyên  - Tin Học 12' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn câu hỏi và không trộn đáp án
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp điểm ưu tiên từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ in ra định dạng ngày tháng năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
