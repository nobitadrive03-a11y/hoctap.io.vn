<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tích hợp Trợ lý AI</title>

     <script async src="https://www.googletagmanager.com/gtag/js?id=G-HE4GXY8B53"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <style>
        /* Reset cơ bản và khóa cuộn toàn trang */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: Arial, sans-serif; overflow: hidden; }

        /* Bố cục chính */
        .layout-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #f4f7f6;
        }

        /* Phần nội dung trang web (chỉ cuộn phần này) */
        .main-content {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
        }

        /* Container thanh bên chứa AI */
        .ai-sidebar {
            width: 0; 
            background: #fff;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Cố định bằng chiều cao màn hình */
            border-left: 1px solid #ddd;
        }

        /* Khi AI được kích hoạt */
        .layout-wrapper.show-ai .ai-sidebar {
            width: 420px; /* Mình chỉnh rộng ra 420px để dễ nhìn hơn */
        }

        /* Nút đóng: Chốt cứng chiều cao là 50px */
        .close-ai-btn {
            height: 50px; 
            width: 100%;
            background: #e74c3c; 
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0; /* Ngăn không cho nút này bị bóp méo */
        }
        .close-ai-btn:hover { background: #c0392b; }

        /* Vùng chứa chat: Chiều cao = Tổng màn hình TRỪ ĐI 50px của nút đóng */
        #coze-chat-container {
            height: calc(100vh - 50px); 
            width: 100%;
            position: relative;
        }

        /* Can thiệp sâu: Ép các thành phần của Coze không được tràn viền */
        #coze-chat-container > div,
        #coze-chat-container iframe {
            width: 100% !important;
            height: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            bottom: 0 !important;
            right: 0 !important;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 768px) {
            .layout-wrapper.show-ai .ai-sidebar {
                position: fixed;
                top: 0;
                right: 0;
                width: 100%; 
                z-index: 9999;
            }
        }
    </style>
</head>
<body>

     <div class="layout-wrapper" id="app-layout">
        
         <!-- PHẦN 1: NỘI DUNG WEB 
        <div class="main-content">
            <nav style="background: #003399; padding: 15px; display: flex; gap: 20px; align-items: center;">
                <a href="#" style="color:white; text-decoration:none; font-weight:bold;">hoctap.io.vn</a>
                <a href="#" style="color:white; text-decoration:none; font-size: 14px;">GIỚI THIỆU</a>
                <a href="#" class="trigger-ai-btn" style="color:white; text-decoration:none; font-size: 14px; font-weight:bold;">TRỢ LÝ AI</a>
            </nav>

            <div style="padding: 40px 20px; text-align: center;">
                <h1 style="color: #005577; margin-bottom: 20px;">MANG CÔNG NGHỆ VÀO MỌI CHUYẾN ĐI</h1>
                
                <button class="trigger-ai-btn" style="padding: 15px 30px; background-color: #f39c12; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold;">
                    🤖 Trợ lý AI Hỗ trợ giải đáp
                </button>
            </div>
        </div>-->

        <!-- PHẦN 2: KHUNG CHAT AI -->
        <div class="ai-sidebar">
            <button class="close-ai-btn" id="close-ai">✖ Đóng Trợ lý AI</button>
            <div id="coze-chat-container"></div>
        </div>
        
    </div>

    <!-- Script nhúng Coze -->
    <script src="https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/1.2.0-beta.6/libs/oversea/index.js"></script>
    <script>
        const cozeClient = new CozeWebSDK.WebChatClient({
            config: {
                type: 'bot',
                bot_id: '7692747122802065413',
                isIframe: false,
            },
            auth: {
                type: 'token',
                token: 'cztei_0MOwKTPJPmqnNn0MnDJB9oH90WqjQ6T9Hq8X4YqzbE5C2bhKaDVaw7HfnNI4IHHib',
                onRefreshToken: async () => 'pat_iHd6HfMdqlG1ffXJqCm6FKIXBJniqoTLMBHOnVeQoePwaWDoClRUJzAqrfHX379R'
            },
            userInfo: {
                id: 'user',
                url: 'https://sf-coze-web-cdn.coze.com/obj/eden-sg/lm-lgvj/ljhwZthlaukjlkulzlp/coze/coze-logo.png',
                nickname: 'Khách hàng',
            },
            ui: {
                base: {
                    icon: 'logo_bot.png',
                    layout: 'pc', /* Trả về PC để khung chat tự động lấp đầy phần tử chứa nó */
                    lang: 'en', 
                },
                header: {
                    isShow: false,
                    isNeedClose: false, 
                },
                asstBtn: {
                    isNeed: false 
                },
                footer: {
                    isShow: false,
                },
                chatBot: {
                    title: 'Trợ lý AI',
                    uploadable: true,
                    width: 420, /* Khớp với chiều rộng của thanh bên ai-sidebar */
                    el: document.getElementById('coze-chat-container'),
                },
            },
        });

        cozeClient.showChatBot();

        const appLayout = document.getElementById('app-layout');
        const triggerBtns = document.querySelectorAll('.trigger-ai-btn');
        const closeBtn = document.getElementById('close-ai');

        triggerBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault(); 
                appLayout.classList.toggle('show-ai'); 
            });
        });

        closeBtn.addEventListener('click', () => {
            appLayout.classList.remove('show-ai');
        });
    </script>
</body>
</html>
