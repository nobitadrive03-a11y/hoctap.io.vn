                q: "Câu 9: Để tạo siêu liên kết mở tệp tài liệu `baocao.pdf` nằm cùng thư mục với trang web hiện tại, đoạn mã HTML nào sau đây ĐÚNG cú pháp?", 
                options: [
                    "A. `&lt;a href=\"baocao.pdf\"&gt;Xem báo cáo&lt;/a&gt;`", 
                    "B. `&lt;a src=\"baocao.pdf\"&gt;Xem báo cáo&lt;/a&gt;`", 
                    "C. `&lt;link href=\"baocao.pdf\"&gt;Xem báo cáo&lt;/link&gt;`", 
                    "D. `&lt;a file=\"baocao.pdf\"&gt;Xem báo cáo&lt;/a&gt;`"
                ], 
                correct: 0 
            },
            { 
                q: "Câu 10: Khi tạo liên kết email để lúc nhấp vào sẽ tự động mở phần mềm gửi thư đến địa chỉ admin@truong.edu.vn, đoạn mã HTML nào viết ĐÚNG cú pháp?", 
                options: [
                    "A. `&lt;a href=\"email:admin@truong.edu.vn\"&gt;Gửi email cho Admin&lt;/a&gt;`", 
                    "B. `&lt;a href=\"send:admin@truong.edu.vn\"&gt;Gửi email cho Admin&lt;/a&gt;`", 
                    "C. `&lt;a href=\"mailto:admin@truong.edu.vn\"&gt;Gửi email cho Admin&lt;/a&gt;`", 
                    "D. `&lt;a mail=\"admin@truong.edu.vn\"&gt;Gửi email cho Admin&lt;/a&gt;`"
                ], 
                correct: 2 
            }
        ];

        function startGame() {
            const nameInput = document.getElementById('studentName').value.trim();
            const classInput = document.getElementById('studentClass').value.trim();
            if (!nameInput || !classInput) { alert("Vui lòng nhập đầy đủ Họ tên và Lớp!"); return; }
            
            player.name = nameInput;
            player.class = classInput;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            
            renderFruits();
            createHangingStars();
        }

        function getHeartSVG(number) {
            return `
            <svg viewBox="0 0 100 100" class="w-full h-full overflow-visible pointer-events-auto">
                <path d="M 50 90 C 10 60, -5 30, 20 10 C 35 0, 45 10, 50 20 C 55 10, 65 0, 80 10 C 105 30, 90 60, 50 90 Z" fill="rgba(0,0,0,0.6)" transform="translate(0, 6) scale(0.95)" transform-origin="50 50"/>
                <path d="M 50 90 C 10 60, -5 30, 20 10 C 35 0, 45 10, 50 20 C 55 10, 65 0, 80 10 C 105 30, 90 60, 50 90 Z" fill="url(#redHeartGrad)"/>
                <path d="M 50 90 C 10 60, -5 30, 20 10 C 35 0, 45 10, 50 20 C 55 10, 65 0, 80 10 C 105 30, 90 60, 50 90 Z" fill="none" stroke="white" stroke-width="3" stroke-dasharray="5,4" transform="scale(0.85)" transform-origin="50 45"/>
                <text x="50" y="62" font-family="Arial, sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.7))">${number}</text>
            </svg>`;
        }

        function renderFruits() {
            const container = document.getElementById('fruits-container');
            const positions = [
                { top: "35%", left: "15%", delay: "0.1s" },
                { top: "18%", left: "28%", delay: "0.4s" },
                { top: "42%", left: "32%", delay: "0.2s" },
                { top: "10%", left: "48%", delay: "0.7s" },
                { top: "32%", left: "45%", delay: "0.3s" },
                { top: "52%", left: "50%", delay: "0.9s" },
                { top: "17%", left: "65%", delay: "0.5s" },
                { top: "38%", left: "65%", delay: "0.8s" },
                { top: "25%", left: "82%", delay: "0.6s" },
                { top: "48%", left: "80%", delay: "1.1s" }
            ];
            let html = '';
            positions.forEach((pos, i) => {
                html += `<div class="fruit" style="top: ${pos.top}; left: ${pos.left}; animation-delay: ${pos.delay};" onclick="openQuestion(${i})" id="fruit-${i}">
                            ${getHeartSVG(i + 1)}
                         </div>`;
            });
            container.innerHTML = html;
        }

        function createHangingStars() {
    const container = document.getElementById('hanging-decor');
    const ns = "http://www.w3.org/2000/svg";
    
    // Tăng số lượng từ 120 lên 350 ngôi sao
    for(let i=0; i<200; i++) {
        const x = 50 + Math.random() * 1500;
        let startY = (Math.random() > 0.3) ? (350 + Math.random() * 350) : (50 + Math.random() * 300);
        const length = 50 + Math.random() * 250;
        
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", x);
        line.setAttribute("y1", startY);
        line.setAttribute("x2", x);
        line.setAttribute("y2", startY + length);
        line.setAttribute("stroke", "#facc15");
        line.setAttribute("stroke-width", "1.5");
        line.setAttribute("stroke-dasharray", "3,3");
        line.setAttribute("opacity", "0.6");
        container.appendChild(line);
        
        const star = document.createElementNS(ns, "use");
        star.setAttribute("href", "#star-shape");
        star.setAttribute("x", x);
        star.setAttribute("y", startY + length);
        star.setAttribute("class", "twinkle-star");
        star.style.animationDelay = (Math.random() * 3) + "s";
        star.style.animationDuration = (2 + Math.random() * 2) + "s";
        star.style.transformOrigin = `${x}px ${startY + length}px`; 
        const scale = 0.5 + Math.random() * 0.7; 
        star.setAttribute("transform", `scale(${scale})`);
        
        container.appendChild(star);
    }
}

        function formatHTMLCode(text) {
            let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return safeText.replace(/`([^`]+)`/g, '<code class="text-[#1d4ed8] bg-white border border-gray-400 px-2 py-0.5 rounded font-mono text-[1.1em] mx-1 break-all sm:break-normal inline-block shadow-sm font-black transition-colors">$1</code>');
        }

        const letters = ['A', 'B', 'C', 'D'];

        function openQuestion(index) {
            currentFruitIndex = index;
            const q = questions[index];
            const contentDiv = document.getElementById('qModalContent');
            
            let formattedQ = formatHTMLCode(q.q);
            
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                let cleanText = opt.replace(/^[A-D]\.\s*/, '');
                let formattedOpt = formatHTMLCode(cleanText);
                
                optionsHtml += `
                <button id="opt-${i}" onclick="checkAnswer(${i})" class="w-full flex items-center gap-3 sm:gap-5 p-4 sm:p-5 rounded-2xl border-2 border-gray-200 hover:border-[#3b82f6] hover:bg-blue-50 transition-all text-left bg-white shadow-sm group shrink-0">
                    <div class="letter-box bg-[#e0e7ff] text-[#1e40af] font-black text-xl sm:text-2xl w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center shrink-0 group-hover:bg-[#2563eb] group-hover:text-white transition-colors">
                        ${letters[i]}
                    </div>
                    <div class="opt-text text-[#1e3a8a] font-bold text-[17px] sm:text-[20px] leading-relaxed flex-1">${formattedOpt}</div>
                </button>`;
            });

            // Chỉnh pb-12 sm:pb-6 và mb-8 sm:mb-0 để trên điện thoại kéo thấy được nút Tiếp tục
            contentDiv.innerHTML = `
                <div class="flex-1 overflow-y-auto p-4 sm:p-6 pb-12 sm:pb-6 custom-scroll relative flex flex-col justify-start sm:justify-center bg-white h-full rounded-2xl sm:rounded-3xl">
                    <div class="border-2 border-red-200 bg-red-50 text-red-600 font-bold text-lg sm:text-2xl p-4 sm:p-5 rounded-2xl mb-4 sm:mb-5 text-center shadow-sm shrink-0 leading-relaxed">
                        ${formattedQ}
                    </div>
                    <div class="flex flex-col gap-3 shrink-0" id="options-container">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-message" class="hidden mt-4 text-center font-bold text-lg sm:text-xl p-3 sm:p-4 rounded-xl shrink-0 shadow-sm border border-red-200 bg-red-100 text-red-700"></div>
                    <button id="btn-next-question" class="hidden mt-4 mb-8 sm:mb-0 w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg transition-all text-xl shrink-0">Tiếp tục ➡</button>
                </div>
            `;

            const modal = document.getElementById('qModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                contentDiv.classList.remove('scale-95', 'opacity-0');
                contentDiv.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function checkAnswer(selectedIndex) {
            const q = questions[currentFruitIndex];
            const isCorrect = selectedIndex === q.correct;
            
            const options = document.querySelectorAll('#options-container button');
            options.forEach(btn => btn.classList.add('opt-disabled'));
            
            if (isCorrect) {
                document.getElementById(`opt-${selectedIndex}`).classList.add('opt-correct');
            } else {
                document.getElementById(`opt-${selectedIndex}`).classList.add('opt-wrong');
                document.getElementById(`opt-${q.correct}`).classList.add('opt-correct');
                
                const feedback = document.getElementById('feedback-message');
                feedback.classList.remove('hidden');
                feedback.innerHTML = `💡 Đáp án đúng là ${letters[q.correct]}. Tiếc quá!`;
            }

            const btnNext = document.getElementById('btn-next-question');
            btnNext.classList.remove('hidden');
            
            setTimeout(() => {
                const modalBody = document.querySelector('.custom-scroll');
                if(modalBody) { modalBody.scrollTop = modalBody.scrollHeight; }
            }, 100);

            // BẢN VÁ LỖI CỘNG LỐ ĐIỂM (Chặn click đúp vào nút Tiếp tục)
            btnNext.onclick = function() {
                this.onclick = null; // Hủy luôn tính năng click sau lần bấm đầu
                this.classList.add('pointer-events-none'); // Khóa tương tác của nút
                processResult(isCorrect);
            };
        }

        function processResult(isCorrect) {
            const contentDiv = document.getElementById('qModalContent');
            contentDiv.classList.remove('scale-100', 'opacity-100');
            contentDiv.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                document.getElementById('qModal').classList.add('hidden');
                
                answeredQuestions++;
                const fruitEl = document.getElementById('fruit-' + currentFruitIndex);
                const resTitle = document.getElementById('resTitle');
                const resMessage = document.getElementById('resMessage');
                const resIcon = document.getElementById('resIcon');

                if (isCorrect) {
                    player.score += SCORE_PER_CORRECT;
                    resTitle.innerText = 'Chính xác! 🎉';
                    resTitle.className = 'text-3xl sm:text-4xl font-extrabold mb-4 text-green-600';
                    resMessage.innerText = 'Bạn nhận được một trái tim.';
                    resIcon.innerHTML = '❤️'; 
                    fruitEl.classList.add('picked');
                } else {
                    resTitle.innerText = 'Sai rồi! 😢';
                    resTitle.className = 'text-3xl sm:text-4xl font-extrabold mb-4 text-gray-800';
                    resMessage.innerText = 'Rất tiếc, trái tim đã bị hỏng!';
                    resIcon.innerHTML = '🖤'; 
                    fruitEl.classList.add('black');
                }

                const resModal = document.getElementById('resModal');
                const resContent = document.getElementById('resModalContent');
                resModal.classList.remove('hidden');
                setTimeout(() => {
                    resContent.classList.remove('scale-95', 'opacity-0');
                    resContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            }, 300);
        }

        function closeResModal() {
            const content = document.getElementById('resModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('resModal').classList.add('hidden');
                
                if(answeredQuestions >= TOTAL_QUESTIONS) {
                    finishGameAndStayOnTree();
                }
            }, 300);
        }

        function finishGameAndStayOnTree() {
            // Lưu điểm âm thầm lên Firebase
            if(scoresRef) {
                scoresRef.push({
                    name: player.name,
                    class: player.class,
                    score: player.score,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).catch(err => { console.error("Lỗi lưu điểm:", err); });
            }

            // Hiện banner ở màn hình cây để xem điểm và BXH
            document.getElementById('final-name-display').innerText = player.name;
            document.getElementById('final-score-display').innerText = player.score;
            document.getElementById('finish-banner').classList.remove('hidden');
        }

        function showLeaderboard() {
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('leaderboard-view').classList.remove('hidden');
            
            document.getElementById('lb-current-name').innerText = player.name;
            document.getElementById('lb-current-class').innerText = player.class;
            document.getElementById('lb-current-score').innerText = player.score;

            const tbody = document.getElementById('leaderboard-body');
            const loading = document.getElementById('lb-loading');
            tbody.innerHTML = '';
            loading.classList.remove('hidden');

            if(scoresRef) {
                scoresRef.orderByChild('score').once('value', snapshot => {
                    loading.classList.add('hidden');
                    let results = [];
                    snapshot.forEach(child => { results.push(child.val()); });
                    
                    results.sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        return (a.timestamp || 0) - (b.timestamp || 0);
                    });

                    renderTable(results);
                });
            } else {
                loading.classList.add('hidden');
                renderTable([{ name: player.name, class: player.class, score: player.score }]);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('leaderboard-body');
            let html = '';
            data.forEach((row, index) => {
                html += `
                <tr class="table-row border-b border-gray-200 text-gray-800 transition-colors text-sm sm:text-xl">
                    <td class="py-2 sm:py-4 px-1 sm:px-4 text-center font-bold text-gray-600">${index + 1}</td>
                    <td class="py-2 sm:py-4 px-1 sm:px-4 text-center">
                        <span class="bg-blue-100 text-blue-700 py-0.5 sm:py-1 px-1.5 sm:px-3 rounded font-bold text-[11px] sm:text-lg border border-blue-200 whitespace-nowrap">${row.class}</span>
                    </td>
                    <td class="py-2 sm:py-4 px-1 sm:px-4 font-semibold text-[13px] sm:text-lg leading-tight break-words">${row.name}</td>
                    <td class="py-2 sm:py-4 px-1 sm:px-4 text-center">
                        <span class="text-red-600 font-black border border-red-200 bg-red-50 rounded-full px-2 sm:px-4 py-0.5 sm:py-1 text-sm sm:text-lg">${row.score}</span>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
