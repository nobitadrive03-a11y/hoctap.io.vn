    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: manipulation; user-select: none;
        }

        /* ----- MÀN HÌNH ĐĂNG NHẬP ----- */
        #login-view {
            background-color: #1e293b;
            background-image: url('cayhanhphuc.png');
            background-size: cover; background-position: center; background-blend-mode: overlay;
        }
        .login-card {
            border: 6px solid #fbbf24; border-radius: 20px; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-header { background: linear-gradient(to bottom right, #1d4ed8, #0ea5e9); }

        /* ----- MÀN HÌNH GAME ----- */
        .game-board {
            position: relative; width: 100%; max-width: 1200px; aspect-ratio: 16/9;
            background-image: url('cayhanhphuc.png'); 
            background-size: contain; background-position: center bottom; background-repeat: no-repeat;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: #fff0f5;
        }

        /* ----- NGÔI SAO TREO LẤP LÁNH ----- */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); filter: drop-shadow(0 0 2px rgba(255,215,0,0.4)); }
            50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 12px rgba(255,215,0,1)); }
        }
        .twinkle-star { animation: twinkle 3s infinite ease-in-out; }

        /* ----- TRÁI TIM ĐỎ TƯƠNG TÁC ----- */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 12px rgba(255, 23, 68, 0.8)); }
        }

        .fruit {
            position: absolute; width: 9.5%; min-width: 55px; 
            cursor: pointer; transition: all 0.3s ease;
            animation: heartbeat 2.5s infinite ease-in-out; z-index: 20;
        }
        .fruit:hover, .fruit:active {
            transform: scale(1.25) !important; animation: none; z-index: 30;
            filter: drop-shadow(0 15px 25px rgba(213, 0, 0, 0.9));
        }

        @keyframes dropHeart {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(300px) rotate(20deg) scale(0.5); opacity: 0; }
        }
        .fruit.picked { animation: dropHeart 1s forwards !important; pointer-events: none; }
        .fruit.black svg { filter: grayscale(100%) brightness(0.2) drop-shadow(0 5px 5px rgba(0,0,0,0.8)); }
        .fruit.black { animation: none !important; transform: scale(0.9); pointer-events: none; }

        /* ----- BẢNG XẾP HẠNG ----- */
        #leaderboard-view { background-color: #f1f5f9; overflow-y: auto; padding: 20px; }
        .table-row:nth-child(even) { background-color: #f9fafb; }
        .table-row:hover { background-color: #f3f4f6; }

        /* ----- MODAL ----- */
        .modal-overlay { backdrop-filter: blur(5px); }
        .modal-content { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #ef4444; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* ----- HIỆU ỨNG CHỌN ĐÁP ÁN ----- */
        .opt-correct { background-color: #3b82f6 !important; border-color: #3b82f6 !important; color: white !important; }
        .opt-correct .letter-box { background-color: white !important; color: #3b82f6 !important; }
        .opt-correct .opt-text { color: white !important; }
        .opt-correct code { background-color: #111827 !important; color: #38bdf8 !important; border-color: #000 !important; }
        
        .opt-wrong { background-color: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }
        .opt-wrong .letter-box { background-color: white !important; color: #ef4444 !important; }
        .opt-wrong .opt-text { color: white !important; }
        .opt-wrong code { background-color: #111827 !important; color: #38bdf8 !important; border-color: #000 !important; }
        
        .opt-disabled { pointer-events: none; cursor: default; }
    </style>
</head>
<body>

    <script>
        // ----- CẤU HÌNH FIREBASE -----
        let database = null;
        let scoresRef = null;

        try {

        } catch(err) { console.error("Lỗi Firebase:", err); }

        // ----- DỮ LIỆU GAME -----
        let player = { name: "", class: "", score: 0 };
        let answeredQuestions = 0;
        let currentFruitIndex = -1;
        const TOTAL_QUESTIONS = 10;
        const SCORE_PER_CORRECT = 10; 

        // BỘ CÂU HỎI MỚI - Đã phân bổ đều đáp án tĩnh: A(3), B(3), C(2), D(2)
        const questions = [
            { 
                q: "Câu 1: Việc thực hiện các thao tác thêm mới, chỉnh sửa hoặc xoá bỏ dữ liệu trong bảng điểm môn học được gọi chung là gì?", 
                options: [
                    "A. Quá trình cập nhật dữ liệu của bài toán.", 
                    "B. Hoạt động truy xuất dữ liệu từ hệ thống.", 
                    "C. Phương thức khai thác thông tin lưu trữ.", 
                    "D. Giải pháp thu thập dữ liệu tự động hoá."
                ], 
                correct: 0 // Đáp án A
            },
            { 
                q: "Câu 2: Theo nội dung bài học, thao tác nào sau đây thuộc về hoạt động truy xuất dữ liệu?", 
                options: [
                    "A. Nhập dữ liệu mới vào bảng quản lí học tập.", 
                    "B. Tìm kiếm và lọc ra dữ liệu theo tiêu chí.", 
                    "C. Xoá bỏ toàn bộ bản ghi không còn dùng nữa.", 
                    "D. Thay đổi tên trường dữ liệu trong bảng."
                ], 
                correct: 1 // Đáp án B
            },
            { 
                q: "Câu 3: Mục đích chính của hoạt động quản lí trong các cơ quan, tổ chức xã hội là gì?", 
                options: [
                    "A. Lưu trữ tài liệu giấy tờ một cách gọn gàng.", 
                    "B. Sử dụng máy tính và các phần mềm hiện đại.", 
                    "C. Xử lí thông tin nhằm đưa ra các quyết định.", 
                    "D. Xoá bỏ các dữ liệu đã cũ trong hệ thống."
                ], 
                correct: 2 // Đáp án C
            },
            { 
                q: "Câu 4: Ví dụ nào sau đây thể hiện rõ hình thức thu thập dữ liệu tự động trong thực tế?", 
                options: [
                    "A. Giáo viên ghi điểm học sinh vào sổ giấy.", 
                    "B. Nhân viên ghi chép hàng tồn kho thủ công.", 
                    "C. Học sinh làm các bài kiểm tra viết tay.", 
                    "D. Dùng đầu đọc mã vạch tại quầy thanh toán."
                ], 
                correct: 3 // Đáp án D
            },
            { 
                q: "Câu 5: Sự khác biệt cơ bản giữa hoạt động truy xuất dữ liệu và khai thác thông tin là gì?", 
                options: [
                    "A. Truy xuất là tìm dữ liệu có sẵn, khai thác là phân tích thống kê để đưa ra thông tin hữu ích.", 
                    "B. Truy xuất là tính toán số liệu lớn, khai thác là công việc tìm kiếm các dữ liệu đơn thuần.", 
                    "C. Truy xuất chỉ thực hiện trên máy tính, khai thác chỉ thực hiện bằng các phương pháp thủ công.", 
                    "D. Truy xuất làm thay đổi cấu trúc dữ liệu gốc, khai thác chỉ đọc dữ liệu mà không làm thay đổi."
                ], 
                correct: 0 // Đáp án A
            },
            { 
                q: "Câu 6: Lợi ích lớn nhất mà ngành điện có được khi sử dụng công tơ điện tử thu thập dữ liệu tự động là gì?", 
                options: [
                    "A. Hoàn toàn không cần đến nhân viên kĩ thuật đi ghi số điện tại các hộ gia đình hằng tháng.", 
                    "B. Cung cấp dữ liệu lớn liên tục để quản lí kĩ thuật, phát hiện sớm khu vực quá tải hay mất điện.", 
                    "C. Tránh được hoàn toàn tình trạng người dân sử dụng trái phép các nguồn điện năng của quốc gia.",

                    "B. Vì các hệ quản trị cơ sở dữ liệu bắt buộc người quản trị phải thao tác gõ phím liên tục mỗi ngày.", 
                    "C. Vì thế giới thực luôn có sự biến động và quá trình nhập liệu ban đầu có thể phát sinh sai sót.", 
                    "D. Vì nếu không thực hiện thao tác cập nhật thì hệ thống máy tính sẽ dễ bị nhiễm các loại mã độc."
                ], 
                correct: 2 // Đáp án C
            },
            { 
                q: "Câu 8: Một học sinh chuyển trường và giáo viên thực hiện thao tác xoá tên em đó khỏi danh sách lớp trên hệ thống. Thao tác này thuộc về nội dung nào?", 
                options: [
                    "A. Nghiệp vụ truy xuất dữ liệu thông qua thao tác lọc ra các bản ghi theo tiêu chí xác định.", 
                    "B. Nghiệp vụ khai thác thông tin thông qua thao tác thống kê tổng hợp số liệu của lớp học.", 
                    "C. Nghiệp vụ thu thập dữ liệu tự động thông qua các thiết bị phần cứng kết nối mạng máy tính.", 
                    "D. Nghiệp vụ cập nhật dữ liệu thông qua thao tác xoá bản ghi cụ thể trong hệ thống quản lí."
                ], 
                correct: 3 // Đáp án D
            },
            { 
                q: "Câu 9: Trong thư viện, thủ thư in danh sách \"Học sinh mượn sách Toán\" (1) và tính toán \"Tỉ lệ loại sách được mượn nhiều nhất\" (2). Các hoạt động này lần lượt là gì?", 
                options: [
                    "A. (1) Truy xuất dữ liệu và (2) Khai thác thông tin dựa trên các số liệu đã được lưu trữ.", 
                    "B. (1) Khai thác thông tin và (2) Cập nhật dữ liệu lưu trữ trong hệ thống quản lí thư viện.", 
                    "C. (1) Cập nhật dữ liệu và (2) Truy xuất dữ liệu từ các bảng thông tin chi tiết của thư viện.", 
                    "D. (1) Thu thập tự động và (2) Truy xuất dữ liệu trực tiếp từ các thiết bị ngoại vi số."
                ], 
                correct: 0 // Đáp án A
            },
            { 
                q: "Câu 10: Giải pháp lắp đặt hệ thống camera nhận diện biển số và thu phí không dừng (ETC) tại các trạm giao thông thể hiện ưu điểm nào?", 
                options: [
                    "A. Hoạt động cập nhật dữ liệu thủ công giúp nâng cao hiệu quả kiểm soát phương tiện qua trạm.", 
                    "B. Hoạt động thu thập dữ liệu tự động giúp giảm thiểu ùn tắc và quản lí doanh thu chính xác.", 
                    "C. Hoạt động truy xuất dữ liệu trực tuyến giúp thay đổi hoàn toàn cấu trúc các tuyến đường.", 
                    "D. Hoạt động khai thác thông tin đa chiều giúp loại bỏ hoàn toàn các lỗi sai sót của tài xế."
                ], 
                correct: 1 // Đáp án B
            }
        ];

        function startGame() {
            const nameInput = document.getElementById('studentName').value.trim();
            const classInput = document.getElementById('studentClass').value.trim();
            if (!nameInput || !classInput) { alert("Vui lòng nhập đầy đủ Họ tên và Lớp!"); return; }
            
            player.name = nameInput;
            player.class = classInput;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            
            renderFruits();
            createHangingStars();
        }

        function getHeartSVG(number) {
            return `
            <svg viewBox="0 0 100 100" class="w-full h-full overflow-visible pointer-events-auto">
                <path d="M 50 90 C 10 60, -5 30, 20 10 C 35 0, 45 10, 50 20 C 55 10, 65 0, 80 10 C 105 30, 90 60, 50 90 Z" fill="rgba(0,0,0,0.6)" transform="translate(0, 6) scale(0.95)" transform-origin="50 50"/>
                <path d="M 50 90 C 10 60, -5 30, 20 10 C 35 0, 45 10, 50 20 C 55 10, 65 0, 80 10 C 105 30, 90 60, 50 90 Z" fill="url(#redHeartGrad)"/>
                <path d="M 50 90 C 10 60, -5 30, 20 10 C 35 0, 45 10, 50 20 C 55 10, 65 0, 80 10 C 105 30, 90 60, 50 90 Z" fill="none" stroke="white" stroke-width="3" stroke-dasharray="5,4" transform="scale(0.85)" transform-origin="50 45"/>
                <text x="50" y="62" font-family="Arial, sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.7))">${number}</text>
            </svg>`;
        }

        function renderFruits() {
            const container = document.getElementById('fruits-container');
            const positions = [
                { top: "45%", left: "10%", delay: "0.1s" },
                { top: "15%", left: "22%", delay: "0.4s" },
                { top: "40%", left: "25%", delay: "0.2s" },
                { top: "5%", left: "40%", delay: "0.7s" },
                { top: "32%", left: "45%", delay: "0.3s" },
                { top: "58%", left: "50%", delay: "0.9s" },
                { top: "5%", left: "55%", delay: "0.5s" },
                { top: "32%", left: "65%", delay: "0.8s" },
                { top: "13%", left: "77%", delay: "0.6s" },
                { top: "50%", left: "76%", delay: "1.1s" }
            ];
            let html = '';
            positions.forEach((pos, i) => {
                html += `<div class="fruit" style="top: ${pos.top}; left: ${pos.left}; animation-delay: ${pos.delay};" onclick="openQuestion(${i})" id="fruit-${i}">
                            ${getHeartSVG(i + 1)}
                         </div>`;
            });
            container.innerHTML = html;
        }

        function createHangingStars() {
            const container = document.getElementById('hanging-decor');
            const ns = "http://www.w3.org/2000/svg";
            
            for(let i=0; i<120; i++) {
                const x = 50 + Math.random() * 1500;
                let startY = (Math.random() > 0.3) ? (350 + Math.random() * 350) : (50 + Math.random() * 300);
                const length = 50 + Math.random() * 250;
                
                const line = document.createElementNS(ns, "line");
                line.setAttribute("x1", x);
                line.setAttribute("y1", startY);
                line.setAttribute("x2", x);
                line.setAttribute("y2", startY + length);
                line.setAttribute("stroke", "#facc15");
                line.setAttribute("stroke-width", "1.5");
                line.setAttribute("stroke-dasharray", "3,3");
                line.setAttribute("opacity", "0.6");
                container.appendChild(line);
                
                const star = document.createElementNS(ns, "use");
                star.setAttribute("href", "#star-shape");
                star.setAttribute("x", x);
                star.setAttribute("y", startY + length);
                star.setAttribute("class", "twinkle-star");
                star.style.animationDelay = (Math.random() * 3) + "s";
                star.style.animationDuration = (2 + Math.random() * 2) + "s";
                star.style.transformOrigin = `${x}px ${startY + length}px`; 
                const scale = 0.5 + Math.random() * 0.7; 
                star.setAttribute("transform", `scale(${scale})`);
                
                container.appendChild(star);
            }
        }

        function formatHTMLCode(text) {
            let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return safeText.replace(/`([^`]+)`/g, '<code class="text-[#1d4ed8] bg-white border border-gray-400 px-2 py-0.5 rounded font-mono text-[1.1em] mx-1 break-all sm:break-normal inline-block shadow-sm font-black transition-colors">$1</code>');
        }

        const letters = ['A', 'B', 'C', 'D'];

        function openQuestion(index) {
            currentFruitIndex = index;
            const q = questions[index];
            const contentDiv = document.getElementById('qModalContent');
            
            let formattedQ = formatHTMLCode(q.q);
            
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                let cleanText = opt.replace(/^[A-D]\.\s*/, '');
                let formattedOpt = formatHTMLCode(cleanText);
                
                optionsHtml += `
                <button id="opt-${i}" onclick="checkAnswer(${i})" class="w-full flex items-center gap-3 sm:gap-5 p-4 sm:p-5 rounded-2xl border-2 border-gray-200 hover:border-[#3b82f6] hover:bg-blue-50 transition-all text-left bg-white shadow-sm group shrink-0">
                    <div class="letter-box bg-[#e0e7ff] text-[#1e40af] font-black text-xl sm:text-2xl w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center shrink-0 group-hover:bg-[#2563eb] group-hover:text-white transition-colors">
                        ${letters[i]}
                    </div>
                    <div class="opt-text text-[#1e3a8a] font-bold text-[17px] sm:text-[20px] leading-relaxed flex-1">${formattedOpt}</div>
                </button>`;
            });

            contentDiv.innerHTML = `
                <div class="flex-1 overflow-y-auto p-4 sm:p-6 custom-scroll relative flex flex-col justify-center bg-white h-full rounded-2xl sm:rounded-3xl">
                    <div class="border-2 border-red-200 bg-red-50 text-red-600 font-bold text-lg sm:text-2xl p-4 sm:p-5 rounded-2xl mb-4 sm:mb-5 text-center shadow-sm shrink-0 leading-relaxed">
                        ${formattedQ}
                    </div>
                    <div class="flex flex-col gap-3 shrink-0" id="options-container">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-message" class="hidden mt-4 text-center font-bold text-lg sm:text-xl p-3 sm:p-4 rounded-xl shrink-0 shadow-sm border border-red-200 bg-red-100 text-red-700"></div>
                    <button id="btn-next-question" class="hidden mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg transition-all text-xl shrink-0">Tiếp tục ➡</button>
                </div>
            `;

            const modal = document.getElementById('qModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                contentDiv.classList.remove('scale-95', 'opacity-0');
                contentDiv.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function checkAnswer(selectedIndex) {
            const q = questions[currentFruitIndex];
            const isCorrect = selectedIndex === q.correct;
            
            const options = document.querySelectorAll('#options-container button');
            options.forEach(btn => btn.classList.add('opt-disabled'));
            
            if (isCorrect) {
                document.getElementById(`opt-${selectedIndex}`).classList.add('opt-correct');
            } else {
                document.getElementById(`opt-${selectedIndex}`).classList.add('opt-wrong');
                document.getElementById(`opt-${q.correct}`).classList.add('opt-correct');
                
                const feedback = document.getElementById('feedback-message');
                feedback.classList.remove('hidden');
                feedback.innerHTML = `💡 Đáp án đúng là ${letters[q.correct]}. Tiếc quá!`;
            }

            const btnNext = document.getElementById('btn-next-question');
            btnNext.classList.remove('hidden');
            
            setTimeout(() => {
                const modalBody = document.querySelector('.custom-scroll');
                if(modalBody) { modalBody.scrollTop = modalBody.scrollHeight; }
            }, 100);

            btnNext.onclick = () => processResult(isCorrect);
        }

        function processResult(isCorrect) {
            const contentDiv = document.getElementById('qModalContent');
            contentDiv.classList.remove('scale-100', 'opacity-100');
            contentDiv.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                document.getElementById('qModal').classList.add('hidden');
                
                answeredQuestions++;
                const fruitEl = document.getElementById('fruit-' + currentFruitIndex);
                const resTitle = document.getElementById('resTitle');
                const resMessage = document.getElementById('resMessage');
                const resIcon = document.getElementById('resIcon');

                if (isCorrect) {
                    player.score += SCORE_PER_CORRECT;
                    resTitle.innerText = 'Chính xác! 🎉';
                    resTitle.className = 'text-3xl sm:text-4xl font-extrabold mb-4 text-green-600';
                    resMessage.innerText = 'Bạn nhận được một trái tim.';
                    resIcon.innerHTML = '❤️'; 
                    fruitEl.classList.add('picked');
                } else {
                    resTitle.innerText = 'Sai rồi! 😢';
                    resTitle.className = 'text-3xl sm:text-4xl font-extrabold mb-4 text-gray-800';
                    resMessage.innerText = 'Rất tiếc, trái tim đã bị hỏng!';
                    resIcon.innerHTML = '🖤'; 
                    fruitEl.classList.add('black');
                }

                const resModal = document.getElementById('resModal');
                const resContent = document.getElementById('resModalContent');
                resModal.classList.remove('hidden');
                setTimeout(() => {
                    resContent.classList.remove('scale-95', 'opacity-0');
                    resContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            }, 300);
        }

        function closeResModal() {
            const content = document.getElementById('resModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('resModal').classList.add('hidden');
                
                if(answeredQuestions >= TOTAL_QUESTIONS) {
                    finishGameAndStayOnTree();
                }
            }, 300);
        }

        function finishGameAndStayOnTree() {
            if(scoresRef) {
                scoresRef.push({
                    name: player.name,
                    class: player.class,
                    score: player.score,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).catch(err => { console.error("Lỗi lưu điểm:", err); });
            }

            document.getElementById('final-name-display').innerText = player.name;
            document.getElementById('final-score-display').innerText = player.score;
            document.getElementById('finish-banner').classList.remove('hidden');
        }

        function showLeaderboard() {
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('leaderboard-view').classList.remove('hidden');
            
            document.getElementById('lb-current-name').innerText = player.name;
            document.getElementById('lb-current-class').innerText = player.class;
            document.getElementById('lb-current-score').innerText = player.score;

            const tbody = document.getElementById('leaderboard-body');
            const loading = document.getElementById('lb-loading');
            tbody.innerHTML = '';
            loading.classList.remove('hidden');

            if(scoresRef) {
                scoresRef.orderByChild('score').once('value', snapshot => {
                    loading.classList.add('hidden');
                    let results = [];
                    snapshot.forEach(child => { results.push(child.val()); });
                    
                    results.sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        return (a.timestamp || 0) - (b.timestamp || 0);
                    });

                    renderTable(results);
                });
            } else {
                loading.classList.add('hidden');
                renderTable([{ name: player.name, class: player.class, score: player.score }]);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('leaderboard-body');
            let html = '';
            data.forEach((row, index) => {
                html += `
                <tr class="table-row border-b border-gray-200 text-gray-800 transition-colors text-lg sm:text-xl">
                    <td class="py-4 px-4 text-center font-bold text-gray-600">${index + 1}</td>
                    <td class="py-4 px-4 text-center">
                        <span class="bg-blue-100 text-blue-700 py-1 px-3 rounded font-bold text-base sm:text-lg border border-blue-200">${row.class}</span>
                    </td>
                    <td class="py-4 px-4 font-semibold">${row.name}</td>
                    <td class="py-4 px-4 text-center">
                        <span class="text-red-600 font-black border border-red-200 bg-red-50 rounded-full px-4 py-1">${row.score}</span>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
