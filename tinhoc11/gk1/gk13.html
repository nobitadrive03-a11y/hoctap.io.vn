  <script>

            database = firebase.database();
            scoresRef = database.ref('bxh_gk1_11_13');

    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

        { id: "3_4", type: "single", question: "Để thuyết trình trong hội trường, một diễn giả cần kết nối máy tính xách tay với máy chiếu thông qua cổng truyền tải đa phương tiện chất lượng cao. Đó là cổng nào?", options: ["Cổng kết nối truyền tín hiệu âm thanh Audio.", "Cổng kết nối truyền tín hiệu hình ảnh VGA cũ.", "Cổng kết nối truyền tải mạng nội bộ LAN RJ45.", "Cổng kết nối truyền tải đa phương tiện HDMI."], correct: 3 },
        { id: "3_5", type: "single", question: "Một nhân viên văn phòng muốn sao lưu toàn bộ hình ảnh công việc lên mạng để giải phóng dung lượng cho máy tính. Dịch vụ nào dưới đây đáp ứng yêu cầu này?", options: ["Nền tảng chia sẻ video trực tuyến YouTube toàn cầu.", "Dịch vụ lưu trữ trực tuyến đám mây Microsoft OneDrive.", "Phần mềm thiết kế đồ họa đa phương tiện Adobe.", "Dịch vụ mạng xã hội giải trí video ngắn TikTok."], correct: 1 },
        { id: "3_6", type: "single", question: "Khi sử dụng công cụ Google, một nhà nghiên cứu muốn bộ máy tìm kiếm chỉ hiển thị kết quả là các tệp tin chứa văn bản PDF. Cú pháp nào sau đây là chính xác?", options: ["Sử dụng cú pháp format=pdf đặt ngay sau từ khóa tìm kiếm.", "Sử dụng cú pháp filetype:pdf đặt ngay sau từ khóa tìm kiếm.", "Sử dụng cú pháp document:pdf đặt ngay sau từ khóa tìm kiếm.", "Sử dụng cú pháp download.pdf đặt ngay sau từ khóa tìm kiếm."], correct: 1 },
        { id: "3_7", type: "single", question: "Một cửa hàng thời trang muốn tạo một trang chính thức trên mạng xã hội Facebook để tương tác với khách hàng một cách chuyên nghiệp. Họ nên khởi tạo loại trang nào?", options: ["Khởi tạo một tài khoản Facebook cá nhân đại diện.", "Khởi tạo một trang Fanpage chuyên nghiệp cho cửa hàng.", "Khởi tạo một hội nhóm kín (Private Group) trên mạng.", "Khởi tạo một phòng trò chuyện (Chat Room) trực tuyến."], correct: 1 },
        { id: "3_8", type: "single", question: "Trong quá trình quản lý hộp thư điện tử Gmail, để đánh dấu nhanh những bức thư quan trọng nhằm ưu tiên xử lý, người dùng thường sử dụng tính năng nào?", options: ["Tính năng Đánh dấu sao (Star) cho các thư điện tử.", "Tính năng Xóa thư điện tử (Delete) vào thùng rác.", "Tính năng Báo cáo thư rác (Spam) cho các thư điện tử.", "Tính năng Chặn địa chỉ (Block) của người gửi thư đến."], correct: 0 },
        { id: "3_9", type: "single", question: "Khi so sánh sự tiến hóa của hệ điều hành máy tính cá nhân, sự xuất hiện của giao diện đồ họa (GUI) đã mang lại lợi ích cốt lõi nào so với giao diện dòng lệnh?", options: ["Giúp máy tính có thể tự động lập trình ra các phần mềm ứng dụng phức tạp.", "Giúp tăng cường tốc độ xử lý dữ liệu của bộ vi xử lý lên gấp nhiều lần.", "Giúp người dùng giao tiếp và thao tác với máy tính một cách trực quan, thân thiện.", "Giúp máy tính miễn nhiễm hoàn toàn với các loại virus lây lan trên mạng."], correct: 2 },
        { id: "3_10", type: "single", question: "Khi cắm một chiếc ổ đĩa USB mới vào máy tính, hệ điều hành tự động nhận diện thiết bị và cài đặt trình điều khiển một cách thầm lặng. Cơ chế này được gọi là gì?", options: ["Tính năng chống phân mảnh ổ đĩa cứng tự động.", "Tính năng cơ chế \"cắm và chạy\" (Plug & Play).", "Tính năng kết nối mạng không dây tầm xa Bluetooth.", "Tính năng tường lửa bảo vệ hệ thống máy tính cục bộ."], correct: 1 },
        { id: "3_11", type: "single", question: "Trong các hệ thống điều khiển tự động, mạch logic AND đóng vai trò là mạch kiểm tra điều kiện đồng thời. Theo nguyên lý, mạch logic AND chỉ cho ra tín hiệu bằng 1 khi nào?", options: ["Khi và chỉ khi có ít nhất một tín hiệu đầu vào mang giá trị bằng 1.", "Khi và chỉ khi tất cả các tín hiệu đầu vào đều mang giá trị bằng 1.", "Khi và chỉ khi hai tín hiệu đầu vào có những giá trị hoàn toàn trái ngược.", "Khi và chỉ khi tất cả các tín hiệu đầu vào đều mang giá trị bằng 0."], correct: 1 },
        { id: "3_12", type: "single", question: "Khi làm việc nhóm trên một dự án, các thành viên ưu tiên sử dụng ứng dụng Google Docs thay vì phần mềm soạn thảo cài trên máy cục bộ. Ưu điểm nổi bật của phương pháp này là gì?", options: ["Cho phép nhiều thành viên cùng lúc cộng tác chỉnh sửa văn bản qua mạng Internet.", "Đảm bảo phần mềm có thể chạy mượt mà ngay cả khi không có kết nối mạng Internet.", "Loại bỏ hoàn toàn khả năng người dùng sao chép nội dung văn bản sang nơi khác.", "Tự động dịch và chỉnh sửa mọi lỗi ngữ pháp trong văn bản mà không cần thao tác."], correct: 0 },
        { id: "3_13", type: "single", question: "Một người dùng thiết lập quyền chia sẻ tệp tin báo cáo trên Google Drive cho cấp dưới với vai trò là \"Người xem\". Hệ quả của việc thiết lập này là gì?", options: ["Người nhận liên kết có thể tùy ý sửa đổi hoặc xóa các đoạn văn bản trong tệp.", "Người nhận liên kết có thể thêm các nhận xét vào bên lề của nội dung tệp tin.", "Người nhận liên kết chỉ có thể đọc nội dung và tải tệp về máy tính cá nhân.", "Người nhận liên kết có quyền chia sẻ lại tệp tin này cho hàng ngàn người khác."], correct: 2 },
        { id: "3_14", type: "single", question: "Khi sử dụng công cụ tìm kiếm trên nền tảng web, việc đặt cụm từ khóa vào bên trong cặp dấu ngoặc kép (\" \") sẽ mang lại kết quả tìm kiếm có đặc tính như thế nào?", options: ["Hệ thống sẽ tự động dịch cụm từ đó sang tiếng Anh trước khi tiến hành tìm kiếm.", "Máy tìm kiếm bắt buộc phải trả về các trang web chứa chính xác thứ tự cụm từ đó.", "Hệ thống sẽ tự động bỏ qua mọi lỗi chính tả mà người dùng lỡ tay gõ sai trên phím.", "Máy tìm kiếm sẽ chỉ trả về các trang web có định dạng là video clip hoặc hình ảnh."], correct: 1 },
        { id: "3_15", type: "single", question: "Tính năng \"Nhãn\" (Label) trong Gmail được đánh giá là ưu việt hơn so với việc sử dụng hệ thống \"Thư mục\" (Folder) truyền thống. Điểm khác biệt lớn nhất là do đâu?", options: ["Vì Nhãn giúp tăng gấp đôi giới hạn dung lượng lưu trữ của toàn bộ hộp thư điện tử.", "Vì một thư điện tử có thể được gắn cùng lúc nhiều Nhãn khác nhau để linh hoạt phân loại.", "Vì khi xóa một Nhãn thì toàn bộ thư nằm trong Nhãn đó sẽ được bảo vệ tuyệt đối an toàn.", "Vì Nhãn cho phép người dùng có thể gửi email đi mà không cần bất kỳ kết nối mạng nào."], correct: 1 },
        { id: "3_16", type: "single", question: "Việc sử dụng thiết lập \"Bạn bè ngoại trừ...\" khi đăng bài trên mạng xã hội Facebook giúp giải quyết được nhu cầu cá nhân nào cho người sử dụng?", options: ["Ngăn chặn hệ thống tự động chèn các quảng cáo thương mại vào bài viết của người dùng.", "Giúp bài viết nhanh chóng lan truyền và có nhiều lượt tương tác từ người lạ trên toàn cầu.", "Đảm bảo thông tin cá nhân không bị hiển thị với một số đối tượng cụ thể không mong muốn.", "Tự động mã hóa toàn bộ hình ảnh và video có trong bài viết để không một ai có thể tải về."], correct: 2 },
        { id: "3_17", type: "single", question: "Một nhóm khởi nghiệp cần triển khai phần mềm chỉnh sửa đồ họa chuyên sâu nhưng không có kinh phí để mua bản quyền phần mềm đóng gói đắt đỏ. Giải pháp hợp pháp và tối ưu chi phí nhất là gì?", options: ["Tìm kiếm các diễn đàn trên mạng để tải về một bản phần mềm đồ họa đã bị bẻ khóa (crack).", "Thuê một công quy công nghệ viết riêng một phần mềm đồ họa chuyên nghiệp với mức giá thật rẻ.", "Tìm kiếm và cài đặt một phần mềm đồ họa thay thế thuộc loại mã nguồn mở miễn phí như GIMP.", "Chỉ sử dụng giấy bút và các công cụ thủ công để vẽ tay toàn bộ các ấn phẩm truyền thông."], correct: 2 },
        { id: "3_18", type: "single", question: "Khi máy tính để bàn sử dụng ổ cứng từ tính (HDD) liên tục báo lỗi do các liên cung mất liên kết (dữ liệu mồ côi), người dùng nên thực hiện thao tác bảo trì nào trên hệ điều hành?", options: ["Mở vỏ máy tính ra và dùng khăn ướt lau sạch các cổng kết nối trên bo mạch chủ.", "Mở hệ điều hành và chạy tiện ích kiểm tra lỗi đĩa (Check disk) để hệ thống khắc phục.", "Xóa bỏ hoàn toàn hệ điều hành hiện tại và cài đặt lại một hệ điều hành mới tinh.", "Thay thế ngay thanh RAM bằng một thanh có dung lượng lớn gấp đôi thanh hiện tại."], correct: 1 },
        { id: "3_19", type: "single", question: "Một người thiết kế đồ họa sử dụng chuột không dây nhưng cảm thấy con trỏ di chuyển quá nhanh khiến việc vẽ các chi tiết nhỏ bị lệch. Để khắc phục triệt để, người này cần thao tác gì?", options: ["Khởi động lại toàn bộ máy tính để hệ điều hành tự động khôi phục các cài đặt ban đầu.", "Thay một tấm lót chuột có bề mặt trơn bóng hơn để làm giảm tốc độ nhận diện quang học.", "Truy cập vào phần Cài đặt của hệ điều hành và giảm thông số tốc độ của chuột (Cursor speed).", "Chuyển sang sử dụng một chiếc màn hình có kích thước đường chéo lớn hơn gấp đôi bình thường."], correct: 2 },
        { id: "3_20", type: "single", question: "Một nhóm dự án đang làm việc tại quán cà phê và cần chia sẻ nhanh một kho tài liệu đồ sộ dung lượng 20GB cho nhau mà không ai mang theo ổ cứng di động ngoài. Giải pháp công nghệ tốt nhất là gì?", options: ["Chia nhỏ thư mục thành hàng trăm tệp nhỏ rồi gửi từng tệp qua phần mềm tin nhắn.", "Tải toàn bộ tài liệu lên dịch vụ lưu trữ Google Drive, tạo liên kết chia sẻ và gửi vào nhóm.", "In toàn bộ 20GB tài liệu đó ra giấy tại tiệm photocopy gần nhất để mọi người cùng xem.", "Chờ đến ngày hôm sau khi lên văn phòng công ty để sử dụng chung một chiếc máy tính."], correct: 1 },
        { id: "3_21", type: "single", question: "Một nhân viên văn phòng được cấp trên giao nhiệm vụ tìm kiếm mẫu \"Hợp đồng thương mại\" dưới dạng tệp văn bản MS Word để tải về tham khảo. Cú pháp tìm kiếm nào trên Google là tối ưu nhất?", options: ["Tìm kiếm nội dung Hợp đồng thương mại mẫu chuẩn trên mạng.", "\"Hợp đồng thương mại\" filetype:docx (hoặc định dạng doc).", "Hợp đồng thương mại định dạng tệp tin word file miễn phí.", "\"Hợp đồng thương mại\" download tài liệu văn bản chuẩn nhất."], correct: 1 },
        { id: "3_22", type: "single", question: "Do đặc thù công việc, một hộp thư điện tử nhận hàng chục thư mời họp và thư báo cáo mỗi ngày khiến các thư họp bị trôi đi mất. Cách quản lý khoa học nhất mà không cần xóa thư là gì?", options: ["Xóa toàn bộ hộp thư đến mỗi ngày một lần để bắt đầu ngày mới với giao diện thật sạch sẽ.", "Đánh dấu tất cả thư báo cáo là thư rác (Spam) để hệ thống tự động xóa đi sau 30 ngày.", "Lập một Nhãn mang tên \"Lịch Họp\" và thiết lập bộ lọc tự động gán nhãn cho các thư này.", "Chuyển tiếp toàn bộ thư đến sang một địa chỉ email cá nhân khác để lưu trữ tạm thời."], correct: 2 },
        { id: "3_23", type: "single", question: "Một câu lạc bộ văn nghệ của trường học muốn mở rộng việc quảng bá hình ảnh ra bên ngoài để thu hút sự chú ý của cộng đồng học sinh. Phương thức truyền thông trên mạng xã hội nào là tối ưu nhất?", options: ["Lập một tài khoản Facebook cá nhân mới tinh và kết bạn ngẫu nhiên với mọi người trên mạng.", "Yêu cầu toàn bộ thành viên đổi tên tài khoản cá nhân thành tên của câu lạc bộ văn nghệ.", "Tạo một trang Fanpage chuyên nghiệp đại diện cho câu lạc bộ để dễ dàng đăng tải và quảng bá.", "Thiết lập chế độ \"Chỉ mình tôi\" cho các video biểu diễn để tạo sự tò mò, bí ẩn cho người xem."], correct: 2 },
        { id: "3_24", type: "single", question: "Một học sinh thường xuyên bị một số tài khoản bán hàng gắn thẻ (tag) vào các bức ảnh quảng cáo không mong muốn trên mạng xã hội Facebook. Để ngăn chặn hình ảnh đó xuất hiện công khai trên tường nhà mình, học sinh này cần làm gì?", options: ["Kích hoạt tính năng \"Xem lại thẻ mọi người thêm vào bài viết của bạn trước khi thẻ xuất hiện\".", "Khóa tạm thời tài khoản mạng xã hội của bản thân trong vòng vài tháng để các tài khoản kia quên đi.", "Xóa hoàn toàn danh sách bạn bè hiện tại và không bao giờ kết bạn lại với những người đó.", "Phản hồi bằng những lời lẽ gay gắt dưới các bức ảnh để yêu cầu người đăng tự động gỡ thẻ."], correct: 0 },
        { id: '3_c1', type: 'tf_cluster', question: "Hệ điều hành trên các thiết bị máy tính cá nhân và thiết bị di động đều mang những đặc điểm cấu trúc và cung cấp các tiện ích riêng biệt nhằm tối ưu hóa trải nghiệm người dùng.", subQuestions: [
            { id: '3_d25a', text: "Một đặc điểm khác biệt của hệ điều hành trên thiết bị di động là giao diện thân thiện, được thiết kế chú trọng vào các thao tác nhận diện cảm biến và vuốt chạm.", correct: "Đúng" },
            { id: '3_d25b', text: "Tiện ích hợp mảnh (Defragment) là một công cụ luôn được tích hợp sẵn trong hầu hết các điện thoại thông minh dùng Android để tối ưu hóa bộ nhớ RAM.", correct: "Sai" },
            { id: '3_d25c', text: "Chức năng kiểm tra lỗi đĩa (Check disk) hoạt động bằng cách rà soát hệ thống tập tin và khoanh vùng các khu vực vật lý bị hỏng để ngăn hệ điều hành ghi đè dữ liệu lên đó.", correct: "Đúng" },
            { id: '3_d25d', text: "Nếu người dùng cảm thấy con trỏ chuột trên màn hình máy tính xách tay di chuyển với tốc độ quá nhanh khó kiểm soát, họ bắt buộc phải gỡ bỏ hệ điều hành và cài đặt lại bản khác để khắc phục.", correct: "Sai" }
        ]},
        { id: '3_c2', type: 'tf_cluster', question: "Một doanh nghiệp khởi nghiệp về thiết kế nội thất đang tìm kiếm các giải pháp phần mềm để tiết kiệm tối đa ngân sách vận hành trong những năm đầu tiên.", subQuestions: [
            { id: '3_d26a', text: "Phần mềm mã nguồn mở như phần mềm xử lý ảnh GIMP cho phép người dùng tải về sử dụng miễn phí mà không phải trả các khoản tiền bản quyền mua gói phần mềm đắt đỏ.", correct: "Đúng" },
            { id: '3_d26b', text: "Tất cả các nền tảng chạy trên Internet (như Google Docs) đều bắt buộc người dùng trả phí thuê bao hàng tháng ngay khi vừa hoàn tất việc đăng ký tài khoản.", correct: "Sai" },
            { id: '3_d26c', text: "Việc tuân thủ giấy phép công cộng GNU GPL đối với phần mềm nguồn mở đảm bảo rằng người dùng có quyền tự do chỉnh sửa nhưng buộc phải duy trì tính mở của mã nguồn nếu phát hành sản phẩm phái sinh.", correct: "Đúng" },
            { id: '3_d26d', text: "Nếu doanh nghiệp này quyết định ký hợp đồng thuê một đội ngũ kỹ sư lập trình để viết riêng một phần mềm quản lý kho theo quy trình đặc thù của hãng, phần mềm đó được gọi là phần mềm thương mại \"đóng gói\" bán sẵn.", correct: "Sai" }
        ]},
        { id: '3_c3', type: 'tf_cluster', question: "Ban truyền thông của một trường đại học vừa thiết lập một không gian lưu trữ trên nền tảng đám mây Google Drive để tổng hợp tư liệu về các hoạt động đoàn thể.", subQuestions: [
            { id: '3_d27a', text: "Thao tác Tải lên (Upload) là hành động đưa các tập tin tài liệu từ ổ đĩa cứng của máy tính lên không gian lưu trữ trực tuyến trên máy chủ mạng Internet.", correct: "Đúng" },
            { id: '3_d27b', text: "Các dịch vụ lưu trữ đám mây luôn thiết lập mặc định tính năng xóa vĩnh viễn toàn bộ dữ liệu nếu người dùng không truy cập vào tài khoản quá 3 ngày liên tiếp.", correct: "Sai" },
            { id: '3_d27c', text: "Nếu trưởng ban truyền thông thiết lập quyền \"Người xem\" cho một thư mục hình ảnh, những người truy cập thông qua liên kết đó sẽ có khả năng tải ảnh về nhưng không thể chèn thêm ảnh mới lên thư mục.", correct: "Đúng" },
            { id: '3_d27d', text: "Để hạn chế rủi ro thất thoát tài liệu quan trọng do một thành viên vô tình ấn xóa, trưởng ban nên áp dụng chính sách phân quyền nghiêm ngặt: chỉ giữ quyền \"Người chỉnh sửa\" cho các cán bộ nòng cốt và cấp quyền \"Người xem\" cho thành viên phổ thông.", correct: "Đúng" }
        ]},
        { id: '3_c4', type: 'tf_cluster', question: "Để bảo vệ hình ảnh cá nhân và quản lý luồng thông tin tốt hơn, một giảng viên đang rà soát lại các mục cài đặt trên mạng xã hội Facebook và hộp thư Gmail.", subQuestions: [
            { id: '3_d28a', text: "Trang Fanpage là một tính năng mở rộng của mạng xã hội Facebook được thiết kế chuyên biệt nhằm phục vụ mục đích quảng bá cho các cá nhân, doanh nghiệp và tổ chức.", correct: "Đúng" },
            { id: '3_d28b', text: "Chức năng \"Nhãn\" (Label) trong hộp thư điện tử Gmail được lập trình để bắt buộc mỗi một bức thư chỉ được phép gắn một nhãn duy nhất tại một thời điểm.", correct: "Sai" },
            { id: '3_d28c', text: "Việc kích hoạt tính năng \"Xem lại thẻ\" trên mạng xã hội giúp người dùng chủ động sàng lọc và quyết định những hình ảnh nào được phép xuất hiện công khai trên dòng thời gian cá nhân của mình.", correct: "Đúng" },
            { id: '3_d28d', text: "Nếu muốn phân loại toàn bộ email hóa đơn gửi về hàng tháng nhằm dễ tra cứu mà không làm đầy hộp thư đến, giải pháp tốt nhất là đánh dấu các email này vào mục Thư rác (Spam) để hệ thống tự động lọc.", correct: "Sai" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin11_3', tenDe: 'Kiểm Tra Giữa kỳ - Tin Học 11 - Đề 3' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn thứ tự câu hỏi, chỉ trộn đáp án từng câu đơn
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            let correctText = q.options[q.correct];
            q.options = shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(45 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp theo điểm số từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ hiển thị ngày/tháng/năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
