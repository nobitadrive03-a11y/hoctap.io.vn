    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

        { id: "2_4", type: "single", question: "Khi chọn mua một chiếc màn hình máy tính, thông số kỹ thuật nào dưới đây cho biết khả năng tái tạo số lần hiển thị lại hình ảnh trong một giây, giúp hình ảnh mượt mà, đỡ mỏi mắt?", options: ["Độ phân giải hiển thị ảnh của màn hình (Pixel).", "Tần số quét hình ảnh của màn hình (Hz).", "Kích thước đường chéo của màn hình (inch).", "Thời gian phản hồi tín hiệu của màn hình (ms)."], correct: 1 },
        { id: "2_5", type: "single", question: "Nền tảng nào sau đây là một dịch vụ lưu trữ dữ liệu trực tuyến (lưu trữ đám mây) nổi tiếng do tập đoàn công nghệ Microsoft vận hành và phát triển?", options: ["Dịch vụ lưu trữ trực tuyến Google Drive.", "Dịch vụ lưu trữ trực tuyến Microsoft OneDrive.", "Dịch vụ lưu trữ trực tuyến Dropbox.", "Dịch vụ lưu trữ trực tuyến Apple iCloud."], correct: 1 },
        { id: "2_6", type: "single", question: "Trong lúc tra cứu tài liệu bằng Google, nếu muốn bắt buộc bộ máy tìm kiếm phải trả về các kết quả chứa chính xác một cụm từ cụ thể mà không bị tách rời, người dùng cần dùng cặp dấu nào?", options: ["Đặt cụm từ khóa vào bên trong cặp dấu ngoặc đơn ( ).", "Đặt cụm từ khóa vào bên trong cặp dấu ngoặc kép \" \".", "Đặt cụm từ khóa vào bên trong cặp dấu ngoặc vuông [ ].", "Đặt cụm từ khóa vào bên trong cặp dấu ngoặc nhọn { }."], correct: 1 },
        { id: "2_7", type: "single", question: "Một tính năng trên dịch vụ thư điện tử Gmail giúp người dùng đánh dấu thư điện tử quan trọng thường có biểu tượng mang hình dáng gì và màu sắc gì?", options: ["Biểu tượng hình chiếc lá có màu xanh lá cây tươi.", "Biểu tượng hình ngọn lửa có màu đỏ rực rỡ.", "Biểu tượng hình một dấu quan trọng có màu vàng.", "Biểu tượng hình một bánh răng cưa có màu xám."], correct: 2 },
        { id: "2_8", type: "single", question: "Đối tượng nào trên mạng xã hội Facebook thường được khởi tạo với mục đích chính là để đại diện cho một thương hiệu, doanh nghiệp hoặc một người nổi tiếng quảng bá hình ảnh?", options: ["Trang thông tin cá nhân (Profile) người dùng.", "Nhóm chat trò chuyện (Messenger) khép kín.", "Trang Fanpage chuyên nghiệp trên mạng xã hội.", "Thước phim ngắn dạng dọc (Facebook Reels)."], correct: 2 },
        { id: "2_9", type: "single", question: "Việc các nhà sản xuất áp dụng cơ chế \"Cắm và chạy\" (Plug & Play) trên hệ điều hành máy tính cá nhân đã mang lại lợi ích to lớn nào cho người sử dụng phổ thông?", options: ["Tránh được hoàn toàn nguy cơ máy tính bị nhiễm virus lây lan từ thiết bị ngoại vi.", "Thiết bị ngoại vi kết nối xong là có thể sử dụng ngay mà không cần cài đặt phần mềm thủ công.", "Tăng gấp đôi tốc độ đường truyền kết nối mạng không dây của các thiết bị Bluetooth.", "Làm cho tất cả các thiết bị ngoại vi không tiêu thụ bất kỳ lượng điện năng nào từ máy tính nữa."], correct: 1 },
        { id: "2_10", type: "single", question: "Khi nghiên cứu về cấu trúc phần cứng của thiết bị số, các nhà khoa học khẳng định rằng mọi mạch logic dù phức tạp đến đâu cũng có thể được tổng hợp từ ba loại cổng logic cơ bản nào?", options: ["Tổng hợp từ các cổng XOR, NAND và NOR.", "Tổng hợp từ các mạch rơ le thời gian độc lập.", "Tổng hợp từ các cổng cơ bản AND, OR và NOT.", "Tổng hợp từ các bộ nhớ ROM và RAM dung lượng nhỏ."], correct: 2 },
        { id: "2_11", type: "single", question: "Việc sử dụng các phần mềm văn phòng chạy trực tuyến trên nền tảng web (như Google Workspace) giúp giải quyết được hạn chế lớn nhất nào của các phần mềm cài đặt truyền thống?", options: ["Xóa bỏ hoàn toàn hiện tượng phần mềm văn phòng bị treo khi xử lý các bảng tính đồ họa nặng.", "Đảm bảo dữ liệu không bao giờ bị hacker xâm nhập do không lưu trên ổ cứng vật lý cục bộ.", "Giúp vượt qua rào cản phụ thuộc vào thiết bị, cho phép làm việc cộng tác mọi nơi chỉ cần có mạng.", "Tự động dịch và sửa toàn bộ lỗi chính tả văn bản theo mọi loại ngôn ngữ trên thế giới."], correct: 2 },
        { id: "2_12", type: "single", question: "Khi nói về nguyên lý hoạt động của các loại máy in ấn, loại máy in nào sử dụng công nghệ tạo tĩnh điện hút mực bột rồi nung nóng chảy ép chặt lên mặt giấy?", options: ["Máy in kim sử dụng đầu kim đập vật lý vào dải ruy-băng mực.", "Máy in phun sử dụng vòi phun các hạt mực lỏng li ti lên giấy.", "Máy in laser sử dụng tia laser và trống từ cảm quang tạo tĩnh điện.", "Máy in nhiệt sử dụng cuộn giấy cảm ứng đổi màu khi bị làm nóng."], correct: 2 },
        { id: "2_13", type: "single", question: "Lợi thế nổi bật của việc sử dụng tính năng Nhãn (Label) so với việc sử dụng các Thư mục (Folder) truyền thống khi phân loại lượng lớn thư điện tử là gì?", options: ["Mỗi thư điện tử chỉ có thể nằm trong một Nhãn duy nhất để đảm bảo tính gọn gàng tuyệt đối.", "Nhãn giúp tiết kiệm dung lượng lưu trữ trên máy chủ lên đến hàng chục lần so với Thư mục.", "Một bức thư điện tử có thể được gắn cùng lúc nhiều Nhãn khác nhau rất linh hoạt để phân loại chéo.", "Khi tiến hành xóa một Nhãn, toàn bộ thư điện tử nằm trong Nhãn đó sẽ tự động biến mất theo."], correct: 2 },
        { id: "2_14", type: "single", question: "Khi tiến hành đăng tải một bài viết chứa các thông tin mang tính chất nội bộ lên mạng xã hội, việc thiết lập quyền xem ở chế độ \"Bạn bè ngoại trừ...\" có tác dụng gì?", options: ["Bài đăng sẽ hiện lên trang chủ của những người nổi tiếng để tăng độ phủ sóng trên mạng.", "Hạn chế danh sách người xem, không cho một vài cá nhân cụ thể thấy được nội dung bài viết.", "Tự động gắn thẻ toàn bộ danh sách bạn bè vào bài viết đó để ép họ vào bình luận.", "Gửi bài đăng đó qua tin nhắn riêng tư cho tất cả những người không nằm trong danh sách loại trừ."], correct: 1 },
        { id: "2_15", type: "single", question: "Các nền tảng lưu trữ trực tuyến (đám mây) như Google Drive hoạt động trơn tru phụ thuộc vào yếu tố hạ tầng công nghệ tiên quyết nào sau đây từ phía người dùng?", options: ["Máy tính của người dùng bắt buộc phải sở hữu hệ thống card đồ họa kép rời thật mạnh mẽ.", "Người dùng phải liên tục duy trì một đường truyền kết nối mạng Internet có tính ổn định.", "Hệ thống điện tại nhà người dùng phải có đường truyền cáp đồng trục theo kiểu truyền thống.", "Người dùng phải cài đặt đồng thời hệ điều hành Windows và Linux song song trên cùng máy tính."], correct: 1 },
        { id: "2_16", type: "single", question: "Tính năng \"Xem lại thẻ (tag) trước khi xuất hiện trên dòng thời gian\" trong mạng xã hội Facebook giúp người dùng ngăn ngừa trực tiếp rủi ro gì về mặt hình ảnh?", options: ["Rủi ro bị mất mật khẩu tài khoản do nhấp vào các liên kết độc hại trên các trang mạng trôi nổi.", "Rủi ro tài khoản bị trừ tiền tự động khi xem các video quảng cáo có chứa tính năng thu phí.", "Rủi ro hình ảnh hoặc nội dung không mong muốn bị gán tên và hiển thị công khai trên tường nhà mình.", "Rủi ro bài viết cá nhân bị hệ thống trí tuệ nhân tạo tự động xóa sổ do vi phạm quy tắc cộng đồng."], correct: 2 },
        { id: "2_17", type: "single", question: "Một phòng ban cần thiết kế nhanh một bản kế hoạch kinh doanh nhưng không có kinh phí để mua phần mềm soạn thảo bản quyền. Giải pháp hợp pháp và tối ưu chi phí nhất là gì?", options: ["Bỏ qua việc soạn thảo trên máy tính và tiến hành viết tay toàn bộ bản kế hoạch kinh doanh ra giấy.", "Nhờ một công ty phần mềm chuyên nghiệp lập trình riêng một công cụ soạn thảo văn bản với giá rẻ.", "Tải phần mềm thương mại từ một nguồn chia sẻ file lậu trên mạng và tiến hành bẻ khóa (crack) hệ thống.", "Cài đặt một bộ phần mềm văn phòng thuộc loại mã nguồn mở miễn phí như bộ phần mềm LibreOffice."], correct: 3 },
        { id: "2_18", type: "single", question: "Một hệ thống cảm biến nhiệt tự động báo cháy cần thiết lập: Còi báo động kêu (Giá trị bằng 1) khi nhiệt độ tăng quá cao (T=1). Nếu dùng trực tiếp tín hiệu T để kích hoạt còi, ta đang mô phỏng mạch của cổng logic nào nếu tín hiệu T đi qua hai lần phủ định liên tiếp?", options: ["Mô phỏng cổng NOT cơ bản.", "Mô phỏng mạch giữ nguyên trạng thái.", "Mô phỏng cổng XOR nâng cao.", "Mô phỏng cổng NAND tích hợp."], correct: 1 },
        { id: "2_19", type: "single", question: "Một người dùng chuyên làm công việc xử lý video liên tục phàn nàn vì mỗi khi kết xuất (render) video, máy tính lại báo dung lượng bộ nhớ tạm thời bị thiếu trầm trọng. Linh kiện phần cứng nào cần được ưu tiên nâng cấp để giải quyết?", options: ["Nâng cấp Bảng mạch mở rộng mạng (Card LAN).", "Nâng cấp Bộ xử lý trung tâm đa nhân (CPU).", "Nâng cấp Bộ nhớ truy cập ngẫu nhiên (RAM).", "Nâng cấp Cáp kết nối tín hiệu đa phương tiện HDMI."], correct: 2 },
        { id: "2_20", type: "single", question: "Khi được phân công viết biên bản cho một buổi họp nhóm trực tuyến có nhịp độ phát biểu rất nhanh, người thư ký nhận thấy bản thân gõ phím không thể theo kịp. Có thể vận dụng công nghệ nào trên nền tảng Google Docs để hỗ trợ trực tiếp?", options: ["Sử dụng công cụ vẽ hình khối và biểu đồ tự động của tiện ích Google Docs.", "Bật tính năng Nhập liệu bằng giọng nói (Voice typing) để máy tính tự động ghi chép.", "Chèn các hình ảnh định dạng ảnh động GIF minh họa vào giữa đoạn văn bản.", "Chuyển đổi ngôn ngữ của bàn phím hệ thống sang một ngôn ngữ có tốc độ gõ nhanh hơn."], correct: 1 },
        { id: "2_21", type: "single", question: "Trong quá trình thu thập số liệu cho một bài báo cáo khoa học, để nhanh chóng tải về danh sách các tệp dữ liệu dạng bảng tính nén (ZIP), cú pháp tìm kiếm trên Google nào mang lại kết quả chuẩn xác nhất?", options: ["Bài báo cáo khoa học dạng số liệu format=zip file.", "\"Tài liệu số liệu khoa học\" filetype:zip.", "Tài liệu nghiên cứu khoa học đuôi zip download miễn phí.", "Báo cáo khoa học tải thư mục nén chuẩn zip về máy."], correct: 1 },
        { id: "2_22", type: "single", question: "Một trưởng phòng nhận thấy hộp thư của mình có rất nhiều email thông báo tự động từ hệ thống quản lý công việc (LMS). Để dọn dẹp Hộp thư đến mà không đánh mất các email này nhằm đối chiếu sau này, người này nên thao tác gì?", options: ["Đánh dấu tất cả chúng là thư rác (Spam) để ngăn hệ thống tiếp tục gửi thư tự động trong tương lai.", "Thay đổi mật khẩu đăng nhập hộp thư ngay lập tức để ép hệ thống cắt đứt quyền gửi thư thông báo.", "Gửi một email nhắc nhở chung đến toàn bộ nhân viên trong phòng yêu cầu ngừng sử dụng hệ thống LMS.", "Tạo Nhãn \"Thông báo LMS\" và thiết lập bộ lọc tự động gán nhãn rồi Lưu trữ (Archive) chúng khỏi Hộp thư đến."], correct: 3 },
        { id: "2_23", type: "single", question: "Một tổ chức phi chính phủ hoạt động bảo vệ môi trường muốn cập nhật thường xuyên tin tức và tương tác với hàng ngàn tình nguyện viên khắp nơi. Phương tiện truyền thông trên mạng xã hội nào phù hợp nhất với tổ chức này?", options: ["Tạo một tài khoản cá nhân có tên tổ chức và đi gửi lời mời kết bạn thủ công với từng người một.", "Thiết lập một nhóm trò chuyện Messenger nhỏ lẻ giới hạn 50 người và thảo luận nội bộ trong đó.", "Khởi tạo một trang Fanpage chuyên nghiệp đại diện cho tổ chức để dễ dàng chạy các chiến dịch truyền thông.", "Đăng tải toàn bộ thông tin lên trang tiểu sử của chủ tịch tổ chức và thiết lập khóa tính năng bình luận."], correct: 2 },
        { id: "2_24", type: "single", question: "Tại một hội thảo ngoài trời, người thuyết trình muốn phát sóng một đoạn video lưu trữ trên đám mây xuống màn hình lớn, nhưng mạng wifi ở khu vực tổ chức được thông báo là rất chập chờn. Để đảm bảo bài thuyết trình diễn ra suôn sẻ, hành động nào là cần thiết nhất trước giờ khai mạc?", options: ["Đợi đến đúng thời điểm phát sóng rồi mới ấn nút Tải xuống (Download) tệp video từ trên đám mây về.", "Yêu cầu toàn bộ khán giả tự lấy điện thoại thông minh quét mã QR truy cập vào đường liên kết đám mây.", "Tải trước (Download) tệp video từ đám mây xuống lưu trữ trực tiếp trên ổ cứng máy tính cá nhân.", "Tắt hoàn toàn kết nối mạng wifi của máy tính đi và gọi điện thoại phàn nàn với nhân viên kỹ thuật của Google."], correct: 2 },
        { id: '2_c1', type: 'tf_cluster', question: "Hệ điều hành đóng vai trò là một môi trường trung gian vững chắc giúp các phần mềm ứng dụng khai thác tài nguyên phần cứng, áp dụng trên cả máy tính cá nhân và thiết bị di động.", subQuestions: [
            { id: '2_d25a', text: "Một sự khác biệt nổi bật của hệ điều hành trên thiết bị di động là giao diện vô cùng thân thiện, ưu tiên thao tác nhận diện cảm biến và các cử chỉ vuốt chạm.", correct: "Đúng" },
            { id: '2_d25b', text: "Chức năng kiểm tra lỗi đĩa (Check disk) là một tính năng độc quyền, chỉ xuất hiện duy nhất trên các dòng điện thoại thông minh chạy hệ điều hành iOS.", correct: "Sai" },
            { id: '2_d25c', text: "Việc chạy tiện ích hợp mảnh (Defragment) trên ổ cứng cơ (HDD) mang lại lợi ích gom các cung dữ liệu bị phân tán về gần nhau, từ đó rút ngắn thời gian đầu từ cơ học phải di chuyển để tìm kiếm tệp tin.", correct: "Đúng" },
            { id: '2_d25d', text: "Nếu người dùng cảm thấy con trỏ chuột không dây trên màn hình máy tính xách tay di chuyển với tốc độ quá nhanh khó kiểm soát, họ bắt buộc phải mua một con chuột mới có độ phân giải cảm biến thấp hơn để khắc phục.", correct: "Sai" }
        ]},
        { id: '2_c2', type: 'tf_cluster', question: "Một doanh nghiệp bán lẻ quy mô nhỏ đang rà soát lại các phương án đầu tư phần mềm nhằm tối ưu hóa ngân sách vận hành công ty trong năm tài chính đầu tiên.", subQuestions: [
            { id: '2_d26a', text: "Việc sử dụng các phần mềm mã nguồn mở như trình duyệt web Firefox hay phần mềm xử lý ảnh GIMP hoàn toàn không yêu cầu doanh nghiệp phải trả các khoản phí bản quyền phần mềm đắt đỏ.", correct: "Đúng" },
            { id: '2_d26b', text: "Mọi nền tảng ứng dụng làm việc trực tuyến trên Internet đều cho phép sử dụng tất cả các chức năng ngoại tuyến (offline) mà không cần có bất kỳ đường truyền kết nối mạng nào.", correct: "Sai" },
            { id: '2_d26c', text: "Việc tuân thủ giấy phép công cộng GNU GPL đối với phần mềm nguồn mở đảm bảo rằng người dùng có quyền tự do chỉnh sửa nhưng buộc phải duy trì tính mở của mã nguồn nếu phát hành sản phẩm phái sinh ra thị trường.", correct: "Đúng" },
            { id: '2_d26d', text: "Nếu doanh nghiệp này quyết định ký hợp đồng thuê một đội ngũ kỹ sư lập trình để viết riêng một phần mềm quản lý kho theo quy trình đặc thù của hãng, phần mềm đó được gọi là phần mềm thương mại \"đóng gói\" bán sẵn.", correct: "Sai" }
        ]},
        { id: '2_c3', type: 'tf_cluster', question: "Ban phụ huynh của một lớp học vừa thiết lập một không gian lưu trữ trên nền tảng đám mây Google Drive để tổng hợp hình ảnh và tư liệu về các hoạt động dã ngoại.", subQuestions: [
            { id: '2_d27a', text: "Thao tác Tải lên (Upload) là hành động đưa các tập tin ảnh từ ổ đĩa cứng của máy tính cá nhân lên không gian lưu trữ trực tuyến trên máy chủ mạng Internet.", correct: "Đúng" },
            { id: '2_d27b', text: "Các dịch vụ lưu trữ đám mây luôn thiết lập mặc định tính năng xóa vĩnh viễn toàn bộ dữ liệu nếu người dùng không truy cập vào tài khoản quá 3 ngày liên tiếp.", correct: "Sai" },
            { id: '2_d27c', text: "Nếu trưởng ban phụ huynh thiết lập quyền \"Người xem\" cho một thư mục hình ảnh, những người truy cập thông qua liên kết đó sẽ có khả năng tải ảnh về máy nhưng không thể chèn thêm ảnh mới lên thư mục chung.", correct: "Đúng" },
            { id: '2_d27d', text: "Để hạn chế rủi ro thất thoát tài liệu quan trọng do một phụ huynh vô tình ấn xóa, trưởng ban nên áp dụng chính sách phân quyền nghiêm ngặt: chỉ giữ quyền \"Người chỉnh sửa\" cho các cán bộ nòng cốt và cấp quyền \"Người xem\" cho phụ huynh phổ thông.", correct: "Đúng" }
        ]},
        { id: '2_c4', type: 'tf_cluster', question: "Để bảo vệ hình ảnh cá nhân và quản lý luồng thông tin liên lạc tốt hơn, một nhân viên bán hàng đang rà soát lại các mục cài đặt trên mạng xã hội Facebook và hộp thư Gmail.", subQuestions: [
            { id: '2_d28a', text: "Trang Fanpage là một tính năng mở rộng của mạng xã hội Facebook được thiết kế chuyên biệt nhằm phục vụ mục đích quảng bá hình ảnh cho các cá nhân, doanh nghiệp và tổ chức.", correct: "Đúng" },
            { id: '2_d28b', text: "Chức năng \"Nhãn\" (Label) trong hộp thư điện tử Gmail được lập trình để bắt buộc mỗi một bức thư chỉ được phép gắn một nhãn duy nhất tại một thời điểm nhất định.", correct: "Sai" },
            { id: '2_d28c', text: "Việc kích hoạt tính năng \"Xem lại thẻ\" trên mạng xã hội giúp người dùng chủ động sàng lọc và quyết định những hình ảnh nào được phép xuất hiện công khai trên dòng thời gian trang cá nhân của mình.", correct: "Đúng" },
            { id: '2_d28d', text: "Nếu muốn phân loại toàn bộ email báo cáo doanh thu gửi về hàng tháng nhằm dễ tra cứu mà không làm đầy hộp thư đến, giải pháp tốt nhất là đánh dấu các email này vào mục Thư rác (Spam) để hệ thống tự động lọc và xóa đi.", correct: "Sai" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin11_2', tenDe: 'Kiểm Tra Giữa kỳ - Tin Học 11 - Đề 2' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        let part1 = shuffleArray(rawQuestions.filter(q => q.type === 'single'));
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            let correctText = q.options[q.correct];
            q.options = shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);
        });
        
        let part2 = shuffleArray(rawQuestions.filter(q => q.type === 'tf_cluster'));
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            q.subQuestions = shuffleArray(q.subQuestions);
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(45 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        const getTen = (fullName) => {
            if (!fullName) return '';
            const words = fullName.trim().split(' ');
            return words[words.length - 1].toLowerCase();
        };

        sortedScoresList = [...allScores].sort((a, b) => {
            const lopA = (a.lop || '').toUpperCase();
            const lopB = (b.lop || '').toUpperCase();
            if (lopA !== lopB) return lopA.localeCompare(lopB);
            
            const tenA = getTen(a.hoTen);
            const tenB = getTen(b.hoTen);
            if (tenA !== tenB) return tenA.localeCompare(tenB);
            
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                timeStr = dt.toLocaleTimeString('vi-VN') + ' - ' + dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
