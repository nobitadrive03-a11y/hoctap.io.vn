        { id: "q5", type: "single", question: "Câu 5: Khai thác thông tin từ dữ liệu đã lưu trữ nhằm mục đích gì?", options: ["Xóa bỏ những dữ liệu đã quá hạn.", "Thay đổi cấu trúc của bảng dữ liệu.", "Phân tích, thống kê, tính toán để thu được thông tin cần thiết.", "Tự động thu thập dữ liệu đầu vào."], correct: 2, explanation: "Khai thác thông tin không chỉ lấy dữ liệu ra, mà còn phải tính toán, phân tích, tổng hợp để tạo ra thông tin mới phục vụ cho việc ra quyết định quản lý." },
        { id: "q6", type: "single", question: "Câu 6: Mục đích chính của công tác quản lý trong các tổ chức là gì?", options: ["Giảm bớt số lượng nhân viên.", "Xử lý thông tin để đưa ra các quyết định.", "Chỉ để lưu trữ hồ sơ bằng giấy.", "Tăng cường mua sắm thiết bị ngoại vi."], correct: 1, explanation: "Mục đích cuối cùng của quản lý là dựa vào các thông tin đã được khai thác, phân tích để người lãnh đạo đưa ra các định hướng và quyết định điều hành chính xác." },
        { id: "q7", type: "single", question: "Câu 7: Việc thu thập dữ liệu tự động mang lại lợi ích lớn nhất nào sau đây?", options: ["Hạn chế khả năng truy xuất dữ liệu của người dùng.", "Tăng thêm sự vất vả cho nhân viên nhập liệu.", "Xóa bỏ hoàn toàn nhu cầu phải có hệ điều hành.", "Giảm công sức thu thập và cung cấp khối lượng dữ liệu lớn để ra quyết định."], correct: 3, explanation: "Thiết bị tự động (như camera, cảm biến, máy đọc mã vạch) giúp thu thập dữ liệu cực nhanh, chính xác, không cần sức người, cung cấp nguồn dữ liệu dồi dào (Big Data) cho hệ thống quản lý." },
        { id: "q8", type: "single", question: "Câu 8: Thiết bị nào sau đây thường được sử dụng để thu thập dữ liệu bán hàng tự động tại các siêu thị?", options: ["Bàn phím cơ.", "Chuột quang.", "Đầu đọc mã vạch.", "Màn hình cảm ứng."], correct: 2, explanation: "Đầu đọc mã vạch (Barcode Scanner) tự động quét mã sản phẩm và đưa dữ liệu về máy tính trong nháy mắt, thay thế việc thu ngân phải gõ phím thủ công." },
        { id: "q9", type: "single", question: "Câu 9: Khi một học sinh chuyển trường, nhân viên giáo vụ bỏ tên học sinh đó khỏi danh sách của trường. Đây là thao tác gì trong quản lý dữ liệu?", options: ["Xóa dữ liệu.", "Khai thác thông tin.", "Truy xuất dữ liệu.", "Thêm dữ liệu."], correct: 0, explanation: "Do học sinh không còn học tại trường, việc loại bỏ thông tin của học sinh đó khỏi cơ sở dữ liệu hiện hành chính là thao tác Xóa (Delete) trong quá trình cập nhật dữ liệu." },
        { id: "q10", type: "single", question: "Câu 10: Sửa lại tên một nhân viên bị gõ sai trong hệ thống quản lý nhân sự của công ty thuộc nhóm thao tác nào?", options: ["Sắp xếp dữ liệu.", "Lọc dữ liệu.", "Cập nhật dữ liệu.", "Khai thác thông tin."], correct: 2, explanation: "Sửa lỗi sai là thao tác \"Sửa\" (Update/Edit), đây là một trong ba thao tác cốt lõi (Thêm, Xóa, Sửa) của quá trình Cập nhật dữ liệu." },
        { id: "q11", type: "single", question: "Câu 11: Khi giáo viên lọc ra danh sách những học sinh có điểm trung bình học kỳ trên 8.0, giáo viên đó đang thực hiện công việc gì?", options: ["Xóa dữ liệu.", "Truy xuất dữ liệu.", "Thu thập dữ liệu.", "Cập nhật dữ liệu."], correct: 1, explanation: "Hành động \"lọc ra\" những dữ liệu thỏa mãn một điều kiện nhất định (điểm > 8.0) từ bảng dữ liệu gốc chính là hoạt động Truy xuất dữ liệu." },
        { id: "q12", type: "single", question: "Câu 12: Việc hệ thống máy tính dùng công thức để tự động tính tỷ lệ học sinh xếp loại Giỏi, Khá, Trung bình từ bảng điểm là thao tác gì?", options: ["Thêm mới dữ liệu.", "Đọc mã vạch.", "Thu thập dữ liệu tự động.", "Khai thác thông tin."], correct: 3, explanation: "Việc sử dụng thuật toán, công thức để tính toán, thống kê tỷ lệ % từ dữ liệu điểm số thô ban đầu chính là quá trình Khai thác thông tin để phục vụ quản lý." },
        { id: "q13", type: "single", question: "Câu 13: Điểm khác biệt lớn nhất giữa việc \"truy xuất dữ liệu\" và \"khai thác thông tin\" là gì?", options: ["Truy xuất là thao tác xóa dữ liệu cũ, khai thác là thao tác thêm dữ liệu mới.", "Truy xuất làm thay đổi dữ liệu gốc, khai thác thì không.", "Truy xuất chỉ tìm và lọc dữ liệu có sẵn, khai thác thường đòi hỏi tính toán, thống kê để tạo ra thông tin mới.", "Khai thác chỉ có thể làm thủ công, truy xuất thì làm tự động."], correct: 2, explanation: "Truy xuất chỉ đơn giản là gọi dữ liệu ra xem (Tìm kiếm, Sắp xếp, Lọc). Khai thác thông tin phức tạp hơn, yêu cầu phải xử lý, tổng hợp, tính toán để sinh ra tri thức/thông tin mới (như báo cáo, biểu đồ)." },
        { id: "q14", type: "single", question: "Câu 14: Đối với ngành điện, lợi ích lớn nhất của việc thay thế công tơ cơ bằng công tơ điện tử là gì?", options: ["Người dân có thể tự chỉnh sửa số điện trên công tơ.", "Giúp công tơ phát sáng vào ban đêm.", "Không cần cung cấp dòng điện cho các thiết bị nữa.", "Tự động thu thập dữ liệu về điện tiêu thụ và hỗ trợ phân tích quản lý lưới điện."], correct: 3, explanation: "Công tơ điện tử có mô-đun truyền thông tin tự động, giúp ngành điện vừa giảm công ghi điện thủ công, vừa có dữ liệu theo thời gian thực để phân tích, điều hành lưới điện." },
        { id: "q15", type: "single", question: "Câu 15: Hệ thống của siêu thị dựa vào dữ liệu bán hàng trong ngày để tự động tính tổng doanh thu. Quá trình này thuộc về:", options: ["Sửa chữa dữ liệu.", "Khai thác thông tin.", "Xóa dữ liệu.", "Thu thập dữ liệu."], correct: 1, explanation: "Tính tổng doanh thu là hành động xử lý, cộng gộp các số liệu bán hàng đơn lẻ (dữ liệu thô) để đưa ra một con số tổng kết báo cáo, tức là đang Khai thác thông tin." },
        { id: "q16", type: "single", question: "Câu 16: Một y tá tìm kiếm mã hồ sơ bệnh án của bệnh nhân \"Nguyễn Văn A\" trong cơ sở dữ liệu. Y tá này đang thực hiện thao tác:", options: ["Truy xuất dữ liệu.", "Cập nhật hồ sơ.", "Xóa hồ sơ.", "Khai thác thông tin thống kê."], correct: 0, explanation: "Việc \"tìm kiếm\" thông tin một người cụ thể trong cơ sở dữ liệu lớn là thao tác cơ bản nhất của hoạt động Truy xuất dữ liệu." },
        { id: "q17", type: "single", question: "Câu 17: Thư viện nhà trường vừa nhập về 50 cuốn truyện mới. Thủ thư nhập mã và tên các cuốn truyện này vào hệ thống máy tính. Đây là bước:", options: ["Thống kê dữ liệu.", "Thêm dữ liệu (Cập nhật dữ liệu).", "Truy xuất dữ liệu.", "Khai thác thông tin."], correct: 1, explanation: "Việc đưa thêm dữ liệu về các cuốn truyện mới tinh chưa từng có trên hệ thống vào cơ sở dữ liệu được gọi là thao tác Thêm (Insert) - thuộc nhóm Cập nhật dữ liệu." },
        { id: "q18", type: "single", question: "Câu 18: Thao tác nào sau đây KHÔNG thuộc nhóm công việc khai thác thông tin?", options: ["Phân tích doanh số bán hàng trong tháng.", "Tính tổng số tiền thu được từ việc bán vé máy bay.", "Xóa một hồ sơ nhân viên đã nghỉ việc khỏi hệ thống.", "Đếm số lượng học sinh đạt điểm 10 môn Toán."], correct: 2, explanation: "Xóa hồ sơ nhân viên nghỉ việc là thao tác làm thay đổi cơ sở dữ liệu gốc, do đó nó thuộc về Cập nhật dữ liệu, chứ KHÔNG phải là Khai thác thông tin (chỉ đọc và tính toán)." },
        { id: "q19", type: "single", question: "Câu 19: Để đưa ra quyết định nhập thêm mặt hàng nào cho tuần tới, quản lý siêu thị cần thực hiện tốt công đoạn nào trong hệ thống CSDL?", options: ["Cập nhật lại toàn bộ tên mặt hàng.", "Khai thác thông tin (phân tích mặt hàng bán chạy, tồn kho).", "Thay mới máy quét mã vạch.", "Xóa ngẫu nhiên các mã sản phẩm."], correct: 1, explanation: "Chỉ khi hệ thống thực hiện Phân tích, thống kê (Khai thác thông tin) chỉ ra được mặt hàng nào đang bán chạy, mặt hàng nào sắp hết, thì người quản lý mới có cơ sở để ra quyết định nhập hàng mới." },
        { id: "q20", type: "single", question: "Câu 20: Ngân hàng thay đổi địa chỉ nhà của một khách hàng trong cơ sở dữ liệu vì khách hàng vừa chuyển nơi ở. Đây là thao tác:", options: ["Khai thác thông tin.", "Sửa dữ liệu (Cập nhật dữ liệu).", "Lọc dữ liệu.", "Sắp xếp dữ liệu."], correct: 1, explanation: "Khi thông tin thực tế thay đổi (địa chỉ), cơ sở dữ liệu cũng phải được \"Sửa\" lại cho khớp. Đây là chức năng Cập nhật dữ liệu để duy trì tính chính xác." },
        { id: "q21", type: "single", question: "Câu 21: Nếu không ứng dụng hệ thống thu thập dữ liệu tự động (như máy đọc mã vạch) tại siêu thị thì điều gì dễ xảy ra nhất?", options: ["Không cần thuê người quản lý siêu thị nữa.", "Tính tiền cực kỳ nhanh chóng.", "Khách hàng sẽ phải tự đọc mã vạch bằng mắt.", "Tốn nhiều thời gian nhập tay, dễ sai sót, gây tắc nghẽn quầy thu ngân."], correct: 3, explanation: "Thu thập thủ công (nhân viên gõ từng mã vạch) sẽ dẫn đến năng suất rất thấp, tốc độ chậm và nguy cơ gõ nhầm rất cao, gây ảnh hưởng đến trải nghiệm của khách hàng." },
        { id: "q22", type: "single", question: "Câu 22: Việc tạo ra bảng phân loại kết quả học tập (bao nhiêu % Giỏi, Khá, Yếu) từ bảng điểm chi tiết là một ví dụ minh họa rõ nhất cho:", options: ["Sự quá tải của phần cứng máy tính.", "Việc nhập liệu thủ công.", "Khai thác thông tin phục vụ quản lý.", "Việc xóa bớt dữ liệu thừa."], correct: 2, explanation: "Tổng hợp dữ liệu thô (bảng điểm) thành các chỉ số ý nghĩa (Tỉ lệ % xếp loại) để báo cáo lên cấp trên chính là tinh hoa của quá trình Khai thác thông tin." },
        { id: "q23", type: "single", question: "Câu 23: Một công ty logistics sử dụng phần mềm tự động tính toán đường đi ngắn nhất cho 100 chiếc xe tải dựa trên dữ liệu giao thông. Hệ thống đang giúp thực hiện việc:", options: ["Xóa bản đồ giao thông.", "Thêm dữ liệu xe tải mới.", "Khai thác thông tin để tối ưu hóa quản lý.", "Sắp xếp thứ tự bảng chữ cái tên tài xế."], correct: 2, explanation: "Phần mềm đang sử dụng thuật toán tính toán trên nền dữ liệu để sinh ra \"tri thức\" mới (đường đi ngắn nhất), giúp lãnh đạo ra quyết định điều phối xe. Đây là mức độ cao của Khai thác thông tin." },
        { id: "q24", type: "single", question: "Câu 24: Việc phần mềm máy tính có thể tự động ghép bảng điểm các môn học riêng lẻ lại thành một bảng tổng kết lớp hoàn chỉnh thể hiện sự tiện lợi của chức năng nào?", options: ["Truy xuất và khai thác thông tin từ dữ liệu đã lưu trữ.", "Xóa hàng loạt dữ liệu rác.", "Mã hóa dữ liệu bằng phần mềm diệt virus.", "Nhập dữ liệu tự động bằng mã vạch."], correct: 0, explanation: "Ghép nối nhiều bảng, lọc theo tên học sinh (Truy xuất) và tính toán tổng kết (Khai thác) là chức năng vượt trội của hệ quản trị CSDL so với quản lý thủ công." },

        // 4 CÂU TRẮC NGHIỆM ĐÚNG/SAI ĐÃ CHIA Ý
        { id: "qII_1", type: "tf_cluster", context: "Câu 1: Bạn Nam đang phụ giúp cán bộ thư viện trường quản lý danh sách mượn sách. Công việc của Nam bao gồm việc ghi nhận tên các cuốn sách mới mua vào hệ thống, xóa bỏ thông tin sách đã bị thất lạc, và tìm kiếm mã sách mỗi khi có học sinh tới mượn.", items: [
            { id: "a", text: "a) Việc Nam nhập thông tin các cuốn sách mới vào máy tính được gọi là khai thác thông tin.", correct: false, expl: "Nhập thông tin sách mới vào hệ thống là hành động \"Thêm mới dữ liệu\", thuộc quá trình Cập nhật dữ liệu chứ không phải Khai thác thông tin." },
            { id: "b", text: "b) Thao tác gỡ bỏ thông tin các cuốn sách đã bị thất lạc khỏi danh sách quản lý của thư viện là thao tác xóa dữ liệu.", correct: true, expl: "Sách bị thất lạc không còn trên thực tế, do đó gỡ bỏ chúng khỏi phần mềm là thao tác \"Xóa\" để đảm bảo dữ liệu phản ánh đúng kho thực tế." },
            { id: "c", text: "c) Khi Nam tìm ra vị trí của các cuốn sách có chủ đề \"Khoa học\" trên phần mềm để hướng dẫn học sinh, Nam đang thực hiện thao tác truy xuất dữ liệu.", correct: true, expl: "Việc sử dụng chức năng \"Tìm kiếm\" trên cơ sở dữ liệu để lấy ra thông tin cần thiết chính xác là hoạt động Truy xuất dữ liệu." },
            { id: "d", text: "d) Nếu Nam dùng phần mềm tính toán xem tháng này có bao nhiêu học sinh đã mượn sách Văn học, đó là quá trình thêm mới dữ liệu.", correct: false, expl: "Tính toán số lượng (thống kê) là hoạt động xử lý dữ liệu để xuất ra báo cáo, do đó đây là thao tác Khai thác thông tin, không phải thêm mới." }
        ]},
        { id: "qII_2", type: "tf_cluster", context: "Câu 2: Một người quản lý siêu thị quyết định đầu tư hệ thống máy quét mã vạch thay cho việc nhân viên thu ngân phải tự đọc và gõ giá tiền bằng tay như những năm trước đây.", items: [
            { id: "a", text: "a) Mã vạch in trên bao bì sản phẩm giúp hệ thống thu thập dữ liệu về mặt hàng một cách tự động khi quét qua đầu đọc.", correct: true, expl: "Mã vạch là công cụ mã hóa thông tin. Khi máy quét đọc, dữ liệu sản phẩm lập tức được truyền về máy tính tự động mà không cần gõ phím." },
            { id: "b", text: "b) So với việc thu ngân gõ phím thủ công, việc đọc mã vạch sẽ làm tăng đáng kể thời gian chờ thanh toán của mỗi khách hàng.", correct: false, expl: "Quét mã vạch diễn ra trong tích tắc, nhanh và chính xác hơn gấp nhiều lần so với gõ phím thủ công, do đó sẽ làm GIẢM thời gian chờ đợi của khách hàng." },
            { id: "c", text: "c) Dữ liệu thu thập tự động từ máy quét mã vạch cung cấp khối lượng thông tin lớn, giúp siêu thị dễ dàng thống kê được mặt hàng nào bán chạy nhất trong ngày.", correct: true, expl: "Mọi giao dịch đều được số hóa tự động tạo thành nguồn dữ liệu lớn. Máy tính sau đó sẽ dựa vào đó để khai thác thông tin báo cáo doanh thu chính xác." },
            { id: "d", text: "d) Việc quét mã vạch chỉ có tác dụng thu thập dữ liệu thô, không hề hỗ trợ gì cho người quản lý trong việc đưa ra các quyết định nhập thêm hàng hóa.", correct: false, expl: "Mặc dù quét mã vạch là bước thu thập dữ liệu, nhưng chính dữ liệu này là nền tảng (nguyên liệu) để hệ thống thống kê, từ đó giúp người quản lý có căn cứ khoa học để ra quyết định kinh doanh." }
        ]},
        { id: "qII_3", type: "tf_cluster", context: "Câu 3: Trường THPT X đang sử dụng một phần mềm cơ sở dữ liệu để quản lý điểm số. Hàng tuần, các giáo viên bộ môn sẽ đăng nhập vào hệ thống để ghi lại điểm kiểm tra thường xuyên của học sinh.", items: [
            { id: "a", text: "a) Thao tác giáo viên nhập điểm số bài kiểm tra mới vào phần mềm là một phần của công việc cập nhật dữ liệu.", correct: true, expl: "Điểm số mới phát sinh được đưa vào hệ thống là hành động \"Thêm\" bản ghi mới, đây là nội dung cơ bản của việc Cập nhật dữ liệu." },

            { id: "a", text: "a) Việc ứng dụng công tơ điện tử giúp ngành điện giảm bớt công sức và thời gian ghi số điện thủ công của nhân viên hàng tháng.", correct: true, expl: "Hệ thống tự động đo và truyền số liệu về trung tâm giúp loại bỏ hoàn toàn việc nhân viên phải đến tận từng nhà ghi chép thủ công." },
            { id: "b", text: "b) Việc công tơ điện tử gửi các giá trị tức thời của điện áp và dòng điện về máy chủ là một hình thức thu thập dữ liệu tự động.", correct: true, expl: "Cảm biến thông minh ghi nhận và viễn thông tự động gửi dữ liệu theo chu kỳ thời gian thực chính là hệ thống thu thập dữ liệu tự động kinh điển." },

   window.startQuizAction = function() {
        try {
            const errDiv = document.getElementById('login-error');
            if(errDiv) errDiv.classList.add('hidden');
            const name = document.getElementById('hoTen').value.trim();
            const lop = document.getElementById('lop').value.trim();
            if (!name || !lop) {
                if(errDiv) { errDiv.innerText = "⚠️ Vui lòng nhập đầy đủ Họ tên và Lớp!"; errDiv.classList.remove('hidden'); } 
                else { alert("⚠️ Vui lòng nhập đầy đủ Họ tên và Lớp!"); }
                return;
            }
            currentStudent = { hoTen: name, lop: lop, maDe: 'bai10', tenDe: 'Tin học 11 - Bài 10' };
            currentQuestions = JSON.parse(JSON.stringify(exam_data));
            quizStartTime = new Date();
            setTimeout(() => { isQuizStarted = true; }, 1000);
            showSection('quiz');
            userAnswers = {};
            window.renderAllQuestions();
            startTimer(45 * 60); 
        } catch (error) { console.error(error); }
    };

    window.viewScoresAction = function() {
        searchTerm = ''; 
        document.getElementById('search-student').value = '';
        currentPage = 1;
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.searchStudent = function(val) { searchTerm = val.toLowerCase(); currentPage = 1; window.renderScores(); };
    window.changePage = function(page) { currentPage = page; window.renderScores(); };
    window.goHome = function() {
        if(document.getElementById('hoTen')) document.getElementById('hoTen').value = ''; 
        if(document.getElementById('lop')) document.getElementById('lop').value = ''; 
        clearInterval(timerInterval); showSection('login');
    };

    function getTotalScoreItems() { return currentQuestions.length; }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'single') {
                if (userAnswers[q.id] !== undefined) count++;
            } else if (q.type === 'tf_cluster') {
                let answeredItems = 0;
                q.items.forEach(item => { if (userAnswers[q.id + '_' + item.id] !== undefined) answeredItems++; });
                if (answeredItems === 4) count++; 
            }
        });
        return count;
    }

   window.selectAnswer = function(qId, val, type) {
        if (type === 'tf') {
            userAnswers[qId] = val;
            const btnT = document.getElementById(`btnT_${qId}`);
            const btnF = document.getElementById(`btnF_${qId}`);
            if (val === true) { btnT.classList.add('selected'); btnT.classList.remove('bg-white'); btnF.classList.remove('selected'); btnF.classList.add('bg-white'); } 
            else { btnF.classList.add('selected'); btnF.classList.remove('bg-white'); btnT.classList.remove('selected'); btnT.classList.add('bg-white'); }
        } else if (type === 'single') { userAnswers[qId] = val; }
        requestAnimationFrame(() => {
            const pgText = document.getElementById('progress-text');
            if(pgText) pgText.innerText = `${getAnsweredCount()}/${getTotalScoreItems()}`;
        });
    };

    window.renderAllQuestions = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const container = document.getElementById('question-container');
        if(!container) return;
        let html = ''; let currentType = '';
        currentQuestions.forEach((q) => {
            if (q.type !== currentType) {
                currentType = q.type;
                let headerText = ''; let roman = '';
                if(currentType === 'single') { headerText = 'TRẮC NGHIỆM MỘT LỰA CHỌN'; roman = 'I'; }
                if(currentType === 'tf_cluster') { headerText = 'TRẮC NGHIỆM ĐÚNG/SAI'; roman = 'II'; }
                html += `<div class="flex items-center gap-3 mt-8 mb-4 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white w-14 h-14 flex items-center justify-center rounded-xl font-black text-2xl shadow-md">${roman}</span><h3 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-700 tracking-wide uppercase">${headerText}</h3></div>`;
            }
            html += `<div class="fade-in w-full bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-blue-100 relative mb-6 hover:shadow-md transition-shadow">`;
            if (q.type === 'single') {
                const uAns = userAnswers[q.id];
                html += `<div class="flex gap-4 mb-5"><div class="w-full math-scroll"><p class="text-xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.question}</p></div></div>`;
                html += `<div class="space-y-4 md:pl-6 mt-6">`;
                q.options.forEach((opt, i) => {
                    const isChecked = (uAns === i) ? 'checked' : '';
                    html += `<div class="flex items-center"><input type="radio" id="opt_${q.id}_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${isChecked} onchange="window.selectAnswer('${q.id}', ${i}, 'single')"><label for="opt_${q.id}_${i}" class="option-label w-full p-4 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-bold text-lg hover:border-blue-300"><div class="w-12 h-12 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg font-black text-gray-400 flex-shrink-0 bg-gray-50">${String.fromCharCode(65 + i)}</div><div class="text-gray-700 leading-relaxed math-scroll flex-1">${opt}</div></label></div>`;
                });
                html += `</div>`;
            } else if (q.type === 'tf_cluster') {
                html += `<div class="bg-red-50 text-red-700 p-5 rounded-xl font-bold mb-4 border-2 border-red-100 text-xl leading-relaxed math-scroll">${q.context}</div><div class="space-y-4 mt-6">`;
                q.items.forEach((item) => {
                    const combinedId = q.id + '_' + item.id;
                    let ans = userAnswers[combinedId];
                    let btnT = ans === true ? 'selected' : 'bg-white'; let btnF = ans === false ? 'selected' : 'bg-white';
                    html += `<div class="p-5 border-2 border-gray-100 rounded-2xl bg-white shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all hover:border-blue-200"><div class="font-bold text-gray-800 flex-1 text-lg math-scroll">${item.text}</div><div class="flex gap-3 shrink-0"><button id="btnT_${combinedId}" onclick="window.selectAnswer('${combinedId}', true, 'tf')" class="btn-tf w-24 sm:w-28 py-3 rounded-xl font-extrabold text-lg ${btnT}">ĐÚNG</button><button id="btnF_${combinedId}" onclick="window.selectAnswer('${combinedId}', false, 'tf')" class="btn-tf w-24 sm:w-28 py-3 rounded-xl font-extrabold text-lg ${btnF}">SAI</button></div></div>`;
                });
                html += `</div>`;
            } 
            html += `</div>`;
        });
        container.innerHTML = html;
        const pgText = document.getElementById('progress-text');
        if(pgText) pgText.innerText = `${getAnsweredCount()}/${getTotalScoreItems()}`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60; return `${m}p ${s}s`;
    }

    window.promptSubmit = function() {
        if (!isQuizStarted) return;
        document.getElementById('confirm-answered').innerText = getAnsweredCount();
        document.getElementById('confirm-total').innerText = getTotalScoreItems();
        document.getElementById('confirm-submit-modal').classList.remove('hidden');
    };

    window.closeConfirmModal = function() { document.getElementById('confirm-submit-modal').classList.add('hidden'); };

    window.executeSubmit = function() {
        window.closeConfirmModal();
        isQuizStarted = false; 
        quizEndTime = new Date();
        clearInterval(timerInterval);
        
        let score = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'single') {
                if (userAnswers[q.id] === q.correct) score += 0.25;
            } else if (q.type === 'tf_cluster') {
                let correctCount = 0;
                q.items.forEach(item => { if (userAnswers[q.id + '_' + item.id] === item.correct) { correctCount++; } });
                if (correctCount === 1) score += 0.1;
                else if (correctCount === 2) score += 0.25;
                else if (correctCount === 3) score += 0.5;
                else if (correctCount === 4) score += 1.0;
            }
        });

        score = score.toFixed(2); 

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe, maDe: currentStudent.maDe, diem: parseFloat(score),
            startTime: quizStartTime.toISOString(), thoiGian: quizEndTime.toISOString(), deviceId: deviceId, userAnswers: userAnswers 
        };
        
        if(database) { scoresRef.push(record, () => { window.showModalResult(score, formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000))); }); } 
        else { window.showModalResult(score, formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000))); }
    };

    window.showModalResult = function(score, dur) {
        ['login', 'quiz', 'scores', 'review'].forEach(s => { const el = document.getElementById(s+'-section'); if(el) el.classList.add('hidden'); });
        const resEl = document.getElementById('result-section'); if(resEl) resEl.classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `
        <div class="flex justify-start mb-4"><button onclick="window.goHome()" class="px-5 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors shadow-sm border border-gray-200 text-lg">🏠 Trang chủ</button></div>
        <div class="text-center"><div class="text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-3xl font-black text-emerald-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-extrabold text-blue-700 text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span></p></div>
        <div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-8 mb-6 shadow-inner relative text-center"><div class="text-base text-blue-500 font-extrabold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-7xl font-black text-blue-600 drop-shadow-sm">${score} <span class="text-3xl text-gray-400">/ 10</span></div></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4"><button onclick="window.reviewQuiz()" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-xl font-extrabold shadow-sm hover:shadow-md transition-colors text-xl">📝 Xem lại bài</button><button onclick="window.viewScoresAction()" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-extrabold shadow-sm hover:shadow-md transition-colors text-xl">🏆 Bảng điểm</button></div>`;
    };

    function getStatusBadge(isCorrect, isUnanswered) {
        if (isUnanswered) return `<div class="mt-4 mb-2 inline-block px-4 py-2 bg-yellow-100 text-yellow-800 text-base font-black rounded-lg border border-yellow-300 shadow-sm">⚠️ CHƯA LÀM</div>`;
        if (isCorrect) return `<div class="mt-4 mb-2 inline-block px-4 py-2 bg-emerald-100 text-emerald-800 text-base font-black rounded-lg border border-emerald-300 shadow-sm">✅ ĐÚNG</div>`;
        return `<div class="mt-4 mb-2 inline-block px-4 py-2 bg-red-100 text-red-800 text-base font-black rounded-lg border border-red-300 shadow-sm">❌ SAI</div>`;
    }

    window.reviewQuiz = function() {
        showSection('review');
        const container = document.getElementById('review-content');
        if(!container) return; let html = '';
        let currentType = '';

        currentQuestions.forEach((q) => {
            if (q.type !== currentType) {
                currentType = q.type;
                let headerText = ''; let roman = '';
                if(currentType === 'single') { headerText = 'TRẮC NGHIỆM MỘT LỰA CHỌN'; roman = 'I'; }
                if(currentType === 'tf_cluster') { headerText = 'TRẮC NGHIỆM ĐÚNG/SAI'; roman = 'II'; }
                html += `<div class="flex items-center gap-3 mt-8 mb-4 border-b-2 border-indigo-100 pb-3"><span class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white w-14 h-14 flex items-center justify-center rounded-xl font-black text-2xl shadow-md">${roman}</span><h3 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-purple-700 tracking-wide uppercase">${headerText}</h3></div>`;
            }

            if (q.type === 'single') {
                let uAns = userAnswers[q.id]; let isUnanswered = (uAns === undefined); let isCorrect = (uAns === q.correct);
                let borderColor = isCorrect ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50';
                html += `<div class="p-6 border-2 rounded-2xl shadow-sm mb-6 ${borderColor}"><div class="font-bold text-xl text-red-600 mb-5 leading-relaxed math-scroll">${q.question}</div><div class="space-y-3">`;
                q.options.forEach((opt, i) => {
                    let optBg = ''; let iconHtml = '';
                    if (q.correct === i) { optBg = 'bg-emerald-100 text-emerald-900 border-emerald-400 border-2'; iconHtml = '✅'; } 
                    else if (uAns === i && !isCorrect) { optBg = 'bg-red-100 text-red-900 line-through border-red-400 border-2'; iconHtml = '❌'; } 
                    else { optBg = 'bg-white text-slate-700 border border-slate-200'; }
                    html += `<div class="p-4 rounded-xl ${optBg} flex items-center gap-4"><div class="w-10 h-10 flex items-center justify-center rounded-lg bg-white/50 text-base font-black shadow-sm flex-shrink-0">${String.fromCharCode(65 + i)}</div><div class="${(q.correct === i || uAns === i) ? 'font-semibold' : 'font-medium'} flex-1 text-lg math-scroll">${opt}</div><div class="text-3xl drop-shadow-sm ml-auto pl-2 flex-shrink-0">${iconHtml}</div></div>`;
                });
                html += `</div>${getStatusBadge(isCorrect, isUnanswered)}`;
                
                if (q.explanation) {
                    html += `<div class="review-explanation mt-3 pt-3 border-t-2 border-gray-200"><p class="text-base font-black uppercase tracking-widest text-blue-600 mb-2">💡 Giải chi tiết:</p><p class="text-black font-medium text-lg leading-loose math-scroll">${q.explanation}</p></div>`;
                }
                html += `</div>`;
            } 
            else if (q.type === 'tf_cluster') {
                html += `<div class="p-6 border-2 border-indigo-200 bg-indigo-50 rounded-2xl shadow-sm mb-6"><div class="font-bold text-xl text-indigo-800 mb-5 math-scroll">${q.context}</div><div class="space-y-5">`;
                q.items.forEach(item => {
                    let uAns = userAnswers[q.id + '_' + item.id]; let isUnanswered = (uAns === undefined); let isCorrect = (uAns === item.correct);
                    let iconHtml = isCorrect ? '✅' : '❌'; let ansText = item.correct ? 'ĐÚNG' : 'SAI';
                    
                    html += `<div class="p-5 bg-white border border-indigo-100 rounded-xl shadow-sm"><div class="font-bold text-gray-800 text-lg math-scroll">${item.text}</div><div class="mt-3 flex items-center justify-between border-b border-gray-100 pb-3"><span class="text-base font-bold text-gray-500">Bạn chọn: <span class="${isUnanswered ? 'text-gray-400' : 'text-blue-600'} font-black uppercase">${isUnanswered ? 'Chưa trả lời' : (uAns?'Đúng':'Sai')}</span></span><span class="font-black text-xl ${isCorrect ? 'text-emerald-500' : 'text-red-500'}">Đáp án: ${ansText} ${iconHtml}</span></div>${getStatusBadge(isCorrect, isUnanswered)}`;
                    
                    if (item.expl) {
                        html += `<div class="review-explanation mt-4 p-4 bg-indigo-50 border-l-4 border-indigo-500 rounded-r-xl text-lg text-gray-700 font-medium leading-relaxed math-scroll">
                            <span class="text-indigo-700 font-black uppercase tracking-widest block mb-2">💡 Giải chi tiết:</span>
                            <span class="text-black">${item.expl}</span>
                        </div>`;
                    }
                    html += `</div>`;
                });
                html += `</div></div>`;
            }
        });
        container.innerHTML = html;
    };

    window.backToResult = function() { showSection('result'); };
    let isReviewingFromLeaderboard = false;
    window.backFromReview = function() {
        if (isReviewingFromLeaderboard) { showSection('scores'); isReviewingFromLeaderboard = false; } 
        else { window.backToResult(); }
    };

    window.reviewStudentScore = function(scoreId) {
        const record = allScores.find(x => x.id === scoreId);
        if (!record) return;
        currentStudent = { hoTen: record.hoTen, lop: record.lop, tenDe: record.tenDe, maDe: record.maDe };
        userAnswers = record.userAnswers || {}; 
        currentQuestions = JSON.parse(JSON.stringify(exam_data)); 
        isReviewingFromLeaderboard = true;
        window.reviewQuiz();
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const noScore = document.getElementById('no-scores');
        const myRankDisplay = document.getElementById('my-rank-display');
        const paginationContainer = document.getElementById('pagination-controls');
        if(!tbody) return;

        const sortedAll = [...allScores].sort((a, b) => b.diem - a.diem);
        
        sortedAll.forEach((s, i) => s.absoluteRank = i + 1);

        const myRankIndex = sortedAll.findIndex(s => s.deviceId === deviceId);
        if (myRankDisplay) {
            if (myRankIndex !== -1) { myRankDisplay.innerHTML = `STT của bạn: <span class="text-red-600 font-black">${sortedAll[myRankIndex].absoluteRank}</span>`; } 
            else { myRankDisplay.innerHTML = `STT của bạn: <span class="text-gray-400">Chưa thi</span>`; }
        }

        const filteredScores = searchTerm ? sortedAll.filter(s => s.hoTen.toLowerCase().includes(searchTerm)) : sortedAll;
        if (filteredScores.length === 0) {
            tbody.innerHTML = ''; noScore.classList.remove('hidden'); paginationContainer.innerHTML = ''; return; 
        }
        
        noScore.classList.add('hidden');
        const totalPages = Math.ceil(filteredScores.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1;
        const startIndex = (currentPage - 1) * itemsPerPage; const endIndex = startIndex + itemsPerPage;
        const pageItems = filteredScores.slice(startIndex, endIndex);

        tbody.innerHTML = pageItems.map((s) => {
            const isMe = s.deviceId === deviceId;
            let timeDisplay = "";
            if (s.thoiGian) {
                const d = new Date(s.thoiGian);
                if (!isNaN(d)) {
                    timeDisplay = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                }
            }

            return `<tr class="${isMe ? 'my-score-row' : 'hover:bg-slate-50'} transition-colors border-b border-slate-100">
            <td class="px-4 py-5 font-black text-slate-500 text-base text-center">${s.absoluteRank}</td>
            <td class="px-4 py-5 font-extrabold text-slate-800 text-base">${s.hoTen} ${isMe ? '<span class="ml-2 bg-pink-500 text-white text-xs px-2 py-1 rounded-md shadow-sm">Bạn</span>' : ''}</td>
            <td class="px-4 py-5 font-black text-blue-600 text-base text-center">${s.lop}</td>
            <td class="px-4 py-5 text-center font-black text-orange-600 text-sm whitespace-nowrap">${timeDisplay}</td>
            <td class="px-4 py-5 text-center"><span class="font-black text-2xl ${s.diem >= 5 ? 'text-emerald-600' : 'text-red-500'}">${s.diem}</span></td>
            <td class="px-4 py-5 text-center">
                <button onclick="window.reviewStudentScore('${s.id}')" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-lg font-bold text-sm transition-colors border border-indigo-200 shadow-sm cursor-pointer whitespace-nowrap">Xem lại</button>
            </td>
        </tr>`;
        }).join('');
        renderPagination(totalPages);
    };

    function renderPagination(totalPages) {
        const container = document.getElementById('pagination-controls');
        if (!container) return;
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '<div class="flex flex-wrap items-center justify-center gap-2">';
        html += `<button onclick="window.changePage(${currentPage - 1})" class="px-4 py-2 rounded-xl font-bold transition-colors ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}" ${currentPage === 1 ? 'disabled' : ''}>&laquo; Trước</button>`;
        let startPage = Math.max(1, currentPage - 1); let endPage = Math.min(totalPages, currentPage + 1);
        if (startPage > 1) { html += `<button onclick="window.changePage(1)" class="px-4 py-2 rounded-xl font-bold bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm">1</button>`; if (startPage > 2) html += `<span class="px-2 text-gray-400 font-black">...</span>`; }
        for (let i = startPage; i <= endPage; i++) { html += `<button onclick="window.changePage(${i})" class="px-4 py-2 rounded-xl font-bold transition-all ${i === currentPage ? 'bg-orange-500 text-white shadow-md border-orange-600' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}">${i}</button>`; }
        if (endPage < totalPages) { if (endPage < totalPages - 1) html += `<span class="px-2 text-gray-400 font-black">...</span>`; html += `<button onclick="window.changePage(${totalPages})" class="px-4 py-2 rounded-xl font-bold bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm">${totalPages}</button>`; }
        html += `<button onclick="window.changePage(${currentPage + 1})" class="px-4 py-2 rounded-xl font-bold transition-colors ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}" ${currentPage === totalPages ? 'disabled' : ''}>Sau &raquo;</button>`;
        html += '</div>'; container.innerHTML = html;
    }

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result', 'review'].forEach(s => { const el = document.getElementById(s+'-section'); if(el) el.classList.add('hidden'); });
        const tgt = document.getElementById(id+'-section'); if(tgt) tgt.classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer'); if(!display) return;
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
