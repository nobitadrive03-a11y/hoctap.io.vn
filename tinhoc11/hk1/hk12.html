    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

        { id: "2_5", type: "single", question: "Các hệ quản trị cơ sở dữ liệu phổ biến trên thị trường hiện nay thường hỗ trợ người dùng giao tiếp và xử lý dữ liệu thông qua ngôn ngữ chuẩn nào?", options: ["Ngôn ngữ lập trình đa nền tảng Java.", "Ngôn ngữ truy vấn có cấu trúc SQL.", "Ngôn ngữ đánh dấu siêu văn bản HTML.", "Ngôn ngữ lập trình bậc thấp Assembly."], correct: 1 },
        { id: "2_6", type: "single", question: "Trong hệ thống cơ sở dữ liệu của một trường học, bảng \"Học sinh\" và bảng \"Lớp học\" thường liên kết với nhau. Yếu tố nào làm nhiệm vụ ghép nối dữ liệu giữa hai bảng này?", options: ["Sử dụng chung một khóa ngoài tham chiếu.", "Sử dụng chung một mật khẩu truy cập mạng.", "Sử dụng chung một ổ đĩa cứng thể rắn SSD.", "Sử dụng chung một câu lệnh hiển thị SELECT."], correct: 0 },
        { id: "2_7", type: "single", question: "Khi thiết kế một bảng lưu trữ thông tin sản phẩm bằng SQL, kỹ thuật viên muốn thêm một trường lưu trữ giá tiền. Kiểu dữ liệu nào phù hợp nhất để thể hiện số thập phân?", options: ["Lựa chọn kiểu dữ liệu dạng INT (Số nguyên).", "Lựa chọn kiểu dữ liệu REAL (Số thực).", "Lựa chọn kiểu dữ liệu DATE (Ngày tháng).", "Lựa chọn kiểu dữ liệu CHAR (Xâu ký tự)."], correct: 1 },
        { id: "2_8", type: "single", question: "Những cá nhân có nhiệm vụ cài đặt, bảo trì, cấp quyền và đảm bảo an toàn cho toàn bộ hệ thống cơ sở dữ liệu của một tổ chức được gọi bằng chức danh gì?", options: ["Chuyên viên quản trị cơ sở dữ liệu.", "Kỹ sư thiết kế giao diện đồ họa.", "Lập trình viên phát triển web frontend.", "Nhân viên nhập liệu văn phòng."], correct: 0 },
        { id: "2_9", type: "single", question: "Việc các nhà sản xuất áp dụng cơ chế \"Cắm và chạy\" (Plug & Play) trên hệ điều hành máy tính đã mang lại tiện ích to lớn nào cho người sử dụng thông thường?", options: ["Tăng gấp đôi tốc độ đường truyền mạng không dây của các thiết bị Bluetooth.", "Máy tính tự động nhận diện và cài đặt thiết bị ngoại vi mà không cần thiết lập thủ công.", "Ngăn chặn triệt để mọi phần mềm gián điệp xâm nhập thông qua thiết bị gắn ngoài.", "Làm cho tất cả các thiết bị ngoại vi không tiêu thụ điện năng từ máy tính chủ nữa."], correct: 1 },
        { id: "2_10", type: "single", question: "Tính năng \"Nhãn\" (Label) trong hộp thư điện tử được đánh giá là linh hoạt hơn so với việc sử dụng \"Thư mục\" (Folder) truyền thống. Điểm khác biệt cốt lõi là gì?", options: ["Mỗi thư điện tử chỉ có thể nằm trong một Nhãn duy nhất để đảm bảo sự gọn gàng tuyệt đối.", "Một bức thư điện tử có thể được gắn cùng lúc nhiều Nhãn khác nhau để phân loại đa chiều.", "Khi tiến hành xóa một Nhãn, toàn bộ thư điện tử nằm trong Nhãn đó sẽ bị xóa vĩnh viễn.", "Nhãn giúp tự động tăng dung lượng lưu trữ tối đa của hòm thư điện tử lên gấp nhiều lần."], correct: 1 },
        { id: "2_11", type: "single", question: "Trong một hệ thống y tế điện tử, việc thu thập tự động dữ liệu từ các thiết bị đo nhịp tim của bệnh nhân truyền thẳng về máy chủ mang lại lợi ích cơ bản nào?", options: ["Cung cấp khối lượng dữ liệu thời gian thực giúp y bác sĩ đưa ra quyết định cấp cứu kịp thời.", "Thay thế hoàn toàn vai trò của các y bác sĩ trong việc khám và chữa bệnh tại bệnh viện.", "Giúp phát hiện nhanh chóng các lỗi bảo mật mạng từ thẻ bảo hiểm y tế của bệnh nhân.", "Đảm bảo bệnh nhân không thể tự ý rời khỏi giường bệnh dưới bất kỳ hình thức nào."], correct: 0 },
        { id: "2_12", type: "single", question: "Trong các tính chất của cơ sở dữ liệu, \"Tính độc lập dữ liệu\" mang ý nghĩa gì khi một tổ chức tiến hành di chuyển kho lưu trữ dữ liệu sang máy chủ mới?", options: ["Khi nâng cấp máy chủ, toàn bộ dữ liệu phải được mã hóa thành các tệp tin độc lập để chống virus.", "Việc thay đổi cách lưu trữ vật lý ở máy chủ không buộc các phần mềm khai thác phải lập trình lại.", "Mỗi nhân viên đều được cung cấp một cơ sở dữ liệu riêng lẻ, hoạt động độc lập trên máy tính cá nhân.", "Hệ thống máy chủ phải được cách ly hoàn toàn khỏi mạng lưới Internet để đảm bảo sự độc lập."], correct: 1 },
        { id: "2_13", type: "single", question: "Khi nói về một Hệ cơ sở dữ liệu (Hệ CSDL), theo nguyên lý cấu trúc thì hệ thống này phải bao gồm tối thiểu những thành phần cốt lõi nào?", options: ["Máy tính chủ, cáp mạng quang băng thông rộng và ổ cứng di động cắm ngoài.", "Hệ điều hành Windows, phần mềm diệt virus chuyên dụng và trình duyệt web.", "CSDL, Hệ quản trị CSDL, và các phần mềm ứng dụng khai thác CSDL.", "Nhân viên quản trị hệ thống mạng, dữ liệu thô chưa xử lý và ngôn ngữ lập trình."], correct: 2 },
        { id: "2_14", type: "single", question: "Sự khác biệt cốt lõi nhất giữa việc dùng ngôn ngữ truy vấn (như SQL) và các ngôn ngữ lập trình truyền thống (như C++) khi thao tác với dữ liệu là gì?", options: ["SQL yêu cầu người dùng mô tả \"muốn làm gì\" thay vì viết chi tiết các thuật toán \"làm như thế nào\".", "Ngôn ngữ lập trình truyền thống xử lý dữ liệu nhanh hơn hàng trăm lần so với ngôn ngữ SQL.", "Chỉ có các chuyên gia bảo mật cấp cao mới được phép viết và thực thi các câu lệnh truy vấn SQL.", "Ngôn ngữ SQL không thể chạy trên môi trường Internet mà chỉ chạy được trên các máy tính cục bộ."], correct: 0 },
        { id: "2_15", type: "single", question: "Trong quản trị hệ thống, người quản trị thường tạo bản sao lưu (backup) cơ sở dữ liệu ra một hệ thống lưu trữ bên ngoài định kỳ nhằm mục đích chính là gì?", options: ["Để theo dõi lịch sử chỉnh sửa dữ liệu của từng nhân viên trong công ty.", "Để phục hồi dữ liệu kịp thời nếu chẳng may máy chủ chính gặp sự cố hỏng hóc.", "Để có thể chia sẻ miễn phí toàn bộ dữ liệu của công ty cho cộng đồng mạng.", "Để giải phóng bớt dung lượng bộ nhớ ổ cứng của máy chủ đang bị đầy."], correct: 1 },
        { id: "2_16", type: "single", question: "Tại sao trong bối cảnh cuộc Cách mạng công nghiệp 4.0 và chuyển đổi số, nhu cầu tuyển dụng các Nhà quản trị cơ sở dữ liệu (DBA) lại tăng mạnh?", options: ["Do các doanh nghiệp đang chuyển dịch từ lưu trữ dữ liệu số hóa quay trở lại ghi chép sổ giấy.", "Do sự sụt giảm của các phần mềm ứng dụng di động khiến các chuyên gia cần tìm công việc mới.", "Do nhu cầu duy trì hệ thống ứng dụng khổng lồ hoạt động thông suốt và an toàn ngày càng cao.", "Do nhà quản trị CSDL là những người duy nhất biết cách sửa chữa phần cứng máy tính."], correct: 2 },
        { id: "2_17", type: "single", question: "Khi được giao nhiệm vụ tra cứu một mẫu \"Báo cáo tài chính\" dưới định dạng bảng tính Excel (.xlsx) trên công cụ tìm kiếm, cú pháp nào là chuyên nghiệp và chính xác nhất?", options: ["\"Báo cáo tài chính\" filetype:xlsx.", "\"Báo cáo tài chính\" format=document xlsx.", "Báo cáo tài chính định dạng tệp tin excel miễn phí.", "\"Báo cáo tài chính\" download tài liệu bảng tính chuẩn nhất."], correct: 0 },
        { id: "2_18", type: "single", question: "Một tổ chức phi lợi nhuận muốn chạy các chiến dịch kêu gọi tình nguyện viên trên mạng xã hội mà không bị giới hạn số lượng người theo dõi. Giải pháp nào là phù hợp nhất?", options: ["Lập một tài khoản Facebook cá nhân mang tên tổ chức và đi kết bạn thủ công với từng người một.", "Khởi tạo một trang Fanpage chuyên nghiệp đại diện cho tổ chức để dễ dàng quảng bá và chạy sự kiện.", "Thiết lập một nhóm trò chuyện Messenger nhỏ lẻ giới hạn 50 người và thảo luận nội bộ trong đó.", "Đăng tải toàn bộ thông tin lên trang tiểu sử của chủ tịch tổ chức và thiết lập khóa tính năng bình luận."], correct: 1 },
        { id: "2_19", type: "single", question: "Một chuỗi siêu thị có chi nhánh trên toàn quốc yêu cầu dữ liệu thanh toán phải được đồng bộ và cho phép tra cứu từ bất kỳ đâu. Để hệ thống không bị sập nếu một máy chủ gặp lỗi, kiến trúc nào là tối ưu?", options: ["Sử dụng Hệ cơ sở dữ liệu tập trung lưu duy nhất trên một chiếc máy tính tại trụ sở chính.", "Thiết lập một Hệ cơ sở dữ liệu phân tán với các máy chủ đặt tại nhiều khu vực địa lý khác nhau.", "Bắt buộc mọi thu ngân phải tải toàn bộ phần mềm máy chủ về điện thoại cá nhân để tự quản lý.", "Không dùng cơ sở dữ liệu điện tử mà quay lại dùng biên lai giấy để lưu trữ phân tán an toàn."], correct: 1 },
        { id: "2_20", type: "single", question: "Khi liên kết bảng \"Sản phẩm\" và bảng \"Nhà cung cấp\" để truy xuất thông tin xuất xứ của món hàng, người thiết kế hệ thống phải sử dụng yếu tố kỹ thuật nào làm cầu nối giữa hai bảng?", options: ["Sử dụng thuộc tính kiểu dữ liệu ngày tháng (Date) chung của cả hai bảng.", "Sử dụng công cụ mã hóa để ẩn giấu thông tin của cả sản phẩm và nhà cung cấp.", "Sử dụng khóa ngoài của bảng Sản phẩm tham chiếu đến khóa chính bảng Nhà cung cấp.", "Sử dụng lệnh DELETE để tự động xóa các thông tin không khớp giữa hai bảng."], correct: 2 },
        { id: "2_21", type: "single", question: "Một nhân viên thư viện muốn thêm một cuốn sách mới có mã sách 'S105' vào bảng 'Sach'. Câu lệnh SQL nào dưới đây được sử dụng để thực hiện thao tác bổ sung dữ liệu này?", options: ["INSERT INTO Sach VALUES ('S105', 'Tên sách', 'Tác giả');", "UPDATE Sach SET MaSach = 'S105';", "SELECT MaSach FROM Sach WHERE MaSach = 'S105';", "ALTER TABLE Sach ADD 'S105';"], correct: 0 },
        { id: "2_22", type: "single", question: "Một công ty muốn chia sẻ cơ sở dữ liệu bán hàng cho nhân viên thử việc tra cứu nhưng tuyệt đối ngăn chặn họ xóa đi các giao dịch cũ. Giải pháp phân quyền nào trên SQL là đúng đắn nhất?", options: ["Viết một email yêu cầu tất cả nhân viên tự giác không bao giờ bấm vào nút xóa trên màn hình.", "Dùng lệnh REVOKE để thu hồi quyền DELETE đối với nhóm tài khoản dành cho nhân viên thử việc.", "Tắt toàn bộ hệ thống máy chủ vào ban đêm khi các nhân viên thử việc đang có ca trực làm thêm.", "Lắp đặt hệ thống khóa vật lý vân tay cho toàn bộ máy tính trong văn phòng công ty."], correct: 1 },
        { id: "2_23", type: "single", question: "Để ghi nhận trạng thái của các tài khoản ngân hàng (Đang hoạt động hoặc Đã khóa), người lập trình CSDL nên định nghĩa cột \"TrangThai\" bằng kiểu dữ liệu nào trong SQL để tiết kiệm dung lượng nhất?", options: ["Lựa chọn kiểu dữ liệu VARCHAR (Xâu ký tự).", "Lựa chọn kiểu dữ liệu INT (Số nguyên).", "Lựa chọn kiểu dữ liệu DATE (Ngày tháng).", "Lựa chọn kiểu dữ liệu BOOLEAN (Kiểu lôgic)."], correct: 3 },
        { id: "2_24", type: "single", question: "Tại một tổ chức tài chính lớn, khi có kế hoạch chuyển đổi nâng cấp toàn bộ hệ thống lưu trữ sang nền tảng công nghệ mới, nhân sự nào chịu trách nhiệm chính trong việc di chuyển an toàn cơ sở dữ liệu?", options: ["Kỹ sư thiết kế giao diện đồ họa trải nghiệm người dùng (UI/UX Designer).", "Nhân viên trực tổng đài tư vấn chăm sóc khách hàng trực tuyến.", "Chuyên viên viết bài truyền thông mạng xã hội và chạy quảng cáo.", "Nhà quản trị cơ sở dữ liệu (Database Administrator) của tổ chức."], correct: 3 },
        
        { id: '2_c1', type: 'tf_cluster', question: "Một tổ chức giáo dục đang rà soát lại các công cụ phần mềm làm việc trực tuyến và các thiết bị lưu trữ vật lý của mình.", subQuestions: [
            { id: '2_d25a', text: "Việc sử dụng các phần mềm chạy trên Internet (như Google Docs) giúp người dùng vượt qua rào cản về cài đặt phần mềm cục bộ.", correct: "Đúng" },
            { id: '2_d25b', text: "Mọi phần mềm mã nguồn mở đều bắt buộc người dùng phải trả một khoản phí để được cấp mã kích hoạt.", correct: "Sai" },
            { id: '2_d25c', text: "Thao tác chạy tiện ích hợp mảnh (Defragment) trên ổ cứng cơ (HDD) giúp gom các liên cung dữ liệu bị phân tán về gần nhau, từ đó rút ngắn thời gian đầu từ cơ học phải di chuyển.", correct: "Đúng" },
            { id: '2_d25d', text: "Nếu người dùng thiết lập đường liên kết của một tệp tin trên OneDrive ở chế độ \"Bất kỳ ai có đường liên kết đều có thể chỉnh sửa\", dữ liệu đó sẽ được đảm bảo an toàn tuyệt đối khỏi sự phá hoại của người lạ.", correct: "Sai" }
        ]},
        { id: '2_c2', type: 'tf_cluster', question: "Một cửa hàng bán lẻ tiến hành nâng cấp từ việc quản lý hàng hóa bằng sổ sách sang sử dụng Hệ quản trị cơ sở dữ liệu điện tử.", subQuestions: [
            { id: '2_d26a', text: "Khác với sổ sách giấy, cơ sở dữ liệu điện tử được thiết kế chặt chẽ nhằm đảm bảo tính không dư thừa để tiết kiệm bộ nhớ.", correct: "Đúng" },
            { id: '2_d26b', text: "Máy quét mã vạch sản phẩm tại quầy thu ngân là một ví dụ điển hình của việc thu thập dữ liệu bằng phương pháp thủ công.", correct: "Sai" },
            { id: '2_d26c', text: "Việc thiết kế cơ sở dữ liệu thành các bảng có liên kết với nhau bằng khóa ngoài giúp tránh tình trạng mỗi lần nhà cung cấp đổi tên thì phải đi tìm sửa ở hàng chục danh sách đơn hàng khác nhau.", correct: "Đúng" },
            { id: '2_d26d', text: "Nếu cửa hàng muốn hệ thống có khả năng tiếp tục hoạt động mà không bị gián đoạn toàn bộ kể cả khi một máy chủ cục bộ bị hỏng, họ bắt buộc phải chọn kiến trúc cơ sở dữ liệu tập trung duy nhất.", correct: "Sai" }
        ]},
        { id: '2_c3', type: 'tf_cluster', question: "Một kỹ sư phần mềm đang thực hiện viết các truy vấn bằng ngôn ngữ SQL để xây dựng hệ thống quản lý cơ sở dữ liệu nhân sự.", subQuestions: [
            { id: '2_d27a', text: "Ngôn ngữ truy vấn có cấu trúc (SQL) được phân chia thành các thành phần chính như ngôn ngữ định nghĩa dữ liệu (DDL) và ngôn ngữ thao tác dữ liệu (DML).", correct: "Đúng" },
            { id: '2_d27b', text: "Câu lệnh SELECT thuộc nhóm định nghĩa dữ liệu, có chức năng chính là để khởi tạo một bảng dữ liệu hoàn toàn mới.", correct: "Sai" },
            { id: '2_d27c', text: "Khi tạo bảng \"Nhân Viên\", việc kỹ sư này chọn trường \"Mã Nhân Viên\" làm khóa chính (Primary Key) là một thao tác thiết yếu để đảm bảo mỗi người có một định danh phân biệt duy nhất.", correct: "Đúng" },
            { id: '2_d27d', text: "Để cập nhật lại mức lương cho nhân viên có mã số 'NV102', kỹ sư này phải sử dụng câu lệnh UPDATE kết hợp với mệnh đề WHERE để xác định đúng đối tượng.", correct: "Đúng" }
        ]},
        { id: '2_c4', type: 'tf_cluster', question: "Đứng trước nguy cơ rò rỉ thông tin cá nhân của khách hàng, ban giám đốc của một sàn thương mại điện tử tiến hành rà soát lại chính sách bảo mật hệ thống.", subQuestions: [
            { id: '2_d28a', text: "Tình trạng hệ thống cấp điện ngừng đột ngột hoặc hư hỏng thiết bị ổ cứng vật lý đều là những sự cố khách quan có thể gây ra hiện tượng mất mát dữ liệu.", correct: "Đúng" },
            { id: '2_d28b', text: "Lệnh REVOKE trong ngôn ngữ SQL được các nhà quản trị sử dụng nhằm cấp thêm các quyền truy cập mở rộng cho một nhóm người dùng mới.", correct: "Sai" },
            { id: '2_d28c', text: "Việc thiết lập phân quyền người dùng thành nhiều cấp bậc (như người dùng ẩn danh, nhân viên, quản trị viên cấp cao) giúp thu hẹp phạm vi tiếp cận dữ liệu, từ đó giảm thiểu tối đa rủi ro lộ lọt từ bên trong.", correct: "Đúng" },
            { id: '2_d28d', text: "Để đảm bảo tính toàn vẹn của dữ liệu trước nguy cơ hỏng hóc thiết bị lưu trữ, việc thường xuyên tiến hành sao lưu dữ liệu (backup) định kỳ là một phần bắt buộc trong công việc của nhà Quản trị cơ sở dữ liệu.", correct: "Đúng" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin11_2_moi', tenDe: 'Kiểm Tra Giữa kỳ 1- Tin Học 11 - Đề 2 ' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        let part1 = shuffleArray(rawQuestions.filter(q => q.type === 'single'));
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            let correctText = q.options[q.correct];
            q.options = shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);
        });
        
        let part2 = shuffleArray(rawQuestions.filter(q => q.type === 'tf_cluster'));
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            q.subQuestions = shuffleArray(q.subQuestions);
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(45 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        const getTen = (fullName) => {
            if (!fullName) return '';
            const words = fullName.trim().split(' ');
            return words[words.length - 1].toLowerCase();
        };

        sortedScoresList = [...allScores].sort((a, b) => {
            const lopA = (a.lop || '').toUpperCase();
            const lopB = (b.lop || '').toUpperCase();
            if (lopA !== lopB) return lopA.localeCompare(lopB);
            
            const tenA = getTen(a.hoTen);
            const tenB = getTen(b.hoTen);
            if (tenA !== tenB) return tenA.localeCompare(tenB);
            
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                timeStr = dt.toLocaleTimeString('vi-VN') + ' - ' + dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
