                brokenPreview: "<table style='border-collapse: collapse; width: 100%; border: 1px solid black; text-align: center;'><tr><td style='border: 1px solid black; padding: 8px;'>Ngày trong tuần</td><td style='border: 1px solid black; padding: 8px; background-color: #fee2e2;'></td><td style='border: 1px solid black; padding: 8px; background-color: #fee2e2;'></td><td style='border: 1px solid black; padding: 8px; background-color: #fee2e2;'></td><td style='border: 1px solid black; padding: 8px; background-color: #fee2e2;'></td></tr></table>",
                fixedCode: "<tr>\n  <td colspan=\"5\">Ngày trong tuần</td>\n</tr>",
                fixedPreview: "<table style='border-collapse: collapse; width: 100%; border: 1px solid black; text-align: center;'><tr><td colspan='5' style='border: 1px solid black; padding: 8px; background-color: #dcfce7; font-weight: bold;'>Ngày trong tuần</td></tr></table>",
                options: ["rowspan=\"5\"", "colspan=\"5\"", "width=\"5%\"", "border=\"5\""],
                correct: 1
            },
            {
                task: "Để tạo khung viền cho bảng, ta có thể đặt thuộc tính <span class='q-code'>border=\"1\"</span> hoặc <span class='q-code'>style=\"border:1px solid\"</span> ở các thẻ nào?",
                brokenCode: "<[target]table[/target]>\n  <tr>\n    <td>Dữ liệu</td>\n  </tr>\n</[target]table[/target]>",
                brokenPreview: "<table style='width: 100%; text-align: center;'><tr><td style='padding: 12px; background-color: #f1f5f9;'>Dữ liệu</td></tr></table>",
                fixedCode: "<table border=\"1\">\n  <tr>\n    <td>Dữ liệu</td>\n  </tr>\n</table>",
                fixedPreview: "<table style='border-collapse: collapse; width: 100%; text-align: center; border: 2px solid #0f172a;'><tr><td style='border: 1px solid #0f172a; padding: 12px; font-weight: bold;'>Dữ liệu</td></tr></table>",
                options: ["Chỉ dùng được ở thẻ <tr>", "Dùng trong thẻ <table> và các thẻ <td> / <th>", "Chỉ dùng được ở thẻ <caption>", "Dùng trong thẻ <dl> và <dd>"],
                correct: 1
            }
        ];

        let state = { name: '', cls: '', score: 0, current: 0, isAnswering: false, sessionID: "user_" + Date.now() };

        function startGame() {
            state.name = document.getElementById('hoten').value.trim();
            state.cls = document.getElementById('userclass').value.trim().toUpperCase();
            if (!state.name || !state.cls) { alert("Vui lòng nhập Họ tên và Lớp!"); return; }
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('hud-player').innerText = `${state.name} (${state.cls})`;
            
            if(window.initFirebaseLeaderboard) window.initFirebaseLeaderboard();
            loadMission();
        }

        function renderBroken(text) {
            return text.replace(/\[target\]/g, '<span class="text-red-500 bg-red-900 bg-opacity-20 font-bold px-1 border border-red-500 border-dashed rounded">').replace(/\[\/target\]/g, '</span>');
        }

        function loadMission() {
            state.isAnswering = false;
            const m = missions[state.current];
            
            document.getElementById('hud-progress').innerText = `${state.current + 1}/10`;
            document.getElementById('question-text').innerHTML = `Câu ${state.current + 1}: ${m.task}`;
            
            const codeDisplay = document.getElementById('code-display');
            codeDisplay.innerHTML = renderBroken(m.brokenCode).replace(/</g, '&lt;').replace(/>/g, '&gt;') 
                                    .replace(/&lt;span class="text-red-500 bg-red-900 bg-opacity-20 font-bold px-1 border border-red-500 border-dashed rounded"&gt;/g, '<span class="text-red-400 border-b-2 border-red-500 border-dashed pb-0.5">')
                                    .replace(/&lt;\/span&gt;/g, '</span>');
                                    
            const previewDisplay = document.getElementById('preview-display');
            previewDisplay.innerHTML = `<div class="w-full">${m.brokenPreview}</div>`;
            document.getElementById('action-area').classList.add('hidden');
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            m.options.forEach((optText, index) => {
                const btn = document.createElement('div');
                btn.className = "option-box shadow-sm";
                
                const letterDiv = document.createElement('div');
                letterDiv.className = "option-letter";
                letterDiv.innerText = letters[index];

                const textDiv = document.createElement('div');
                textDiv.className = "option-text";
                textDiv.innerText = optText;

                btn.appendChild(letterDiv);
                btn.appendChild(textDiv);
                
                btn.onclick = () => checkAnswer(index, m.correct, btn, m);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn, m) {
            if (state.isAnswering) return;
            state.isAnswering = true;

            const feedback = document.getElementById('feedback-msg');
            const codeDisplay = document.getElementById('code-display');
            const previewDisplay = document.getElementById('preview-display');

            if (selected === correct) {
                state.score += 10;
                document.getElementById('hud-score').innerText = state.score;
                
                btn.classList.add('selected');
                
                feedback.innerText = "✨ CHÍNH XÁC! Lỗi đã được vá.";
                feedback.className = "font-black text-xl mb-4 text-green-600";
                
                codeDisplay.innerHTML = `<div class="patched-highlight px-2 py-1 rounded font-bold">${m.fixedCode.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
                previewDisplay.innerHTML = `<div class="patched-highlight px-2 py-1 rounded">${m.fixedPreview}</div>`;
            } else {
                btn.classList.add('wrong');

                feedback.innerText = "❌ SAI RỒI! Hệ thống báo lỗi định dạng.";
                feedback.className = "font-black text-xl mb-4 text-red-600";
                
                const plainBroken = m.brokenCode.replace(/\[target\]/g, '').replace(/\[\/target\]/g, '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                codeDisplay.innerHTML = `<div class="error-highlight px-2 py-1 rounded font-bold">${plainBroken}</div>`;
                previewDisplay.innerHTML = `<div class="error-highlight px-2 py-1 rounded">${m.brokenPreview}</div>`;

                setTimeout(() => {
                    codeDisplay.innerHTML = `<div class="patched-highlight px-2 py-1 rounded font-bold">${m.fixedCode.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
                    previewDisplay.innerHTML = `<div class="patched-highlight px-2 py-1 rounded">${m.fixedPreview}</div>`;
                }, 600);
            }
            
            document.getElementById('action-area').classList.remove('hidden');
        }

        function nextQuestion() {
            state.current++;
            if (state.current < missions.length) {
                loadMission();
            } else {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('end-screen').style.display = 'flex';
                document.getElementById('final-score').innerText = state.score;
                document.getElementById('end-player-info').innerText = `${state.name} (${state.cls})`;
                if(window.saveDataToFirebase) window.saveDataToFirebase(state);
            }
        }
    </script>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Pos8awlh9j041qDWTPFRsVIjF-kPnk",
            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoctap-91691"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const LEADERBOARD_PATH = 'trochoi_bai9tin12_html_v2';
        
        let allPlayers = [], filtered = [], currentPage = 1, pageSize = 50, hasSubmitted = false;

        window.initFirebaseLeaderboard = function() {
            onValue(ref(db, LEADERBOARD_PATH), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    let list = Object.values(data);
                    list.sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        return (a.timestamp || 0) - (b.timestamp || 0);
                    });
                    list.forEach((item, idx) => item.rank = idx + 1);
                    allPlayers = list;
                }
                applySearch(false);
            });
        }

        window.saveDataToFirebase = async function(gameState) {
            if (hasSubmitted) return;
            hasSubmitted = true;
            const d = new Date();
            const dateStr = `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear()}`;
            const record = { id: gameState.sessionID, name: gameState.name, className: gameState.cls, score: gameState.score, timestamp: Date.now(), date: dateStr };
            try {
                await set(ref(db, `${LEADERBOARD_PATH}/${record.id}`), record);
                setTimeout(jumpToMe, 500); 
            } catch (e) { console.error("Lỗi", e); }
        }

        function applySearch(reset = true) {
            const kw = document.getElementById('search-input').value.trim().toLowerCase();
            filtered = kw === "" ? allPlayers : allPlayers.filter(p => (p.name && p.name.toLowerCase().includes(kw)) || (p.className && p.className.toLowerCase().includes(kw)));
            if (reset) currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('final-leaderboard-list');
            tbody.innerHTML = '';
            const total = filtered.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            
            const startIdx = (currentPage - 1) * pageSize, endIdx = Math.min(startIdx + pageSize, total);
            const pageItems = filtered.slice(startIdx, endIdx);

            document.getElementById('showing-range').innerText = total > 0 ? `${startIdx + 1} - ${endIdx}` : "0 - 0";
            document.getElementById('showing-total').innerText = total;
            document.getElementById('current-page-display').innerText = currentPage;
            document.getElementById('total-pages-display').innerText = totalPages;

            if (pageItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-gray-500 font-bold">Chưa có dữ liệu 📭</td></tr>`; return;
            }

            pageItems.forEach(p => {
                const tr = document.createElement('tr');
                tr.id = `row_${p.id}`;
                if (window.state && p.id === window.state.sessionID) tr.classList.add('me-row');
                
                let rankStr = p.rank === 1 ? '🥇 1' : p.rank === 2 ? '🥈 2' : p.rank === 3 ? '🥉 3' : p.rank;
                tr.innerHTML = `<td class="font-bold text-red-600">${rankStr}</td><td><span class="badge-class">${p.className || '---'}</span></td><td class="text-left font-bold">${p.name}</td><td><span class="badge-score">${p.score}</span></td>`;
                tbody.appendChild(tr);
            });
        }

        function jumpToMe() {
            document.getElementById('search-input').value = '';
            filtered = allPlayers;
            const myIdx = filtered.findIndex(p => p.id === state.sessionID);
            if (myIdx === -1) return;
            currentPage = Math.floor(myIdx / pageSize) + 1;
            renderTable();
            setTimeout(() => { const row = document.getElementById(`row_${state.sessionID}`); if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }

        document.getElementById('search-input').addEventListener('input', () => applySearch(true));
        document.getElementById('find-me-btn').addEventListener('click', jumpToMe);
        document.getElementById('prev-page-btn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
        document.getElementById('next-page-btn').addEventListener('click', () => { if (currentPage < Math.ceil(filtered.length / pageSize)) { currentPage++; renderTable(); } });
    </script>
</body>
