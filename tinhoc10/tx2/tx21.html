  <script>
    let database = null;
    let scoresRef = null;
    let currentIdx = 0;

    try {
        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Pos8awlh9j041qDWTPFRsVIjF-kPnk",
            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoctap-91691",
            storageBucket: "hoctap-91691.firebasestorage.app",
            messagingSenderId: "1004553425319",
            appId: "1:1004553425319:web:45d15cbae393f614c56682",
            measurementId: "G-Q6X1TL9PRV"
        };
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            scoresRef = database.ref('TinHoc10/tx2_De1');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('selectstart', event => {
        if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') { event.preventDefault(); }
    });
    document.addEventListener('dragstart', event => event.preventDefault()); 
    document.addEventListener('copy', event => {
        event.clipboardData.setData('text/plain', 'Tài liệu đã được bảo vệ!');
        event.preventDefault();
        window.handleCheatAction('Sao chép (Copy) văn bản');
    });

    // DỮ LIỆU ĐỀ THI MỚI - PYTHON (ĐÃ ÁP DỤNG CODE-INLINE VÀ CODE-BLOCK)
    const de_data = [
        { id: "1_1", type: "single", question: "Lệnh lặp <span class='code-inline'>while</span> trong ngôn ngữ lập trình Python được thiết kế để sử dụng chủ yếu trong những tình huống lập trình mang đặc trưng cơ bản nào dưới đây?", options: ["Tình huống lập trình cần thực hiện các thao tác lặp lại nhiều lần với số lần lặp hoàn toàn chưa thể biết trước và phụ thuộc vào một điều kiện.", "Tình huống lập trình cần tính toán ngay lập tức các biểu thức toán học phức tạp có sự xuất hiện của các chữ số thập phân siêu dài.", "Tình huống lập trình yêu cầu máy tính tự động dịch toàn bộ các đoạn văn bản tiếng Việt sang một hệ thống ngôn ngữ tiếng Anh quốc tế.", "Tình huống lập trình buộc người sử dụng phải đóng toàn bộ các ứng dụng đang chạy nền để hệ thống giải phóng bớt bộ nhớ dung lượng RAM."], correct: 0 },
        { id: "1_2", type: "single", question: "Trong ngôn ngữ lập trình bậc cao Python, ba cấu trúc điều khiển cơ bản nhất đóng vai trò nền tảng để xây dựng nên mọi chương trình máy tính là gì?", options: ["Cấu trúc thiết kế phần cứng, cấu trúc kết nối mạng máy tính và cấu trúc bảo mật hệ thống thông tin an toàn.", "Cấu trúc lưu trữ dữ liệu, cấu trúc truy xuất dữ liệu từ xa và cấu trúc kết xuất biểu đồ báo cáo tài chính.", "Cấu trúc lập trình tuần tự, cấu trúc lập trình rẽ nhánh có điều kiện và cấu trúc lập trình lặp lại nhiều lần.", "Cấu trúc biên tập hình ảnh, cấu trúc xử lí các tệp tin âm thanh nổi và cấu trúc thiết kế hoạt hình ba chiều."], correct: 2 },
        { id: "1_3", type: "single", question: "Kiểu dữ liệu danh sách (<span class='code-inline'>list</span>) trong phần mềm Python được định nghĩa và khởi tạo bằng cách gom nhóm các phần tử vào bên trong cặp dấu ngoặc nào?", options: ["Các phần tử phải được sắp xếp liên tục và đặt cẩn thận vào khu vực nằm bên trong cặp dấu ngoặc nhọn <span class='code-inline'>{}</span>.", "Các phần tử phải được sắp xếp liên tục và đặt cẩn thận vào khu vực nằm bên trong cặp dấu ngoặc vuông <span class='code-inline'>[]</span>.", "Các phần tử phải được sắp xếp liên tục và đặt cẩn thận vào khu vực nằm bên trong cặp dấu ngoặc đơn <span class='code-inline'>()</span>.", "Các phần tử phải được sắp xếp liên tục và đặt cẩn thận vào khu vực nằm bên trong cặp dấu ngoặc kép <span class='code-inline'>\"\"</span>."], correct: 1 },
        { id: "1_4", type: "single", question: "Để xác định chính xác tổng số lượng phần tử hiện đang được lưu trữ bên trong một danh sách, lập trình viên sử dụng hàm tích hợp sẵn nào của Python?", options: ["Hàm <span class='code-inline'>type()</span> giúp lập trình viên nhanh chóng thu thập và báo cáo số lượng thông tin bên trong danh sách.", "Hàm <span class='code-inline'>int()</span> giúp lập trình viên nhanh chóng thu thập và báo cáo số lượng thông tin bên trong danh sách.", "Hàm <span class='code-inline'>len()</span> giúp lập trình viên nhanh chóng thu thập và báo cáo số lượng thông tin bên trong danh sách.", "Hàm <span class='code-inline'>str()</span> giúp lập trình viên nhanh chóng thu thập và báo cáo số lượng thông tin bên trong danh sách."], correct: 2 },
        { id: "1_5", type: "single", question: "Các chỉ số vị trí (<span class='code-inline'>index</span>) dùng để truy cập vào từng phần tử bên trong một cấu trúc danh sách của Python được hệ thống đếm bắt đầu từ con số nào?", options: ["Chỉ số vị trí được hệ thống máy tính tự động thiết lập và bắt đầu đếm tuần tự từ con số 0 trở đi.", "Chỉ số vị trí được hệ thống máy tính tự động thiết lập và bắt đầu đếm tuần tự từ con số 1 trở đi.", "Chỉ số vị trí được hệ thống máy tính tự động thiết lập và bắt đầu đếm tuần tự từ con số -1 trở đi.", "Chỉ số vị trí được hệ thống máy tính tự động thiết lập và bắt đầu đếm tuần tự từ số lượng tổng."], correct: 0 },
        { id: "1_6", type: "single", question: "Toán tử <span class='code-inline'>in</span> trong Python được thiết kế để thực hiện chức năng kiểm tra điều kiện logic gì khi làm việc với kiểu dữ liệu danh sách (<span class='code-inline'>list</span>)?", options: ["Toán tử này thực hiện chức năng tự động biến đổi tất cả các dữ liệu chữ cái thành kiểu số nguyên toán học.", "Toán tử này thực hiện chức năng kiểm tra xem một giá trị cụ thể có tồn tại bên trong danh sách hay không.", "Toán tử này thực hiện chức năng tiến hành xóa bỏ toàn bộ các phần tử đang được lưu trữ trong danh sách đó.", "Toán tử này thực hiện chức năng ghép nối hai danh sách hoàn toàn độc lập lại với nhau thành một tệp duy nhất."], correct: 1 },
        { id: "1_7", type: "single", question: "Phương thức <span class='code-inline'>append(x)</span> cung cấp tính năng hữu ích gì khi thao tác chỉnh sửa một đối tượng danh sách đang tồn tại bên trong chương trình Python?", options: ["Phương thức này tự động đảo ngược toàn bộ trình tự xuất hiện của mọi phần tử đang nằm ở trong danh sách.", "Phương thức này trực tiếp tiến hành bổ sung thêm một phần tử mang giá trị x vào đúng vị trí đầu tiên của danh sách.", "Phương thức này trực tiếp tiến hành bổ sung thêm một phần tử mang giá trị x vào đúng vị trí cuối cùng của danh sách.", "Phương thức này tự động loại bỏ bớt phần tử mang giá trị x ra khỏi hệ thống lưu trữ của danh sách hiện tại."], correct: 2 },
        { id: "1_8", type: "single", question: "Khi cần dọn dẹp bộ nhớ, để xóa hoàn toàn mọi phần tử và biến một danh sách đang chứa dữ liệu trở thành danh sách rỗng, ta sử dụng phương thức nào?", options: ["Việc kích hoạt phương thức <span class='code-inline'>remove()</span> sẽ ngay lập tức xóa bỏ sạch sẽ mọi nội dung bên trong của danh sách đó.", "Việc kích hoạt phương thức <span class='code-inline'>delete()</span> sẽ ngay lập tức xóa bỏ sạch sẽ mọi nội dung bên trong của danh sách đó.", "Việc kích hoạt phương thức <span class='code-inline'>clear()</span> sẽ ngay lập tức xóa bỏ sạch sẽ mọi nội dung bên trong của danh sách đó.", "Việc kích hoạt phương thức <span class='code-inline'>insert()</span> sẽ ngay lập tức xóa bỏ sạch sẽ mọi nội dung bên trong của danh sách đó."], correct: 2 },
        { id: "1_9", type: "single", question: "Đoạn lệnh <span class='code-inline'>while</span> sẽ lập tức kết thúc quá trình chạy lặp lại và chuyển quyền điều khiển sang các câu lệnh tiếp theo bên dưới khi xảy ra điều gì?", options: ["Khi biểu thức điều kiện logic đi kèm theo vòng lặp được hệ thống đánh giá và trả về kết quả là <span class='code-inline'>False</span>.", "Khi biểu thức điều kiện logic đi kèm theo vòng lặp được hệ thống đánh giá và trả về kết quả là <span class='code-inline'>True</span>.", "Khi người sử dụng tiến hành thu nhỏ giao diện cửa sổ làm việc của phần mềm lập trình xuống thanh Taskbar.", "Khi máy tính cá nhân tự động ngắt kết nối với mạng internet quốc tế trong quá trình biên dịch mã nguồn."], correct: 0 },
        { id: "1_10", type: "single", question: "Trong cấu trúc lặp <span class='code-inline'>while</span>, nếu biểu thức điều kiện luôn luôn nhận giá trị <span class='code-inline'>True</span> và lập trình viên quên không dùng lệnh ngắt, hiện tượng kĩ thuật nào sẽ xuất hiện?", options: ["Chương trình sẽ tự động tối ưu hóa mã nguồn và kết thúc quá trình lặp một cách an toàn không báo lỗi.", "Chương trình sẽ rơi vào trạng thái lặp vô hạn và không bao giờ tự động dừng lại nếu không can thiệp.", "Chương trình sẽ tự động mở hộp thoại thông báo yêu cầu người dùng phải tự tay nhập thời gian chờ.", "Chương trình sẽ tiến hành xóa bỏ toàn bộ dữ liệu ổ cứng để bảo vệ hệ thống khỏi vòng lặp nguy hiểm."], correct: 1 },
        { id: "1_11", type: "single", question: "Khẳng định nào sau đây diễn tả chính xác nhất về đặc tính kiểu dữ liệu của các phần tử khi được người dùng đưa vào lưu trữ trong cùng một danh sách?", options: ["Một danh sách luôn ép buộc mọi phần tử phải đồng nhất mang chung một kiểu dữ liệu duy nhất là số nguyên dương.", "Một danh sách cho phép lưu trữ đồng thời nhiều phần tử mang các kiểu dữ liệu hoàn toàn khác nhau (số, xâu, logic).", "Một danh sách luôn ép buộc mọi phần tử phải đồng nhất mang chung một kiểu dữ liệu duy nhất là xâu kí tự văn bản.", "Một danh sách hoàn toàn không thể chứa đựng được các phần tử thuộc dạng dữ liệu logic (<span class='code-inline'>boolean</span>) như <span class='code-inline'>True</span>, <span class='code-inline'>False</span>."], correct: 1 },
        { id: "1_12", type: "single", question: "Giả sử đang có một danh sách <span class='code-inline'>A = [10, 20, 30, 40]</span>, nếu hệ thống thực thi lệnh gán <span class='code-inline'>A[1] = 50</span>, sự biến đổi dữ liệu nào sẽ trực tiếp diễn ra bên trong danh sách?", options: ["Giá trị của phần tử nằm ở vị trí thứ hai trong danh sách (giá trị 20) sẽ được cập nhật thay thế bằng con số 50.", "Giá trị của phần tử nằm ở vị trí đầu tiên trong danh sách (giá trị 10) sẽ được cập nhật thay thế bằng con số 50.", "Hệ thống sẽ tự động chèn thêm một phần tử mang con số 50 vào chen giữa phần tử thứ nhất và phần tử thứ hai.", "Hệ thống sẽ ngay lập tức loại bỏ đi phần tử mang con số 50 nếu như nó xuất hiện ở bất kì đâu trong danh sách."], correct: 0 },
        { id: "1_13", type: "single", question: "Câu lệnh <span class='code-inline'>del A[2]</span> khi được thực thi trên danh sách <span class='code-inline'>A = [1, 2, 3, 4]</span> sẽ mang lại kết quả biến đổi dữ liệu chuẩn xác nào cho danh sách này?", options: ["Hệ thống sẽ xóa đi phần tử mang giá trị là số 2, danh sách A lúc này sẽ còn lại ba phần tử là <span class='code-inline'>[1, 3, 4]</span>.", "Hệ thống sẽ xóa đi phần tử mang giá trị là số 3, danh sách A lúc này sẽ còn lại ba phần tử là <span class='code-inline'>[1, 2, 4]</span>.", "Hệ thống sẽ xóa đi phần tử mang giá trị là số 4, danh sách A lúc này sẽ còn lại ba phần tử là <span class='code-inline'>[1, 2, 3]</span>.", "Hệ thống sẽ thực hiện việc nhân đôi tất cả các số lên, danh sách A lúc này sẽ chứa các phần tử là <span class='code-inline'>[2, 4, 6, 8]</span>."], correct: 1 },
        { id: "1_14", type: "single", question: "Sự khác biệt cốt lõi về nguyên lí hoạt động giữa phương thức <span class='code-inline'>remove(x)</span> và câu lệnh <span class='code-inline'>del A[i]</span> trong việc loại bỏ một phần tử khỏi danh sách Python là gì?", options: ["Phương thức <span class='code-inline'>remove()</span> tiến hành tìm và xóa phần tử dựa trên giá trị cụ thể, còn lệnh <span class='code-inline'>del</span> tiến hành xóa phần tử dựa theo vị trí chỉ số.", "Phương thức <span class='code-inline'>remove()</span> tiến hành tìm và xóa phần tử dựa trên vị trí chỉ số, còn lệnh <span class='code-inline'>del</span> tiến hành xóa phần tử dựa theo giá trị cụ thể.", "Phương thức <span class='code-inline'>remove()</span> bắt buộc phải xóa sạch mọi thứ trong danh sách, còn lệnh <span class='code-inline'>del</span> luôn giữ lại một phần tử dự phòng an toàn.", "Phương thức <span class='code-inline'>remove()</span> dùng để thao tác với kiểu dữ liệu số nguyên, còn lệnh <span class='code-inline'>del</span> chỉ giới hạn dùng để thao tác với dữ liệu văn bản."], correct: 0 },
        { id: "1_15", type: "single", question: "Phương thức <span class='code-inline'>insert(i, x)</span> thực hiện nhiệm vụ chèn dữ liệu vào danh sách theo cơ chế sắp xếp dịch chuyển các phần tử đang có như thế nào?", options: ["Chèn giá trị <span class='code-inline'>x</span> vào đúng vị trí chỉ số <span class='code-inline'>i</span>, đồng thời tự động xóa bỏ hoàn toàn đi phần tử cũ đang chiếm giữ tại vị trí này.", "Chèn giá trị <span class='code-inline'>x</span> vào đúng vị trí chỉ số <span class='code-inline'>i</span>, đồng thời đẩy phần tử cũ và các phần tử nằm phía sau lùi sang phía bên phải.", "Chèn giá trị <span class='code-inline'>x</span> vào đúng vị trí chỉ số <span class='code-inline'>i</span>, đồng thời đẩy phần tử cũ và các phần tử nằm phía trước lùi sang phía bên trái.", "Chèn giá trị <span class='code-inline'>x</span> vào vị trí đầu tiên của danh sách mặc kệ thông số <span class='code-inline'>i</span> và gộp nó lại với phần tử cũ để tính ra tổng số chung."], correct: 1 },
        { id: "1_16", type: "single", question: "Khi lập trình viên tiến hành duyệt qua các phần tử của danh sách A bằng cấu trúc lặp <span class='code-inline'>for x in A:</span>, biến <span class='code-inline'>x</span> trong mỗi một vòng lặp sẽ đóng vai trò đại diện cho yếu tố gì?", options: ["Biến <span class='code-inline'>x</span> sẽ chỉ đại diện cho một con số chỉ mục (<span class='code-inline'>index</span>) tăng dần đều từ 0 cho đến hết chiều dài của bảng danh sách.", "Biến <span class='code-inline'>x</span> sẽ lần lượt đại diện tiếp nhận trực tiếp giá trị của từng phần tử xuất hiện lần lượt ở bên trong bảng danh sách.", "Biến <span class='code-inline'>x</span> sẽ đại diện cho mức dung lượng bộ nhớ mà phần mềm Python đã tiêu tốn để lưu trữ cấu trúc bảng danh sách.", "Biến <span class='code-inline'>x</span> sẽ đóng vai trò làm công cụ đếm xem hiện tại có bao nhiêu phần tử mang giá trị là chữ số bên trong danh sách."], correct: 1 },
        { id: "1_17", type: "single", question: "Cho đoạn mã lập trình sau: <div class='code-block'>i = 0<br>while i < 5:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(i)<br>&nbsp;&nbsp;&nbsp;&nbsp;i = i + 2</div> Khi khởi chạy đoạn chương trình này, màn hình máy tính sẽ in ra chuỗi giá trị nào?", options: ["Chương trình sẽ in ra lần lượt ba giá trị số nguyên theo trình tự từ nhỏ đến lớn là các số 0, 2 và 4.", "Chương trình sẽ in ra lần lượt ba giá trị số nguyên theo trình tự từ nhỏ đến lớn là các số 1, 3 và 5.", "Chương trình sẽ in ra lần lượt năm giá trị số nguyên theo trình tự từ nhỏ đến lớn là các số 0, 1, 2, 3 và 4.", "Chương trình sẽ in ra lần lượt hai giá trị số nguyên theo trình tự từ nhỏ đến lớn là các số 2 và 4."], correct: 0 },
        { id: "1_18", type: "single", question: "Cho đoạn mã: <div class='code-block'>A = [1, 3, 5, 7]<br>A.append(9)<br>A.insert(1, 2)</div> Sau khi toàn bộ các lệnh này được máy tính thực thi xong, danh sách A sẽ có nội dung như thế nào?", options: ["Danh sách A sẽ mang nội dung chi tiết bao gồm sáu phần tử theo đúng trình tự phân bố là <span class='code-inline'>[1, 2, 3, 5, 7, 9]</span>.", "Danh sách A sẽ mang nội dung chi tiết bao gồm sáu phần tử theo đúng trình tự phân bố là <span class='code-inline'>[2, 1, 3, 5, 7, 9]</span>.", "Danh sách A sẽ mang nội dung chi tiết bao gồm năm phần tử theo đúng trình tự phân bố là <span class='code-inline'>[1, 3, 5, 7, 9]</span>.", "Danh sách A sẽ mang nội dung chi tiết bao gồm sáu phần tử theo đúng trình tự phân bố là <span class='code-inline'>[1, 3, 5, 7, 9, 2]</span>."], correct: 0 },
        { id: "1_19", type: "single", question: "Để tự động duyệt qua danh sách <span class='code-inline'>DS = [5, 10, 15]</span> và in ra màn hình các giá trị gấp đôi của từng phần tử, cấu trúc dòng lệnh lặp nào sau đây là chuẩn xác nhất?", options: ["Câu lệnh <span class='code-inline'>for x in range(DS): print(x * 2)</span> sẽ tạo ra quá trình lặp qua từng giá trị thực tế và in kết quả nhân đôi.", "Câu lệnh <span class='code-inline'>for x in DS: print(x * 2)</span> sẽ tạo ra quá trình lặp qua từng giá trị thực tế và in kết quả nhân đôi ra màn hình.", "Câu lệnh <span class='code-inline'>while x in DS: print(x * 2)</span> sẽ tạo ra quá trình lặp qua từng giá trị thực tế và in kết quả nhân đôi ra màn hình.", "Câu lệnh <span class='code-inline'>for x in DS: x = x * 2</span> sẽ tạo ra quá trình lặp qua từng giá trị thực tế và in kết quả nhân đôi ra màn hình."], correct: 1 },
        { id: "1_20", type: "single", question: "Giả sử đang có danh sách <span class='code-inline'>HocSinh = [\"An\", \"Bình\", \"Cường\", \"Dũng\"]</span>. Nếu hệ thống thực thi lệnh <span class='code-inline'>HocSinh.remove(\"Bình\")</span> rồi ngay sau đó chạy lệnh <span class='code-inline'>HocSinh.clear()</span>, kết quả là gì?", options: ["Danh sách HocSinh lúc này sẽ chỉ còn lại chứa đựng duy nhất ba phần tử văn bản là \"An\", \"Cường\", \"Dũng\".", "Toàn bộ các phần tử sẽ bị xóa sạch hoàn toàn, danh sách HocSinh chính thức trở thành một danh sách rỗng <span class='code-inline'>[]</span>.", "Hệ thống sẽ phát ra tiếng bíp cảnh báo lỗi do không thể sử dụng phương thức xóa rỗng ngay sau khi dùng lệnh gỡ bỏ.", "Danh sách HocSinh lúc này sẽ chỉ còn lại chứa đựng duy nhất một phần tử văn bản là tên của bạn học sinh \"Bình\"."], correct: 1 },
        { id: "1_21", type: "single", question: "Đoạn mã: <div class='code-block'>S = 0<br>n = 1<br>while n <= 3:<br>&nbsp;&nbsp;&nbsp;&nbsp;S = S + n<br>&nbsp;&nbsp;&nbsp;&nbsp;n = n + 1</div> thực thi quá trình tự động tính toán tổng số cộng dồn, cho ra kết quả giá trị S cuối cùng bằng bao nhiêu?", options: ["Đoạn mã tiến hành tính tổng của ba số nguyên dương đầu tiên (1+2+3) và cho ra kết quả giá trị S cuối cùng bằng 6.", "Đoạn mã tiến hành tính tổng của bốn số nguyên dương đầu tiên (1+2+3+4) và cho ra kết quả giá trị S cuối cùng bằng 10.", "Đoạn mã tiến hành tính toán một dãy số nhân lặp lại liên tiếp (123) và cho ra kết quả giá trị S cuối cùng bằng 6.", "Đoạn mã tiến hành tính tổng của hai số nguyên dương đầu tiên (1+2) và cho ra kết quả giá trị S cuối cùng bằng 3."], correct: 0 },
        { id: "1_22", type: "single", question: "Khi tiến hành khai báo danh sách <span class='code-inline'>A = [10, 20, 30]</span>, câu lệnh cập nhật dữ liệu <span class='code-inline'>A[len(A) - 1] = 50</span> sẽ tác động và làm thay đổi phần tử nào bên trong danh sách đã cho?", options: ["Câu lệnh sẽ tự động xác định và thay thế giá trị của phần tử nằm ở vị trí đầu tiên trong danh sách thành số 50.", "Câu lệnh sẽ tự động xác định và thay thế giá trị của phần tử nằm ở vị trí cuối cùng trong danh sách thành số 50.", "Câu lệnh sẽ tự động xác định và thay thế giá trị của phần tử nằm ở vị trí chính giữa trong danh sách thành số 50.", "Câu lệnh sẽ tự động tạo ra một phần tử hoàn toàn mới mang số 50 và gắn nó vào đằng sau lưng của danh sách."], correct: 1 },
        { id: "1_23", type: "single", question: "Cho đoạn mã lập trình: <div class='code-block'>A = [1, 2, 3]<br>B = A + [4, 5]</div> Nội dung của biến B sau khi hệ thống xử lí phép toán ghép nối danh sách này sẽ mang những giá trị chi tiết nào?", options: ["Biến B sẽ lưu trữ một danh sách mới được hệ thống tính tổng toán học các số lại tạo thành một phần tử mang giá trị <span class='code-inline'>[15]</span>.", "Biến B sẽ lưu trữ một danh sách mới được hệ thống sao chép nhân đôi số lượng mảng tạo thành giá trị <span class='code-inline'>[1, 2, 3, 1, 2, 3]</span>.", "Biến B sẽ lưu trữ một danh sách mới được gộp nối liên tiếp chứa đựng năm phần tử phân biệt là <span class='code-inline'>[1, 2, 3, 4, 5]</span>.", "Biến B sẽ phát sinh ra một thông báo lỗi cú pháp đỏ vì phần mềm Python không hỗ trợ toán tử cộng giữa các danh sách."], correct: 2 },
        { id: "1_24", type: "single", question: "Nếu bạn tạo lệnh <span class='code-inline'>A = [5, 6, 7]</span> và tiếp tục gọi lệnh chèn dữ liệu <span class='code-inline'>A.insert(10, 8)</span>, ngôn ngữ Python sẽ xử lí tình huống vượt quá khoảng chỉ số an toàn này theo phương pháp nào?", options: ["Ngôn ngữ Python sẽ tự động điều chỉnh chỉ số bị vượt quá này và chèn giá trị số 8 vào vị trí nằm ngay cuối cùng của danh sách.", "Ngôn ngữ Python sẽ tự động đóng băng cửa sổ dòng lệnh và yêu cầu người dùng phải gõ lại chỉ số bé hơn 3 để đảm bảo quy tắc.", "Ngôn ngữ Python sẽ tự động tạo ra hàng loạt các phần tử giá trị 0 chen vào giữa để độ dài danh sách đủ với chỉ số 10 vừa gọi.", "Ngôn ngữ Python sẽ tự động chèn giá trị số 8 vào vị trí đầu tiên của danh sách để phạt người dùng vì tội nhập sai vượt giới hạn."], correct: 0 },
        { id: '1_c1', type: 'tf_cluster', question: "Bạn Nam đang thiết kế lập trình một trò chơi giải đố nhỏ, trong đó yêu cầu người chơi phải gõ nhập mật khẩu cho đến khi điền đúng cụm từ <span class='code-inline'>\"MỞ CỬA\"</span> thì mới được đi tiếp qua màn. Nhận thấy số lần nhập bị sai của người chơi là không thể đoán trước, Nam quyết định sử dụng cấu trúc lặp <span class='code-inline'>while</span> để xử lí vòng lặp nhập liệu này.", subQuestions: [
            { id: '1_d25a', text: "Lệnh lặp <span class='code-inline'>while</span> trong Python là một cấu trúc điều khiển chuyên dụng được dùng để thực hiện các thao tác lặp đi lặp lại nhiều lần với số lần lặp hoàn toàn chưa thể biết trước.", correct: "Đúng" },
            { id: '1_d25b', text: "Biểu thức điều kiện đi kèm ngay sau từ khóa <span class='code-inline'>while</span> bắt buộc phải luôn luôn là một biểu thức có khả năng tính toán và trả về một trong hai giá trị logic là Đúng (<span class='code-inline'>True</span>) hoặc Sai (<span class='code-inline'>False</span>).", correct: "Đúng" },
            { id: '1_d25c', text: "Để chương trình trò chơi của Nam có thể chính thức thoát khỏi vòng lặp và đi tiếp qua màn, biểu thức kiểm tra mật khẩu đặt bên cạnh lệnh <span class='code-inline'>while</span> phải chuyển đổi sang trạng thái <span class='code-inline'>False</span>.", correct: "Đúng" },
            { id: '1_d25d', text: "Nếu Nam viết lệnh <span class='code-inline'>while mat_khau != \"MỞ CỬA\":</span> nhưng bên trong thân khối vòng lặp lại quên không đưa vào câu lệnh để người dùng nhập lại biến <span class='code-inline'>mat_khau</span>, chương trình sẽ lập tức báo lỗi cú pháp đỏ rực và tự động đóng phần mềm.", correct: "Sai" }
        ]},
        { id: '1_c2', type: 'tf_cluster', question: "Cô giáo môn Tin học yêu cầu bạn Lan tạo ra một biến danh sách nhằm mục đích lưu trữ điểm thi cuối kì của một nhóm các bạn học sinh trong lớp. Lan đã tiến hành gõ dòng lệnh khởi tạo danh sách trên màn hình như sau: <span class='code-inline'>DiemTin = [8.5, 9.0, 7.5, 10.0, 6.5]</span> và bạn ấy đang chuẩn bị viết thêm các lệnh để truy xuất bảng điểm này.", subQuestions: [
            { id: '1_d26a', text: "Kiểu dữ liệu danh sách (<span class='code-inline'>List</span>) trong ngôn ngữ Python cung cấp tính năng cho phép lập trình viên gom nhóm và lưu trữ nhiều giá trị dữ liệu liên tiếp nhau dưới cùng một tên định danh duy nhất.", correct: "Đúng" },
            { id: '1_d26b', text: "Mỗi một con số điểm thi được lưu trữ bên trong danh sách DiemTin đều được hệ thống máy tính tự động cấp cho một số chỉ mục vị trí (<span class='code-inline'>index</span>) phân biệt và luôn luôn bắt đầu đếm từ con số 1.", correct: "Sai" },
            { id: '1_d26c', text: "Khác biệt hoàn toàn so với các kiểu dữ liệu văn bản hay số nguyên truyền thống, kiểu dữ liệu danh sách mang đặc tính linh hoạt cho phép thay đổi được giá trị của từng phần tử bên trong sau khi tạo.", correct: "Đúng" },
            { id: '1_d26d', text: "Nếu như Lan tiếp tục gõ viết câu lệnh <span class='code-inline'>print(DiemTin[2] + DiemTin[4])</span> trên màn hình làm việc, hệ thống máy tính sẽ thực hiện phép toán cộng và trả về kết quả số thập phân chuẩn xác là 14.0.", correct: "Đúng" }
        ]},
        { id: '1_c3', type: 'tf_cluster', question: "Nhóm học tập của bạn Hùng đang xây dựng phần mềm quản lí thông tin thư viện mượn sách. Hùng ứng dụng một danh sách có tên biến là <span class='code-inline'>KhoSach = [\"Toán\", \"Lí\", \"Hóa\"]</span> nhằm mục đích lưu trữ tên các đầu sách môn học. Hùng đang tiến hành chạy thử nghiệm một số lệnh thêm và xóa phần tử để có thể cập nhật kho sách tự động.", subQuestions: [
            { id: '1_d27a', text: "Nhằm mục đích bổ sung thêm một cuốn sách môn \"Sinh\" vào vị trí nằm ở cuối cùng của danh sách thư viện hiện tại, Hùng cần phải gọi tên phương thức xử lí đặc biệt là <span class='code-inline'>append(\"Sinh\")</span>.", correct: "Đúng" },
            { id: '1_d27b', text: "Cấu trúc câu lệnh <span class='code-inline'>del KhoSach</span> khi được kết hợp với một chỉ số vị trí index cụ thể ở trong ngoặc vuông sẽ giúp Hùng có thể dễ dàng xóa bỏ vĩnh viễn bất kì một cuốn sách nào ra khỏi hệ thống.", correct: "Đúng" },
            { id: '1_d27c', text: "Nếu Hùng sử dụng phương thức lệnh <span class='code-inline'>KhoSach.insert(1, \"Văn\")</span>, cuốn sách \"Văn\" sẽ tự động được chèn vào vị trí chỉ số 1, đồng thời đẩy sách \"Lí\" và sách \"Hóa\" lùi lướt về phía sau một bậc.", correct: "Đúng" },
            { id: '1_d27d', text: "Nếu Hùng lập trình thực thi liên tiếp hai câu lệnh <span class='code-inline'>KhoSach.remove(\"Toán\")</span> và <span class='code-inline'>KhoSach.clear()</span>, hệ thống sẽ xử lí khiến cho danh sách kho sách lúc này sẽ còn lại duy nhất hai phần tử là \"Lí\" và \"Hóa\".", correct: "Sai" }
        ]},
        { id: '1_c4', type: 'tf_cluster', question: "Nhằm mục đích chuẩn bị cho buổi lễ sơ kết thi đua, bạn Mai được giao quản lí một danh sách lưu tên những bạn học sinh xuất sắc được nhận phần thưởng: <span class='code-inline'>KhenThuong = [\"An\", \"Bình\", \"Cường\"]</span>. Mai cần ứng dụng các công cụ lập trình cơ bản của ngôn ngữ Python để tiến hành thao tác kiểm tra tên người và tự động duyệt qua danh sách để in giấy khen.", subQuestions: [
            { id: '1_d28a', text: "Toán tử <span class='code-inline'>in</span> trong môi trường lập trình Python là một công cụ đặc biệt chuyên dụng được dùng để kiểm tra rà soát xem một giá trị cụ thể nào đó có nằm ở bên trong một danh sách cho trước hay không.", correct: "Đúng" },
            { id: '1_d28b', text: "Cấu trúc vòng lặp có dạng <span class='code-inline'>for i in range(len(KhenThuong)):</span> sẽ hỗ trợ duyệt qua các phần tử của danh sách bằng cơ chế kĩ thuật là tự động tạo ra một dãy số đếm chỉ mục (<span class='code-inline'>index</span>) chạy tương ứng.", correct: "Đúng" },
            { id: '1_d28c', text: "Câu lệnh kiểm tra logic <span class='code-inline'>\"Bình\" in KhenThuong</span> khi được chạy sẽ tiến hành so sánh đối chiếu dữ liệu văn bản và lập tức trả về kết quả thuộc kiểu dữ liệu boolean (logic) với giá trị cụ thể là <span class='code-inline'>True</span>.", correct: "Đúng" },
            { id: '1_d28d', text: "Để duyệt nhanh qua toàn bộ danh sách và in ra màn hình các dòng chữ khen ngợi, Mai viết lệnh <span class='code-inline'>for x in KhenThuong: print(x + \" giỏi quá\")</span>. Thao tác này sẽ bị hệ thống báo lỗi vì biến <span class='code-inline'>x</span> chỉ có thể nhận được giá trị là các con số chứ không nhận được xâu văn bản tên người.", correct: "Sai" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Kiểm Tra Thường Xuyên Đề 1 - Tin Học 10' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn câu hỏi và không trộn đáp án
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp điểm ưu tiên từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ in ra định dạng ngày tháng năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
