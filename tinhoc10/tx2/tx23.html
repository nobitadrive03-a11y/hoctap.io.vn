  <script>
    let database = null;
    let scoresRef = null;
    let currentIdx = 0;

    try {
        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Pos8awlh9j041qDWTPFRsVIjF-kPnk",
            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoctap-91691",
            storageBucket: "hoctap-91691.firebasestorage.app",
            messagingSenderId: "1004553425319",
            appId: "1:1004553425319:web:45d15cbae393f614c56682",
            measurementId: "G-Q6X1TL9PRV"
        };
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            scoresRef = database.ref('TinHoc10/tx2_De3');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('selectstart', event => {
        if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') { event.preventDefault(); }
    });
    document.addEventListener('dragstart', event => event.preventDefault()); 
    document.addEventListener('copy', event => {
        event.clipboardData.setData('text/plain', 'Tài liệu đã được bảo vệ!');
        event.preventDefault();
        window.handleCheatAction('Sao chép (Copy) văn bản');
    });

    // DỮ LIỆU ĐỀ THI MỚI (LỖI VÀ KIỂM THỬ) - CÓ BỌC CODE-INLINE VÀ CODE-BLOCK
    const de_data = [
        { id: "1_1", type: "single", question: "Trong quá trình lập trình bằng ngôn ngữ Python, khái niệm \"Lỗi cú pháp\" (<span class='code-inline'>Syntax Error</span>) được định nghĩa chính xác nhất theo cách diễn đạt nào dưới đây?", options: ["Lỗi cú pháp là tình trạng người lập trình viết sai quy tắc ngữ pháp của ngôn ngữ, khiến trình biên dịch không thể hiểu và chương trình hoàn toàn không thể khởi chạy.", "Lỗi cú pháp là tình trạng chương trình vẫn thực thi bình thường từ đầu đến cuối nhưng thuật toán sai lệch dẫn đến kết quả in ra màn hình không đúng với yêu cầu.", "Lỗi cú pháp là tình trạng chương trình đang chạy thì bất ngờ bị hệ điều hành tắt ép buộc do tiêu tốn quá nhiều dung lượng bộ nhớ RAM của máy tính cá nhân.", "Lỗi cú pháp là tình trạng người sử dụng phần mềm nhập sai định dạng dữ liệu từ bàn phím, khiến máy tính phát ra tiếng bíp cảnh báo và yêu cầu gõ lại từ đầu."], correct: 0 },
        { id: "1_2", type: "single", question: "Lập trình viên sẽ đối mặt với thông báo lỗi ngoại lệ <span class='code-inline'>\"ZeroDivisionError\"</span> trên màn hình làm việc của phần mềm Python khi tiến hành thực thi thao tác toán học nào?", options: ["Khi lập trình viên cố tình thực hiện phép toán cộng dồn một số nguyên dương với một xâu kí tự văn bản mà không tiến hành ép kiểu dữ liệu đồng nhất.", "Khi lập trình viên cố tình thực hiện phép toán chia một số thực hoặc một số nguyên bất kì cho con số không (0) trong quá trình tính toán biểu thức.", "Khi lập trình viên cố tình gọi đến một biến số đếm chưa hề được khai báo và khởi tạo giá trị ban đầu ở các dòng lệnh phía trên của chương trình.", "Khi lập trình viên cố tình mở một tệp tin văn bản không tồn tại trên ổ cứng máy tính để tiến hành đọc và trích xuất dữ liệu vào trong bộ nhớ tạm."], correct: 1 },
        { id: "1_3", type: "single", question: "Cho đoạn mã sau: <span class='code-inline'>DanhSach = [10, 20, 30]</span>. Nếu hệ thống thực thi câu lệnh <span class='code-inline'>print(DanhSach[5])</span>, phần mềm Python sẽ phát sinh ra loại lỗi ngoại lệ đặc trưng nào?", options: ["Hệ thống sẽ phát sinh lỗi ngoại lệ <span class='code-inline'>ValueError</span> vì giá trị số 5 không hề tồn tại bên trong nội dung các phần tử của cấu trúc mảng danh sách hiện hành.", "Hệ thống sẽ phát sinh lỗi ngoại lệ <span class='code-inline'>TypeError</span> vì lập trình viên đang cố gắng truy cập chỉ số phần tử bằng một con số nguyên thay vì một xâu kí tự.", "Hệ thống sẽ phát sinh lỗi ngoại lệ <span class='code-inline'>IndexError</span> vì lập trình viên đang cố gắng truy cập vào một vị trí chỉ số nằm hoàn toàn ngoài phạm vi của danh sách.", "Hệ thống sẽ phát sinh lỗi ngoại lệ <span class='code-inline'>NameError</span> vì tên biến danh sách đã bị lập trình viên gõ sai chính tả so với từ khóa gốc do hệ điều hành quy định."], correct: 2 },
        { id: "1_4", type: "single", question: "Trong kĩ thuật lập trình máy tính, \"Lỗi ngữ nghĩa\" (Lỗi logic / <span class='code-inline'>Semantic Error</span>) được đánh giá là loại lỗi nguy hiểm và khó phát hiện nhất vì nguyên nhân cơ bản nào?", options: ["Vì chương trình vẫn dịch thuật thành công và chạy mượt mà không hề báo ra bất kì dòng lỗi đỏ nào, nhưng kết quả tính toán cuối cùng lại hoàn toàn sai lệch.", "Vì chương trình sẽ tự động lây nhiễm virus vào hệ thống hệ điều hành Windows mỗi khi người dùng cố gắng mở mã nguồn lên để tiến hành rà soát sửa chữa.", "Vì chương trình yêu cầu lập trình viên phải có chứng chỉ tin học quốc tế cấp cao thì phần mềm mới cho phép kích hoạt công cụ gỡ lỗi dò tìm nguyên nhân.", "Vì chương trình sẽ tự động mã hóa toàn bộ dữ liệu ổ cứng thành những kí tự hình học kì lạ khiến lập trình viên không thể đọc hiểu được cấu trúc mã lệnh."], correct: 0 },
        { id: "1_5", type: "single", question: "Chức năng cốt lõi của công việc \"Kiểm thử chương trình\" (<span class='code-inline'>Testing</span>) trong quy trình kĩ thuật phát triển phần mềm ứng dụng chuyên nghiệp là gì?", options: ["Là quá trình viết lại toàn bộ mã nguồn của phần mềm bằng một ngôn ngữ lập trình khác hiện đại hơn nhằm tăng tốc độ xử lí dữ liệu đa luồng.", "Là quá trình chạy thử nghiệm chương trình với nhiều bộ dữ liệu đầu vào khác nhau nhằm mục đích phát hiện ra các lỗi ẩn giấu bên trong hệ thống.", "Là quá trình thiết kế giao diện đồ họa đa sắc màu cho phần mềm để thu hút thêm nhiều người dùng tải về cài đặt trên điện thoại thông minh.", "Là quá trình đóng gói phần mềm thành tệp tin cài đặt và tự động đăng tải lên các kho ứng dụng trực tuyến để tiến hành kinh doanh thương mại."], correct: 1 },
        { id: "1_6", type: "single", question: "Khi thực hiện ép kiểu dữ liệu bằng câu lệnh <span class='code-inline'>SoTuoi = int(\"Mười Tám\")</span>, trình thông dịch của Python sẽ xử lí và phản hồi lại kết quả kĩ thuật như thế nào?", options: ["Trình thông dịch sẽ tự động hiểu nghĩa của cụm từ tiếng Việt và gán giá trị số nguyên 18 vào cho biến SoTuoi một cách vô cùng thông minh.", "Trình thông dịch sẽ tự động loại bỏ các chữ cái và gán giá trị số nguyên 0 vào cho biến SoTuoi để đảm bảo chương trình không bị gián đoạn.", "Trình thông dịch sẽ lập tức dừng chạy và ném ra thông báo lỗi ngoại lệ <span class='code-inline'>ValueError</span> vì không thể chuyển đổi xâu kí tự chữ cái thành số nguyên.", "Trình thông dịch sẽ lập tức dừng chạy và ném ra thông báo lỗi ngoại lệ <span class='code-inline'>SyntaxError</span> vì thiếu dấu hai chấm ở cuối câu lệnh khai báo biến số."], correct: 2 },
        { id: "1_7", type: "single", question: "Thuật ngữ \"Gỡ lỗi\" (<span class='code-inline'>Debugging</span>) mang ý nghĩa kĩ thuật chuyên ngành nào đối với các kĩ sư công nghệ thông tin trong quá trình xây dựng hệ thống mã nguồn?", options: ["Gỡ lỗi là quá trình xóa bỏ đi toàn bộ các đoạn mã lệnh chú thích (comment) để giảm thiểu tối đa mức dung lượng lưu trữ của tệp tin dự án phần mềm.", "Gỡ lỗi là quá trình xác định chính xác vị trí nguyên nhân gây ra lỗi bên trong mã nguồn, sau đó tiến hành sửa chữa để chương trình hoạt động đúng.", "Gỡ lỗi là quá trình tự động cập nhật hệ điều hành máy tính cá nhân lên phiên bản mới nhất để tương thích với nền tảng phần mềm đang được lập trình.", "Gỡ lỗi là quá trình dịch thuật toàn bộ các thông báo cảnh báo lỗi từ ngôn ngữ tiếng Anh sang ngôn ngữ tiếng Việt để người dùng phổ thông dễ đọc."], correct: 1 },
        { id: "1_8", type: "single", question: "Bộ dữ liệu kiểm thử (<span class='code-inline'>Test case</span>) được các lập trình viên xây dựng chuẩn mực và khoa học bắt buộc phải bao gồm những thành phần dữ liệu cốt lõi nào?", options: ["Bắt buộc phải bao gồm một bộ dữ liệu đầu vào (Input) đặc thù và một kết quả đầu ra dự kiến (Expected Output) tương ứng để tiện việc đối chiếu đối chứng.", "Bắt buộc phải bao gồm toàn bộ lịch sử các lần bấm phím của người sử dụng máy tính trong khoảng thời gian phần mềm đang được khởi chạy thử nghiệm.", "Bắt buộc phải bao gồm số hiệu địa chỉ mạng IP của máy chủ cơ sở dữ liệu cùng với mật khẩu quản trị viên cấp cao nhất để phần mềm tự động đăng nhập.", "Bắt buộc phải bao gồm cấu hình chi tiết về phần cứng máy tính như dung lượng ổ cứng, dung lượng ram và tốc độ vi xử lí hiện tại của kĩ sư lập trình."], correct: 0 },
        { id: "1_9", type: "single", question: "Trong Python, thao tác nào dưới đây chắc chắn sẽ làm phát sinh ra lỗi ngoại lệ <span class='code-inline'>\"TypeError\"</span> ngay lập tức trên màn hình giao diện cửa sổ dòng lệnh?", options: ["Thao tác gọi và sử dụng hàm tính độ dài <span class='code-inline'>len()</span> để đo đếm số lượng các kí tự đang có mặt bên trong một biến mang kiểu dữ liệu xâu văn bản (str).", "Thao tác thực hiện phép toán cộng (<span class='code-inline'>+</span>) nhằm mục đích ghép nối trực tiếp một biến chứa dữ liệu số nguyên (int) với một biến chứa dữ liệu xâu kí tự (str).", "Thao tác khởi tạo một biến danh sách (<span class='code-inline'>list</span>) hoàn toàn rỗng không chứa bất kì một phần tử nào ở bên trong cặp dấu ngoặc vuông theo chuẩn cú pháp.", "Thao tác thực hiện vòng lặp <span class='code-inline'>while</span> với biểu thức điều kiện luôn luôn mang giá trị <span class='code-inline'>True</span> mà không có bất kì câu lệnh ngắt break nào ở bên trong."], correct: 1 },
        { id: "1_10", type: "single", question: "Lỗi ngoại lệ <span class='code-inline'>\"NameError\"</span> thường xuyên xuất hiện làm gián đoạn tiến trình chạy của phần mềm máy tính trong trường hợp phổ biến nào sau đây?", options: ["Trong trường hợp lập trình viên đang cố gắng truy cập sử dụng hoặc in ra màn hình một tên biến chưa từng được khởi tạo giá trị ở bất kì đâu trước đó.", "Trong trường hợp lập trình viên gõ sai quy tắc thụt lề đầu dòng (indentation) của ngôn ngữ Python khi tiến hành định nghĩa cấu trúc của một khối lệnh.", "Trong trường hợp lập trình viên đang cố gắng chèn thêm một phần tử mang giá trị chữ cái vào bên trong một danh sách chỉ chuyên chứa đựng số nguyên.", "Trong trường hợp lập trình viên mở quá nhiều cửa sổ phần mềm cùng một lúc khiến cho hệ thống máy tính bị tràn bộ nhớ và không thể nhận diện tên tệp."], correct: 0 },
        { id: "1_11", type: "single", question: "Phương pháp sử dụng câu lệnh <span class='code-inline'>print()</span> để tiến hành rà soát lỗi (<span class='code-inline'>Print Debugging</span>) trong mã nguồn hoạt động dựa trên nguyên lí kĩ thuật cơ bản nào?", options: ["Phương pháp này yêu cầu lập trình viên ra lệnh in toàn bộ mã nguồn của chương trình lên trên các trang giấy A4 để có thể dùng bút đỏ gạch chân tìm lỗi.", "Phương pháp này yêu cầu lập trình viên chèn các lệnh in giá trị biến ra màn hình tại nhiều vị trí khác nhau để dễ dàng theo dõi sự biến đổi của dòng dữ liệu.", "Phương pháp này yêu cầu lập trình viên thiết lập tự động in gửi thông báo lỗi qua hộp thư điện tử email cho đội ngũ hỗ trợ kĩ thuật của hệ điều hành Windows.", "Phương pháp này yêu cầu lập trình viên chỉ định máy in tự động khởi động và in ra một tờ giấy xác nhận thành công mỗi khi phần mềm vượt qua một vòng lặp."], correct: 1 },
        { id: "1_12", type: "single", question: "Để thiết kế một bộ dữ liệu kiểm thử (test case) đánh giá hàm <span class='code-inline'>KiemTraSoChan(n)</span>, ta cần chọn những con số đầu vào (Input) nào để mang lại độ bao phủ tốt nhất?", options: ["Cần lựa chọn đầu vào là hàng loạt các con số nguyên dương có giá trị cực kì lớn (ví dụ hàng tỉ) để kiểm tra xem hệ thống máy tính có bị quá tải hay không.", "Cần lựa chọn đầu vào là các xâu kí tự văn bản chứa tên người dùng để hệ thống báo lỗi nhằm kiểm tra khả năng bắt lỗi ngoại lệ của hàm máy tính đó.", "Cần lựa chọn đầu vào bao gồm cả số chẵn điển hình, số lẻ điển hình, số không (0) và số âm để kiểm tra toàn diện tính đúng đắn của logic thuật toán.", "Cần lựa chọn đầu vào là những con số thập phân có chứa rất nhiều chữ số ở đằng sau dấu phẩy nhằm kiểm tra độ chính xác của phép chia lấy phần dư."], correct: 2 },
        { id: "1_13", type: "single", question: "Trong các môi trường phát triển tích hợp (IDE) hiện đại, tính năng \"Đặt điểm dừng\" (<span class='code-inline'>Set Breakpoint</span>) cung cấp cho kĩ sư lập trình quyền năng kiểm soát nào?", options: ["Cung cấp quyền năng ép buộc chương trình phải chạy lặp đi lặp lại một khối lệnh duy nhất cho đến khi ổ cứng máy tính bị lấp đầy bởi các tập tin rác.", "Cung cấp quyền năng thiết lập chương trình tạm dừng thực thi ngay tại một dòng lệnh cụ thể để lập trình viên có thể kiểm tra kĩ lưỡng giá trị các biến số.", "Cung cấp quyền năng tự động phát hiện và xóa bỏ tất cả các dòng mã lệnh bị viết sai cú pháp ngôn ngữ mà không cần phải hỏi ý kiến của kĩ sư lập trình.", "Cung cấp quyền năng tự động chia nhỏ phần mềm thành nhiều tệp tin con riêng biệt để dễ dàng chia sẻ cho những người dùng khác thông qua mạng wifi."], correct: 1 },
        { id: "1_14", type: "single", question: "Khẳng định nào sau đây phản ánh đúng nhất tính chất của lỗi cú pháp (<span class='code-inline'>Syntax Error</span>) khi đem ra so sánh với lỗi ngữ nghĩa (<span class='code-inline'>Semantic Error</span>) trong lập trình?", options: ["Lỗi cú pháp rất khó để phát hiện vì hệ thống không báo lỗi rõ ràng, trong khi đó lỗi ngữ nghĩa lại được trình biên dịch chỉ điểm chính xác từng dòng sai.", "Lỗi cú pháp luôn luôn tự động biến mất khi người dùng khởi động lại máy tính, trong khi đó lỗi ngữ nghĩa thì sẽ tồn tại vĩnh viễn bên trong mã nguồn gốc.", "Lỗi cú pháp được hệ thống cảnh báo ngay lập tức và chặn không cho chạy mã, trong khi lỗi ngữ nghĩa để chương trình chạy bình thường nhưng ra kết quả sai.", "Lỗi cú pháp chỉ xuất hiện trên hệ điều hành MacOS của Apple, trong khi đó lỗi ngữ nghĩa thì lại chỉ có thể được tìm thấy trên hệ điều hành Windows của Microsoft."], correct: 2 },
        { id: "1_15", type: "single", question: "Giả sử đoạn mã: <span class='code-inline'>for i in range(5): print(i)</span> bị gõ thiếu dấu hai chấm <span class='code-inline'>:</span> ở phần cuối của dòng lệnh <span class='code-inline'>for</span>. Trình thông dịch Python sẽ ném ra thông báo lỗi gì?", options: ["Trình thông dịch sẽ ném ra thông báo lỗi <span class='code-inline'>NameError</span> vì nó không thể hiểu được biến i đại diện cho tên gọi của một hàm số toán học nào bên trong bộ nhớ.", "Trình thông dịch sẽ ném ra thông báo lỗi <span class='code-inline'>SyntaxError</span> vì đoạn mã lệnh đã vi phạm nghiêm trọng quy tắc ngữ pháp cấu trúc điều khiển của ngôn ngữ lập trình.", "Trình thông dịch sẽ ném ra thông báo lỗi <span class='code-inline'>ValueError</span> vì con số 5 được truyền vào bên trong hàm range() có giá trị quá lớn so với mức cho phép của hệ thống.", "Trình thông dịch sẽ ném ra thông báo lỗi <span class='code-inline'>IndexError</span> vì lệnh in print(i) đang cố gắng truy cập vào một vị trí chỉ mục không tồn tại bên trong danh sách ảo."], correct: 1 },
        { id: "1_16", type: "single", question: "Cho đoạn mã: <div class='code-block'>A = 10<br>B = \"5\"<br>Tong = A + B</div> Theo nguyên tắc kĩ thuật phân tích lỗi, để khắc phục triệt để lỗi <span class='code-inline'>\"TypeError\"</span> trong tình huống này, ta phải làm gì?", options: ["Ta phải tiến hành cập nhật hệ điều hành máy tính lên phiên bản mới nhất để Python có thể tự động hiểu và cộng trực tiếp số nguyên với xâu kí tự văn bản.", "Ta phải bổ sung thao tác ép kiểu dữ liệu đồng nhất bằng cách sửa lệnh thành <span class='code-inline'>Tong = A + int(B)</span> hoặc <span class='code-inline'>Tong = str(A) + B</span> tùy thuộc vào mục đích sử dụng.", "Ta phải tiến hành đổi tên biến Tong thành một tên gọi khác viết bằng ngôn ngữ tiếng Anh vì Python không cho phép sử dụng từ vựng mang ngữ nghĩa tiếng Việt.", "Ta phải xóa bỏ hoàn toàn biến B ra khỏi hệ thống bộ nhớ và chỉ cho phép máy tính thực hiện phép toán cộng dồn trên cùng một biến số nguyên duy nhất là A."], correct: 1 },
        { id: "1_17", type: "single", question: "Lỗi thụt lề đầu dòng (<span class='code-inline'>IndentationError</span>) thường xuyên khiến người mới học lập trình bối rối. Trong ngôn ngữ Python, việc thụt lề đóng vai trò cốt lõi như thế nào?", options: ["Thụt lề được sử dụng nhằm mục đích làm cho đoạn mã nguồn trở nên có tính thẩm mĩ cao hơn và dễ dàng in ấn ra giấy A4 thành các tài liệu báo cáo đẹp mắt.", "Thụt lề được sử dụng nhằm mục đích báo hiệu cho hệ thống biết rằng đoạn lệnh này thuộc quyền sở hữu trí tuệ của một lập trình viên khác trên mạng internet.", "Thụt lề là một quy tắc ngữ pháp bắt buộc được dùng để xác định phạm vi của các khối lệnh (như khối lệnh của vòng lặp, khối lệnh của hàm, khối lệnh rẽ nhánh).", "Thụt lề là một tùy chọn mở rộng giúp mã hóa bảo mật các dòng lệnh quan trọng không bị các phần mềm gián điệp của tin tặc trích xuất và đánh cắp thông tin."], correct: 2 },
        { id: "1_18", type: "single", question: "Công cụ \"Chạy từng bước\" (<span class='code-inline'>Step Over / Step Into</span>) trong một phần mềm gỡ lỗi (<span class='code-inline'>Debugger</span>) mang lại tính năng chuyên biệt nào hỗ trợ cho kĩ sư lập trình?", options: ["Tính năng này cho phép phần mềm tự động bỏ qua toàn bộ những dòng lệnh bị viết sai cú pháp để tiến thẳng đến kết quả tính toán hiển thị ở phía cuối cùng.", "Tính năng này cho phép chương trình chạy với tốc độ cực nhanh (gấp nhiều lần bình thường) nhằm đo lường hiệu suất hoạt động tối đa của phần cứng CPU.", "Tính năng này cho phép thực thi mã nguồn tuần tự chậm rãi qua từng dòng lệnh một, giúp kĩ sư dễ dàng quan sát được luồng xử lí logic và sự thay đổi dữ liệu.", "Tính năng này cho phép người sử dụng đảo ngược lại toàn bộ quá trình thực thi của máy tính để khôi phục lại những tệp tin vô tình bị xóa khỏi thùng rác."], correct: 2 },
        { id: "1_19", type: "single", question: "Đoạn chương trình: <div class='code-block'>def TinhThuong(a, b):<br>&nbsp;&nbsp;&nbsp;&nbsp;return a / b</div> Nếu thiết kế một bộ dữ liệu kiểm thử với Input là <span class='code-inline'>a = 10, b = 0</span>, kết quả dự đoán nhận được sẽ là gì?", options: ["Hàm sẽ trả về giá trị số nguyên bằng 0 một cách an toàn vì hệ thống tự động coi mọi phép chia cho con số không đều mang kết quả là sự không tồn tại.", "Hàm sẽ trả về một thông báo lỗi cú pháp (SyntaxError) yêu cầu lập trình viên phải tiến hành viết lại toàn bộ cấu trúc của hàm bằng các lệnh vòng lặp.", "Hàm sẽ trả về giá trị vô cùng lớn (Infinity) dưới dạng một kí hiệu toán học đặc biệt và tiếp tục chạy mượt mà các dòng lệnh tính toán ở phía bên dưới.", "Hàm sẽ lập tức bị gián đoạn tiến trình chạy và ném ra một ngoại lệ phân chia cho không (<span class='code-inline'>ZeroDivisionError</span>) khiến phần mềm báo lỗi và buộc phải dừng lại."], correct: 3 },
        { id: "1_20", type: "single", question: "Lập trình viên đang thao tác vòng lặp <span class='code-inline'>while True:</span> nhưng quên thiết lập lệnh <span class='code-inline'>break</span>. Khi chương trình rơi vào trạng thái lặp vô tận, người dùng có thể áp dụng tổ hợp phím tắt nào trên cửa sổ Terminal để cưỡng chế dừng lại?", options: ["Người dùng có thể nhấn tổ hợp phím tắt <span class='code-inline'>Ctrl + C</span> trên bàn phím để gửi tín hiệu ngắt (KeyboardInterrupt) nhằm cưỡng chế chương trình dừng chạy lập tức.", "Người dùng có thể nhấn tổ hợp phím tắt <span class='code-inline'>Ctrl + S</span> trên bàn phím để gửi tín hiệu lưu trữ dự phòng nhằm bảo vệ toàn bộ cấu trúc cơ sở dữ liệu hiện đang mở.", "Người dùng có thể nhấn tổ hợp phím tắt <span class='code-inline'>Ctrl + P</span> trên bàn phím để kích hoạt tự động hệ thống máy in giấy nhằm lưu lại toàn bộ các cảnh báo lỗi trên màn hình.", "Người dùng có thể nhấn tổ hợp phím tắt <span class='code-inline'>Alt + Tab</span> trên bàn phím để tự động chuyển đổi ngôn ngữ của phần mềm sang một hệ thống mã hóa hoàn toàn mới."], correct: 0 },
        { id: "1_21", type: "single", question: "Tình huống chương trình quản lí kho hàng in ra màn hình <span class='code-inline'>\"Tổng số lượng hàng tồn kho là -5\"</span> thay vì báo lỗi. Phân tích kĩ thuật cho thấy đoạn mã đã mắc phải loại lỗi gì?", options: ["Đây chắc chắn là lỗi ngoại lệ kiểu dữ liệu (<span class='code-inline'>TypeError</span>) vì hệ thống đã tự động chuyển đổi số lượng hàng hóa thành các giá trị văn bản âm không hợp lệ.", "Đây chắc chắn là lỗi cú pháp (<span class='code-inline'>SyntaxError</span>) vì lập trình viên đã đặt dấu trừ ngay phía trước tên biến khiến cho trình biên dịch hoàn toàn không thể dịch được.", "Đây chắc chắn là lỗi ngữ nghĩa (<span class='code-inline'>Lỗi logic</span>) vì chương trình vẫn chạy ra kết quả nhưng công thức tính toán lượng tồn kho đã bị thiết lập sai về mặt toán học.", "Đây chắc chắn là lỗi tràn bộ nhớ (<span class='code-inline'>MemoryError</span>) vì số lượng hàng hóa trong kho đã vượt quá giới hạn lưu trữ tối đa của ổ cứng máy chủ cơ sở dữ liệu gốc."], correct: 2 },
        { id: "1_22", type: "single", question: "Khi thiết kế các trường hợp ngoại lệ trong lập trình Python, khối lệnh <span class='code-inline'>try... except...</span> được ứng dụng nhằm thực thi chiến lược quản trị rủi ro nào cho hệ thống?", options: ["Chiến lược ép buộc trình biên dịch phải bỏ qua việc kiểm tra cú pháp đối với toàn bộ các câu lệnh được đặt bên trong khối try để tăng tốc độ khởi chạy.", "Chiến lược cho phép mã nguồn chạy thử trong khối try, nếu phát sinh lỗi ngoại lệ thì sẽ không bị văng phần mềm mà chuyển sang khối except để xử lí êm ái.", "Chiến lược tự động xóa bỏ toàn bộ các tệp tin chứa mã nguồn độc hại nếu như phần mềm phát hiện có tin tặc đang cố gắng xâm nhập vào bên trong máy chủ.", "Chiến lược tạo ra một vòng lặp vô hạn liên tục khởi động lại hệ điều hành Windows mỗi khi người dùng máy tính nhập sai mật khẩu đăng nhập quá ba lần."], correct: 1 },
        { id: "1_23", type: "single", question: "Việc sử dụng một danh sách các tham số giả định <span class='code-inline'>[1, \"Hai\", 3.0, [4]]</span> làm bộ test case (dữ liệu kiểm thử) cho một hàm chuyên dùng để tính tổng các số nguyên nhằm mục đích gì?", options: ["Nhằm mục đích ép buộc hàm tính tổng đó phải tự động chuyển đổi thành một hàm nối chuỗi văn bản để tạo ra kết quả hiển thị trên màn hình là \"1Hai3.0[4]\".", "Nhằm mục đích chứng minh rằng ngôn ngữ lập trình Python có khả năng tính toán cộng gộp được tất cả các kiểu dữ liệu lại với nhau mà không hề gặp khó khăn.", "Nhằm mục đích kiểm tra xem cấu trúc mã nguồn của hàm có khả năng nhận diện ngoại lệ và bắt lỗi (<span class='code-inline'>TypeError</span>) khi người dùng cố tình nhập dữ liệu sai chuẩn hay không.", "Nhằm mục đích tự động mã hóa toàn bộ dữ liệu trong bộ nhớ thành những kí tự vô nghĩa để bảo vệ phần mềm khỏi nguy cơ bị sao chép trộm bản quyền thương mại."], correct: 2 },
        { id: "1_24", type: "single", question: "Khái niệm \"Vết chương trình\" (<span class='code-inline'>Traceback</span>) xuất hiện trên màn hình console khi một phần mềm Python bị crash (sụp đổ) mang lại thông tin hữu ích nào cho nhà phát triển?", options: ["Traceback hiển thị toàn bộ lịch sử các trang web mà người sử dụng máy tính vừa mới truy cập vào trước khi phần mềm bị lỗi để giúp tìm ra nguyên nhân lây nhiễm virus.", "Traceback hiển thị một danh sách liệt kê chi tiết thứ tự các lệnh gọi hàm đã diễn ra, chỉ dẫn chính xác tên tệp và số dòng mã cụ thể nơi xảy ra lỗi sự cố.", "Traceback hiển thị danh sách các thiết bị phần cứng đang kết nối với máy tính và đưa ra đề xuất yêu cầu người dùng phải thay mới linh kiện nào bị hỏng hóc.", "Traceback hiển thị toàn bộ mật khẩu và thông tin tài khoản ngân hàng của người lập trình viên để cảnh báo nguy cơ bị lộ dữ liệu riêng tư ra ngoài môi trường mạng."], correct: 1 },
        
        { id: '1_c1', type: 'tf_cluster', question: "Bạn An đang viết một chương trình Python để tính toán chỉ số khối cơ thể (BMI) của một người dựa trên thông tin chiều cao và cân nặng được nhập từ bàn phím. Đoạn mã của An như sau:<div class='code-block'>CanNang = input(\"Nhập cân nặng (kg): \")<br>ChieuCao = input(\"Nhập chiều cao (m): \")<br>BMI = CanNang / (ChieuCao * ChieuCao)<br>print(\"Chỉ số BMI của bạn là:\", BMI)</div>Khi chạy thử chương trình, An nhập cân nặng là 60 và chiều cao là 1.6, nhưng hệ thống lập tức ném ra thông báo lỗi ngoại lệ màu đỏ trên màn hình thay vì in kết quả.", subQuestions: [
            { id: '1_d25a', text: "Câu lệnh <span class='code-inline'>input()</span> trong Python mặc định luôn luôn tiếp nhận và trả về dữ liệu dưới dạng kiểu xâu kí tự văn bản (<span class='code-inline'>str</span>) bất chấp người dùng gõ vào các con số.", correct: "Đúng" },
            { id: '1_d25b', text: "Dòng lệnh tính toán <span class='code-inline'>BMI = CanNang / (ChieuCao - ChieuCao)</span> sẽ phát sinh ra lỗi ngoại lệ <span class='code-inline'>TypeError</span> do ngôn ngữ Python không cho phép thực hiện phép chia trực tiếp trên các xâu kí tự.", correct: "Sai" },
            { id: '1_d25c', text: "Lỗi mà bạn An gặp phải thuộc nhóm Lỗi ngữ nghĩa (<span class='code-inline'>Semantic Error</span>) vì chương trình vẫn ra được kết quả nhưng con số BMI tính ra lại bị sai lệch hoàn toàn so với công thức chuẩn.", correct: "Sai" },
            { id: '1_d25d', text: "Để khắc phục triệt để sự cố trên và làm cho phần mềm hoạt động đúng, An bắt buộc phải bổ sung thêm các lệnh ép kiểu dữ liệu thành số thực (<span class='code-inline'>float</span>) bao bọc xung quanh lệnh <span class='code-inline'>input()</span>.", correct: "Đúng" }
        ]},
        { id: '1_c2', type: 'tf_cluster', question: "Nhóm của Mai được giao nhiệm vụ kiểm thử một hàm tìm kiếm giá trị lớn nhất trong một danh sách có tên là <span class='code-inline'>TimMax(DanhSach)</span>. Khối mã nguồn của hàm được thiết kế với mục tiêu luôn trả về phần tử có giá trị lớn nhất, nhưng hiện tại Mai phát hiện ra một số trường hợp hàm hoạt động không như mong muốn. Bộ dữ liệu kiểm thử (Test cases) mà Mai chuẩn bị bao gồm:<br>- Test 1: <span class='code-inline'>DanhSach = [1, 5, 3]</span> -> Kết quả mong muốn: 5<br>- Test 2: <span class='code-inline'>DanhSach = [-10, -5, -20]</span> -> Kết quả mong muốn: -5<br>- Test 3: <span class='code-inline'>DanhSach = []</span> -> Kết quả mong muốn: Báo lỗi", subQuestions: [
            { id: '1_d26a', text: "Việc Mai xây dựng các bộ dữ liệu kiểm thử (Test cases) bao gồm cả danh sách số dương, danh sách số âm và danh sách rỗng là một chiến lược kiểm thử phần mềm vô cùng khoa học và toàn diện.", correct: "Đúng" },
            { id: '1_d26b', text: "Nếu hàm <span class='code-inline'>TimMax()</span> được lập trình viên thiết lập một biến tạm lưu giá trị lớn nhất ban đầu là <span class='code-inline'>Max = 0</span>, thì khi chạy Test 2, kết quả hàm trả về sẽ bị sai lệch hoàn toàn do kết quả đầu ra sẽ là 0.", correct: "Đúng" },
            { id: '1_d26c', text: "Lỗi thuật toán khiến hàm trả về kết quả 0 trong Test 2 (như mô tả ở ý b) được phân loại kĩ thuật vào nhóm \"Lỗi cú pháp\" do máy tính không hiểu cách so sánh số âm.", correct: "Sai" },
            { id: '1_d26d', text: "Khi Mai truyền Test 3 (danh sách rỗng) vào hàm và nếu hàm cố gắng lấy phần tử đầu tiên <span class='code-inline'>DanhSach[0]</span> ra để khởi tạo giá trị so sánh, hệ thống chắc chắn sẽ phát sinh ngoại lệ <span class='code-inline'>IndexError</span>.", correct: "Đúng" }
        ]},
        { id: '1_c3', type: 'tf_cluster', question: "Trong một buổi thực hành lập trình, bạn Dũng đang cố gắng tìm ra nguyên nhân tại sao vòng lặp tính tổng các số chẵn của mình lại chạy mãi không chịu dừng lại. Đoạn mã của Dũng như sau:<div class='code-block'>Tong = 0<br>N = 1<br>while N <= 10:<br>&nbsp;&nbsp;&nbsp;&nbsp;if N % 2 == 0:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Tong = Tong + N<br>print(\"Tổng là:\", Tong)</div>Dũng quyết định sử dụng kĩ thuật \"Print Debugging\" (Gỡ lỗi bằng lệnh in) để theo dõi dòng chảy của dữ liệu bên trong vòng lặp.", subQuestions: [
            { id: '1_d27a', text: "Đoạn mã trên của Dũng bị mắc phải Lỗi logic nghiêm trọng dẫn đến vòng lặp vô hạn (Infinite Loop) do biến đếm <span class='code-inline'>N</span> không hề được gia tăng giá trị trong thân khối lặp.", correct: "Đúng" },
            { id: '1_d27b', text: "Để gỡ lỗi bằng kĩ thuật Print Debugging, Dũng nên chèn một câu lệnh <span class='code-inline'>print(\"Giá trị N hiện tại:\", N)</span> vào ngay phía dưới dòng <span class='code-inline'>while N <= 10:</span> để quan sát sự thay đổi của biến đếm.", correct: "Đúng" },
            { id: '1_d27c', text: "Khi chương trình bị kẹt trong vòng lặp vô tận, Dũng có thể sử dụng tổ hợp phím tắt <span class='code-inline'>Ctrl + C</span> trên màn hình dòng lệnh Console để ra lệnh cưỡng chế hệ thống ngắt tiến trình (KeyboardInterrupt).", correct: "Đúng" },
            { id: '1_d27d', text: "Nếu Dũng cài đặt thêm dòng lệnh <span class='code-inline'>N = N + 1</span> nhưng lại vô tình để nó nằm thụt lề vào bên trong nhánh điều kiện <span class='code-inline'>if N % 2 == 0:</span>, chương trình sẽ tự động khắc phục và chạy hoàn toàn chính xác.", correct: "Sai" }
        ]},
        { id: '1_c4', type: 'tf_cluster', question: "Cô giáo môn Tin học đưa ra một đoạn chương trình Python để tính và in ra màn hình các phần tử thỏa mãn điều kiện, đồng thời yêu cầu học sinh dùng công cụ gỡ lỗi (Debugger) có sẵn trong môi trường lập trình để đặt \"Điểm dừng\" (Breakpoint) tại dòng lệnh số 3.<div class='code-block'>1. A = [2, 4, 6, 8]<br>2. for i in range(5):<br>3.&nbsp;&nbsp;&nbsp;&nbsp;print(A[i])</div>Học sinh Hùng tiến hành chạy chương trình trong chế độ Debug và liên tục ấn nút \"Step Over\" (Chạy từng bước) để quan sát kết quả hiện ra.", subQuestions: [
            { id: '1_d28a', text: "Chức năng \"Đặt điểm dừng\" (Breakpoint) tại dòng số 3 cho phép phần mềm thực thi tự do các lệnh ở dòng 1 và 2, sau đó sẽ tạm thời đứng khựng lại trước khi in kết quả ra màn hình.", correct: "Đúng" },
            { id: '1_d28b', text: "Khi quá trình vòng lặp <span class='code-inline'>for</span> chạy đến giá trị chỉ mục <span class='code-inline'>i = 4</span>, câu lệnh tại dòng số 3 sẽ phát sinh ra lỗi ngoại lệ <span class='code-inline'>NameError</span> do tên biến danh sách A chưa từng được khai báo.", correct: "Sai" },
            { id: '1_d28c', text: "Việc phần mềm ném ra lỗi ngoại lệ khi <span class='code-inline'>i = 4</span> là hoàn toàn chính xác vì lập trình viên đang cố gắng truy cập vào vị trí phần tử thứ năm trong một mảng danh sách vốn dĩ chỉ có bốn phần tử.", correct: "Đúng" },
            { id: '1_d28d', text: "Công cụ gỡ lỗi Debugger là một công cụ tối quan trọng giúp các kĩ sư phần mềm soi chiếu được nội dung bộ nhớ RAM và trạng thái các biến số ở từng mili-giây cụ thể của chương trình.", correct: "Đúng" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Kiểm Tra Thường Xuyên Đề 3 - Tin Học 10' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn câu hỏi và không trộn đáp án
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp điểm ưu tiên từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ in ra định dạng ngày tháng năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
