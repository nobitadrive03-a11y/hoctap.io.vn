  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; }
    
    body { 
      font-family: 'Be Vietnam Pro', sans-serif; 
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    #app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 50px; }
    
    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .option-label { transition: transform 0.15s ease, background-color 0.2s ease; cursor: pointer; border-color: #e2e8f0; }
    .option-label:hover { background-color: #f0fdfa; border-color: #38bdf8; box-shadow: 0 4px 6px -1px rgba(56, 189, 248, 0.1); }
    
    input[type="radio"].single-radio:checked + .option-label {
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      color: white; border-color: transparent;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    input[type="radio"].single-radio:checked + .option-label span:first-child { background-color: rgba(255,255,255,0.25); border-color: transparent; color: white; }
    input[type="radio"].single-radio:checked + .option-label span:last-child { color: white; }
    
    .tf-radio-T:checked + .tf-label-T, .tf-radio-S:checked + .tf-label-S {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important; 
        border-color: transparent !important; color: white !important;
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    .my-score-row {
      background: linear-gradient(to right, #fdf4ff, #ffffff) !important;
      border-left: 4px solid #db2777 !important; font-weight: 700 !important;
      color: #9d174d !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; z-index: 10;
    }
    .my-score-row td { padding-top: 16px; padding-bottom: 16px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  </style>

  <script>
    let database = null;
    let scoresRef = null;
    let currentIdx = 0;

    try {
        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Pos8awlh9j041qDWTPFRsVIjF-kPnk",
            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hoctap-91691",
            storageBucket: "hoctap-91691.firebasestorage.app",
            messagingSenderId: "1004553425319",
            appId: "1:1004553425319:web:45d15cbae393f614c56682",
            measurementId: "G-Q6X1TL9PRV"
        };
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            scoresRef = database.ref('bxh_tx_10_de5');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 2 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('selectstart', event => {
        if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') { event.preventDefault(); }
    });
    document.addEventListener('dragstart', event => event.preventDefault()); 
    document.addEventListener('copy', event => {
        event.clipboardData.setData('text/plain', 'Tài liệu đã được bảo vệ!');
        event.preventDefault();
        window.handleCheatAction('Sao chép (Copy) văn bản');
    });

    const de_data = [
        { id: "q1", type: "single", question: "Mạng thông tin toàn cầu Internet được định nghĩa dựa trên các đặc điểm về quy mô và quyền sở hữu như thế nào?", options: ["Internet là một mạng lưới máy tính diện rộng có quy mô toàn cầu và hoàn toàn không thuộc quyền sở hữu của bất kỳ cá nhân nào.", "Internet là một hệ thống thiết bị phần cứng chuyển mạch tín hiệu chuyên biệt dành cho các phòng thực hành công nghệ trường học.", "Internet là một trung tâm dữ liệu cục bộ được xây dựng độc quyền nhằm mục đích phục vụ lưu trữ thông tin cho chính phủ quốc gia.", "Internet là một nền tảng điện toán đám mây chỉ cung cấp dịch vụ máy chủ cơ sở hạ tầng mạng cho các tập đoàn thương mại cực lớn."], correct: 0 },
        { id: "q2", type: "single", question: "Trong mô hình kết nối của hệ thống mạng, thiết bị bộ định tuyến (Router) đóng vai trò chức năng kĩ thuật cốt lõi gì?", options: ["Router là thiết bị định tuyến chuyên dùng để kết nối các mạng LAN lại với nhau và xác định các đường truyền dữ liệu ra ngoài Internet.", "Router là thiết bị điện tử thông minh có chức năng chính là hiển thị các hình ảnh ba chiều độ phân giải cao lên hệ thống màn hình tivi.", "Router là thiết bị trung tâm lưu trữ mọi tập tin văn bản quan trọng của nhân viên văn phòng trong quá trình làm việc hành chính hàng ngày.", "Router là thiết bị phần mềm mã nguồn mở chuyên kiểm tra các tập tin tải xuống để tiêu diệt các phần mềm vi-rút nguy hiểm trên mạng."], correct: 0 },
        { id: "q3", type: "single", question: "Khái niệm 'Điện toán đám mây' được định nghĩa một cách cụ thể và chính xác nhất trong lĩnh vực công nghệ số là gì?", options: ["Là việc phân phối tài nguyên công nghệ thông tin theo nhu cầu qua Internet với chính sách thanh toán linh hoạt theo đúng hạn mức sử dụng.", "Là việc cài đặt toàn bộ phần mềm diệt mã độc trực tiếp vào ổ đĩa cứng của hệ thống nhằm bảo vệ thông tin cá nhân của mọi người dùng.", "Là việc liên kết các hệ thống thiết bị phần cứng thông minh với nhau thông qua cáp mạng quang để chế tạo ra các hệ thống máy tính lượng tử.", "Là việc thiết kế và lập trình các hệ điều hành thế hệ mới dành riêng cho những chiếc điện thoại di động thông minh sử dụng màn cảm ứng."], correct: 0 },
        { id: "q4", type: "single", question: "Mô hình dịch vụ đám mây cơ bản có tên viết tắt là SaaS (Software as a service) mang ý nghĩa cung cấp loại tài nguyên nào?", options: ["Được các chuyên gia công nghệ định nghĩa là dịch vụ chuyên cho thuê phần mềm ứng dụng như một dịch vụ.", "Được các chuyên gia công nghệ định nghĩa là dịch vụ chuyên cho thuê phần cứng nền tảng cấu hình mạnh.", "Được các chuyên gia công nghệ định nghĩa là dịch vụ chuyên cho thuê hạ tầng cơ sở vật chất trung tâm mạng.", "Được các chuyên gia công nghệ định nghĩa là dịch vụ chuyên cho thuê máy chủ lưu trữ tệp tin đa phương tiện."], correct: 0 },
        { id: "q5", type: "single", question: "Khái niệm 'Internet vạn vật' (viết tắt là IoT - Internet of Things) được hiểu chính xác nhất là một hệ thống mạng lưới như thế nào?", options: ["Là việc liên kết các thiết bị thông minh để tự động thu thập, trao đổi và xử lí dữ liệu phục vụ mọi mục đích.", "Là mạng lưới chuyên kết nối các dòng điện thoại thông minh để trao đổi dữ liệu tin nhắn hình ảnh cá nhân.", "Là trung tâm điện toán đám mây khổng lồ chuyên cung cấp dịch vụ cho thuê phần mềm ứng dụng trực tuyến.", "Là bộ giao thức truyền thông mạng lưới quy định cách thức mã hoá các thẻ định dạng siêu văn bản đồ họa."], correct: 0 },
        { id: "q6", type: "single", question: "Hệ thống thu phí không dừng trên các tuyến đường bộ cao tốc hoạt động dựa trên cốt lõi công nghệ thẻ định danh nào?", options: ["Là công nghệ định danh giao tiếp thông qua sóng radio (RFID) chuyên ứng dụng để thu phí không dừng xe.", "Là công nghệ cảm biến nhiệt độ chuyên dụng để nhận diện cháy nổ trong các hệ thống nhà máy thông minh.", "Là công nghệ kết nối truyền hình trực tuyến đa nền tảng chuyên dùng cho môi trường giáo dục đại học công.", "Là công nghệ quét sinh trắc học vân tay nhằm mục đích mở khoá màn hình cho thiết bị điện thoại di động số."], correct: 0 },
        { id: "q7", type: "single", question: "Trong lĩnh vực giáo dục hiện đại, mạng lưới Internet đã góp phần tạo ra bước ngoặt to lớn làm thay đổi phương thức học tập như thế nào?", options: ["Tạo ra các nền tảng học trực tuyến giúp người học tiếp cận kho tri thức từ xa mọi lúc mọi nơi rất tiện lợi.", "Tạo ra phương thức học tập bắt buộc học sinh phải mua sắm thật nhiều phần cứng lưu trữ vật lý để chứa bài.", "Tạo ra rào cản địa lý khiến học sinh ở những vùng sâu vùng xa không thể nào đăng kí dự thi tốt nghiệp được.", "Tạo ra hệ thống khóa bảo mật vô hiệu hóa hoàn toàn các thư viện bách khoa toàn thư trên hệ thống không gian mạng."], correct: 0 },
        { id: "q8", type: "single", question: "Sự khác biệt về vai trò xử lí lưu lượng mạng giữa hai loại thiết bị Hub/Switch so với thiết bị Router nằm ở điểm cốt lõi nào?", options: ["Hub và Switch chỉ dùng chuyển tiếp dữ liệu nội bộ trong LAN, còn Router dùng để kết nối các mạng LAN với nhau ra Internet.", "Hub và Switch chuyên kết nối mạng diện rộng toàn cầu, trong khi Router chỉ được dùng để chia tín hiệu mạng không dây.", "Hub và Switch làm nhiệm vụ quét sạch toàn bộ vi-rút mạng, còn Router làm nhiệm vụ lưu trữ các tệp văn bản của máy khách.", "Hub và Switch đều là hệ thống phần mềm ứng dụng đám mây, còn Router là một đoạn mã lập trình thiết kế website bảo mật."], correct: 0 },
        { id: "q9", type: "single", question: "Loại mã độc nào dưới đây bản chất KHÔNG phải là một phần mềm hoàn chỉnh mà bắt buộc phải gắn vào một phần mềm khác để phát tác?", options: ["Loại mã độc này được các chuyên gia an ninh mạng phân loại chính thức và gọi tên thông dụng là Phần mềm Virus.", "Loại mã độc này được các chuyên gia an ninh mạng phân loại chính thức và gọi tên thông dụng là Sâu máy tính.", "Loại mã độc này được các chuyên gia an ninh mạng phân loại chính thức và gọi tên thông dụng là Mã nội gián Trojan.", "Loại mã độc này được các chuyên gia an ninh mạng phân loại chính thức và gọi tên thông dụng là Ứng dụng Spyware."], correct: 0 },
        { id: "q10", type: "single", question: "Khi người dùng tham gia giao tiếp trên không gian mạng, thuật ngữ 'Bắt nạt qua mạng' được đánh giá và phân loại là hành vi như thế nào?", options: ["Được phân loại là một kiểu khủng bố tinh thần trên không gian mạng gây ảnh hưởng tâm lý cực kì vô cùng nghiêm trọng.", "Được phân loại là hành vi quảng cáo các sản phẩm công nghệ hoàn toàn hợp pháp và không hề gây hại cho ai.", "Được phân loại là hình thức kết bạn xã giao rất an toàn nhằm mở rộng thêm thật nhiều mối quan hệ cộng đồng tốt.", "Được phân loại là hành động chia sẻ tin tức cảnh báo tình hình thời tiết và bão lũ cực kì hữu ích đến người thân quen."], correct: 0 },
        { id: "q11", type: "single", question: "Trong các lựa chọn quét (Scan options) của phần mềm Windows Defender, chế độ 'Quick scan' (Quét nhanh) sẽ thực hiện thao tác kiểm tra ở đâu?", options: ["Chế độ này sẽ thực hiện thao tác kiểm tra các tệp ở những thư mục mà virus máy tính thường hay lây nhiễm vào nhất.", "Chế độ này sẽ thực hiện thao tác kiểm tra tất cả các tệp chương trình đang nằm rải rác trên mọi phân vùng đĩa cứng.", "Chế độ này sẽ thực hiện thao tác kiểm tra một cách vô cùng ngẫu nhiên các tập tin đa phương tiện tải về từ mạng.", "Chế độ này sẽ thực hiện thao tác kiểm tra toàn bộ các thiết bị USB lưu trữ ngoại vi đang được cắm trực tiếp vào máy."], correct: 0 },
        { id: "q12", type: "single", question: "Một trong những biểu hiện rõ rệt nhất của vấn nạn 'Nghiện mạng' gây hậu quả tiêu cực cho người dùng máy tính là gì?", options: ["Là tình trạng người dùng dành quá nhiều thời gian chơi trò chơi điện tử liên tục trên máy dẫn đến kiệt sức và đột quỵ.", "Là tình trạng người dùng liên tục sử dụng phần mềm đồ họa hiện đại để thiết kế ra các bộ tài liệu báo cáo cực đẹp mắt.", "Là tình trạng người dùng cố gắng học hỏi ngôn ngữ lập trình Python hàng ngày để nhanh chóng nâng cao kỹ năng code.", "Là tình trạng người dùng thường xuyên tham gia hội thảo khoa học trực tuyến đa quốc gia để mở rộng kiến thức mới mẻ."], correct: 0 },
        { id: "q13", type: "single", question: "Về mặt cơ chế lây lan và tính hoàn chỉnh của phần mềm, sự khác biệt lớn nhất giữa Sâu máy tính (Worm) và Virus là gì?", options: ["Virus cần gắn vào một phần mềm khác để phát tác, trong khi Worm là một phần mềm tự thân vô cùng hoàn chỉnh độc lập.", "Virus là phần mềm độc lập tự hoạt động, trong khi Worm phải bám vào một đoạn mã hệ thống của nền tảng Windows.", "Virus không lây lan qua mạng Internet, trong khi Worm chỉ lây lan thông qua việc chia sẻ các đĩa quang học vật lý.", "Virus chỉ chuyên dùng để mã hóa thông tin tài liệu, trong khi Worm chỉ chuyên ăn cắp hình ảnh trên trang mạng Facebook."], correct: 0 },
        { id: "q14", type: "single", question: "Tại sao các chuyên gia an ninh mạng thường xuyên khuyến cáo người dùng không nên sử dụng các điểm phát Wi-Fi công cộng không có mật khẩu để giao dịch ngân hàng?", options: ["Bởi vì hầu hết những trạm Wi-Fi công cộng đều không mã hoá thông tin khi truyền, cực kì dễ làm lộ lọt thông tin cá nhân.", "Bởi vì mạng Wi-Fi công cộng thường có băng thông rất yếu khiến ứng dụng ngân hàng di động liên tục báo lỗi hệ thống.", "Bởi vì nhà cung cấp mạng Wi-Fi công cộng luôn yêu cầu khách hàng phải nộp mức phí giao dịch chuyển tiền cực kỳ đắt đỏ.", "Bởi vì hệ thống Wi-Fi công cộng sẽ ngay lập tức tự động định dạng lại ổ cứng thiết bị điện thoại thông minh của người dùng."], correct: 0 },
        { id: "q15", type: "single", question: "Trong các phân loại mã độc nội gián (Trojan), phần mềm 'Rootkit' sở hữu đặc tính xâm nhập hệ thống đặc biệt nguy hiểm nào?", options: ["Sở hữu khả năng chiếm quyền cao nhất của máy tính, thực hiện mọi hoạt động ngầm và tự động xóa mọi dấu vết xâm nhập.", "Sở hữu khả năng biến máy tính thành một cỗ máy đào tiền ảo chuyên dụng khiến phần cứng bị chập cháy nổ liên tục.", "Sở hữu khả năng liên tục bật mở hàng nghìn đoạn video quảng cáo trên màn hình khiến người dùng hoàn toàn không thể tắt.", "Sở hữu khả năng tự động gửi đi các gói tin rác đến mọi địa chỉ thư điện tử trên toàn thế giới chỉ trong vòng vài giây."], correct: 0 },
        { id: "q16", type: "single", question: "Mã độc tống tiền WannaCry (xuất hiện năm 2017) đã gây ra thảm họa công nghệ và thiệt hại vô cùng nặng nề cho người dùng trên toàn cầu bằng thủ đoạn khét tiếng nào?", options: ["Thủ đoạn tự động mã hoá toàn bộ thông tin có trên đĩa cứng và công khai đòi tiền chuộc mới cho phần mềm hoá giải chuỗi.", "Thủ đoạn âm thầm ghi lại tất cả các thao tác gõ bàn phím để đánh cắp mật khẩu đăng nhập của hệ thống mạng xã hội lớn.", "Thủ đoạn điều hướng toàn bộ máy tính truy cập vào một trang web đánh bạc trực tuyến nhằm thu tiền phí bất chính của dân.", "Thủ đoạn tạo ra một tài khoản bí mật ở cửa sau để sao chép hàng loạt các tấm hình riêng tư rồi tung lên trên mặt báo chí."], correct: 0 },
        { id: "q17", type: "single", question: "Để nghe máy tính tự động phát âm phần văn bản đã dịch trên Google Translate, người dùng cần thực hiện thao tác nháy chuột vào biểu tượng đồ họa nào?", options: ["Người sử dụng cần nháy chuột trực tiếp vào biểu tượng chiếc loa nhỏ nằm ở phía dưới khung kết quả dịch văn bản.", "Người sử dụng cần nháy chuột trực tiếp vào biểu tượng chiếc micro nằm ở phía góc dưới cùng màn hình giao diện.", "Người sử dụng cần nháy chuột trực tiếp vào biểu tượng hình ảnh thư mục nằm ở trên thanh công cụ gốc điều khiển.", "Người sử dụng cần nháy chuột trực tiếp vào biểu tượng dấu chữ thập nằm ở góc trên cùng của giao diện ứng dụng."], correct: 0 },
        { id: "q18", type: "single", question: "Trên trang chủ của kho học liệu mở igiaoduc.vn, các loại tài liệu học tập được sắp xếp và tổ chức theo hình thức hệ thống nào?", options: ["Các loại học liệu được hệ thống tự động xếp theo các chủ đề nằm trên cây thư mục đa cấp ở phía bên tay trái màn hình.", "Các loại học liệu được hệ thống tự động sắp xếp theo dạng danh sách dài nối tiếp mà không hề phân chia cấp bậc.", "Các loại học liệu được hệ thống tự động xếp lộn xộn một cách ngẫu nhiên ở khu vực trung tâm màn hình chính hiển thị.", "Các loại học liệu được hệ thống tự động tổ chức lưu trữ dưới dạng các biểu đồ tư duy hình tròn cực kì phức tạp rối rắm."], correct: 0 },
        { id: "q19", type: "single", question: "Sự khác biệt cốt lõi về bản chất kỹ thuật giữa ngôn ngữ nguồn và ngôn ngữ đích trong nguyên lý hoạt động của ứng dụng Google Translate là gì?", options: ["Ngôn ngữ nguồn chính là phần văn bản đầu vào cần dịch, còn ngôn ngữ đích chính là kết quả bản dịch đầu ra màn hình.", "Ngôn ngữ nguồn luôn luôn bị hệ thống gán cố định là tiếng Anh, ngôn ngữ đích có thể là bất kỳ một loại ngôn ngữ nào.", "Ngôn ngữ nguồn chính là kết quả cuối cùng phần mềm tạo ra, ngôn ngữ đích là đoạn văn bản gốc mà người dùng tự gõ.", "Ngôn ngữ nguồn đóng vai trò là các tệp tin tài liệu đính kèm, ngôn ngữ đích đóng vai trò là các hình ảnh trực tuyến mạng."], correct: 0 },
        { id: "q20", type: "single", question: "Khi người dùng thao tác kích hoạt tính năng 'nhập bằng giọng nói' trên Google Dịch, trạng thái biểu tượng micro đột ngột chuyển sang màu xanh mang ý nghĩa thông báo gì?", options: ["Trạng thái màu sắc này thông báo cho người sử dụng biết rằng phần mềm đang sẵn sàng thu âm giọng nói trực tiếp từ môi trường.", "Trạng thái màu sắc này thông báo cho người sử dụng biết rằng hệ thống máy chủ mạng đang bị ngắt kết nối đường truyền tạm thời.", "Trạng thái màu sắc này thông báo cho người sử dụng biết rằng thiết bị micro phần cứng của chiếc máy tính cá nhân đang bị hư hỏng.", "Trạng thái màu sắc này thông báo cho người sử dụng biết rằng hệ thống máy tính vừa hoàn tất thành công quá trình biên dịch văn bản."], correct: 0 },
        { id: "q21", type: "single", question: "Cấu trúc tổ chức hệ thống theo hình thức 'cây thư mục đa cấp' trên trang web igiaoduc.vn mang lại ưu điểm quản lý dữ liệu nổi bật nào cho người sử dụng?", options: ["Giúp người học có khả năng dễ dàng phân loại, tra cứu và điều hướng tìm kiếm tài liệu học tập từ mức độ tổng quan đến chi tiết.", "Giúp hệ thống bắt buộc người dùng phải tiến hành nộp khoản phí dịch vụ cao trước khi xem bất kỳ một nội dung bài giảng nào.", "Giúp bộ phận kĩ thuật dễ dàng tự động xóa bỏ toàn bộ dữ liệu máy chủ không cần thiết khi có sự cố tấn công mạng điện tử xảy ra.", "Giúp phần mềm tự động biên dịch tất cả các bài giảng truyền thống thành định dạng tệp tin âm thanh mp3 để tải về chiếc thẻ nhớ."], correct: 0 },

        { id: 'q_tf2', type: 'tf_cluster', question: "Lớp phó phụ trách kĩ thuật của câu lạc bộ Tin học đang soạn thảo tài liệu hướng dẫn sử dụng tính năng an toàn của phần mềm Windows Defender. Những hướng dẫn nào do học sinh này viết là Đúng hay Sai:", subQuestions: [

            { id: 'q_tf2_c', text: "Trong giao diện phần mềm Windows Security, mục 'Current threats' đảm nhận chức năng hiển thị lịch sử mua sắm trực tuyến của người dùng tại các trang web thương mại điện tử lớn.", correct: "Sai" },
            { id: 'q_tf2_d', text: "Khi cắm một chiếc USB chứa tài liệu lấy từ tiệm photocopy vào máy tính cá nhân, thay vì mở trực tiếp, người dùng nên nhấp phải chuột vào biểu tượng ổ đĩa USB và chọn lệnh 'Scan with Microsoft Defender' để kiểm tra trước.", correct: "Đúng" }
        ]},
        { id: 'q_tf3', type: 'tf_cluster', question: "Trong giờ học chuyên đề, giáo viên môn Tin học trình bày về sự ảnh hưởng của phần mềm độc hại (Malware) trên không gian số. Các nhận định dưới đây là Đúng hay Sai:", subQuestions: [
            { id: 'q_tf3_a', text: "Phần mềm độc hại (malware) là danh từ chung để chỉ những phần mềm được viết ra với ý đồ xấu, nhằm mục đích gây hại cho hệ thống và người dùng máy tính.", correct: "Đúng" },
            { id: 'q_tf3_b', text: "Trái ngược hoàn toàn với virus, sâu máy tính (Worm) là một loại phần mềm hoàn chỉnh và có khả năng độc lập tự lây lan thông qua việc lừa người dùng nhấp vào các liên kết độc hại.", correct: "Đúng" },
            { id: 'q_tf3_c', text: "Đặc trưng cơ bản của các phần mềm gián điệp thuộc nhóm Trojan là chúng luôn cảnh báo rõ ràng bằng âm thanh cho nạn nhân biết trước khi bắt đầu quá trình mã hóa dữ liệu ổ cứng.", correct: "Sai" },
            { id: 'q_tf3_d', text: "Việc tự ý tắt bỏ hoặc vô hiệu hóa các phần mềm bảo mật (như Windows Defender) để tiến hành cài đặt các trò chơi bị bẻ khóa (crack) là một thao tác cực kì an toàn và được chuyên gia đặc biệt khuyến khích sử dụng nhằm tối ưu hóa máy tính.", correct: "Sai" }

            { id: 'q_tf4_a', text: "Kho học liệu mở khổng lồ của Bộ Giáo dục và Đào tạo Việt Nam phục vụ học sinh trên toàn quốc có địa chỉ tên miền truy cập chính thức trên Internet là https://igiaoduc.vn.", correct: "Đúng" },
            { id: 'q_tf4_b', text: "Trong giao diện phần mềm trực tuyến Google Translate, nếu người dùng có nhu cầu muốn dịch toàn bộ một tệp tài liệu nguyên bản có sẵn lưu trong máy tính (ví dụ tệp văn bản .docx), họ bắt buộc cần phải nháy chuột vào thẻ chức năng lựa chọn mục 'Tài liệu'.", correct: "Đúng" },
            { id: 'q_tf4_c', text: "Khi chế độ chức năng thu âm nhập văn bản bằng lời nói trên giao diện Google Translate được người dùng kích hoạt thành công để chuẩn bị thu âm thanh, biểu tượng hình chiếc micro tích hợp trên màn hình sẽ lập tức tự động chuyển đổi sang trạng thái hiển thị màu xanh.", correct: "Đúng" },

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10_7', tenDe: 'Kiểm Tra Thường Xuyên Môn Tin Học 10 - Đề số 5' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        let part1 = shuffleArray(rawQuestions.filter(q => q.type === 'single'));
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            let correctText = q.options[q.correct];
            q.options = shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);
        });
        
        let part2 = shuffleArray(rawQuestions.filter(q => q.type === 'tf_cluster'));
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            q.subQuestions = shuffleArray(q.subQuestions);
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60); // 45 phút như trong đề
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

        const container = document.getElementById('question-container');

                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>

                <div class="flex gap-4 mb-5">

                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        const getTen = (fullName) => {
            if (!fullName) return '';
            const words = fullName.trim().split(' ');
            return words[words.length - 1].toLowerCase();
        };

        sortedScoresList = [...allScores].sort((a, b) => {
            const lopA = (a.lop || '').toUpperCase();
            const lopB = (b.lop || '').toUpperCase();
            if (lopA !== lopB) return lopA.localeCompare(lopB);
            
            const tenA = getTen(a.hoTen);
            const tenB = getTen(b.hoTen);
            if (tenA !== tenB) return tenA.localeCompare(tenB);
            
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                timeStr = dt.toLocaleTimeString('vi-VN') + ' - ' + dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
                   <!-- <td class="px-3 sm:px-4 py-4 text-right font-bold text-orange-600 text-xs">${s.duration}</td> -->
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
