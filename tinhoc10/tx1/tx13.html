  <script>

        }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 3 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

    });

    // NGÂN HÀNG CÂU HỎI MỚI
    const de_data = [
        { id: "1_1", type: "single", question: "Theo quy mô phân bổ địa lí, khái niệm mạng cục bộ (viết tắt là LAN) được các chuyên gia định nghĩa chuẩn xác nhất là gì?", options: ["Là hệ thống mạng viễn thông toàn cầu chuyên kết nối các quốc gia thông qua dải vệ tinh và đường cáp quang ngầm dưới biển.", "Là mạng cục bộ có phạm vi địa lí vô cùng nhỏ như không gian của một hộ gia đình, một trường học hay một công ty nội bộ.", "Là giải pháp phần mềm thông minh tự động hóa tất cả mọi quy trình làm việc trong môi trường kinh doanh của doanh nghiệp.", "Là thiết bị phần cứng đặc biệt được chế tạo nhằm mục đích chuyển đổi tín hiệu sóng tương tự sang tín hiệu kỹ thuật số."], correct: 1 },
        { id: "1_2", type: "single", question: "Sự khác biệt cốt lõi về bản chất sở hữu giữa mạng cục bộ (LAN) và mạng toàn cầu (Internet) là gì?", options: ["Mạng LAN không có bất kỳ tổ chức hay chủ sở hữu nào, còn Internet thuộc về một chính phủ duy nhất quản lý.", "Mạng LAN là sở hữu của cá nhân, gia đình hay tổ chức xác định, còn Internet hoàn toàn không thuộc quyền sở hữu riêng ai.", "Mạng LAN và Internet đều là tài sản chung của mọi người dân trên thế giới và hoàn toàn được miễn phí khi truy cập.", "Mạng LAN và Internet đều bắt buộc phải đăng ký quyền sở hữu với nhà mạng viễn thông quốc tế trước khi bắt đầu dùng."], correct: 1 },
        { id: "1_3", type: "single", question: "Trong hệ thống cấu trúc dịch vụ điện toán đám mây, loại hình PaaS (Platform as a service) mang ý nghĩa cung cấp tài nguyên gì?", options: ["Là hình thức cho thuê nền tảng (ví dụ bản đồ số) để các tổ chức công nghệ dùng làm công cụ nhằm phát triển phần mềm.", "Là hình thức cho thuê phần cứng lưu trữ để người dùng bình thường tiến hành sao lưu dữ liệu cá nhân trên máy chủ trực tuyến.", "Là hình thức cho thuê phần mềm soạn thảo văn bản trực tuyến để người dùng chỉnh sửa tài liệu mà không cần tải hay cài đặt.", "Là hình thức bán đứt hoàn toàn một chương trình hệ điều hành nhằm cài đặt trực tiếp và cố định vào hệ thống máy tính văn phòng."], correct: 0 },
        { id: "1_4", type: "single", question: "Khi đánh giá lợi ích của hệ thống điện toán đám mây, thuộc tính \"Kinh tế hơn\" được thể hiện rõ nét qua mô hình thanh toán nào?", options: ["Người dùng bắt buộc phải chi trả một số tiền cực kì khổng lồ để được độc quyền sở hữu trọn vẹn toàn bộ một hệ thống máy chủ.", "Người dùng chỉ cần thanh toán chi phí theo đúng hạn mức thực tế sử dụng và dịch vụ thường phân tải để phòng tránh lãng phí.", "Người dùng hoàn toàn được nhà mạng cung cấp miễn phí mọi thiết bị phần cứng từ máy tính cho đến toàn bộ cáp quang truyền dẫn.", "Người dùng sẽ luôn nhận được một khoản lợi nhuận khổng lồ mỗi tháng nhờ việc thực hiện chia sẻ đường truyền mạng cho hàng xóm."], correct: 1 },
        { id: "1_5", type: "single", question: "Mô hình \"Nhà thông minh\" (Smart home) có khả năng tự động bật tắt thiết bị điều hoà không khí là ví dụ tiêu biểu cho hệ thống nào?", options: ["Thuộc vào ví dụ tiêu biểu cho mô hình mạng lưới kết nối vạn vật (IoT) hoạt động điều phối tự động thông qua Internet.", "Thuộc vào ví dụ tiêu biểu cho hệ thống lưu trữ điện toán đám mây khổng lồ phục vụ việc bảo vệ dữ liệu siêu an toàn.", "Thuộc vào ví dụ tiêu biểu cho mô hình bộ định tuyến mạng chuyển mạch viễn thông băng thông siêu rộng chuẩn quốc tế.", "Thuộc vào ví dụ tiêu biểu cho hệ thống phát triển nền tảng phần mềm viết mã nguồn mở chuyên dành cho thiết bị vô tuyến."], correct: 0 },
        { id: "1_6", type: "single", question: "Trong nguyên lý vận hành của các loại xe tự hành (ô tô tự lái) hiện đại, quá trình đánh giá tình huống để ra quyết định lái xe được diễn ra ở đâu?", options: ["Quá trình tính toán chiến lược này được xử lý hoàn toàn bởi tổng đài điều hướng trực tuyến do hàng ngàn nhân viên điều khiển.", "Quá trình tính toán chiến lược này được xử lý thông qua việc in các biểu đồ dữ liệu ra màn hình trung tâm rồi quét chụp lại.", "Quá trình tính toán chiến lược này được thực hiện trong không gian thế giới ảo dựa trên dữ liệu thu thập được từ các cảm biến.", "Quá trình tính toán chiến lược này được thực hiện một cách ngẫu nhiên thông qua hệ thống động cơ cơ khí đốt trong của chiếc xe."], correct: 2 },
        { id: "1_7", type: "single", question: "Việc điện lực thay thế công tơ cũ bằng công tơ điện tử gắn vi xử lí tự động gửi chỉ số điện về máy chủ qua Internet hằng ngày là ứng dụng của công nghệ gì?", options: ["Đây chính là một ứng dụng vô cùng thực tế của hệ sinh thái công nghệ mạng lưới kết nối vạn vật không dây (IoT).", "Đây chính là một ứng dụng vô cùng thực tế của bộ phần mềm tiện ích xử lý định dạng tệp tin ảnh số đa phương tiện.", "Đây chính là một ứng dụng vô cùng thực tế của bộ giao thức phân giải hệ thống tên miền quốc tế trên nền tảng web (DNS).", "Đây chính là một ứng dụng vô cùng thực tế của dịch vụ cho thuê phần mềm bảng tính điện tử trực tuyến được đóng gói (SaaS)."], correct: 0 },
        { id: "1_8", type: "single", question: "Nhờ vào những khả năng kĩ thuật đặc thù nào mà một chiếc camera an ninh có kết nối mạng được giới công nghệ phân loại là thiết bị thông minh?", options: ["Nhờ vào khả năng tự động in ra giấy các bức ảnh siêu sắc nét ngay lập tức sau khi người dùng thực hiện thao tác chụp hình.", "Nhờ vào khả năng truyền dữ liệu tự động, tương tác qua mạng và chọn lọc để chỉ tiến hành ghi hình khi phát hiện ra chuyển động.", "Nhờ vào khả năng lập tức mã hoá toàn bộ mọi đoạn phim và tự động khoá hệ thống máy quay khi có hiện tượng rung lắc mạnh.", "Nhờ vào khả năng nhận diện tuyệt đối chính xác mọi ngôn ngữ giao tiếp của con người và phiên dịch tức thời sang tiếng Anh chuẩn."], correct: 1 },
        { id: "1_9", type: "single", question: "Trong lĩnh vực an toàn thông tin, khái niệm \"Phần mềm độc hại\" (viết tắt là malware) được các chuyên gia định nghĩa chuẩn xác nhất là gì?", options: ["Là những ứng dụng mã nguồn mở miễn phí chuyên dùng để tối ưu hóa hiệu suất hoạt động định tuyến của mạng cục bộ.", "Là những chương trình tiện ích hệ thống được cài đặt sẵn giúp gia tăng bộ nhớ đệm RAM cho các hệ thống máy tính.", "Là những công cụ bảo mật đa lớp được viết ra nhằm mục đích mã hóa hoàn toàn các loại thư tín điện tử trao đổi nội bộ.", "Là những phần mềm được cố tình viết ra với ý đồ xấu, nhằm mục đích trực tiếp gây hại cho người và thiết bị sử dụng máy."], correct: 3 },
        { id: "1_10", type: "single", question: "Đối tượng phần mềm độc hại nào thường xuyên lợi dụng các lỗ hổng bảo mật của hệ điều hành hoặc lừa người dùng tải về để tự cài đặt lây lan?", options: ["Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan tự động này được giới chuyên gia gọi tên là Sâu máy tính (Worm).", "Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan tự động này được giới chuyên gia gọi tên là Bức tường lửa (Firewall).", "Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan tự động này được giới chuyên gia gọi tên là Phần mềm tống tiền (DOS).", "Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan tự động này được giới chuyên gia gọi tên là Trợ lý kĩ thuật ảo (Botnet)."], correct: 0 },
        { id: "1_11", type: "single", question: "Trong các loại mã độc nội gián (Trojan), chương trình mang tên \"Keylogger\" được tin tặc thiết kế ra nhằm phục vụ mục đích cốt lõi gì?", options: ["Nhằm mục đích vô hiệu hóa hệ thống bức tường lửa bảo vệ máy tính cá nhân và tắt toàn bộ mọi phần mềm chống vi rút.", "Nhằm mục đích ngầm ghi lại mọi hoạt động của bàn phím và chuột để tìm hiểu xem người sử dụng thiết bị đang làm gì.", "Nhằm mục đích tạo ra một tài khoản đăng nhập bí mật có quyền lực cao nhất để chiếm đoạt hoàn toàn bộ nhớ của máy.", "Nhằm mục đích mã hóa tất cả các loại tệp tin lưu trữ trên đĩa cứng để ép buộc nạn nhân phải tiến hành nộp tiền chuộc."], correct: 1 },
        { id: "1_12", type: "single", question: "Vấn nạn bắt nạt trên không gian mạng (cyberbullying) mang lại ảnh hưởng tâm lý trầm trọng và đáng sợ hơn nhiều so với bắt nạt truyền thống do nguyên nhân nào?", options: ["Do người thực hiện hành vi bắt nạt luôn luôn phải công khai rõ ràng danh tính thật của mình trên các diễn đàn trực tuyến quốc tế.", "Do sự việc có thể xảy ra dai dẳng bất cứ lúc nào, người bắt nạt được ẩn danh và số lượng người bình luận theo dõi là rất đông.", "Do nền tảng mạng xã hội luôn tự động chặn ngay lập tức bất kỳ một từ ngữ thô tục nào ngay khi vừa được gõ ra trên bàn phím.", "Do pháp luật quốc tế đã có những hình phạt cực kỳ nghiêm khắc và mang tính răn đe cho tội bắt nạt trên mạng từ hàng chục năm trước."], correct: 1 },
        { id: "1_13", type: "single", question: "Phương thức Tấn công từ chối dịch vụ (Denial of Service - DOS) đánh sập các máy chủ mạng thường được tin tặc thực hiện thông qua kịch bản nào?", options: ["Tin tặc lợi dụng kẽ hở kĩ thuật tự tay cắt đứt đường cáp quang viễn thông truyền tải tín hiệu nối kết trực tiếp tới máy chủ đó.", "Tin tặc cử các phần mềm gián điệp tinh vi vào hệ thống để ăn cắp từng đoạn mã nguồn gốc của giao diện hiển thị website.", "Tin tặc điều khiển hàng vạn mã độc truy cập đồng thời vào một máy chủ định trước gây ra hiện tượng quá tải làm tê liệt hệ thống.", "Tin tặc đóng giả làm những nhân viên bảo trì mạng lưới đến tận cơ sở điều hành để tự tay rút nguồn điện cung cấp cho máy chủ."], correct: 2 },
        { id: "1_14", type: "single", question: "Khi vô tình nhận được một thư điện tử có chứa đường liên kết thông báo trúng phần thưởng từ một người bạn quen trong danh bạ, phản ứng chuẩn mực nhất là gì?", options: ["Cần phải nhanh tay nhấp ngay vào đường liên kết đó để xem chi tiết phần thưởng là gì trước khi hệ thống báo hết thời hạn.", "Cần phải lập tức tiến hành chuyển tiếp bức thư điện tử đó cho toàn bộ người thân gia đình để cùng nhau nhận phần thưởng lớn.", "Cần phải tắt ngay thiết bị máy tính cá nhân bằng cách nhấn giữ nút nguồn vật lí trong vòng mười lăm giây đồng hồ liên tục.", "Cần phải không mở vội, hãy liên lạc qua phương tiện khác (ví dụ gọi điện) để xác minh với bạn mình trước khi tiến hành tải xuống."], correct: 3 },
        { id: "1_15", type: "single", question: "Tiện ích bảo mật \"Windows Defender\" được Microsoft tích hợp sẵn bên trong hệ điều hành Windows 10 đảm nhận chức năng kĩ thuật vô cùng quan trọng nào?", options: ["Chức năng kĩ thuật quan trọng nhất là gia tăng tốc độ đường truyền tải cáp quang lên mức tối đa cho phần cứng máy tính.", "Chức năng kĩ thuật quan trọng nhất là sửa chữa tất cả các bảng mạch vật lí bị hỏng hóc bên trong bộ CPU của hệ thống.", "Chức năng kĩ thuật quan trọng nhất là thực hiện phòng chống virus, cảnh báo mã độc và tiến hành bảo vệ thiết bị máy tính.", "Chức năng kĩ thuật quan trọng nhất là tự động dọn dẹp các thùng rác điện tử và nén tất cả các tập tin trên mọi ổ đĩa cứng."], correct: 2 },
        { id: "1_16", type: "single", question: "Tại sao các chuyên gia an ninh mạng đặc biệt khuyến cáo người dùng phải vô cùng thận trọng đối với các phần mềm bẻ khoá (crack) phát tán tự do trên Internet?", options: ["Bởi vì các loại phần mềm bẻ khóa này thường xuyên yêu cầu người dùng phải trả một mức phí kích hoạt bản quyền vô cùng đắt đỏ.", "Bởi vì rất nhiều phần mềm bẻ khoá cho tải lấy tự do trên mạng đều là các phần mềm bị kẻ xấu cố ý gắn thêm vào những đoạn mã độc.", "Bởi vì các loại phần mềm bẻ khóa này sẽ lập tức làm hệ điều hành máy tính bị đổi hoàn toàn sang một ngôn ngữ hiển thị cực kì lạ lẫm.", "Bởi vì nhà cung cấp dịch vụ mạng viễn thông sẽ tự động ngắt đường truyền cáp quang ngay lập tức nếu phát hiện ra có người bẻ khóa."], correct: 1 },
        { id: "1_17", type: "single", question: "Địa chỉ trang web cung cấp dịch vụ dịch thuật đa ngôn ngữ trực tuyến chính thức của nền tảng Google là gì?", options: ["Trang web cung cấp dịch vụ công cụ này có địa chỉ truy cập chính thức trên Internet là đường dẫn https://translate.google.com/.", "Trang web cung cấp dịch vụ công cụ này có địa chỉ truy cập chính thức trên Internet là đường dẫn https://dictionary.google.com/.", "Trang web cung cấp dịch vụ công cụ này có địa chỉ truy cập chính thức trên Internet là đường dẫn https://vocabulary.google.com/.", "Trang web cung cấp dịch vụ công cụ này có địa chỉ truy cập chính thức trên Internet là đường dẫn https://translation.google.com/."], correct: 0 },
        { id: "1_18", type: "single", question: "Thuật ngữ \"ngôn ngữ nguồn\" trong giao diện điều khiển của phần mềm Google Translate mang ý nghĩa kĩ thuật cơ bản nào?", options: ["Là ngôn ngữ đầu ra để hệ thống máy chủ tiến hành biên dịch thành kết quả văn bản cuối cùng trả về hiển thị cho người xem.", "Là ngôn ngữ đầu vào cần được phần mềm tiếp nhận và tiến hành quá trình phân tích dịch thuật đa ngữ trên không gian mạng.", "Là ngôn ngữ máy tính chuyên dụng dùng để lập trình tạo ra toàn bộ hệ thống trí tuệ nhân tạo nhận diện của nền tảng Google.", "Là ngôn ngữ mặc định của trình duyệt luôn luôn được thiết lập cố định là tiếng nước Anh bất kể người dùng đang ở vị trí nào."], correct: 1 },
        { id: "1_19", type: "single", question: "Tính năng dịch \"Tài liệu\" của phần mềm Google Translate hỗ trợ trực tiếp việc tải lên và biên dịch các loại tệp tin có định dạng quen thuộc nào sau đây?", options: ["Hỗ trợ quá trình xử lý dịch thuật đối với tệp văn bản Word, tệp bảng tính Excel, tệp trình chiếu PowerPoint và tệp tài liệu PDF.", "Hỗ trợ quá trình xử lý dịch thuật đối với tệp hình ảnh JPEG, tệp âm thanh MP3, tệp video clip MP4 và tệp mã nguồn HTML.", "Hỗ trợ quá trình xử lý dịch thuật đối với tệp định dạng âm thanh WAV, tệp hình ảnh PNG, tệp nén ZIP và tệp hệ thống ISO.", "Hỗ trợ quá trình xử lý dịch thuật đối với tệp mã nguồn lập trình Python, tệp cài đặt đuôi EXE và tệp đồ họa vector dạng SVG."], correct: 0 },
        { id: "1_20", type: "single", question: "Khi người sử dụng tiến hành thao tác kích hoạt tính năng \"nhập bằng giọng nói\" trên Google Dịch, trạng thái biểu tượng micro đột ngột chuyển sang màu xanh mang ý nghĩa gì?", options: ["Trạng thái màu sắc đặc biệt này thông báo cho người sử dụng biết rằng hệ thống máy chủ mạng đang bị ngắt kết nối tạm thời.", "Trạng thái màu sắc đặc biệt này thông báo cho người sử dụng biết rằng phần mềm đang sẵn sàng thu âm giọng nói trực tiếp.", "Trạng thái màu sắc đặc biệt này thông báo cho người sử dụng biết rằng thiết bị micro phần cứng của máy tính đang bị hư hỏng.", "Trạng thái màu sắc đặc biệt này thông báo cho người sử dụng biết rằng hệ thống máy tính vừa hoàn tất xong quá trình dịch văn bản."], correct: 1 },
        { id: "1_21", type: "single", question: "Trang web kho học liệu mở do Bộ Giáo dục và Đào tạo Việt Nam cung cấp cho người học hiện nay có địa chỉ tên miền chính thức là gì?", options: ["Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là https://igiaoduc.vn.", "Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là https://moet.gov.vn.", "Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là https://elearning.vn.", "Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là https://khohoclieu.vn."], correct: 0 },
        { id: "1_22", type: "single", question: "Khái niệm \"học liệu mở\" bắt đầu được sử dụng vô cùng rộng rãi trên thế giới bắt nguồn từ sự kiện lịch sử của tổ chức quốc tế nào vào năm 2002?", options: ["Bắt nguồn từ sự kiện trường Đại học Tổng hợp Harvard của Mĩ quyết định chia sẻ toàn bộ tài liệu nghiên cứu lên trên mạng.", "Bắt nguồn từ sự kiện Đại học Quốc gia Stanford của Mĩ bắt đầu tiến hành chia sẻ hệ thống thư viện dữ liệu hoàn toàn miễn phí.", "Bắt nguồn từ sự kiện Đại học Bách khoa Hà Nội của Việt Nam chia sẻ ngân hàng bài giảng điện tử trực tuyến cho công chúng.", "Bắt nguồn từ sự kiện Học viện Công nghệ Massachusetts của Mĩ tiến hành đưa toàn bộ nội dung giảng dạy lên trên Internet."], correct: 3 },
        { id: "1_23", type: "single", question: "Cấu trúc tổ chức hệ thống theo hình thức \"cây thư mục đa cấp\" trên trang web igiaoduc.vn mang lại ưu điểm quản lý dữ liệu nổi bật nào cho người sử dụng?", options: ["Giúp hệ thống bắt buộc người dùng luôn phải tiến hành nộp khoản phí dịch vụ cao trước khi xem bất kỳ một nội dung bài giảng nào.", "Giúp bộ phận kĩ thuật dễ dàng tự động xóa bỏ toàn bộ khối lượng dữ liệu máy chủ không cần thiết khi có sự cố tấn công mạng xảy ra.", "Giúp người học có khả năng dễ dàng phân loại, tiến hành tra cứu và điều hướng tìm kiếm tài liệu học tập từ mức độ tổng quan đến chi tiết.", "Giúp phần mềm máy tính tự động biên dịch tất cả các bài giảng truyền thống thành định dạng tệp tin âm thanh mp3 để tải về thẻ nhớ."], correct: 2 },
        { id: "1_24", type: "single", question: "Để có thể mở xem trực tiếp video bài giảng chi tiết của một môn học bất kì bên trong giao diện của kho học liệu mở igiaoduc.vn, thao tác mà người dùng phải thực hiện là gì?", options: ["Người dùng bắt buộc phải dùng hòm thư điện tử cá nhân gửi email xin phép bộ phận kĩ thuật máy chủ để được cấp các loại mã mật khẩu truy cập.", "Người dùng chỉ việc điều hướng nháy chuột chọn môn học trong thư mục cấp ba rồi nháy tiếp vào ảnh học liệu tương ứng và lựa chọn mục Học trực tuyến.", "Người dùng bắt buộc phải nạp tiền cọc vào tài khoản hệ thống thông qua cổng thanh toán ngân hàng trực tuyến để luôn duy trì đường truyền tốc độ cao.", "Người dùng chỉ cần gõ đúng tên bài giảng vào khung nhập liệu giọng nói và chờ đợi trong vài giây để hệ thống tự động in ấn toàn bộ tài liệu ra giấy."], correct: 1 },
        { id: '1_c1', type: 'tf_cluster', question: "Bạn Tuấn đang hoàn thành bài kiểm tra về khái niệm cơ bản của mạng máy tính: Mạng cục bộ (LAN) và Internet toàn cầu. Hãy kiểm tra tính Đúng/Sai của những câu trả lời do Tuấn biên soạn:", subQuestions: [

            { id: '1_d25b', text: " Trong sơ đồ liên kết của hệ thống mạng, thiết bị bộ chia tín hiệu (Hub) và bộ chuyển mạch (Switch) được giới công nghệ thiết kế chuyên biệt để kết nối các mạng LAN lại với nhau qua Internet.", correct: "Sai" },
            { id: '1_d25c', text: " Mạng lưới viễn thông Internet toàn cầu thực chất là tài sản riêng độc quyền được sở hữu, quản trị và điều hành bởi một cơ quan quản lý tập trung duy nhất đóng trụ sở tại Hợp chủng quốc Hoa Kỳ.", correct: "Sai" },
            { id: '1_d25d', text: " Khi gia đình bạn Tuấn vừa đăng ký thành công việc lắp đặt và phát sóng gói mạng cáp quang tốc độ cao của nhà mạng Viettel, Tuấn đã vô tình tạo ra một mạng Internet cục bộ hoàn toàn tách biệt.", correct: "Sai" }
        ]},
        { id: '1_c2', type: 'tf_cluster', question: "Nhóm kĩ thuật của bạn Dũng nghiên cứu về cấu trúc hoạt động của các loại phần mềm độc hại (malware) để chuẩn bị cho buổi báo cáo. Hãy đánh giá tính Đúng/Sai của các luận điểm sau:", subQuestions: [
            { id: '1_d26a', text: " Phần mềm độc hại (malware) là danh từ chung để chỉ những phần mềm được viết ra với ý đồ xấu, nhằm mục đích gây hại cho hệ thống và người dùng máy tính.", correct: "Đúng" },
            { id: '1_d26b', text: " Trái ngược hoàn toàn với virus, sâu máy tính (Worm) là một loại phần mềm hoàn chỉnh và có khả năng độc lập tự lây lan thông qua việc lừa người dùng nhấp vào các liên kết độc hại.", correct: "Đúng" },
            { id: '1_d26c', text: " Đặc trưng cơ bản của các phần mềm gián điệp thuộc nhóm Trojan là chúng luôn cảnh báo rõ ràng bằng âm thanh cho nạn nhân biết trước khi bắt đầu quá trình mã hóa dữ liệu ổ cứng.", correct: "Sai" },
            { id: '1_d26d', text: " Do máy tính của mình đang chạy hệ điều hành Windows 10 vốn dĩ đã vô cùng hiện đại, Dũng quyết định vô hiệu hóa phần mềm bảo mật Windows Defender để cài đặt các tựa game bị bẻ khóa (crack) cho máy nhẹ hơn.", correct: "Sai" }
        ]},
        { id: '1_c3', type: 'tf_cluster', question: "Trong giờ học chuyên đề về phòng chống bạo lực và các vấn nạn trên môi trường số, giáo viên đã liệt kê một số nhận định. Hãy xét tính Đúng/Sai của các đánh giá sau:", subQuestions: [
            { id: '1_d27a', text: " Tình trạng nghiện mạng xảy ra khi một người dành quá nhiều thời gian liên tục cho mạng Internet hoặc chơi game đến mức gây ảnh hưởng nghiêm trọng tới sức khoẻ vật lý và tinh thần.", correct: "Đúng" },
            { id: '1_d27b', text: " Vấn nạn bắt nạt trên không gian mạng mang tính chất như một kiểu khủng bố tinh thần, người bắt nạt có thể dễ dàng ẩn danh để buông lời đe doạ khiến nạn nhân rất khó đối phó.", correct: "Đúng" },
            { id: '1_d27c', text: " Khi không may trở thành nạn nhân của bạo lực mạng, giải pháp ứng xử khôn ngoan nhất là người dùng phải chủ động lập các chủ đề tranh luận nảy lửa trên diễn đàn để bảo vệ quan điểm cá nhân đến cùng.", correct: "Sai" },
            { id: '1_d27d', text: " Nếu nhận được những tin nhắn tống tiền từ một kẻ lạ mặt trên Zalo kèm theo hình ảnh cắt ghép đe dọa, học sinh nên ngoan ngoãn chuyển tiền ngay lập tức để mua sự bình yên tạm thời cho bản thân.", correct: "Sai" }
        ]},
        { id: '1_c4', type: 'tf_cluster', question: "Bạn Lan đang tự mình kiên trì rèn luyện kĩ năng ngoại ngữ chuyên ngành kết hợp kĩ năng tự học nghiên cứu thông qua nền tảng mạng Internet. Lan cẩn thận ghi chép lại các bước thực hành của bản thân. Xác định tính Đúng/Sai của các dòng ghi chú kĩ thuật này:", subQuestions: [
            { id: '1_d28a', text: " Trong giao diện phần mềm trực tuyến Google Translate, nếu người dùng có nhu cầu muốn dịch toàn bộ một tệp tài liệu nguyên bản có sẵn lưu trong máy tính (ví dụ tệp văn bản .docx), họ bắt buộc cần phải nháy chuột vào thẻ chức năng lựa chọn mục \"Tài liệu\".", correct: "Đúng" },
            { id: '1_d28b', text: " Khi chế độ chức năng thu âm nhập văn bản bằng lời nói trên giao diện Google Translate được người dùng kích hoạt thành công để chuẩn bị thu âm thanh, biểu tượng hình chiếc micro tích hợp trên màn hình sẽ lập tức tự động chuyển đổi sang trạng thái hiển thị màu xanh.", correct: "Đúng" },
            { id: '1_d28c', text: " Các định dạng bài giảng phục vụ việc học trực tuyến trên nền tảng trang web igiaoduc.vn được nhà cung cấp phân phối dưới rất nhiều hình thức phong phú đa dạng, ví dụ điển hình nhất như dạng video quay trực tiếp lớp học hoặc đoạn phim được chuyển thể kĩ thuật số từ các bản trình chiếu của giáo viên.", correct: "Đúng" },
            { id: '1_d28d', text: " Do đoạn trích tài liệu văn học bằng ngôn ngữ tiếng Pháp trong bài nghiên cứu quá dài để có thể thực hiện bôi đen sao chép thủ công, Lan quyết định đổi sang dùng tính năng dịch \"Tài liệu\" của Google Translate; tuy nhiên hệ thống phần mềm lập tức báo lỗi đỏ vì tính năng này được lập trình tuyệt đối không hỗ trợ xử lý các tệp tin đang được lưu dưới định dạng PDF.", correct: "Sai" }
        ]}
    ];

    let currentQuestions = [];
    let deviceId = '';
    let allScores = [];
    let currentStudent = {};
    let userAnswers = {};
    let timerInterval;
    let quizStartTime, quizEndTime;
    
    let currentPage = 1;
    const rowsPerPage = 10;
    let sortedScoresList = [];

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Kiểm Tra Thường Xuyên Đề 3 -Tin Học 10' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        // Không trộn thứ tự câu hỏi, chỉ trộn ngẫu nhiên các đáp án ở từng câu đơn
        let part1 = rawQuestions.filter(q => q.type === 'single');
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            let correctText = q.options[q.correct];
            q.options = shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);
        });
        
        let part2 = rawQuestions.filter(q => q.type === 'tf_cluster');
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text.replace(/^[a-d]\)\s*/i, '')}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(20 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }
    };

    window.viewScoresAction = function() {
        if (database) {
            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                currentPage = 1;
                window.renderScores();
                showSection('scores');
            });
        }
    };

    window.goHome = function() {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('hoTen').value = ''; 
        document.getElementById('lop').value = ''; 
        clearInterval(timerInterval);
        showSection('login');
    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

    window.selectAnswer = function(qId, val, type) {
        userAnswers[qId] = val;
        window.updateProgress();
    };

    window.renderQuestion = function() {
        if (!currentQuestions || currentQuestions.length === 0) return;
        const q = currentQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        if (q.type === 'tf_cluster') {
            container.innerHTML = `<div class="fade-in">
                <div class="flex items-center gap-3 mb-6 border-b-2 border-orange-100 pb-3">
                    <span class="bg-gradient-to-br from-orange-400 to-red-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">II</span>
                    <h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 to-red-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM ĐÚNG/SAI</h3>
                </div>
                <div class="bg-red-50 border-2 border-red-200 p-4 sm:p-6 rounded-2xl mb-6 text-red-700 text-lg sm:text-xl font-bold leading-relaxed shadow-inner">
                    ${q.displayQuestion.replace(/\n/g, '<br/>')}
                </div>
                <div class="space-y-4 md:pl-6">
                    ${q.subQuestions.map(sub => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-5 sm:p-6 border-2 border-gray-100 hover:border-red-300 rounded-2xl gap-4 shadow-sm hover:shadow-md transition-all">
                        <span class="flex-1 text-gray-800 font-bold text-lg sm:text-xl leading-relaxed">${sub.text}</span>
                        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto mt-3 sm:mt-0 justify-between sm:justify-end">
                            <input type="radio" id="q_${sub.id}_T" name="q_${sub.id}" value="Đúng" class="hidden tf-radio-T" onchange="window.selectAnswer('${sub.id}', 'Đúng', 'tf')" ${userAnswers[sub.id] === 'Đúng' ? 'checked' : ''}>
                            <label for="q_${sub.id}_T" class="tf-label-T flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Đúng</label>
                            
                            <input type="radio" id="q_${sub.id}_S" name="q_${sub.id}" value="Sai" class="hidden tf-radio-S" onchange="window.selectAnswer('${sub.id}', 'Sai', 'tf')" ${userAnswers[sub.id] === 'Sai' ? 'checked' : ''}>
                            <label for="q_${sub.id}_S" class="tf-label-S flex-1 sm:flex-none px-4 py-4 border-2 border-gray-200 rounded-xl cursor-pointer font-bold text-gray-500 text-base sm:text-lg text-center w-full sm:w-32 transition-all hover:bg-gray-50 uppercase tracking-wide active:scale-95 touch-manipulation">Sai</label>
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        } else {
            container.innerHTML = `<div class="fade-in">
                ${currentIdx === 0 ? `<div class="flex items-center gap-3 mb-6 border-b-2 border-blue-100 pb-3"><span class="bg-gradient-to-br from-blue-400 to-cyan-500 text-white w-10 h-10 flex items-center justify-center rounded-xl font-bold text-xl shadow-md">I</span><h3 class="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-600 tracking-wide uppercase">PHẦN TRẮC NGHIỆM MỘT LỰA CHỌN</h3></div>` : ''}
                <div class="flex gap-4 mb-5">
                    <div class="w-full">
                        <p class="text-xl sm:text-2xl font-bold text-red-600 mt-1 leading-snug tracking-tight">${q.displayQuestion}</p>
                    </div>
                </div>
                <div class="space-y-4 md:pl-14 mt-6">
                    ${q.options.map((opt, i) => `
                    <div class="flex items-center">
                        <input type="radio" id="opt_${i}" name="q_${q.id}" value="${i}" class="hidden single-radio" ${userAnswers[q.id] === i ? 'checked' : ''} onchange="window.selectAnswer('${q.id}',${i}, 'single')">
                        <label for="opt_${i}" class="option-label w-full p-4 sm:p-5 border-2 border-gray-200 rounded-2xl flex items-center gap-4 bg-white shadow-sm font-semibold text-lg sm:text-xl active:scale-[0.98] touch-manipulation">
                            <span class="w-12 h-12 sm:w-10 sm:h-10 rounded-xl border-2 border-gray-300 flex items-center justify-center text-lg sm:text-base font-bold text-gray-400 flex-shrink-0 bg-gray-50 transition-colors">${String.fromCharCode(65 + i)}</span>
                            <span class="text-gray-700 leading-relaxed">${opt}</span>
                        </label>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        window.updateNav();
        window.updateProgress();
    };

    window.updateNav = function() {
        document.getElementById('next-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'none' : 'block';
        document.getElementById('submit-btn').style.display = (currentIdx === currentQuestions.length - 1) ? 'block' : 'none';
    };

    window.updateProgress = function() {
        document.getElementById('progress-text').innerText = `${getAnsweredCount()}/${getTotalItems()} ý`;
    };

    function formatDuration(sec) {
        const m = Math.floor(sec / 60); const s = sec % 60;
        return `${m}p ${s}s`;
    }

    window.submitQuiz = function() {
        if (!isQuizStarted) return; 
        isQuizStarted = false; 
        
        quizEndTime = new Date();
        clearInterval(timerInterval);

        let totalScore = 0;
        let correctSubItems = 0;
        let totalItems = getTotalItems();

        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        // Sắp xếp điểm ưu tiên từ cao xuống thấp
        sortedScoresList = [...allScores].sort((a, b) => {
            if (b.diem !== a.diem) {
                return b.diem - a.diem;
            }
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                // Chỉ in ra định dạng ngày tháng năm
                timeStr = dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
</html>
