        { id: "q8", type: "single", question: "Câu 8: Thẻ (Tab) nào trong hộp thoại Fill and Stroke dùng để điều chỉnh độ dày mỏng và kiểu dáng của đường viền (nét liền, nét đứt)?", options: ["Stroke paint.", "Fill.", "Pattern.", "Stroke style."], correct: 3, explanation: "Thẻ Stroke style (Kiểu nét vẽ) cho phép tinh chỉnh độ dày mỏng (Width) và các kiểu nét (Dashes) của đường viền bao quanh hình." },
        { id: "q9", type: "single", question: "Câu 9: Điểm khác biệt cốt lõi giữa hai kiểu tô màu Linear gradient và Radial gradient là gì?", options: ["Linear gradient dùng cho đường viền, Radial gradient dùng cho phần ruột.", "Linear gradient chuyển sắc theo đường thẳng, Radial gradient chuyển sắc lan toả từ tâm.", "Linear gradient làm mờ hình, Radial gradient làm hình sắc nét.", "Linear gradient tạo hiệu ứng 3D, Radial gradient tạo hiệu ứng trong suốt."], correct: 1, explanation: "Linear gradient tạo dải màu biến thiên dần theo một phương thẳng, trong khi Radial gradient lan toả màu từ một điểm tâm ra xung quanh thành vòng tròn." },
        { id: "q10", type: "single", question: "Câu 10: Để biến các đỉnh nhọn của một hình sao trở nên cong và mềm mại, cần thay đổi tham số nào trên thanh điều khiển thuộc tính?", options: ["Tăng tham số Corners.", "Thay đổi tham số Randomized.", "Tăng tham số Rounded.", "Điều chỉnh tham số Spoke ratio."], correct: 2, explanation: "Tham số Rounded điều chỉnh độ bo cong của các đỉnh. Tăng tham số này làm đỉnh nhọn của hình sao trở nên tròn và mềm mại hơn." },
        { id: "q11", type: "single", question: "Câu 11: Chức năng chính của thuộc tính Spoke ratio khi vẽ hình sao là gì?", options: ["Tăng số lượng cánh của hình sao.", "Làm cong các góc nhọn của hình sao.", "Làm méo mó hình sao một cách ngẫu nhiên.", "Thay đổi tỉ lệ bán kính từ tâm đến góc trong và từ tâm tới đỉnh đầu (làm cánh sao mập hoặc gầy đi)."], correct: 3, explanation: "Spoke ratio quy định tỉ lệ giữa bán kính vòng trong và vòng ngoài của hình sao, qua đó kiểm soát độ vươn dài hay thụt ngắn của cánh sao." },
        { id: "q12", type: "single", question: "Câu 12: Kết quả nhận được khi sử dụng phép ghép Intersection (Giao) trên hai đối tượng đồ hoạ là gì?", options: ["Giữ lại phần thuộc cả hai hình được chọn.", "Giữ lại phần hình thuộc các hình trừ phần giao nhau.", "Cắt hình lớp dưới thành nhiều mảnh.", "Hợp nhất toàn bộ hai hình thành một."], correct: 0, explanation: "Phép giao (Intersection) thực hiện lấy phần không gian giao nhau, chỉ giữ lại phần diện tích đè lên nhau chung của hai khối hình." },
        { id: "q13", type: "single", question: "Câu 13: Khi muốn vẽ hình một bông hoa từ công cụ hình sao ban đầu, ta điều chỉnh tham số nào để cánh hoa tròn trịa?", options: ["Tăng số đỉnh Corners lên tối đa.", "Sử dụng lệnh Path > Difference.", "Điều chỉnh tham số Rounded để làm cong đỉnh và góc.", "Điều chỉnh độ trong suốt Opacity."], correct: 2, explanation: "Để tạo hình dáng cánh hoa từ cánh sao nhọn, thao tác cần thiết là bo tròn các góc đỉnh bằng cách tăng thông số Rounded." },
        { id: "q14", type: "single", question: "Câu 14: Giá trị Opacity trong hộp thoại Fill and Stroke được dùng để kiểm soát điều gì?", options: ["Số lượng màu chuyển sắc trong dải Gradient.", "Độ dày của nét vẽ bao quanh khối.", "Kích thước thu phóng của đối tượng.", "Độ trong suốt của màu khi tô lên đối tượng."], correct: 3, explanation: "Opacity xác định độ mờ hoặc độ trong suốt tổng thể của đối tượng. Giảm Opacity sẽ làm hình ảnh dễ dàng nhìn xuyên qua lớp nền." },
        { id: "q15", type: "single", question: "Câu 15: Phép ghép Division (Chia) thao tác trên hai hình chồng lên nhau sẽ có tác dụng gì?", options: ["Lấy phần giao nhau của hai hình.", "Hình lớp dưới được chia thành các phần bởi đường nét của hình lớp trên.", "Cắt hình lớp dưới và xoá luôn màu tô của nó.", "Giữ nguyên hình lớp trên, xoá toàn bộ hình lớp dưới."], correct: 1, explanation: "Trong phép Division, hình bên trên đóng vai trò như một khuôn cắt, chia cắt rời hình bên dưới thành các mảnh nhỏ theo đường viền." },
        { id: "q16", type: "single", question: "Câu 16: Tùy chọn Unset (Huỷ đặt) trong hộp thoại chỉnh màu có tác dụng gì?", options: ["Huỷ thiết lập màu (đối tượng không có màu xác định, có thể thừa kế màu sắc).", "Làm đối tượng hoàn toàn biến mất khỏi bản vẽ.", "Tô hình bằng màu đen trắng mặc định.", "Chuyển đổi màu tô thành nét vẽ."], correct: 0, explanation: "Tùy chọn Unset (biểu tượng dấu ?) sẽ hủy thiết lập màu hiện tại. Lúc này đối tượng không có màu xác định (hiển thị màu đen) và có khả năng thừa kế màu sắc, rất hữu ích khi làm việc với đối tượng nhân bản (Clone)." },
        { id: "q17", type: "single", question: "Câu 17: Phương pháp ghép hình nào hiệu quả nhất để thiết kế một đám mây?", options: ["Vẽ một hình elip, chỉnh Stroke style và dùng lệnh Cut Path.", "Vẽ một hình tròn và một đa giác rồi dùng lệnh Difference.", "Vẽ một hình chữ nhật bo góc và nhiều hình tròn rồi dùng lệnh Union.", "Vẽ nhiều hình vuông rồi dùng phép Intersection."], correct: 2, explanation: "Đám mây thường được vẽ bởi phần đáy phẳng từ hình chữ nhật (bo góc) và phần bồng bềnh từ nhiều hình tròn nhỏ đè lên trên, sau đó gộp tất cả lại bằng Union." },
        { id: "q18", type: "single", question: "Câu 18: Để tạo hình trái tim từ một hình vuông và hai nửa hình tròn, sau khi xếp chúng đúng vị trí (hai nửa hình tròn kề trên hai cạnh hình vuông đã xoay), ta dùng lệnh gì để hoàn thiện?", options: ["Path > Union.", "Path > Division.", "Path > Difference.", "Path > Exclusion."], correct: 0, explanation: "Sau khi định hình xếp 3 mảnh chính xác, cần hàn chúng lại bằng lệnh Path > Union để trở thành một trái tim hoàn chỉnh và duy nhất." },
        { id: "q19", type: "single", question: "Câu 19: Bạn muốn vẽ biểu tượng vầng trăng khuyết một cách nhanh nhất, thao tác nào dưới đây là đúng?", options: ["Vẽ một hình tròn, dùng công cụ chỉnh điểm neo kéo lõm một phía.", "Dùng công cụ vẽ hình sao, giảm số cánh xuống còn 2 và tăng Rounded.", "Vẽ hai hình tròn đè lên nhau (lệch một chút) và dùng phép ghép Difference.", "Vẽ hình đa giác và dùng phép ghép Union."], correct: 2, explanation: "Dùng hình tròn to ở dưới, lấy hình tròn nhỏ đè lên che đi một phần rồi dùng lệnh Difference (Trừ) sẽ cắt khoét tạo ra lưỡi liềm trăng khuyết cực chuẩn." },
        { id: "q20", type: "single", question: "Câu 20: Để tạo hiệu ứng 3D hình cầu nổi khối như quả bóng, kĩ thuật tô màu nào cho hình tròn là phù hợp nhất?", options: ["Tô màu đồng nhất (Flat color).", "Tô hoa văn (Pattern).", "Tô màu chuyển sắc theo đường thẳng (Linear gradient).", "Tô màu chuyển sắc từ tâm (Radial gradient) kết hợp chỉnh điểm sáng."], correct: 3, explanation: "Radial gradient tạo điểm sáng từ tâm và tối dần ra viền, phản ánh hoàn hảo hiệu ứng chiếu sáng 3D trên một khối cầu." },
        { id: "q21", type: "single", question: "Câu 21: Khi muốn tạo một đường viền bo tròn (không có ruột màu) từ công cụ hình elip (như bài thực hành vẽ logo vòng cung), ta cần thiết lập màu như thế nào?", options: ["Thẻ Fill: No paint; Thẻ Stroke paint: Flat color; Thẻ Stroke style: Tăng giá trị Width.", "Thẻ Fill: Flat color; Thẻ Stroke paint: No paint.", "Thẻ Fill: Radial gradient; Thẻ Stroke paint: Pattern.", "Thẻ Fill: Linear gradient; Thẻ Stroke paint: Unset."], correct: 0, explanation: "Yêu cầu vòng cung rỗng bắt buộc phần tô nền (Fill) phải tắt (No paint), chỉ kích hoạt nét vẽ (Stroke paint) và chỉnh độ dày (Stroke style)." },
        { id: "q22", type: "single", question: "Câu 22: Thao tác nào giúp loại bỏ hoàn toàn viền bao quanh của một khối hình đa giác?", options: ["Chọn thẻ Fill và chọn No paint.", "Chọn thẻ Stroke style và chọn nét đứt.", "Giảm Opacity trong thẻ Fill xuống mức 0.", "Chọn thẻ Stroke paint và chọn biểu tượng No paint (Dấu X)."], correct: 3, explanation: "Đường viền do thẻ Stroke paint quản lý. Việc chọn dấu X (No paint) ở thẻ này sẽ lập tức xóa sạch đường viền bao quanh đối tượng." },
        { id: "q23", type: "single", question: "Câu 23: Để điều chỉnh trực tiếp trên màn hình hướng chuyển màu và độ rộng của dải màu Gradient, ta sử dụng thao tác nào?", options: ["Bấm biểu tượng Select and transform.", "Nháy vào biểu tượng cây bút (Create and edit gradients) phía dưới hộp thoại Fill and Stroke.", "Kéo giãn đối tượng bằng chuột phải.", "Tăng thông số Corners trên thanh điều khiển."], correct: 1, explanation: "Công cụ Edit Gradient (biểu tượng cây bút) cho phép kích hoạt các điểm điều khiển màu trực tiếp trên hình vẽ để kéo thả hướng sáng dễ dàng." },
        { id: "q24", type: "single", question: "Câu 24: Nếu bạn chọn hai đối tượng giao nhau, sau đó nhấn tổ hợp phím Ctrl + Alt + / (Cut Path), kết quả trả về sẽ là gì?", options: ["Phần giao nhau bị đục lỗ rỗng.", "Hai hình tự động hợp lại thành một khối duy nhất.", "Hình lớp trên bị cắt thành nhiều mảnh nhỏ và giữ nguyên màu tô.", "Hình lớp dưới bị cắt thành các phần bởi hai điểm giao ở viền với hình lớp trên, kết quả là các phần mới không có màu tô."], correct: 3, explanation: "Phép Cut Path (Cắt đường nét) dùng đường viền hình trên để cắt đứt đường viền hình dưới tại các điểm giao cắt. Kết quả sinh ra các đoạn đường viền rời rạc và màu tô của hình dưới sẽ bị biến mất (rớt màu)." },

        { id: "qII_1", type: "tf_cluster", context: "Câu 1: Bạn An đang thiết kế một bức tranh phong cảnh bằng phần mềm đồ hoạ. An muốn vẽ một ông mặt trời to tỏa sáng rực rỡ từ tâm ra xung quanh và một số đám mây bồng bềnh trên bầu trời.", items: [
            { id: "a", text: "a) Để tô màu mặt trời sáng mạnh ở tâm và nhạt dần ra viền ngoài, An cần sử dụng kiểu tô màu chuyển sắc từ tâm (Radial gradient).", correct: true, expl: "Radial gradient giúp màu sắc lan tỏa từ một điểm trung tâm ra xung quanh, rất thích hợp để mô phỏng ánh sáng mặt trời." },
            { id: "b", text: "b) Để gộp các hình tròn và một hình chữ nhật lại thành khối mây duy nhất, An sử dụng lệnh ghép hình Path > Difference.", correct: false, expl: "Để gộp các khối lại làm một, phải dùng lệnh Path > Union. Difference là lệnh lấy hiệu (phép trừ) giữa hai khối." },
            { id: "c", text: "c) Khi thiết kế các tia sáng của mặt trời bằng công cụ vẽ hình sao, An có thể thay đổi thông số 'Corners' để tăng hoặc giảm số lượng tia sáng.", correct: true, expl: "Thông số Corners trong công cụ Star and Polygon chính là số đỉnh (cánh sao), tương ứng với số tia sáng của mặt trời." },
            { id: "d", text: "d) Để bầu trời phía sau có thể lờ mờ hiện ra qua đám mây, An cần giảm thông số Opacity (độ trong suốt) của khối mây trong hộp thoại Fill and Stroke.", correct: true, expl: "Giảm thông số Opacity làm khối mây bớt đặc và trở nên trong suốt, giúp nhìn xuyên qua để thấy lớp hình phía sau." }
        ]},
        { id: "qII_2", type: "tf_cluster", context: "Câu 2: Bạn Bình đang làm bài tập thiết kế logo cho câu lạc bộ Tin học. Bản phác thảo logo yêu cầu có hình một chiếc bánh răng cưa và một hình vòng tròn khuyết (như mặt trăng).", items: [
            { id: "a", text: "a) Bình có thể dùng công cụ vẽ Đa giác, hình sao (Star and Polygon tool) làm cơ sở để tạo ra hình bánh răng cưa.", correct: true, expl: "Hình sao nhiều cánh (với thông số Corners cao) là nền tảng cơ sở hoàn hảo để thiết kế các mũi răng cưa." },
            { id: "b", text: "b) Để loại bỏ hoàn toàn viền của tất cả các khối hình trong logo, Bình chỉ cần mở thẻ Fill và chọn biểu tượng No paint (Không màu).", correct: false, expl: "Thẻ Fill quản lý màu nền bên trong. Để xóa bỏ đường viền, Bình phải thực hiện ở thẻ Stroke paint." },
            { id: "c", text: "c) Để làm các góc nhọn của bánh răng cưa trở nên mềm mại, bo cong hơn, Bình cần thay đổi thông số Spoke ratio thay vì Rounded.", correct: false, expl: "Tham số bo cong cạnh góc nhọn là Rounded. Spoke ratio chỉ xác định độ nông sâu, dài ngắn của cánh nhọn đó." },
            { id: "d", text: "d) Để tạo ra hình vòng khuyên (donut), Bình có thể vẽ hai hình tròn đồng tâm (một to, một nhỏ), chọn cả hai và thực hiện phép trừ Path > Difference.", correct: true, expl: "Lấy hình tròn lớn trừ đi hình tròn nhỏ ở giữa (Path > Difference) sẽ để lại phần viền và khoét rỗng lỗ ở tâm." }
        ]},
        { id: "qII_3", type: "tf_cluster", context: "Câu 3: Trong giờ học thực hành, bạn Châu được giao nhiệm vụ tạo một chiếc nhãn vở có đường viền bao quanh là nét đứt, trang trí kèm một bông hoa 5 cánh chụm lại ở góc.", items: [
            { id: "a", text: "a) Châu sử dụng hộp thoại Fill and Stroke để có thể thiết lập độc lập màu tô phần nền và màu nét vẽ viền cho nhãn vở.", correct: true, expl: "Hộp thoại Fill and Stroke cho phép thiết lập độc lập: Fill (Nền) không ảnh hưởng tới Stroke paint (Màu viền) và ngược lại." },
            { id: "b", text: "b) Nếu Châu lỡ tay quét chọn hai hình và bấm lệnh Path > Union, phần mềm sẽ chỉ giữ lại vùng giao nhau chung của hai hình đó.", correct: false, expl: "Lệnh Union sẽ gộp tất cả diện tích của cả hai hình. Việc chỉ giữ lại vùng giao nhau là chức năng của phép Intersection." },
            { id: "c", text: "c) Để chuyển đường viền của nhãn vở từ nét liền sang dạng nét đứt, Châu mở hộp thoại Fill and Stroke và tiến hành tuỳ chỉnh trong thẻ Stroke style.", correct: true, expl: "Thẻ Stroke style cho phép chỉnh sửa không chỉ độ dày (Width) mà còn các tuỳ chọn nét đứt (Dashes) của đường viền." },
            { id: "d", text: "d) Để vẽ bông hoa 5 cánh nhanh chóng, Châu sẽ vẽ một hình sao 5 cánh trước, sau đó chỉnh sửa tham số Rounded trên thanh thuộc tính để làm cong các góc và đỉnh nhọn.", correct: true, expl: "Việc sử dụng hình sao (5 cánh) rồi nâng giá trị Rounded để bo cong cạnh nhọn là kỹ thuật chuẩn xác tạo hình bông hoa." }
        ]},
        { id: "qII_4", type: "tf_cluster", context: "Câu 4: Bạn Dũng cần hoàn thiện một poster quảng cáo trái cây, trong đó mô tả chi tiết đồ hoạ của một miếng dưa hấu xếp nhiều lớp và một quả cam hình cầu có hiệu ứng nổi 3D.", items: [
            { id: "a", text: "a) Các hình khối Dũng vẽ trong phần mềm sẽ tự động tuân thủ nguyên tắc xếp lớp, hình vẽ trước nằm ở lớp dưới, hình vẽ sau đè lên lớp trên.", correct: true, expl: "Inkscape quản lý các đối tượng đồ họa xếp chồng theo nguyên lý đối tượng sinh ra sau luôn đè lên đối tượng trước (nằm lớp trên)." },
            { id: "b", text: "b) Khi Dũng áp dụng phép chia (Division), đường nét của hình lớp trên sẽ đóng vai trò như lưỡi dao cắt khối hình lớp dưới ra thành các phần riêng biệt.", correct: true, expl: "Phép Division sử dụng ranh giới của đối tượng bên trên cắt lìa đối tượng bên dưới thành các mảnh độc lập." },
            { id: "c", text: "c) Để quả cam có hiệu ứng nổi 3D khối cầu, Dũng chỉ cần chọn hình tròn và tô một màu đồng nhất (Flat color) thật nổi bật là đủ.", correct: false, expl: "Tô màu Flat color (màu phẳng) chỉ tạo được hình 2D, để có hiệu ứng 3D nổi khối cần ứng dụng kĩ thuật tô màu toả tròn (Radial gradient)." },

    function getTotalScoreItems() { return currentQuestions.length; }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'single') {
                if (userAnswers[q.id] !== undefined) count++;
            } else if (q.type === 'tf_cluster') {
                let answeredItems = 0;
                q.items.forEach(item => { if (userAnswers[q.id + '_' + item.id] !== undefined) answeredItems++; });
                if (answeredItems === 4) count++; 
            }
        });
        return count;
    }

   window.selectAnswer = function(qId, val, type) {

            const btnT = document.getElementById(`btnT_${qId}`);
            const btnF = document.getElementById(`btnF_${qId}`);

    function formatDuration(sec) {

    window.promptSubmit = function() {
        if (!isQuizStarted) return;
        document.getElementById('confirm-answered').innerText = getAnsweredCount();
        document.getElementById('confirm-total').innerText = getTotalScoreItems();
        document.getElementById('confirm-submit-modal').classList.remove('hidden');
    };

    window.closeConfirmModal = function() { document.getElementById('confirm-submit-modal').classList.add('hidden'); };

    window.executeSubmit = function() {
        window.closeConfirmModal();
        isQuizStarted = false; 
        quizEndTime = new Date();
        clearInterval(timerInterval);
        
        let score = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'single') {
                if (userAnswers[q.id] === q.correct) score += 0.25;
            } else if (q.type === 'tf_cluster') {
                let correctCount = 0;
                q.items.forEach(item => { if (userAnswers[q.id + '_' + item.id] === item.correct) { correctCount++; } });
                if (correctCount === 1) score += 0.1;
                else if (correctCount === 2) score += 0.25;
                else if (correctCount === 3) score += 0.5;
                else if (correctCount === 4) score += 1.0;
            }
        });

        score = score.toFixed(2); 

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe, maDe: currentStudent.maDe, diem: parseFloat(score),
            startTime: quizStartTime.toISOString(), thoiGian: quizEndTime.toISOString(), deviceId: deviceId, userAnswers: userAnswers 
        };
        
        if(database) { scoresRef.push(record, () => { window.showModalResult(score, formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000))); }); } 
        else { window.showModalResult(score, formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000))); }
    };

        if (isCorrect) return `<div class="mt-4 mb-2 inline-block px-4 py-2 bg-emerald-100 text-emerald-800 text-base font-black rounded-lg border border-emerald-300 shadow-sm">✅ ĐÚNG</div>`;

        currentQuestions.forEach((q) => {
            if (q.type !== currentType) {

                if(currentType === 'tf_cluster') { headerText = 'TRẮC NGHIỆM ĐÚNG/SAI'; roman = 'II'; }
                html += `<div class="flex items-center gap-3 mt-8 mb-4 border-b-2 border-indigo-100 pb-3"><span class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white w-14 h-14 flex items-center justify-center rounded-xl font-black text-2xl shadow-md">${roman}</span><h3 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-purple-700 tracking-wide uppercase">${headerText}</h3></div>`;

        else { window.backToResult(); }

    window.reviewStudentScore = function(scoreId) {
        const record = allScores.find(x => x.id === scoreId);
        if (!record) return;
        currentStudent = { hoTen: record.hoTen, lop: record.lop, tenDe: record.tenDe, maDe: record.maDe };
        userAnswers = record.userAnswers || {}; 
        currentQuestions = JSON.parse(JSON.stringify(exam_data)); 
        isReviewingFromLeaderboard = true;
        window.reviewQuiz();
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const noScore = document.getElementById('no-scores');
        const myRankDisplay = document.getElementById('my-rank-display');
        const paginationContainer = document.getElementById('pagination-controls');
        if(!tbody) return;

        const sortedAll = [...allScores].sort((a, b) => b.diem - a.diem);
        
        sortedAll.forEach((s, i) => s.absoluteRank = i + 1);

        const myRankIndex = sortedAll.findIndex(s => s.deviceId === deviceId);
        if (myRankDisplay) {
            if (myRankIndex !== -1) { myRankDisplay.innerHTML = `STT của bạn: <span class="text-red-600 font-black">${sortedAll[myRankIndex].absoluteRank}</span>`; } 
            else { myRankDisplay.innerHTML = `STT của bạn: <span class="text-gray-400">Chưa thi</span>`; }
        }

        const filteredScores = searchTerm ? sortedAll.filter(s => s.hoTen.toLowerCase().includes(searchTerm)) : sortedAll;
        if (filteredScores.length === 0) {
            tbody.innerHTML = ''; noScore.classList.remove('hidden'); paginationContainer.innerHTML = ''; return; 
        }
        
        noScore.classList.add('hidden');
        const totalPages = Math.ceil(filteredScores.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1;
        const startIndex = (currentPage - 1) * itemsPerPage; const endIndex = startIndex + itemsPerPage;
        const pageItems = filteredScores.slice(startIndex, endIndex);

        tbody.innerHTML = pageItems.map((s) => {
            const isMe = s.deviceId === deviceId;
            let timeDisplay = "";
            if (s.thoiGian) {
                const d = new Date(s.thoiGian);
                if (!isNaN(d)) {
                    timeDisplay = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                }
            }

            return `<tr class="${isMe ? 'my-score-row' : 'hover:bg-slate-50'} transition-colors border-b border-slate-100">
            <td class="px-4 py-5 font-black text-slate-500 text-base text-center">${s.absoluteRank}</td>
            <td class="px-4 py-5 font-extrabold text-slate-800 text-base">${s.hoTen} ${isMe ? '<span class="ml-2 bg-pink-500 text-white text-xs px-2 py-1 rounded-md shadow-sm">Bạn</span>' : ''}</td>
            <td class="px-4 py-5 font-black text-blue-600 text-base text-center">${s.lop}</td>
            <td class="px-4 py-5 text-center font-black text-orange-600 text-sm whitespace-nowrap">${timeDisplay}</td>
            <td class="px-4 py-5 text-center"><span class="font-black text-2xl ${s.diem >= 5 ? 'text-emerald-600' : 'text-red-500'}">${s.diem}</span></td>
            <td class="px-4 py-5 text-center">
                <button onclick="window.reviewStudentScore('${s.id}')" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-lg font-bold text-sm transition-colors border border-indigo-200 shadow-sm cursor-pointer whitespace-nowrap">Xem lại</button>
            </td>
        </tr>`;
        }).join('');
        renderPagination(totalPages);
    };

    function renderPagination(totalPages) {
        const container = document.getElementById('pagination-controls');
        if (!container) return;
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '<div class="flex flex-wrap items-center justify-center gap-2">';
        html += `<button onclick="window.changePage(${currentPage - 1})" class="px-4 py-2 rounded-xl font-bold transition-colors ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}" ${currentPage === 1 ? 'disabled' : ''}>&laquo; Trước</button>`;
        let startPage = Math.max(1, currentPage - 1); let endPage = Math.min(totalPages, currentPage + 1);
        if (startPage > 1) { html += `<button onclick="window.changePage(1)" class="px-4 py-2 rounded-xl font-bold bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm">1</button>`; if (startPage > 2) html += `<span class="px-2 text-gray-400 font-black">...</span>`; }
        for (let i = startPage; i <= endPage; i++) { html += `<button onclick="window.changePage(${i})" class="px-4 py-2 rounded-xl font-bold transition-all ${i === currentPage ? 'bg-orange-500 text-white shadow-md border-orange-600' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}">${i}</button>`; }
        if (endPage < totalPages) { if (endPage < totalPages - 1) html += `<span class="px-2 text-gray-400 font-black">...</span>`; html += `<button onclick="window.changePage(${totalPages})" class="px-4 py-2 rounded-xl font-bold bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm">${totalPages}</button>`; }
        html += `<button onclick="window.changePage(${currentPage + 1})" class="px-4 py-2 rounded-xl font-bold transition-colors ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm'}" ${currentPage === totalPages ? 'disabled' : ''}>Sau &raquo;</button>`;
        html += '</div>'; container.innerHTML = html;
    }

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result', 'review'].forEach(s => { const el = document.getElementById(s+'-section'); if(el) el.classList.add('hidden'); });
        const tgt = document.getElementById(id+'-section'); if(tgt) tgt.classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer'); if(!display) return;
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
