  <script>
    let database = null;

    try {
        const firebaseConfig = {

            authDomain: "hoctap-91691.firebaseapp.com",
            databaseURL: "https://hoctap-91691-default-rtdb.asia-southeast1.firebasedatabase.app",

            messagingSenderId: "1004553425319",
            appId: "1:1004553425319:web:45d15cbae393f614c56682",

            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            scoresRef = database.ref('bxh_gk1_10_12');
        }
    } catch(err) { console.error("Lỗi Firebase:", err); }

    let cheatCount = 0;
    let isQuizStarted = false; 
    let isPenalizing = false; 
    let isSubmitting = false;

    window.handleCheatAction = function(reason) {
        if (!isQuizStarted || isPenalizing || isSubmitting) return; 
        const isQuizActive = !document.getElementById('quiz-section').classList.contains('hidden');
        
        if (isQuizActive) {
            isPenalizing = true;
            cheatCount++;
            document.getElementById('cheat-count-display').innerText = cheatCount;
            const modal = document.getElementById('cheat-modal');
            const msg = document.getElementById('cheat-message');
            const btn = document.getElementById('cheat-continue-btn');
            modal.classList.remove('hidden');
            
            const currentQ = currentQuestions[currentIdx];
            if (currentQ) {
                if (currentQ.type === 'tf_cluster') {
                    currentQ.subQuestions.forEach(sub => {
                        if (!userAnswers[sub.id]) userAnswers[sub.id] = "Gian lận"; 
                    });
                } else {
                    if (userAnswers[currentQ.id] === undefined) userAnswers[currentQ.id] = -1; 
                }
                updateProgress();
            }

            if (cheatCount >= 2) {
                msg.innerHTML = "Bạn đã vi phạm quy chế (Rời khỏi màn hình/Dùng phím cấm/Copy) quá 3 lần.<br>Hệ thống bắt buộc <b>TỰ ĐỘNG THU BÀI</b>!";
                btn.innerText = "NỘP BÀI NGAY";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    isPenalizing = false;
                    window.submitQuiz();
                };
            } else {
                msg.innerHTML = `Hệ thống phát hiện bạn vừa sử dụng thao tác : <b>${reason}</b>.<br><br><span class='text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg border border-red-200 inline-block mt-2 mb-2'>Câu hỏi này bị bỏ qua (0 điểm).</span><br><br><i class='text-sm text-gray-500'>Vui lòng bấm nút bên dưới để tiếp tục.</i>`;
                btn.innerText = "TÔI ĐÃ HIỂU & TIẾP TỤC";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    if (currentIdx < currentQuestions.length - 1) {
                        currentIdx++;
                        window.renderQuestion();
                    } else { window.submitQuiz(); }
                    isPenalizing = false;
                };
            }
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') {
            window.handleCheatAction('Chuyển tab hoặc thu nhỏ trình duyệt');
        }
    });

    window.addEventListener('keydown', (e) => {
        const forbiddenKeys = ['PrintScreen', 'F12'];
        if (forbiddenKeys.includes(e.key)) {
            e.preventDefault();
            window.handleCheatAction('Nhấn phím ' + e.key);
        }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            window.handleCheatAction('Dùng tổ hợp phím Ctrl + ' + e.key.toUpperCase());
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') window.handleCheatAction('Chụp màn hình');
    });

    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('selectstart', event => {
        if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') { event.preventDefault(); }
    });
    document.addEventListener('dragstart', event => event.preventDefault()); 
    document.addEventListener('copy', event => {
        event.clipboardData.setData('text/plain', 'Tài liệu đã được bảo vệ!');
        event.preventDefault();
        window.handleCheatAction('Sao chép (Copy) văn bản');
    });

    // NGÂN HÀNG CÂU HỎI MỚI (TIN HỌC 10)
    const de_data = [
    { id: "1_1", type: "single", question: "Trong nguyên lí hoạt động cơ bản của hệ thống máy tính, quy trình xử lí thông tin diễn ra theo trình tự như thế nào?", options: ["Thiết bị tiến hành tiếp nhận dữ liệu đầu vào, thực hiện quy trình xử lí dữ liệu và cuối cùng đưa ra kết quả.", "Thiết bị tiến hành phát ra các tín hiệu cảnh báo, tự động tổng hợp hình ảnh và mã hóa toàn bộ dữ liệu.", "Thiết bị tiến hành phân tích văn bản ngôn ngữ, tổng hợp các dải âm thanh và chia sẻ thông tin trực tuyến.", "Thiết bị tiến hành tính toán các loại con số, tự động in ấn tài liệu vật lí và truyền tải mọi tệp tin lên mạng."], correct: 0 },
    { id: "1_2", type: "single", question: "Khái niệm \"dữ liệu\" trong môi trường kĩ thuật số được các chuyên gia khoa học máy tính định nghĩa là gì?", options: ["Là tập hợp những loại thông tin đã được biến đổi đưa vào máy tính để thiết bị có thể nhận biết và xử lí.", "Là tập hợp những loại phần mềm tiện ích đã được lập trình sẵn nhằm quản trị hệ thống thư mục mạng.", "Là tập hợp những linh kiện phần cứng kĩ thuật số vô cùng phức tạp cấu tạo nên hệ thống máy tính.", "Là tập hợp những đoạn mã ngôn ngữ tự nhiên được con người sử dụng nhằm mục đích giao tiếp mạng."], correct: 0 },
    { id: "1_3", type: "single", question: "Theo chuẩn hệ thống đo lường quốc tế, một đơn vị Gigabyte (GB) sở hữu mức dung lượng kĩ thuật bằng bao nhiêu?", options: ["Mức dung lượng kĩ thuật này tương đương với độ lớn bằng chính xác 1024 đơn vị KiloByte (KB).", "Mức dung lượng kĩ thuật này tương đương với độ lớn bằng chính xác 1000 đơn vị KiloByte (KB).", "Mức dung lượng kĩ thuật này tương đương với độ lớn bằng chính xác 1024 đơn vị MegaByte (MB).", "Mức dung lượng kĩ thuật này tương đương với độ lớn bằng chính xác 1000 đơn vị MegaByte (MB)."], correct: 2 },
    { id: "1_4", type: "single", question: "Khi đánh giá về ưu điểm của các thiết bị máy tính điện tử, năng lực kĩ thuật nào dưới đây là vô cùng vượt trội so với con người?", options: ["Năng lực tự động sản sinh ra các nguồn năng lượng điện vô tận để thiết bị duy trì hoạt động vĩnh viễn.", "Năng lực tự động phân tích và thấu hiểu mọi loại cảm xúc tâm lí vô cùng tinh tế của não bộ con người.", "Năng lực thực hiện các phép tính toán khối lượng khổng lồ với độ chính xác cao và duy trì sự ổn định tốt.", "Năng lực thay thế hoàn toàn con người trong tất cả các hoạt động liên quan đến sáng tác nghệ thuật."], correct: 2 },
    { id: "1_5", type: "single", question: "Khái niệm \"Thiết bị thông minh\" được các kĩ sư công nghệ định nghĩa dựa trên đặc điểm nhận dạng kĩ thuật nào?", options: ["Là những công cụ cơ học truyền thống bắt buộc con người phải dùng tay để điều khiển mọi thao tác.", "Là những thiết bị điện tử có thể hoạt động tự chủ, tự thích ứng hoàn cảnh và có khả năng nối mạng.", "Là những cỗ máy tính lượng tử chỉ được ứng dụng duy nhất vào việc mô phỏng các hiện tượng thiên văn.", "Là những tấm bảng điện tử hiển thị bằng đèn LED chỉ có chức năng hiển thị số liệu mà không tính toán."], correct: 1 },
    { id: "1_6", type: "single", question: "Việc tích hợp nền tảng Trí tuệ nhân tạo (AI) giúp các thiết bị thông minh hiện nay sở hữu khả năng tuyệt vời gì?", options: ["Sở hữu khả năng tự động tiêu diệt toàn bộ mọi loại mã nguồn độc hại lây lan trên hệ thống mạng Internet.", "Sở hữu khả năng vô hiệu hóa hoàn toàn mọi thuật toán bảo mật của hệ thống ngân hàng tài chính quốc tế.", "Sở hữu khả năng chuyển đổi mọi loại tín hiệu sóng âm thanh thành các đoạn văn bản hiển thị trên thiết bị.", "Sở hữu khả năng \"bắt chước\" một phần hành vi giao tiếp và phong cách tư duy logic của não bộ con người."], correct: 3 },
    { id: "1_7", type: "single", question: "Mô hình kinh tế hiện đại nào lấy yếu tố chất xám trên cơ sở phát triển bền vững khoa học và công nghệ cao làm động lực phát triển?", options: ["Mô hình nền kinh tế nông nghiệp tập trung chuyên phân phối hàng hóa tiêu dùng bằng hình thức bao cấp.", "Mô hình nền kinh tế thương mại hàng hải chuyên khai thác sức lao động của công nhân tại các bến cảng.", "Mô hình nền kinh tế công nghiệp khai khoáng chuyên khai thác cạn kiệt các mỏ tài nguyên thiên nhiên thô.", "Mô hình nền kinh tế tri thức hiện đại chuyên ứng dụng các nền tảng tự động hóa và thiết bị thông minh."], correct: 3 },
    { id: "1_8", type: "single", question: "Trong lĩnh vực công nghệ số, thuật ngữ Trợ thủ số cá nhân (viết tắt là PDA) được định nghĩa chuẩn xác là thiết bị gì?", options: ["Là những cỗ máy chủ siêu khổng lồ được doanh nghiệp thiết lập chuyên dùng để vận hành điện toán đám mây.", "Là những thiết bị số được tích hợp rất nhiều chức năng tiện ích, mang kích thước nhỏ gọn và có khả năng kết nối.", "Là những phần mềm ứng dụng bảo mật chuyên dụng dùng để tiêu diệt các loại mã độc gián điệp trên không gian mạng.", "Là những trình duyệt website hiện đại được các nhà mạng thiết kế để hỗ trợ việc truy cập thư viện điện tử đa chiều."], correct: 1 },
    { id: "1_9", type: "single", question: "Hiện nay, hai nền tảng hệ điều hành di động nào đang chiếm vị trí phổ biến nhất trên thị trường điện thoại thông minh?", options: ["Hệ điều hành máy tính Windows của hãng Microsoft và hệ điều hành đồ họa Linux mã nguồn mở.", "Hệ điều hành thiết bị di động iOS của hãng Apple và hệ điều hành thiết bị di động Android của Google.", "Hệ điều hành máy chủ mạng UNIX truyền thống và hệ điều hành máy tính macOS của tập đoàn Apple.", "Hệ điều hành dòng lệnh MS-DOS cực kì cổ điển và hệ điều hành điện thoại phím Symbian thế hệ cũ."], correct: 1 },
    { id: "1_10", type: "single", question: "Trên hệ điều hành di động Android, phím chức năng ảo mang tên \"Quay lại\" (Back) nằm trên dải thanh điều hướng thực hiện nhiệm vụ gì?", options: ["Thực hiện nhiệm vụ tự động xóa vĩnh viễn toàn bộ các tin nhắn quảng cáo rác đang ngầm chạy trong hệ thống.", "Thực hiện nhiệm vụ tự động ngắt ngay lập tức mọi kết nối sóng vô tuyến mạng wifi của chiếc điện thoại di động đó.", "Thực hiện nhiệm vụ giúp thiết bị điện thoại điều hướng lùi trở lại trang giao diện trước đó hoặc thoát nhanh ứng dụng.", "Thực hiện nhiệm vụ giúp khóa chặt màn hình hiển thị cảm ứng bằng mật khẩu sinh trắc học nhằm bảo vệ quyền riêng tư."], correct: 2 },
    { id: "1_11", type: "single", question: "Khái niệm \"Internet vạn vật\" (viết tắt là IoT - Internet of Things) được hiểu một cách chính xác nhất là một hệ thống kĩ thuật như thế nào?", options: ["Là mạng lưới chuyên kết nối các dòng điện thoại thông minh để trao đổi khối lượng dữ liệu tin nhắn hình ảnh cá nhân.", "Là việc liên kết các thiết bị thông minh để tự động thu thập, trao đổi và xử lí luồng dữ liệu phục vụ mọi mục đích lớn.", "Là trung tâm điện toán đám mây khổng lồ chuyên cung cấp dịch vụ cho thuê phần mềm ứng dụng trực tuyến đa nền tảng.", "Là bộ giao thức truyền thông mạng lưới quốc tế quy định cách thức mã hoá các thẻ định dạng siêu văn bản đồ họa."], correct: 1 },
    { id: "1_12", type: "single", question: "Khi nói về mạng thông tin toàn cầu Internet, đặc điểm nhận dạng kĩ thuật nào dưới đây là vô cùng chính xác?", options: ["Internet là mạng diện rộng có quy mô toàn cầu và hoàn toàn không thuộc về quyền sở hữu của bất kỳ một cá nhân nào.", "Internet là hệ thống thiết bị phần cứng chuyển mạch chuyên biệt chỉ dành riêng cho các phòng thực hành nhà trường.", "Internet là trung tâm dữ liệu cục bộ được xây dựng độc quyền nhằm phục vụ lưu trữ thông tin tuyệt mật cho chính phủ.", "Internet là nền tảng điện toán đám mây chỉ cung cấp dịch vụ máy chủ cơ sở hạ tầng mạng cho các tập đoàn thương mại."], correct: 0 },
    { id: "1_13", type: "single", question: "Trong hệ thống cấu trúc dịch vụ điện toán đám mây, loại hình SaaS (Software as a service) mang ý nghĩa cung cấp tài nguyên gì?", options: ["Là hình thức cho thuê nền tảng bản đồ số để các tổ chức công nghệ dùng làm công cụ nhằm mục đích phát triển phần mềm.", "Là hình thức cho thuê phần cứng lưu trữ vật lí để người dùng bình thường tiến hành sao lưu dữ liệu cá nhân trên máy chủ mạng.", "Là hình thức cho thuê phần mềm ứng dụng như một dịch vụ để người dùng trực tiếp sử dụng trên nền tảng trình duyệt web.", "Là hình thức bán đứt hoàn toàn một chương trình hệ điều hành nhằm cài đặt trực tiếp và cố định vào hệ thống máy tính bàn."], correct: 2 },
    { id: "1_14", type: "single", question: "Trong lĩnh vực an toàn thông tin, đối tượng phần mềm độc hại nào thường xuyên lợi dụng các lỗ hổng bảo mật của hệ điều hành để tự động lây lan?", options: ["Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan độc lập tự động này được giới chuyên gia gọi tên là Sâu máy tính (Worm).", "Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan độc lập tự động này được giới chuyên gia gọi tên là Bức tường lửa (Firewall).", "Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan độc lập tự động này được giới chuyên gia gọi tên là Phần mềm tống tiền (DOS).", "Đối tượng phần mềm độc hại hoạt động theo cơ chế lây lan độc lập tự động này được giới chuyên gia gọi tên là Trợ lý kĩ thuật ảo (Botnet)."], correct: 0 },
    { id: "1_15", type: "single", question: "Trong các phân loại mã độc nội gián, phần mềm mang tên \"Keylogger\" được tin tặc thiết kế ra nhằm phục vụ mục đích kĩ thuật cốt lõi gì?", options: ["Nhằm mục đích vô hiệu hóa hệ thống bức tường lửa bảo vệ máy tính cá nhân và tắt toàn bộ mọi phần mềm chống vi rút đang chạy.", "Nhằm mục đích tạo ra một tài khoản đăng nhập bí mật có quyền lực cao nhất để chiếm đoạt hoàn toàn mọi bộ nhớ đệm của máy.", "Nhằm mục đích mã hóa tất cả các loại tệp tin lưu trữ trên đĩa cứng để ép buộc các nạn nhân phải tiến hành nộp tiền chuộc.", "Nhằm mục đích ngầm ghi lại mọi hoạt động của bàn phím và nhấp chuột để đánh cắp thông tin người sử dụng thiết bị mạng."], correct: 3 },
    { id: "1_16", type: "single", question: "Vấn nạn bắt nạt trên không gian mạng (cyberbullying) mang lại ảnh hưởng tâm lý trầm trọng và đáng sợ hơn nhiều so với bắt nạt truyền thống do nguyên nhân nào?", options: ["Do người thực hiện hành vi bắt nạt luôn luôn phải công khai rõ ràng danh tính thật của mình trên tất cả các diễn đàn trực tuyến quốc tế.", "Do sự việc có thể xảy ra dai dẳng bất cứ lúc nào, người bắt nạt được ẩn danh an toàn và số lượng người bình luận theo dõi là rất đông.", "Do nền tảng mạng xã hội luôn tự động chặn ngay lập tức bất kỳ một từ ngữ thô tục nào ngay khi chúng vừa được gõ ra trên bàn phím.", "Do pháp luật quốc tế đã có những hình phạt cực kỳ nghiêm khắc và mang tính răn đe cho tội bắt nạt trên mạng từ hàng chục năm trước."], correct: 1 },
    { id: "1_17", type: "single", question: "Tiện ích bảo mật \"Windows Defender\" được tích hợp sẵn bên trong hệ điều hành Windows 10 đảm nhận chức năng kĩ thuật vô cùng quan trọng nào?", options: ["Chức năng kĩ thuật quan trọng nhất là làm gia tăng tốc độ đường truyền tải cáp quang lên đến mức tối đa cho hệ thống phần cứng.", "Chức năng kĩ thuật quan trọng nhất là phục hồi và sửa chữa các bảng mạch vật lí bị hỏng hóc nằm sâu bên trong bộ vi xử lí trung tâm.", "Chức năng kĩ thuật quan trọng nhất là thường xuyên phòng chống virus, cảnh báo các loại mã độc lây lan và tiến hành bảo vệ thiết bị.", "Chức năng kĩ thuật quan trọng nhất là chạy ngầm tự động dọn dẹp các thùng rác điện tử và nén tất cả các tập tin trên mọi ổ đĩa cứng."], correct: 2 },
    { id: "1_18", type: "single", question: "Thuật ngữ \"ngôn ngữ nguồn\" trong giao diện điều khiển của phần mềm Google Translate mang ý nghĩa kĩ thuật cơ bản nào?", options: ["Là loại ngôn ngữ đầu ra để hệ thống máy chủ tiến hành biên dịch thành kết quả văn bản cuối cùng trả về hiển thị cho người xem.", "Là loại ngôn ngữ đầu vào cần được phần mềm tiếp nhận và tiến hành quá trình phân tích biên dịch thuật ngữ trên không gian mạng.", "Là loại ngôn ngữ máy tính chuyên dụng dùng để lập trình tạo ra toàn bộ hệ thống trí tuệ nhân tạo nhận diện của nền tảng Google.", "Là loại ngôn ngữ mặc định của trình duyệt luôn luôn được thiết lập cố định là tiếng nước Anh bất kể người dùng đang ở vị trí nào."], correct: 1 },
    { id: "1_19", type: "single", question: "Tính năng dịch \"Tài liệu\" của phần mềm Google Translate hỗ trợ trực tiếp việc tải lên và biên dịch các loại tệp tin có định dạng quen thuộc nào?", options: ["Hỗ trợ quá trình xử lý dịch thuật đối với tệp hình ảnh JPEG, tệp định dạng âm thanh MP3, tệp video clip MP4 và tệp mã nguồn HTML.", "Hỗ trợ quá trình xử lý dịch thuật đối với tệp định dạng âm thanh WAV, tệp hình ảnh đồ họa PNG, tệp nén ZIP và tệp hệ thống ISO.", "Hỗ trợ quá trình xử lý dịch thuật đối với tệp văn bản Word, tệp bảng tính Excel, tệp trình chiếu PowerPoint và hệ thống tệp tài liệu PDF.", "Hỗ trợ quá trình xử lý dịch thuật đối với tệp mã nguồn lập trình Python, tệp đóng gói cài đặt đuôi EXE và tệp đồ họa vector dạng SVG."], correct: 2 },
    { id: "1_20", type: "single", question: "Khi người dùng tiến hành nháy chuột lần thứ nhất vào biểu tượng chiếc loa nhỏ trên giao diện Google Translate, phần mềm sẽ phát âm đọc văn bản với tốc độ như thế nào?", options: ["Phần mềm trí tuệ nhân tạo sẽ tự động phát âm đọc đoạn văn bản với tốc độ chậm hơn so với thông thường một chút xíu để giúp người dùng dễ nghe.", "Phần mềm trí tuệ nhân tạo sẽ tự động phát âm đọc đoạn văn bản với tốc độ hoàn toàn bình thường giống hệt như tốc độ con người giao tiếp.", "Phần mềm trí tuệ nhân tạo sẽ tự động phát âm đọc đoạn văn bản với tốc độ nhanh gấp hai lần so với tốc độ chuẩn thông thường nhất của hệ thống.", "Phần mềm trí tuệ nhân tạo sẽ hoàn toàn không phát ra bất cứ âm thanh nào vì hệ thống chỉ hỗ trợ việc đọc văn bản kể từ lần nhấp chuột thứ hai trở đi."], correct: 1 },
    { id: "1_21", type: "single", question: "Trang web kho học liệu mở do Bộ Giáo dục và Đào tạo Việt Nam cung cấp cho người học hiện nay có địa chỉ tên miền chính thức là gì?", options: ["Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là đường dẫn https://moet.gov.vn.", "Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là đường dẫn https://elearning.vn.", "Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là đường dẫn https://khohoclieu.vn.", "Trang web lưu trữ kho học liệu vô cùng đồ sộ này có địa chỉ truy cập chính thức trên mạng lưới Internet là đường dẫn https://igiaoduc.vn."], correct: 3 },

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    window.startQuizAction = function() {
        const errDiv = document.getElementById('login-error');
        errDiv.classList.add('hidden');
        const name = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim().toUpperCase(); 
        
        if (!name || !lop) {
            errDiv.innerText = "⚠️ Yêu cầu nhập đầy đủ Họ tên và Lớp!";
            errDiv.classList.remove('hidden');
            return;
        }

        currentStudent = { hoTen: name, lop: lop, maDe: 'de_tin10', tenDe: 'Đề Kiểm Tra Giữa Kỳ 1 - Đề Số 2' };
        
        let rawQuestions = JSON.parse(JSON.stringify(de_data));
        
        let part1 = shuffleArray(rawQuestions.filter(q => q.type === 'single'));
        part1.forEach((q, idx) => {
            q.displayQuestion = `Câu ${idx + 1}: ${q.question}`;
            let correctText = q.options[q.correct];
            q.options = shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);
        });
        
        let part2 = shuffleArray(rawQuestions.filter(q => q.type === 'tf_cluster'));
        part2.forEach((q, idx) => {
            q.displayQuestion = `Câu ${part1.length + idx + 1}: ${q.question}`;
            q.subQuestions = shuffleArray(q.subQuestions);
            const labels = ['a)', 'b)', 'c)', 'd)'];
            q.subQuestions.forEach((sub, sIdx) => {
                sub.text = `${labels[sIdx]} ${sub.text}`;
            });
        });
        
        currentQuestions = [...part1, ...part2];
        quizStartTime = new Date();
        cheatCount = 0; 
        setTimeout(() => { isQuizStarted = true; }, 1000);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentStudent.tenDe;
        document.getElementById('student-info').innerText = `${currentStudent.hoTen} - Lớp ${currentStudent.lop}`;
        currentIdx = 0;
        userAnswers = {};
        window.renderQuestion();
        startTimer(45 * 60);
    };

    window.nextQuestion = function() {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; window.renderQuestion(); }

            scoresRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                allScores = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];

        document.getElementById('result-section').classList.add('hidden');

    };

    function getTotalItems() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') count += q.subQuestions.length;
            else count++;
        });
        return count; 
    }

    function getAnsweredCount() {
        let count = 0;
        currentQuestions.forEach(q => {
            if (q.type === 'tf_cluster') {
                q.subQuestions.forEach(sub => { if (userAnswers[sub.id]) count++; });
            } else {
                if (userAnswers[q.id] !== undefined) count++;
            }
        });
        return count;
    }

                let subCorrectCount = 0;
                q.subQuestions.forEach(sub => {
                    if (userAnswers[sub.id] === sub.correct) {
                        subCorrectCount++;
                        correctSubItems++;
                    }
                });
                
                if (subCorrectCount === 1) totalScore += 0.1;
                else if (subCorrectCount === 2) totalScore += 0.25;
                else if (subCorrectCount === 3) totalScore += 0.5;
                else if (subCorrectCount === 4) totalScore += 1.0;

            } else {
                if (userAnswers[q.id] === q.correct) {
                    totalScore += 0.25; 
                    correctSubItems++;
                }
            }
        });

        const score = totalScore.toFixed(2);

        const record = {
            hoTen: currentStudent.hoTen, lop: currentStudent.lop, tenDe: currentStudent.tenDe,
            diem: parseFloat(score), soCauDung: correctSubItems, tongCau: totalItems,
            startTime: quizStartTime.toLocaleTimeString(), endTime: quizEndTime.toLocaleTimeString(),
            duration: formatDuration(Math.floor((quizEndTime - quizStartTime) / 1000)),
            thoiGian: new Date().toISOString(), deviceId: deviceId
        };
        if(database) {
            scoresRef.push(record, () => { window.showModalResult(score, correctSubItems, totalItems, record.duration); });
        }
    };

    window.showModalResult = function(score, correct, total, dur) {
        ['login', 'quiz', 'scores'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-content').innerHTML = `<div class="text-6xl sm:text-7xl mb-4 animate-bounce">🎉</div><h3 class="text-2xl sm:text-3xl font-bold text-green-600 mb-2">Hoàn thành bài thi!</h3><p class="text-gray-600 mb-6 mt-2"><span class="font-bold text-blue-700 text-lg sm:text-xl uppercase tracking-wider">${currentStudent.hoTen} - Lớp ${currentStudent.lop}</span><br><span class="text-sm font-semibold text-gray-400 mt-1 block">${currentStudent.tenDe}</span></p><div class="bg-blue-50 border-2 border-blue-100 rounded-3xl p-6 mb-6 shadow-inner relative"><div class="text-sm text-blue-500 font-bold mb-2 uppercase tracking-widest">ĐIỂM SỐ CỦA BẠN</div><div class="text-6xl sm:text-7xl font-bold text-blue-600 drop-shadow-sm">${score} <span class="text-2xl text-gray-400">/ 10</span></div><div class="text-base sm:text-lg font-bold text-indigo-600 mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm">Trả lời đúng ${correct}/${total} ý | TG: ${dur}</div></div><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="window.goHome()" class="w-full py-4 bg-gray-100 text-gray-800 rounded-xl font-bold shadow-sm hover:bg-gray-200 transition-transform active:scale-95 touch-manipulation text-lg border-2 border-gray-200">🏠 Trang chủ</button><button onclick="document.getElementById('result-section').classList.add('hidden'); window.viewScoresAction();" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-bold shadow-sm hover:shadow-md transition-transform active:scale-95 touch-manipulation text-lg">🏆 Bảng điểm</button></div>`;
    };

    window.renderScores = function() {
        const tbody = document.getElementById('scores-tbody');
        const paginationControls = document.getElementById('pagination-controls');
        
        if (allScores.length === 0) { 
            tbody.innerHTML = ''; 
            document.getElementById('no-scores').classList.remove('hidden'); 
            paginationControls.classList.add('hidden');
            document.getElementById('my-score-summary').classList.add('hidden');
            return; 
        }
        
        document.getElementById('no-scores').classList.add('hidden');
        paginationControls.classList.remove('hidden');
        
        const getTen = (fullName) => {
            if (!fullName) return '';
            const words = fullName.trim().split(' ');
            return words[words.length - 1].toLowerCase();
        };

        sortedScoresList = [...allScores].sort((a, b) => {
            const lopA = (a.lop || '').toUpperCase();
            const lopB = (b.lop || '').toUpperCase();
            if (lopA !== lopB) return lopA.localeCompare(lopB);
            
            const tenA = getTen(a.hoTen);
            const tenB = getTen(b.hoTen);
            if (tenA !== tenB) return tenA.localeCompare(tenB);
            
            return (a.hoTen || '').localeCompare(b.hoTen || '');
        });

        const myScoreIndex = sortedScoresList.findIndex(s => s.deviceId === deviceId);
        if (myScoreIndex !== -1) {
            const myScore = sortedScoresList[myScoreIndex];
            document.getElementById('my-score-summary').classList.remove('hidden');
            document.getElementById('my-summary-name').innerText = `${myScore.hoTen} (${(myScore.lop || '').toUpperCase()})`;
            document.getElementById('my-summary-rank').innerText = `Hạng: #${myScoreIndex + 1}`;
            document.getElementById('my-summary-score').innerText = `${myScore.diem}`;
        } else {
            document.getElementById('my-score-summary').classList.add('hidden');
        }

        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const pageData = sortedScoresList.slice(startIndex, endIndex);

        tbody.innerHTML = pageData.map((s, idx) => {
            let timeStr = s.startTime;
            if (s.thoiGian) {
                const dt = new Date(s.thoiGian);
                timeStr = dt.toLocaleTimeString('vi-VN') + ' - ' + dt.toLocaleDateString('vi-VN');
            }
            const globalIdx = startIndex + idx + 1;

            return `<tr class="${s.deviceId === deviceId ? 'my-score-row' : 'hover:bg-gray-50'} transition-colors border-b border-gray-100">
                <td class="px-3 sm:px-4 py-4 text-center font-bold text-gray-500 text-sm">#${globalIdx}</td>
                <td class="px-3 sm:px-4 py-4 font-bold text-blue-600 text-sm">${(s.lop || '').toUpperCase()}</td>
                <td class="px-3 sm:px-4 py-4 font-semibold text-gray-800 text-sm">${s.hoTen} ${s.deviceId === deviceId ? '<span class="ml-2 bg-pink-500 text-white text-[10px] px-2 rounded-md">Bạn</span>' : ''}</td>
                <td class="px-3 sm:px-4 py-4 text-center"><span class="font-bold text-lg ${s.diem >= 5 ? 'text-green-600' : 'text-red-500'}">${s.diem}</span></td>
                <td class="px-3 sm:px-4 py-4 text-center text-gray-500 text-xs">${timeStr}</td>
              <!--  <td class="px-3 sm:px-4 py-4 text-right font-bold text-orange-600 text-xs">${s.duration}</td> -->
            </tr>`;
        }).join('');
    };

    window.prevPage = function() {
        if (currentPage > 1) {
            currentPage--;
            window.renderScores();
        }
    };

    window.nextPage = function() {
        const totalPages = Math.ceil(sortedScoresList.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            window.renderScores();
        }
    };

    function showSection(id) {
        ['login', 'quiz', 'scores', 'result'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
        document.getElementById(id+'-section').classList.remove('hidden');
    }

    function startTimer(seconds) {
        const display = document.getElementById('timer');
        let remaining = seconds;
        timerInterval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            display.innerText = `${m}:${s}`;
            if (remaining <= 0) window.submitQuiz();
        }, 1000);
    }

    try {
        if (!localStorage.getItem('deviceId')) {
            localStorage.setItem('deviceId', 'dev_' + Math.random().toString(36).substr(2) + Date.now());
        }
        deviceId = localStorage.getItem('deviceId');
    } catch (e) { deviceId = 'dev_temp_' + Math.random().toString(36).substr(2); }
  </script>
 </body>
